[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-reverse-tools"
version = "0.1.0"
description = "Reproducible tooling for Genshin reverse-engineering artifacts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RinoPaw"}]
dependencies = []

[project.scripts]
genshinre = "genshinre.entrypoint:main"

[tool.setuptools.packages.find]
include = ["genshinre*"]
