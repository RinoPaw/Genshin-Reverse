[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-reverse-tools"
version = "0.1.0"
description = "Reproducible tooling, artifacts, and provenance for Genshin Impact protocol research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "RinoPaw"}]
keywords = ["genshin-impact", "reverse-engineering", "il2cpp", "protobuf", "protocol"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/RinoPaw/Genshin-Reverse"
Issues = "https://github.com/RinoPaw/Genshin-Reverse/issues"

[project.scripts]
genshinre = "genshinre.cli:main"

[tool.setuptools.packages.find]
include = ["genshinre*"]
