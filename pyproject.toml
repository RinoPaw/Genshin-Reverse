[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-reverse-tools"
dynamic = ["version"]
description = "Reproducible tooling, artifacts, and provenance for Genshin Impact protocol research"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "RinoPaw"}]
keywords = ["genshin-impact", "reverse-engineering", "il2cpp", "protobuf", "protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/RinoPaw/Genshin-Reverse"
Issues = "https://github.com/RinoPaw/Genshin-Reverse/issues"

[project.scripts]
genshinre = "genshinre.cli:main"

[tool.setuptools.dynamic]
version = {attr = "genshinre.__version__"}

[tool.setuptools.packages.find]
include = ["genshinre*"]
