name: Probe Quest 7.0 resource census

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest70-resource-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch candidate 7.0 resource sets
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" ref="$3"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set 'BinOutput/Quest/*.json'
            git -C "$dir" checkout "$ref"
          }

          fetch_repo https://github.com/chenlin996/LunaGC-Resources7.0.git /tmp/chenlin main
          fetch_repo https://github.com/nyakochao/LunaGC-Resources-7.0.git /tmp/nyako master
          fetch_repo https://github.com/Merprose2/LunaGCR-Resources.git /tmp/merprose main
          fetch_repo https://github.com/jibanso/LunaGCR-Resources.git /tmp/jibanso main
          fetch_repo https://github.com/wwmf1201/LunaGCR-Resources.git /tmp/wwmf main

          rm -rf /tmp/agd70
          git clone --filter=blob:none --no-checkout https://github.com/DimbreathBot/AnimeGameData.git /tmp/agd70
          git -C /tmp/agd70 sparse-checkout init --no-cone
          git -C /tmp/agd70 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/agd70 checkout 5930a9caf54a57ff2b60bb816a9c492dfaa6b488

      - name: Count rows and missing-field coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest70-resource-census.txt
          import json
          from collections import Counter
          from pathlib import Path

          ROOTS={
              "chenlin":Path("/tmp/chenlin/BinOutput/Quest"),
              "nyako":Path("/tmp/nyako/BinOutput/Quest"),
              "merprose":Path("/tmp/merprose/BinOutput/Quest"),
              "jibanso":Path("/tmp/jibanso/BinOutput/Quest"),
              "wwmf":Path("/tmp/wwmf/BinOutput/Quest"),
          }

          def meaningful(v):
              return [
                  x for x in v
                  if isinstance(v,list) and isinstance(x,dict) and x.get("type")
              ] if isinstance(v,list) else []

          def load_normal(root):
              rows={}
              files=0
              for p in sorted(root.glob("*.json")):
                  files+=1
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("subQuests",[])
                  if not isinstance(seq,list):continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("subId"),int):
                          rows[r["subId"]]=r
              return files,rows

          def load_raw(root):
              rows={}
              for p in sorted(root.glob("*.json")):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("EBNBLBEIFFJ",[])
                  if not isinstance(seq,list):continue
                  for i,r in enumerate(seq):
                      if not isinstance(r,dict):continue
                      # Identify subId using overlap against candidate normalized
                      # rows later; keep every ordinary row under a synthetic key
                      # for count. For exact id coverage, raw row count is enough.
                      rows[(p.stem,i)]=r
              return rows

          raw=load_raw(Path("/tmp/agd70/BinOutput/Quest"))
          print("RAW_7_0_ROWS",len(raw))

          sets={}
          report={}
          for name,root in ROOTS.items():
              files,rows=load_normal(root)
              sets[name]=set(rows)
              st=Counter()
              for r in rows.values():
                  if meaningful(r.get("acceptCond")):st["accept_meaningful"]+=1
                  if meaningful(r.get("beginExec")):st["begin_meaningful"]+=1
                  if isinstance(r.get("acceptCond"),list):st["accept_present"]+=1
                  if isinstance(r.get("beginExec"),list):st["begin_present"]+=1
              report[name]={
                  "files":files,"rows":len(rows),**dict(st),
              }
              print(name,report[name])

          names=list(ROOTS)
          print("\n=== PAIRWISE ID OVERLAP ===")
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  print(a,b,
                        "overlap",len(sets[a]&sets[b]),
                        "a_only",len(sets[a]-sets[b]),
                        "b_only",len(sets[b]-sets[a]))

          union=set().union(*sets.values())
          inter=set.intersection(*(sets[n] for n in names))
          print("UNION_ROWS",len(union))
          print("INTERSECTION_ALL",len(inter))

          # Build best-of-union for the two missing fields. Prefer the value from
          # repositories that agree; report conflicts rather than choosing silently.
          for field in ("acceptCond","beginExec"):
              recovered={}
              conflicts=[]
              for sid in sorted(union):
                  vals={}
                  for name,root in ROOTS.items():
                      _,rows=load_normal(root)
                      if sid not in rows:continue
                      v=meaningful(rows[sid].get(field))
                      if not v:continue
                      key=json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(",",":"))
                      vals.setdefault(key,{"value":v,"sources":[]})["sources"].append(name)
                  if not vals:continue
                  best=max(vals.values(),key=lambda x:(len(x["sources"]),x["sources"]))
                  recovered[sid]=best
                  if len(vals)>1:
                      conflicts.append({"subId":sid,"variants":list(vals.values())})
              print("\nFIELD",field,
                    "recovered_rows",len(recovered),
                    "conflicts",len(conflicts))
              print("conflict_examples",json.dumps(conflicts[:30],ensure_ascii=False,indent=2))

          Path("quest70-resource-census.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest70-resource-census
          path: |
            quest70-resource-census.txt
            quest70-resource-census.json
          if-no-files-found: error
