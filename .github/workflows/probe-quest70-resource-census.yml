name: Probe Quest 7.0 resource census

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest70-resource-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned candidate 7.0 resource sets
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" sha="$3"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set 'BinOutput/Quest/*.json'
            git -C "$dir" checkout "$sha"
          }

          fetch_repo https://github.com/chenlin996/LunaGC-Resources7.0.git \
            /tmp/chenlin 0991d8a9d82b37a7400774764c0b6e04e7c66a9d
          fetch_repo https://github.com/nyakochao/LunaGC-Resources-7.0.git \
            /tmp/nyako 15e8fedc1fcc1547e4a0175e7cd6501c808c3241
          fetch_repo https://github.com/Merprose2/LunaGCR-Resources.git \
            /tmp/merprose a64cf90adbcbb4fec3ad1c00d94bfb455511e080

      - name: Count row and compatibility-field coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest70-resource-census.txt
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOTS = {
              "chenlin": Path("/tmp/chenlin/BinOutput/Quest"),
              "nyako": Path("/tmp/nyako/BinOutput/Quest"),
              "merprose": Path("/tmp/merprose/BinOutput/Quest"),
          }

          def load(root):
              rows={}
              files=0
              for p in sorted(root.glob("*.json")):
                  files += 1
                  try:
                      o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if not isinstance(o,dict):
                      continue
                  seq=o.get("subQuests",[])
                  if not isinstance(seq,list):
                      continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("subId"),int):
                          rows[r["subId"]]=r
              return files,rows

          def typed(v, field):
              if not isinstance(v,list):
                  return []
              out=[]
              for x in v:
                  if not isinstance(x,dict):
                      continue
                  t=x.get("type")
                  if not isinstance(t,str) or not t:
                      continue
                  if field=="acceptCond" and t=="QUEST_COND_UNKNOWN":
                      continue
                  out.append(x)
              return out

          loaded={}
          sets={}
          report={}
          for name,root in ROOTS.items():
              files,rows=load(root)
              loaded[name]=rows
              sets[name]=set(rows)
              st=Counter()
              for r in rows.values():
                  for field in ("acceptCond","beginExec"):
                      if isinstance(r.get(field),list):
                          st[field+"_present"] += 1
                      if typed(r.get(field),field):
                          st[field+"_meaningful"] += 1
              report[name]={"files":files,"rows":len(rows),**dict(st)}
              print(name,report[name])

          names=list(ROOTS)
          print("\n=== ID COVERAGE ===")
          union=set().union(*(sets[n] for n in names))
          inter=set.intersection(*(sets[n] for n in names))
          print("union",len(union),"intersection",len(inter))
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  print(a,b,
                        "overlap",len(sets[a]&sets[b]),
                        "a_only",len(sets[a]-sets[b]),
                        "b_only",len(sets[b]-sets[a]))

          print("\n=== FIELD CONSENSUS ===")
          field_report={}
          for field in ("acceptCond","beginExec"):
              recovered={}
              conflicts=[]
              source_counts=Counter()
              for sid in sorted(union):
                  variants=defaultdict(list)
                  payload={}
                  for name,rows in loaded.items():
                      r=rows.get(sid)
                      if r is None:
                          continue
                      v=typed(r.get(field),field)
                      if not v:
                          continue
                      k=json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(",",":"))
                      variants[k].append(name)
                      payload[k]=v
                  if not variants:
                      continue
                  best_key,best_sources=max(
                      variants.items(),key=lambda kv:(len(kv[1]),tuple(kv[1]))
                  )
                  recovered[sid]={"sources":best_sources,"value":payload[best_key]}
                  source_counts["+".join(best_sources)] += 1
                  if len(variants)>1:
                      conflicts.append({
                          "subId":sid,
                          "variants":[
                              {"sources":srcs,"value":payload[k]}
                              for k,srcs in variants.items()
                          ],
                      })
              print(field,
                    "recovered",len(recovered),
                    "conflicts",len(conflicts),
                    "source_sets",dict(source_counts))
              print("conflict_examples",
                    json.dumps(conflicts[:30],ensure_ascii=False,indent=2))
              field_report[field]={
                  "recovered_rows":len(recovered),
                  "conflict_rows":len(conflicts),
                  "source_sets":dict(source_counts),
              }

          Path("quest70-resource-census.json").write_text(
              json.dumps({"repos":report,"fields":field_report},
                         ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest70-resource-census
          path: |
            quest70-resource-census.txt
            quest70-resource-census.json
          if-no-files-found: error
