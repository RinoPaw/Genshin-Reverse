name: Investigate Amber pre-mask handoff (7.1)

on:
  push:
    branches: [research/amber-2178-quest-notify-20261010]
    paths:
      - .github/workflows/amber-guide-native-71.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install static research dependencies
        run: python -m pip install -e . capstone zstandard

      - name: Fetch exact 7.1 native sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Trace talk ending, quest list receiver and mask controllers
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            amber-guide-native-71.json \
            --max-body 0x1800 \
            --focus talk_response:0xA5E18C0 \
            --focus finish_current_talk:0xFE57430 \
            --focus on_create_talk_finish:0xFE33B70 \
            --focus quest_list_update:0xA5CE790 \
            --focus old_mask_attach:0xCB9BAB0 \
            --focus old_mask_select:0xCB9BD70 \
            --focus new_mask_on_notify:0xF57CFF0 \
            --focus new_mask_init:0xF57D0D0 \
            --focus new_mask_update:0xF57AEF0 \
            --focus guide_click:0x7A577D0 \
            --focus old_mask_index:0x9E2C4B0 \
            > /tmp/amber-native-full.log

      - name: Print narrow native call evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('amber-guide-native-71.json').read_text(encoding='utf-8'))
          for label, value in data['focus'].items():
              print('==',label, value['requested_rva'])
              print('owner:', [(x.get('type_name'),x.get('method_name')) for x in value['owner'].get('metadata_rows',[])])
              print('validated callers:', value['validated_direct_caller_count'])
              for edge in value['direct_callers'][:35]:
                  names=[(r.get('type_name'),r.get('method_name')) for r in edge['caller'].get('metadata_rows',[])]
                  print('  CALLER',edge['call_site_rva'],names)
              print('direct callees:',len(value['direct_edges']))
              for edge in value['direct_edges'][:65]:
                  dest=edge.get('target_owner')
                  names=[] if dest is None else [(r.get('type_name'),r.get('method_name')) for r in dest.get('metadata_rows',[])]
                  print('  CALLEE',edge['site_rva'],edge['kind'],edge['target_rva'],names)
          PY

      - name: Preserve pinned native trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amber-guide-native-71
          path: |
            amber-guide-native-71.json
            /tmp/amber-native-full.log
          if-no-files-found: warn
          retention-days: 7
