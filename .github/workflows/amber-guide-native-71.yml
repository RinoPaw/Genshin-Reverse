name: Investigate 7.1 Amber Newbie Guide Gate

on:
  push:
    branches:
      - research/amber-newbie-guide-gate-71
    paths:
      - .github/workflows/amber-guide-native-71.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact research ref
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch pinned Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace native guide start and input lock paths
        run: |
          python - <<'PY'
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.sampleidentity import require_sha256
          require_sha256("inputs/7.1.0-global/GenshinImpact.exe", PROFILE_71.exe_sha256, label="7.1 Global client")
          PY
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            amber-guide-native-edges.json \
            --max-body 0x5000 \
            --focus GlobalActor.StartGuide:0xFE284A0 \
            --focus GlobalActor.EndGuide:0xFE28170 \
            --focus MonoNewbieMask.showCompulory:0x1163D740 \
            --focus MonoNewbieDialog.SetNewbieMaskIndex:0x9E2C4B0 \
            --focus MonoBaseCanvas.SetBlockInputMaskEnable:0x9152EB0 \
            --focus BaseInputAdapter.UpdateInputDisable:0xAC528D0 \
            --focus BaseInputAdapter.UpdateDisableInputMask:0xAC529B0 \
            --focus MonoGuideV2ClickTarget.OnPointerClick:0x7A577D0 \
            --focus InteractionManager.FinishCurrTalk:0xFE57430 \
            --focus InteractionManager.ClearAfterKeyListFinish:0xFE5FE80 \
            > /tmp/amber-native-full.log
          python - <<'PY'
          import json
          r=json.load(open('amber-guide-native-edges.json',encoding='utf-8'))
          for label,item in r['focus'].items():
            print("\n===",label,item['requested_rva'],"===")
            print("validated_callers",item['validated_direct_caller_count'])
            for x in item['direct_callers'][:40]:
              owners=x['caller']['metadata_rows']
              print("CALLER",x['call_site_rva'],[(m['type_name'],m['method_name'],m['parameter_types']) for m in owners[:3]])
              print("  CONTEXT",[(i['rva'],i['mnemonic'],i['op_str']) for i in x['context'][-9:]])
            print("callee_edges")
            for e in item['direct_edges'][:50]:
              o=e.get('target_owner') or {}
              print("EDGE",e['site_rva'],e['kind'],e['target_rva'],[(m['type_name'],m['method_name']) for m in o.get('metadata_rows',[])[:3]])
            print("DISASM_HEAD",[(i['rva'],i['mnemonic'],i['op_str']) for i in item['disassembly'][:28]])
          PY
      - name: Preserve exact-client research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amber-guide-native-edges
          path: amber-guide-native-edges.json
          if-no-files-found: ignore
          retention-days: 7
