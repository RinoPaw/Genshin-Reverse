name: One-shot original 7.1 entity oneof call-owner audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-entity-oneof-native-owners.yml'
permissions:
  contents: read
jobs:
  native-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact-native inspection dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Map original call targets and tagged-variant comparisons
        run: |
          python scripts/probe-7.1-entity-oneof-call-owners.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/economy/7.1-original-scene-entity-float-parent-native-chain.json \
            --output work/original-71-entity-oneof-call-owners.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-entity-oneof-call-owners
          path: work/original-71-entity-oneof-call-owners.json
          if-no-files-found: error
          retention-days: 7
