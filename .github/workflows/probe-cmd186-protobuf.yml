name: Probe CmdId 186 protobuf structure

on:
  push:
    paths:
      - .github/workflows/probe-cmd186-protobuf.yml
  workflow_dispatch:

concurrency:
  group: probe-cmd186-protobuf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Cross-check genericinst field reuse
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from pathlib import Path
          root=Path('versions/7.1.0-global/windows-x64')
          wanted={'476942','476943'}
          reg={}
          with (root/'registry/registry.csv').open(encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f): reg[row['type_name']]=row
          matches=defaultdict(list)
          with (root/'metadata/fields.csv').open(encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  if row.get('field_type_index') in wanted:
                      matches[row['type_name']].append(row)
          both=[]
          semantic=[]
          for type_name, rows in matches.items():
              indexes={r['field_type_index'] for r in rows}
              item={'type_name':type_name,'field_type_indexes':sorted(indexes),'fields':rows,'registry':reg.get(type_name,{})}
              if wanted <= indexes: both.append(item)
              if reg.get(type_name,{}).get('semantic_name'): semantic.append(item)
          print('=== genericinst reuse summary ===')
          print(json.dumps({'types_using_either':len(matches),'types_using_both':len(both),'semantic_rows':semantic[:20],'both_sample':both[:20]}, indent=2, ensure_ascii=False))
          PY
      - name: Fetch pinned exact 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Disassemble CmdId 186 protobuf method cluster
        run: |
          set -euo pipefail
          EXE=inputs/7.1.0-global/GenshinImpact.exe
          SHA=08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d
          python tools/disassemble_rva.py "$EXE" 0x9ED1E80 0x70 --expected-sha256 "$SHA" --label CopyFrom --output copyfrom.json
          python tools/disassemble_rva.py "$EXE" 0x9ED1EF0 0x50 --expected-sha256 "$SHA" --label size-like --output size.json
          python tools/disassemble_rva.py "$EXE" 0x9ED1F90 0x80 --expected-sha256 "$SHA" --label cctor --output cctor.json
          python tools/disassemble_rva.py "$EXE" 0x9ED2100 0x70 --expected-sha256 "$SHA" --label parser --output parser.json
      - name: Inspect genericinst runtime entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from genshinre.mhy71 import TYPE_ARRAY_POINTER_RVA
          from genshinre.pe import PEImage
          exe=Path('inputs/7.1.0-global/GenshinImpact.exe')
          indexes=[476942,476943]
          out=[]
          with PEImage(exe) as image:
              ptr=image.read_rva(TYPE_ARRAY_POINTER_RVA,8)
              array_va=int.from_bytes(ptr,'little')
              array_rva=array_va-image.image_base
              for index in indexes:
                  entry_rva=array_rva+index*16
                  entry=image.read_rva(entry_rva,16)
                  data_u64=int.from_bytes(entry[:8],'little')
                  target_rva=data_u64-image.image_base
                  target=b''
                  if target_rva>0:
                      target=image.read_rva(target_rva,0x80)
                  out.append({
                      'type_index':index,
                      'entry_rva':f'0x{entry_rva:X}',
                      'entry_hex':entry.hex(),
                      'kind':f'0x{entry[0xA]:02X}',
                      'data_u64':f'0x{data_u64:X}',
                      'target_rva':f'0x{target_rva:X}',
                      'target_hex':target.hex(),
                      'target_qwords':[f'0x{int.from_bytes(target[i:i+8],"little"):X}' for i in range(0,min(len(target),0x80),8)],
                  })
          print('=== runtime genericinst entries ===')
          print(json.dumps(out,indent=2))
          PY
      - name: Preserve focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: cmdid-186-protobuf-probe
          path: |
            copyfrom.json
            size.json
            cctor.json
            parser.json
          if-no-files-found: error
          retention-days: 7
