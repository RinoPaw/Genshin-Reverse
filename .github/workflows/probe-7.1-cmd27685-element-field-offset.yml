name: Verify original 7.1 packet element offset usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-7.1-cmd27685-element-field-offset.yml'
      - 'scripts/probe-7.1-cmd27685-element-field-offset.py'

permissions:
  contents: read

concurrency:
  group: original-71-cmd27685-element-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard capstone
      - name: Fetch source-pinned original client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect native CEOG field, KFOLL field offset and OnAccept usage
        run: |
          python scripts/probe-7.1-cmd27685-element-field-offset.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/original-cmd27685-element-offset.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-cmd27685-element-offset
          path: work/original-cmd27685-element-offset.json
          retention-days: 7
          if-no-files-found: error
