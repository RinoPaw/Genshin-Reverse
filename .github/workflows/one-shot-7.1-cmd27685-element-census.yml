name: One-shot original 7.1 Cmd27685 element census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-cmd27685-element-census.yml'

permissions:
  contents: read

jobs:
  native-element:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native-code and exact-client source dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256-pinned original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify original native fields and reader
        run: |
          python scripts/probe-7.1-cmd27685-element-field-census.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/original-71-cmd27685-element-field-census.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-cmd27685-element-field-census
          path: work/original-71-cmd27685-element-field-census.json
          retention-days: 7
          if-no-files-found: error
