name: Compare direct 7.0 and 7.1 protocol typedef order

on:
  push:
    paths:
      - '.github/workflows/compare-7.0-7.1-typedef-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published 7.0 dump and packet IDs
        run: |
          curl --fail --location \
            'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' \
            -o /tmp/data.7z
          curl --fail --location \
            'https://raw.githubusercontent.com/kuma-dayo/protos/main/7.0.0/packetIds.json' \
            -o /tmp/packetIds-7.0.json
          mkdir -p /tmp/data
          7z x -y /tmp/data.7z -o/tmp/data >/dev/null
          test -f /tmp/data/data/dump.cs

      - name: Compare direct TypeDef indices
        run: |
          python - <<'PY' > /tmp/typedef-direct-70-71.json
          import csv, json, math, re
          from pathlib import Path

          pairs = [
              ('UnlockTransPointReq', 8813, 9369),
              ('GetScenePointReq', 26108, 1649),
              ('GetScenePointRsp', 6529, 26),
              ('SceneTransToPointReq', 1837, 1252),
              ('SceneTransToPointRsp', 4731, 23515),
              ('EnterWorldAreaReq', 26017, 25407),
              ('EnterWorldAreaRsp', 24557, 6774),
              ('ScenePointUnlockNotify', 7929, 25567),
              ('SceneAreaUnlockNotify', 5912, 27420),
              ('GetSceneAreaReq', 1014, 24721),
              ('GetSceneAreaRsp', 4722, 23366),
          ]
          candidates = [36641, 20290, 2666]

          old_ids = json.load(open('/tmp/packetIds-7.0.json', encoding='utf-8'))
          old_cmd_to_name = {int(v): k for k, v in old_ids.items()}

          wanted_names = {old_cmd_to_name[old] for _, old, _ in pairs}
          wanted_names.add(old_cmd_to_name[1776])
          name_to_old_tdef = {}
          # dump.cs declarations carry comments such as // TypeDefIndex: 33350.
          decl_re = re.compile(r'^(?:public|internal|private|protected).*?\b(class|struct|enum|interface)\s+([A-Za-z0-9_`<>]+).*?// TypeDefIndex: (\d+)')
          for line in Path('/tmp/data/data/dump.cs').open(encoding='utf-8', errors='ignore'):
              if 'TypeDefIndex:' not in line:
                  continue
              m = decl_re.search(line.strip())
              if not m:
                  continue
              name = m.group(2).split('<', 1)[0]
              if name in wanted_names:
                  name_to_old_tdef[name] = int(m.group(3))

          current = {}
          with open('versions/7.1.0-global/windows-x64/registry/registry.csv', encoding='utf-8', newline='') as f:
              for row in csv.DictReader(f):
                  cmd = int(row['cmd_id'])
                  if cmd in {new for _,_,new in pairs} | set(candidates):
                      current[cmd] = {
                          'type_name': row['type_name'],
                          'type_definition_index': int(row['type_definition_index']),
                      }

          anchors=[]
          xs=[]; ys=[]
          for semantic, old_cmd, new_cmd in pairs:
              old_name = old_cmd_to_name[old_cmd]
              old_tdef = name_to_old_tdef.get(old_name)
              new = current.get(new_cmd)
              row={
                  'semantic_name': semantic,
                  'old_cmd': old_cmd,
                  'old_type_name': old_name,
                  'old_type_definition_index': old_tdef,
                  'new_cmd': new_cmd,
                  'new_type_name': new['type_name'] if new else None,
                  'new_type_definition_index': new['type_definition_index'] if new else None,
              }
              if old_tdef is not None and new is not None:
                  xs.append(old_tdef); ys.append(new['type_definition_index'])
                  row['status']='ok'
              else:
                  row['status']='missing'
              anchors.append(row)

          def corr(a,b):
              if len(a)<2: return None
              ma=sum(a)/len(a); mb=sum(b)/len(b)
              num=sum((x-ma)*(y-mb) for x,y in zip(a,b))
              den=(sum((x-ma)**2 for x in a)*sum((y-mb)**2 for y in b))**0.5
              return num/den if den else None

          n=len(xs)
          sx=sum(xs); sy=sum(ys); sxx=sum(x*x for x in xs); sxy=sum(x*y for x,y in zip(xs,ys))
          denom=n*sxx-sx*sx
          slope=(n*sxy-sx*sy)/denom if denom else 0.0
          intercept=(sy-slope*sx)/n if n else 0.0
          for row in anchors:
              if row['status']=='ok':
                  pred=slope*row['old_type_definition_index']+intercept
                  row['fit_residual']=row['new_type_definition_index']-pred

          old_target_name=old_cmd_to_name[1776]
          old_target_tdef=name_to_old_tdef.get(old_target_name)
          pred=slope*old_target_tdef+intercept if old_target_tdef is not None else None
          candidate_rows=[]
          for cmd in candidates:
              item=current.get(cmd)
              if not item: continue
              candidate_rows.append({
                  'cmd_id': cmd,
                  'type_name': item['type_name'],
                  'type_definition_index': item['type_definition_index'],
                  'distance_from_predicted': abs(item['type_definition_index']-pred) if pred is not None else None,
                  'signed_residual': item['type_definition_index']-pred if pred is not None else None,
              })
          candidate_rows.sort(key=lambda r:r['distance_from_predicted'] if r['distance_from_predicted'] is not None else 1e99)

          inversions=0; comparisons=0
          for i in range(len(xs)):
              for j in range(i+1,len(xs)):
                  if xs[i]==xs[j] or ys[i]==ys[j]: continue
                  comparisons += 1
                  if (xs[i]-xs[j])*(ys[i]-ys[j]) < 0: inversions += 1

          out={
              'resolved_anchor_count': n,
              'correlation_old_typedef_new_typedef': corr(xs,ys),
              'linear_fit': {'slope':slope,'intercept':intercept},
              'pairwise_comparisons':comparisons,
              'pairwise_inversions':inversions,
              'pairwise_order_agreement': (comparisons-inversions)/comparisons if comparisons else None,
              'anchors':anchors,
              'old_target': {'cmd_id':1776,'type_name':old_target_name,'type_definition_index':old_target_tdef},
              'predicted_new_type_definition_index': pred,
              'candidates':candidate_rows,
              'interpretation_guard':'Use candidate distance only when controls show strong direct TypeDef stability; otherwise retain as heuristic/rejected evidence.',
          }
          print(json.dumps(out,indent=2))
          PY
          cat /tmp/typedef-direct-70-71.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: typedef-direct-70-71
          path: /tmp/typedef-direct-70-71.json
