name: Research Amber 7.1 interaction lock ownership

on:
  push:
    branches:
      - research/amber-2178-quest-notify-20261010
    paths:
      - '.github/workflows/research-amber-lock-chain-71.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Scan input lock and guide dispatch call sites against pinned client
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            amber-lock-guide-callgraph-71.json \
            --focus lock_inter:0xFE508D0 \
            --focus unlock_inter:0xFE552F0 \
            --focus finish_talk:0xFE57430 \
            --focus clear_interaction:0xFE3D630 \
            --focus start_guide:0xFE284A0 \
            --focus preflight_guide_name:0x758D8C0 \
            --focus launch_guide:0x758DBD0 \
            --focus quest_list_receiver:0xA5CE790 \
            --focus setup_newbie_view:0x89FB050
      - name: Report validated direct callers and relevant arguments
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('amber-lock-guide-callgraph-71.json').read_text())
          for key, info in j['focus'].items():
              print(f"\n== {key} direct callers={info['validated_direct_caller_count']}")
              for item in info['direct_callers'][:100]:
                  owner=item.get('caller',{}).get('metadata_rows',[])
                  labels=[f"{r.get('type_name')}.{r.get('method_name')}" for r in owner[:2]]
                  print("CALL",item['call_site_rva'], "from",','.join(labels))
                  print('  context:',[(e['rva'],e['mnemonic'],e['op_str']) for e in item.get('context',[])[-16:-3]])
              print('direct callee sites=',len(info.get('direct_edges',[])))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: amber-lock-guide-callgraph-71
          path: amber-lock-guide-callgraph-71.json
          retention-days: 7
