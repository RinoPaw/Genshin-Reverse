name: Probe original 7.1 Gadget auxiliary manager native types

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-gadget-aux-manager-types.yml']

permissions:
  contents: read

concurrency:
  group: research-gadget-aux-manager-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact original sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Recover original Gadget auxiliary native manager fields and types
        run: |
          python scripts/probe-7.1-gadget-aux-manager-native-types.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/gadget-aux-manager-native-types.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-aux-manager-native-types
          path: work/gadget-aux-manager-native-types.json
          retention-days: 7
          if-no-files-found: error
