name: Audit original 7.1 GadgetProp candidate row bytes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-7.1-gadget-prop-candidate-rows.yml'
      - 'scripts/audit-7.1-gadget-prop-candidate-rows.py'

permissions:
  contents: read

concurrency:
  group: gadget-prop-native-rows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard
      - name: Acquire original source verified Sophon assets
        run: |
          python scripts/fetch-7.1-design-blocks.py --output work/blocks
          curl --fail --location --retry 3 \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --output work/animestudio.tar.gz
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks work/blocks --cli-archive work/animestudio.tar.gz \
            --work work/export --report work/source-verification.json
      - name: Probe all 326 original GadgetProp rows
        run: |
          python scripts/audit-7.1-gadget-prop-candidate-rows.py \
            --raw work/export/export-25539185/MiHoYoBinData/e37e8728.dat \
            --output work/gadget-prop-native-candidate-rows.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-prop-native-candidate-rows
          path: work/gadget-prop-native-candidate-rows.json
          retention-days: 7
          if-no-files-found: error
