name: Publish generated 7.1 data

on:
  push:
    paths:
      - '.github/workflows/publish-7.1-from-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository tooling
        run: python -m pip install -e .

      - name: Download completed 7.1 work artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/7.1.0-global/windows-x64
          gh run download 36827443710 \
            --name genshin-7.1-reverse-work \
            --dir work/7.1.0-global/windows-x64
          find work/7.1.0-global/windows-x64 -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -30

      - name: Publish computation-friendly artifacts
        run: |
          python tools/publish_generated_71.py \
            work/7.1.0-global/windows-x64 \
            versions/7.1.0-global/windows-x64

      - name: Validate requested data files
        run: |
          test -s versions/7.1.0-global/windows-x64/registry/getcmdid-candidates.csv
          test -s versions/7.1.0-global/windows-x64/metadata/runtime-types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/methods.csv
          test -s versions/7.1.0-global/windows-x64/metadata/type-methods.json
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path('versions/7.1.0-global/windows-x64')
          checks = {
              'types': root/'metadata/types.csv',
              'methods': root/'metadata/methods.csv',
              'runtime-types': root/'metadata/runtime-types.csv',
              'getcmdid': root/'registry/getcmdid-candidates.csv',
          }
          for name, path in checks.items():
              with path.open(encoding='utf-8', newline='') as f:
                  count = sum(1 for _ in csv.DictReader(f))
              print(name, count, path.stat().st_size)
          PY

      - name: Commit and push generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A versions/7.1.0-global/windows-x64
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish generated global 7.1 reverse artifacts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
