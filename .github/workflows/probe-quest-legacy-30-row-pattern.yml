name: Probe 3.0 QuestExcel exact row pattern

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30-row-pattern.yml"

concurrency:
  group: probe-quest-legacy-30-row-pattern-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact 3.0.0 inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$base/GenshinImpact_Data/Native/UserAssembly.dll" -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat" -o "$out/global-metadata.dat"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            "UserAssembly.dll":(177601560,"b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b"),
            "global-metadata.dat":(49356392,"efd5a35bed23de3f1444d40ebf4eaa1dfb338c84d7a168a0264678f94cca5a2a"),
          }
          for name,(size,sha) in expected.items():
              raw=(Path("inputs/3.0.0-global")/name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
          PY

      - name: Build pinned Genshin-aware dumper
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/R0xdeadc0de/Il2CppDumper-Genshin.git .probe-tools/dumper
          git -C .probe-tools/dumper checkout --detach 731c4022a15b126da993e54a9f7d7e2c8a06c1af
          python - <<'PY'
          from pathlib import Path
          p=Path(".probe-tools/dumper/Il2CppDumper/Il2CppDumper.csproj")
          s=p.read_text(encoding="utf-8-sig")
          s=s.replace(
            "<TargetFrameworks>net472;net5.0</TargetFrameworks>",
            "<TargetFramework>net6.0</TargetFramework>\n    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>",
          )
          p.write_text(s,encoding="utf-8")
          PY
          dotnet build .probe-tools/dumper/Il2CppDumper/Il2CppDumper.csproj -c Release --nologo
          app=.probe-tools/dumper/Il2CppDumper/bin/Release/net6.0
          python - "$app/config.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          x=json.loads(p.read_text(encoding="utf-8-sig"))
          x["RequireAnyKey"]=False
          x["GenerateDummyDll"]=False
          x["GenerateStruct"]=False
          x["GenerateScript"]=True
          x["DumpMethod"]=True
          x["DumpField"]=True
          x["DumpFieldOffset"]=True
          x["DumpMethodOffset"]=True
          p.write_text(json.dumps(x,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Dump exact metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.probe-tools/dumper/Il2CppDumper/bin/Release/net6.0"
          out="$GITHUB_WORKSPACE/genshin-dump"
          mkdir -p "$out"
          (
            cd "$app"
            dotnet Il2CppDumper.dll \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll" \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat" \
              "$out"
          ) </dev/null | tee "$GITHUB_WORKSPACE/quest-legacy-30-typedef-dumper.txt"
          test -s "$out/dump.cs"

      - name: Find exact legacy Quest row by typed field pattern
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-row-pattern.txt
          import json,re
          from pathlib import Path

          lines=Path("genshin-dump/dump.cs").read_text(
              encoding="utf-8",errors="replace"
          ).splitlines()

          field_rx=re.compile(
              r"^\s*(?:public|private|protected|internal).*?\s+"
              r"([^\s]+)\s+([A-Za-z_][A-Za-z0-9_]*)\s*;\s*//\s*0x([0-9A-Fa-f]+)"
          )
          type_rx=re.compile(
              r"^\s*(?:public|private|protected|internal)?\s*"
              r"(?:sealed\s+|abstract\s+|static\s+)*"
              r"(?:class|struct)\s+([^\s:{]+).*?TypeDefIndex:\s*(\d+)"
          )
          rva_rx=re.compile(r"RVA:\s*0x([0-9A-Fa-f]+)")

          # Stable 3.0 QuestExcel semantic layout from WorldReverse.
          # Exact Global aliases recovered from named RandomQuestExcelConfig:
          # EIGBLIIIDOO=BanGroupType, NEFIKHJPMCB=LogicType,
          # AIPNHENEMIB=QuestGuide.
          # Array element class names may be obfuscated between builds, so score
          # primitive/enumeration slots exactly and array-ness separately.
          exact={
              0x10:"uint",0x14:"uint",0x18:"int",0x1C:"uint",
              0x20:"bool",0x24:"uint",0x28:"uint",0x2C:"uint",
              0x30:"QuestShowType",0x34:"EIGBLIIIDOO",0x38:"NEFIKHJPMCB",
              0x48:"NEFIKHJPMCB",0x58:"NEFIKHJPMCB",
              0x68:"AIPNHENEMIB",0x70:"ShowQuestGuideType",
              0x74:"bool",0x75:"bool",0x78:"QuestShowType",0x7C:"bool",
              0xA8:"uint",
          }
          arrays={0x40,0x50,0x60,0x80,0x88,0x90,0x98,0xA0,0xB0,0xB8}
          required_offsets=set(exact)|arrays|{0x68}

          starts=[i for i,x in enumerate(lines) if x.startswith("// Namespace:")]
          starts.append(len(lines))
          rows=[]
          for a,b in zip(starts,starts[1:]):
              block=lines[a:b]
              decl=None
              fields={}
              for rel,line in enumerate(block):
                  if decl is None:
                      tm=type_rx.search(line)
                      if tm:
                          decl={
                              "name":tm.group(1),
                              "typedef_index":int(tm.group(2)),
                              "line":a+rel+1,
                              "text":line.strip(),
                          }
                  fm=field_rx.search(line)
                  if fm:
                      fields[int(fm.group(3),16)]={
                          "type":fm.group(1),
                          "name":fm.group(2),
                          "line":a+rel+1,
                          "text":line.strip(),
                      }
              if not decl:
                  continue

              score=0
              exact_hits=[]
              exact_misses=[]
              for off,typ in exact.items():
                  got=fields.get(off,{}).get("type")
                  if got==typ:
                      score+=120
                      exact_hits.append(off)
                  elif got is not None:
                      exact_misses.append({"offset":off,"expected":typ,"got":got})
                      score-=45

              array_hits=[]
              for off in arrays:
                  got=fields.get(off,{}).get("type","")
                  if got.endswith("[]"):
                      score+=75
                      array_hits.append(off)
                  elif got:
                      score-=25

              layout_hits=sorted(required_offsets & set(fields))
              score += len(layout_hits)*8

              # The early primitive prefix is particularly selective.
              prefix_ok=all(
                  fields.get(off,{}).get("type")==typ
                  for off,typ in {
                      0x10:"uint",0x14:"uint",0x18:"int",0x1C:"uint",
                      0x20:"bool",0x24:"uint",0x28:"uint",0x2C:"uint",
                  }.items()
              )
              if prefix_ok:
                  score+=800

              # Three LogicType combiners + the two QuestShowType slots are
              # nearly unique to this schema.
              enum_core=all(
                  fields.get(off,{}).get("type")==typ
                  for off,typ in {
                      0x30:"QuestShowType",0x34:"EIGBLIIIDOO",
                      0x38:"NEFIKHJPMCB",0x48:"NEFIKHJPMCB",0x58:"NEFIKHJPMCB",
                      0x68:"AIPNHENEMIB",0x70:"ShowQuestGuideType",0x78:"QuestShowType",
                  }.items()
              )
              if enum_core:
                  score+=1400

              if score<500:
                  continue

              methods=[]
              for rel,line in enumerate(block):
                  rm=rva_rx.search(line)
                  if not rm:
                      continue
                  rva=int(rm.group(1),16)
                  sig=None
                  sig_line=None
                  for k in range(rel+1,min(len(block),rel+8)):
                      q=block[k].strip()
                      if q and not q.startswith("//") and "(" in q and ")" in q:
                          sig=q
                          sig_line=a+k+1
                          break
                  methods.append({
                      "rva":rva,
                      "comment_line":a+rel+1,
                      "signature_line":sig_line,
                      "signature":sig,
                  })

              rows.append({
                  "score":score,
                  "prefix_ok":prefix_ok,
                  "enum_core":enum_core,
                  "declaration":decl,
                  "exact_hits":exact_hits,
                  "exact_misses":exact_misses,
                  "array_hits":array_hits,
                  "layout_hits":layout_hits,
                  "fields":fields,
                  "methods":methods,
              })

          rows.sort(key=lambda x:(-x["score"],-len(x["exact_hits"]),x["declaration"]["line"]))
          print("candidates",len(rows))
          for rank,x in enumerate(rows[:40],1):
              d=x["declaration"]
              print(
                  f"\n=== RANK {rank:02d} score={x['score']} "
                  f"type={d['name']} TypeDefIndex={d['typedef_index']} "
                  f"prefix={x['prefix_ok']} enum_core={x['enum_core']} ==="
              )
              print("EXACT_HITS",",".join(hex(v) for v in x["exact_hits"]))
              print("ARRAY_HITS",",".join(hex(v) for v in x["array_hits"]))
              print("MISSES",x["exact_misses"])
              for off in sorted(x["fields"]):
                  if off<=0xC8:
                      f=x["fields"][off]
                      print(f"FIELD +0x{off:X} {f['type']} {f['name']}")
              print("METHODS")
              for m in x["methods"]:
                  sig=m["signature"] or ""
                  if "GALKIMALNDL" in sig or "FromBinary" in sig or len(x["methods"])<20:
                      print(f"  RVA=0x{m['rva']:X} L{m['signature_line']} {sig}")

          Path("quest-legacy-30-row-pattern.json").write_text(
              json.dumps({"candidates":rows[:100]},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          strong=[x for x in rows if x["prefix_ok"] and x["enum_core"]]
          print("\nSTRONG_CANDIDATES",len(strong))
          for x in strong:
              print(x["declaration"])
          if not strong:
              raise SystemExit("no exact QuestExcel semantic-layout candidate")
          PY

      - name: Upload row-pattern evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30-row-pattern
          path: |
            quest-legacy-30-typedef-dumper.txt
            quest-legacy-30-row-pattern.txt
            quest-legacy-30-row-pattern.json
          if-no-files-found: warn
