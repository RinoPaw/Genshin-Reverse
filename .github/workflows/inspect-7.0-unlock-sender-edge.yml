name: Inspect 7.0 unlock sender call edge

on:
  push:
    paths:
      - '.github/workflows/inspect-7.0-unlock-sender-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone
      - name: Fetch exact official global 7.0 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/3XnPviMfoILi/manifest_2efe39d995f47170_29ad2bc6e42fe4af2086ae58c7e81b33' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/3XnPviMfoILi' \
            --output /tmp/gi70 \
            --expected-exe-sha256 'a1a23cb76d941df28c5156ca3152fa49421ec98842221b7d71633d42ee76ca45' \
            --expected-metadata-sha256 'd361ff11f6ca123f4126004db13cdf1956e00d95231f84c1e5437f560e79128b'
      - name: Trace direct calls from historical sender
        run: |
          python - <<'PY' | tee /tmp/old-unlock-sender-calls.json
          import json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM
          from genshinre.pe import PEImage

          start,end=0xB6EA6B0,0xB6EAA40
          expected_helper=0xB6F3B00
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          calls=[]
          with PEImage(Path('/tmp/gi70/GenshinImpact.exe')) as image:
              blob=image.read_rva(start,end-start)
              for insn in md.disasm(blob,image.image_base+start):
                  if insn.mnemonic!='call' or not insn.operands:
                      continue
                  op=insn.operands[0]
                  if op.type!=X86_OP_IMM:
                      calls.append({'rva':f'0x{insn.address-image.image_base:X}','op_str':insn.op_str,'direct_target_rva':None})
                      continue
                  target=int(op.imm)-image.image_base
                  calls.append({'rva':f'0x{insn.address-image.image_base:X}','op_str':insn.op_str,'direct_target_rva':f'0x{target:X}','is_expected_helper':target==expected_helper})
          out={
              'sender_rva':f'0x{start:X}',
              'sender_end_rva':f'0x{end:X}',
              'expected_helper_rva':f'0x{expected_helper:X}',
              'direct_call_count':sum(x['direct_target_rva'] is not None for x in calls),
              'expected_helper_call_count':sum(bool(x.get('is_expected_helper')) for x in calls),
              'calls':calls,
          }
          print(json.dumps(out,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gi70-unlock-sender-edge
          path: /tmp/old-unlock-sender-calls.json
