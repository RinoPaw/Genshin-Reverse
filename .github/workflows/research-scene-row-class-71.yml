name: Temporary 7.1 Scene row-class pointer xrefs

on:
  push:
    paths:
      - '.github/workflows/research-scene-row-class-71.yml'
      - 'scripts/probe-7.1-scene-row-class-globals.py'

permissions:
  contents: read

concurrency:
  group: research-scene-row-class-71
  cancel-in-progress: true

jobs:
  source-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install maintained research package
        run: python -m pip install -e . zstandard
      - name: Obtain exact SHA-256-pinned Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace row and collection allocation class-pointer slots
        run: |
          python scripts/probe-7.1-scene-row-class-globals.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/scene-row-class-globals.json
      - name: Preserve native xref results without client bytes
        uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-row-class-pointer-xrefs
          path: work/scene-row-class-globals.json
          if-no-files-found: error
          retention-days: 2
