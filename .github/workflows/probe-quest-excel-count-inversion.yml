name: Identify QuestExcel loader by inverted row count

on:
  push:
    branches: [probe/quest-blb3-binoutput]
    paths: [".github/workflows/probe-quest-excel-count-inversion.yml"]
  workflow_dispatch:

concurrency:
  group: probe-quest-excel-count-inversion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Test generated table count readers against exact QuestExcel head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-excel-count-inversion.txt
          import bisect
          import csv
          import json
          from pathlib import Path

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          BASE=0x140000000
          MASK=0xffffffff
          ENSURE=0x1269BFC0
          OBJNEW=0x529A10

          # Exact 7.1 QuestExcel serialized payload starts with this u32.
          # The same-version public ordering contains 17,814 rows.
          RAW_HEAD=0x40233AB1
          EXPECTED={17814,17812}
          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          with (META/"methods.csv").open("r",encoding="utf-8-sig",newline="") as f:
              methods=list(csv.DictReader(f))
          rows=[]
          for m in methods:
              try:
                  r=int(m.get("rva") or "0",0)
              except Exception:
                  continue
              if r:
                  rows.append((r,m))
          rows.sort()
          starts=[r for r,_ in rows]

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          md.detail=True

          def canon(ins,reg):
              n=(ins.reg_name(reg) or "").lower()
              d={
                  "rax":"a","eax":"a","ax":"a","al":"a",
                  "rbx":"b","ebx":"b","bx":"b","bl":"b",
                  "rcx":"c","ecx":"c","cx":"c","cl":"c",
                  "rdx":"d","edx":"d","dx":"d","dl":"d",
                  "rsi":"si","esi":"si","sil":"si",
                  "rdi":"di","edi":"di","dil":"di",
                  "rbp":"bp","ebp":"bp","bpl":"bp",
              }
              if n in d:
                  return d[n]
              if n.startswith("r"):
                  z=n[1:].rstrip("dwb")
                  if z.isdigit():
                      return "r"+z
              return n

          def tr(ins):
              if ins.mnemonic not in ("call","jmp") or not ins.operands:
                  return None
              if ins.operands[0].type!=X86_OP_IMM:
                  return None
              v=int(ins.operands[0].imm)
              return v-BASE if v>=BASE else v

          def stream4(op):
              return (
                  op.type==X86_OP_MEM
                  and op.size==4
                  and op.mem.disp==0x20
                  and op.mem.base
                  and op.mem.index
                  and op.mem.scale==1
              )

          def imm_before(ins,k,reg,lim=32):
              for j in range(k-1,max(-1,k-lim),-1):
                  x=ins[j]
                  if (
                      x.mnemonic in ("mov","movabs")
                      and len(x.operands)==2
                      and x.operands[0].type==X86_OP_REG
                      and canon(x,x.operands[0].reg)==reg
                      and x.operands[1].type==X86_OP_IMM
                  ):
                      return int(x.operands[1].imm)&MASK
              return None

          def apply(v,init,ops):
              kind,c=init
              c&=MASK
              if kind=="raw":
                  x=v&MASK
              elif kind=="add":
                  x=(c+v)&MASK
              elif kind=="xor":
                  x=(c^v)&MASK
              elif kind=="const-sub-raw":
                  x=(c-v)&MASK
              else:
                  return None
              for op,k in ops:
                  k&=MASK
                  if op=="add":
                      x=(x+k)&MASK
                  elif op=="sub":
                      x=(x-k)&MASK
                  elif op=="xor":
                      x^=k
                  else:
                      return None
              return x&MASK

          parsed=[]
          with PEImage(EXE) as image:
              base=image.image_base
              for rva,m in rows:
                  if m.get("method_name")!="GMENPOPMKAA":
                      continue
                  if m.get("parameter_types")!='["FNIAHJGHFAK"]':
                      continue
                  i=bisect.bisect_right(starts,rva)
                  end=starts[i] if i<len(starts) else rva+0x600
                  size=end-rva
                  if size<0x100 or size>0x700:
                      continue
                  ins=list(md.disasm(image.read_rva(rva,size),base+rva))
                  if not any(tr(x)==ENSURE for x in ins):
                      continue
                  if sum(1 for x in ins if tr(x)==OBJNEW)<2:
                      continue
                  virtual=[
                      j for j,x in enumerate(ins)
                      if x.mnemonic in ("call","jmp")
                      and ("+ 0xf0]" in x.op_str.lower() or "+0xf0]" in x.op_str.lower())
                  ]
                  if not virtual:
                      continue

                  eidx=next((j for j,x in enumerate(ins) if tr(x)==ENSURE),None)
                  if eidx is None:
                      continue
                  found=None
                  for k in range(eidx+1,min(len(ins),eidx+40)):
                      x=ins[k]
                      if (
                          len(x.operands)!=2
                          or x.operands[0].type!=X86_OP_REG
                          or not stream4(x.operands[1])
                      ):
                          continue
                      reg=canon(x,x.operands[0].reg)
                      if x.mnemonic=="mov":
                          init=("raw",0)
                      elif x.mnemonic in ("add","xor"):
                          c=imm_before(ins,k,reg)
                          if c is None:
                              continue
                          init=(x.mnemonic,c)
                      elif x.mnemonic=="sub":
                          c=imm_before(ins,k,reg)
                          if c is None:
                              continue
                          init=("const-sub-raw",c)
                      else:
                          continue

                      ops=[]
                      for z in ins[k+1:min(len(ins),k+28)]:
                          if z.mnemonic=="call":
                              break
                          if (
                              len(z.operands)>=1
                              and z.operands[0].type==X86_OP_REG
                              and canon(z,z.operands[0].reg)==reg
                          ):
                              if (
                                  len(z.operands)==2
                                  and z.operands[1].type==X86_OP_IMM
                                  and z.mnemonic in ("add","sub","xor")
                              ):
                                  ops.append((z.mnemonic,int(z.operands[1].imm)&MASK))
                              elif (
                                  z.mnemonic=="lea"
                                  and len(z.operands)==2
                                  and z.operands[1].type==X86_OP_MEM
                              ):
                                  mm=z.operands[1].mem
                                  if mm.base and not mm.index and canon(z,mm.base)==reg and mm.disp:
                                      ops.append(("add",int(mm.disp)&MASK))
                      found=(init,ops,k)
                      break
                  if found is None:
                      continue

                  init,ops,k=found
                  decoded=apply(RAW_HEAD,init,ops)
                  keyoff=None
                  vj=virtual[0]
                  for z in ins[vj+1:vj+28]:
                      if (
                          z.mnemonic=="mov"
                          and len(z.operands)==2
                          and z.operands[1].type==X86_OP_MEM
                          and z.operands[1].size==4
                          and z.operands[1].mem.index==0
                      ):
                          disp=z.operands[1].mem.disp
                          if 0x10<=disp<=0x200:
                              keyoff=disp
                              break

                  parsed.append({
                      "rva":f"0x{rva:X}",
                      "type":m.get("type_name"),
                      "tdi":m.get("type_definition_index"),
                      "method_size":size,
                      "init":init,
                      "ops":ops,
                      "decoded_head":decoded,
                      "exact_expected":decoded in EXPECTED,
                      "plausible_count":isinstance(decoded,int) and 1000<=decoded<=100000,
                      "key_offset":keyoff,
                  })

          parsed.sort(key=lambda x:(
              not x["exact_expected"],
              not x["plausible_count"],
              abs((x["decoded_head"] or 0)-17814),
              x["rva"],
          ))

          exact=[x for x in parsed if x["exact_expected"]]
          plausible=[x for x in parsed if x["plausible_count"]]
          print("raw_head",f"0x{RAW_HEAD:08X}")
          print("container_candidates",len(parsed))
          print("exact_expected",len(exact))
          print("plausible_counts",len(plausible))
          print("\n=== exact ===")
          for x in exact:
              print(json.dumps(x,ensure_ascii=False))
          print("\n=== plausible / nearest ===")
          for x in parsed[:120]:
              print(json.dumps(x,ensure_ascii=False))

          Path("quest-excel-count-inversion.json").write_text(
              json.dumps({
                  "raw_head":f"0x{RAW_HEAD:08X}",
                  "expected_counts":sorted(EXPECTED),
                  "container_candidates":len(parsed),
                  "exact":exact,
                  "plausible":plausible,
                  "ranked":parsed,
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-excel-count-inversion
          path: |
            quest-excel-count-inversion.txt
            quest-excel-count-inversion.json
          if-no-files-found: error
