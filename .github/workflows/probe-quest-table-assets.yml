name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/samplefetch.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Enumerate exact 7.1 AssetBundle block candidates
        run: |
          python - <<'PY' | tee probe-summary.txt
          from __future__ import annotations

          from collections import Counter
          from pathlib import PurePosixPath

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import decompress_zstd, download, normalized_name, parse_manifest

          raw = download(PROFILE_71.sophon_manifest_url)
          rows = parse_manifest(decompress_zstd(raw))

          print('manifest_files', len(rows))

          suffixes = Counter()
          for row in rows:
              name = normalized_name(row)
              suffix = PurePosixPath(name).suffix or '<none>'
              suffixes[suffix] += 1
          print('=== top suffix counts ===')
          for suffix, count in suffixes.most_common(40):
              print('SUFFIX', repr(suffix), count)

          needles = ('streamingassets', 'assetbundles', '.blk', 'blocks')
          candidates = [
              row for row in rows
              if any(needle in normalized_name(row) for needle in needles)
          ]
          print('candidate_count', len(candidates))
          print('=== matching manifest rows ===')
          for row in candidates:
              print(
                  'ROW',
                  repr(row.get('filename')),
                  'size=', row.get('size'),
                  'chunks=', len(row.get('chunks', [])),
                  'flags=', row.get('flags'),
                  'md5=', row.get('md5'),
              )

          blk = [row for row in rows if normalized_name(row).endswith('.blk')]
          print('blk_count', len(blk))
          for row in blk:
              print(
                  'BLK',
                  repr(row.get('filename')),
                  'size=', row.get('size'),
                  'chunks=', len(row.get('chunks', [])),
                  'md5=', row.get('md5'),
              )

          block_named = [
              row for row in rows
              if 'blocks' in PurePosixPath(normalized_name(row)).name
          ]
          print('block_named_count', len(block_named))
          for row in block_named:
              print(
                  'BLOCK_NAMED',
                  repr(row.get('filename')),
                  'size=', row.get('size'),
                  'chunks=', len(row.get('chunks', [])),
                  'md5=', row.get('md5'),
              )
          PY
      - name: Upload probe summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-table-assets-summary
          path: probe-summary.txt
          if-no-files-found: error
