name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Inventory exact 7.1 AssetBundles files
        run: |
          python - <<'PY'
          import json
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import download,decompress_zstd,parse_manifest,normalized_name
          raw=download(PROFILE_71.sophon_manifest_url)
          rows=parse_manifest(decompress_zstd(raw))
          print('manifest files',len(rows))
          picked=[]
          for row in rows:
              n=normalized_name(row)
              if '/streamingassets/streamingassets/assetbundles/' in n:
                  picked.append(row)
          print('assetbundle manifest files',len(picked))
          for row in picked:
              print('ASSETBUNDLE_ROW', json.dumps(row,ensure_ascii=False,sort_keys=True))
          print('=== likely catalogs/indexes anywhere in manifest ===')
          for row in rows:
              n=normalized_name(row)
              base=n.rsplit('/',1)[-1]
              if any(k in base for k in ('catalog','index','manifest','blk','block','binasset','bundle')):
                  print('INDEX_CANDIDATE',json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
      - name: Search executable strings for QuestExcel table identity
        run: |
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
          python - <<'PY'
          from pathlib import Path
          data=Path('inputs/7.1.0-global/GenshinImpact.exe').read_bytes()
          needles=[
              b'Data/_ExcelBinOutput/QuestExcelConfigData',
              b'QuestExcelConfigData',
              'Data/_ExcelBinOutput/QuestExcelConfigData'.encode('utf-16le'),
              'QuestExcelConfigData'.encode('utf-16le'),
          ]
          for needle in needles:
              pos=0; hits=[]
              while True:
                  pos=data.find(needle,pos)
                  if pos<0: break
                  hits.append(pos); pos+=1
              print(needle[:60], 'hits=', [hex(x) for x in hits[:50]], 'count=',len(hits))
          PY
