name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/samplefetch.py"

permissions:
  contents: read

concurrency:
  group: probe-quest-table-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Reconstruct small exact-7.1 AssetBundle blocks
        run: |
          python - <<'PY' | tee probe-summary.txt
          from __future__ import annotations

          import re
          from pathlib import Path, PurePosixPath

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          raw = download(PROFILE_71.sophon_manifest_url)
          rows = parse_manifest(decompress_zstd(raw))
          blk = [
              row for row in rows
              if '/assetbundles/blocks/' in normalized_name(row)
              and normalized_name(row).endswith('.blk')
          ]
          small = [row for row in blk if int(row.get('size', 0) or 0) <= 300_000]
          small.sort(key=lambda row: int(row.get('size', 0) or 0))

          print('manifest_files', len(rows))
          print('blk_count', len(blk))
          print('small_blk_count', len(small))

          out = Path('probe-small-blocks')
          for row in small:
              name = str(row['filename']).replace('\\', '/')
              rel = '/'.join(name.split('/')[-3:])
              target = out / rel
              reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=2)
              data = target.read_bytes()
              strings = [
                  m.group().decode('ascii', errors='replace')
                  for m in re.finditer(rb'[ -~]{6,}', data)
              ]
              interesting = [
                  s for s in strings
                  if any(k in s.lower() for k in (
                      'quest', 'excel', 'config', 'data/', 'asset', 'bundle',
                      'version', 'revision', 'binoutput', 'json', 'lua'
                  ))
              ]
              print(
                  'SMALL', rel,
                  'size=', len(data),
                  'md5=', row.get('md5'),
                  'head=', data[:32].hex(),
              )
              for s in interesting[:80]:
                  print('STRING', rel, repr(s[:500]))
          PY
      - name: Upload probe summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-table-assets-summary
          path: probe-summary.txt
          if-no-files-found: error
      - name: Upload reconstructed small blocks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-table-small-blocks
          path: probe-small-blocks
          if-no-files-found: error
