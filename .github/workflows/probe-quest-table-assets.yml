name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/samplefetch.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Reconstruct exact 7.1 catalog files
        run: |
          python - <<'PY'
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import decompress_zstd, download, normalized_name, parse_manifest, reconstruct

          rows = parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          wanted = {
              'data_versions_streaming',
              'res_versions_streaming',
              'ctable_streaming.dat',
              'svc_catalog',
              'asb_settings.json',
          }
          out = Path('catalogs')
          for name in wanted:
              matches = [r for r in rows if normalized_name(r).endswith('/' + name)]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one manifest row, got {len(matches)}')
              row = matches[0]
              target = out / name
              reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=8)
              print(name, target.stat().st_size, row.get('md5'))
          PY
      - name: Inspect catalogs
        shell: bash
        run: |
          set -euo pipefail
          {
            for f in catalogs/*; do
              echo "===== $f ====="
              file "$f" || true
              sha256sum "$f"
              echo '-- head hex --'
              od -An -tx1 -N128 "$f" || true
              echo '-- relevant strings --'
              strings -a -n 5 "$f" | grep -Ei 'QuestExcel|ExcelBinOutput|binoutput|asset_index|external_asset|data/binoutput|31049740|26986803|\.asb|blocks/' | head -n 300 || true
              echo '-- first strings --'
              strings -a -n 5 "$f" | head -n 80 || true
            done
          } | tee catalog-summary.txt
      - name: Upload focused probe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-catalog-probe
          path: |
            catalog-summary.txt
            catalogs
          if-no-files-found: warn
