name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches:
      - main
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/samplefetch.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Inventory exact 7.1 manifest and reconstruct known binoutput block
        run: |
          python - <<'PY' | tee probe-summary.txt
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          raw = download(PROFILE_71.sophon_manifest_url)
          rows = parse_manifest(decompress_zstd(raw))
          blk = [
              row for row in rows
              if '/assetbundles/blocks/' in normalized_name(row)
              and normalized_name(row).endswith('.blk')
          ]
          print('manifest_files', len(rows))
          print('blk_count', len(blk))
          print('--- non-block manifest rows ---')
          for row in rows:
              if row not in blk:
                  print('ROW', row.get('size'), len(row.get('chunks', [])), row.get('filename'))
          print('--- BLB size distribution ---')
          for limit in (1_000, 10_000, 100_000, 256_000, 1_000_000, 5_000_000, 10_000_000, 50_000_000):
              print('LE', limit, sum(int(row.get('size', 0) or 0) <= limit for row in blk))
          largest = sorted(blk, key=lambda row: int(row.get('size', 0) or 0), reverse=True)[:30]
          print('--- largest BLBs ---')
          for row in largest:
              print('BLK', row.get('size'), len(row.get('chunks', [])), row.get('filename'))

          matches = [row for row in blk if normalized_name(row).endswith('/00/26986803.blk')]
          if len(matches) != 1:
              raise SystemExit(f'expected one 00/26986803.blk row, got {len(matches)}')
          row = matches[0]
          name = str(row['filename']).replace('\\', '/')
          rel = '/'.join(name.split('/')[-3:])
          target = Path('probe-block') / rel
          reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=2)
          data = target.read_bytes()
          print('TARGET', rel, 'size=', len(data), 'md5=', row.get('md5'), 'head=', data[:32].hex())
          print('contains_binoutput_path=', b'data/binoutput_1.asb' in data)
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract BLB3 through AnimeStudio
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"

          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if ((${#apphosts[@]})); then
            chmod +x "${apphosts[0]}"
            cli=("${apphosts[0]}")
          elif ((${#dlls[@]})); then
            cli=(dotnet "${dlls[0]}")
          else
            echo 'AnimeStudio CLI entry point not found' >&2
            exit 2
          fi

          input=$(find probe-block -type f -name '26986803.blk' -print -quit)
          test -n "$input"
          rm -rf animestudio-output
          mkdir -p animestudio-output
          "${cli[@]}" "$input" animestudio-output --game GI --export_type Raw --logger_flags Verbose 2>&1 | tee animestudio-probe.txt
          {
            echo '--- extracted files ---'
            find animestudio-output -type f -printf '%P\t%s bytes\n' | sort
          } | tee animestudio-output-summary.txt
      - name: Upload focused probe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-binoutput-blb3-probe
          path: |
            probe-summary.txt
            animestudio-probe.txt
            animestudio-output-summary.txt
            animestudio-output
          if-no-files-found: warn
