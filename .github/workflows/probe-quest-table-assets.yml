name: Probe 7.1 QuestExcel serialized assets

on:
  push:
    branches:
      - main
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/samplefetch.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Reconstruct exact 7.1 catalog candidates and known binoutput block
        run: |
          python - <<'PY' | tee probe-summary.txt
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          raw = download(PROFILE_71.sophon_manifest_url)
          rows = parse_manifest(decompress_zstd(raw))
          blk = [
              row for row in rows
              if '/assetbundles/blocks/' in normalized_name(row)
              and normalized_name(row).endswith('.blk')
          ]
          print('manifest_files', len(rows))
          print('blk_count', len(blk))

          names = {
              'genshinimpact_data/streamingassets/res_versions_streaming',
              'genshinimpact_data/streamingassets/data_versions_streaming',
              'genshinimpact_data/streamingassets/svc_catalog',
              'genshinimpact_data/streamingassets/ctable_streaming.dat',
          }
          out = Path('catalogs')
          out.mkdir(exist_ok=True)
          for row in rows:
              norm = normalized_name(row)
              if norm not in names:
                  continue
              target = out / Path(str(row['filename'])).name
              reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=4)
              data = target.read_bytes()
              print('CATALOG', target.name, 'size=', len(data), 'md5=', row.get('md5'), 'head=', data[:64].hex())
              for needle in (b'binoutput', b'87ae8396', b'QuestExcel', b'26986803', b'blocks/00'):
                  print(' ', needle.decode(), 'offset=', data.lower().find(needle.lower()))

          matches = [row for row in blk if normalized_name(row).endswith('/00/26986803.blk')]
          if len(matches) != 1:
              raise SystemExit(f'expected one 00/26986803.blk row, got {len(matches)}')
          row = matches[0]
          target = Path('probe-block/blocks/00/26986803.blk')
          reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=2)
          data = target.read_bytes()
          print('TARGET blocks/00/26986803.blk size=', len(data), 'md5=', row.get('md5'), 'head=', data[:32].hex())
          print('contains_binoutput_path=', b'data/binoutput_1.asb' in data)
          PY
      - name: Inspect catalog text surfaces
        shell: bash
        run: |
          set -euo pipefail
          {
            for f in catalogs/*; do
              echo "===== $f ====="
              file "$f" || true
              echo '-- first lines --'
              head -n 20 "$f" 2>/dev/null || true
              echo '-- targeted strings --'
              strings -a -n 6 "$f" | grep -Ei 'binoutput|QuestExcel|87ae8396|26986803|blocks[/\\]00|assetbundle' | head -n 300 || true
            done
          } | tee catalog-inspect.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract known BLB3 through AnimeStudio
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if ((${#apphosts[@]})); then
            chmod +x "${apphosts[0]}"
            cli=("${apphosts[0]}")
          elif ((${#dlls[@]})); then
            cli=(dotnet "${dlls[0]}")
          else
            echo 'AnimeStudio CLI entry point not found' >&2
            exit 2
          fi
          rm -rf animestudio-output
          mkdir -p animestudio-output
          "${cli[@]}" probe-block/blocks/00/26986803.blk animestudio-output --game GI --export_type Raw --logger_flags Verbose 2>&1 | tee animestudio-probe.txt
          find animestudio-output -type f -printf '%P\t%s bytes\n' | sort | tee animestudio-output-summary.txt
      - name: Upload focused probe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-binoutput-catalog-probe
          path: |
            probe-summary.txt
            catalog-inspect.txt
            catalogs
            animestudio-probe.txt
            animestudio-output-summary.txt
            animestudio-output
          if-no-files-found: warn
