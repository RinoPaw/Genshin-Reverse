name: Probe 7.1 QuestExcel serialized asset

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-table-assets.yml"
      - "genshinre/assetindex.py"
      - "genshinre/samplefetch.py"

concurrency:
  group: probe-quest-table-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Reconstruct exact 7.1 source blocks
        run: |
          python - <<'PY' | tee reconstruct-summary.txt
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import decompress_zstd, download, normalized_name, parse_manifest, reconstruct

          rows = parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          wanted = {
              'design-index/31049741.blk': '/assetbundles/blocks/00/31049741.blk',
              'quest-native/25539185.blk': '/assetbundles/blocks/00/25539185.blk',
          }
          for target_name, suffix in wanted.items():
              matches = [r for r in rows if normalized_name(r).endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f'{suffix}: expected one manifest row, got {len(matches)}')
              row = matches[0]
              target = Path(target_name)
              reconstruct(PROFILE_71.sophon_chunk_prefix, row, target, workers=8)
              print(target_name, 'size=', target.stat().st_size, 'md5=', row.get('md5'))
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned AnimeStudio CLI
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if ((${#apphosts[@]})); then
            chmod +x "${apphosts[0]}"
            printf '%s\n' "${apphosts[0]}" > /tmp/animestudio-entry
          elif ((${#dlls[@]})); then
            printf 'dotnet\n%s\n' "${dlls[0]}" > /tmp/animestudio-entry
          else
            echo 'AnimeStudio CLI entry point not found' >&2
            exit 2
          fi
      - name: Resolve QuestExcel hash to native block
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if ((${#entry[@]} == 1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi
          rm -rf design-index-output
          mkdir -p design-index-output
          "${cli[@]}" design-index/31049741.blk design-index-output --game GI --export_type Raw --logger_flags Error 2>&1 | tee design-index-animestudio.txt
          python - <<'PY' | tee asset-chain-summary.txt
          from pathlib import Path
          from genshinre.assetindex import mihoyo_name_hash, parse_asset_index

          path = 'Data/_ExcelBinOutput/QuestExcelConfigData'
          expected_hash = 0x3B87AE8396
          value = mihoyo_name_hash(path)
          if value != expected_hash:
              raise SystemExit(f'QuestExcel hash mismatch: 0x{value:010X}')

          export = Path('design-index-output/MiHoYoBinData/0000006f.dat')
          if not export.is_file():
              raise SystemExit(f'design index export missing: {export}')
          index = parse_asset_index(export.read_bytes())
          name = index.name_for_hash(value)
          block_ref = index.block_ref_for_asset(name.sub_asset_id)
          group_id = index.block_groups[block_ref.block_id]
          print(f'name_hash=0x{value:010X}')
          print(f'exported_name={name.exported_name}')
          print(f'sub_asset_id={name.sub_asset_id}')
          print(f'block_id={block_ref.block_id}')
          print(f'group_id={group_id}')
          print(f'unknown0={block_ref.unknown0}')
          print(f'unknown1={block_ref.unknown1}')
          if (name.sub_asset_id, block_ref.block_id, group_id) != (178, 25539185, 0):
              raise SystemExit('unexpected 7.1 QuestExcel asset chain')
          PY
      - name: Resolve and decode current 7.1 MainQuest binary indexes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if (("${#entry[@]}" == 1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi

          python - <<'PY' | tee mainquest-index-asset-summary.txt
          import json
          from pathlib import Path

          from genshinre.assetindex import mihoyo_name_hash, parse_asset_index

          export = Path('design-index-output/MiHoYoBinData/0000006f.dat')
          index = parse_asset_index(export.read_bytes())
          paths = [
              'Data/_BinOutput/IndexDic/MainQuestIndex',
              'Data/_BinOutput/IndexDic/MainQuestBriefIndex',
              'Data/_ExcelBinOutput/MainQuestExcelConfigData',
          ]
          out = []
          for path in paths:
              h = mihoyo_name_hash(path)
              name = index.name_for_hash(h)
              ref = index.block_ref_for_asset(name.sub_asset_id)
              group_id = index.block_groups[ref.block_id]
              item = {
                  'path': path,
                  'hash': f'0x{h:010X}',
                  'exported_name': name.exported_name,
                  'sub_asset_id': name.sub_asset_id,
                  'block_id': ref.block_id,
                  'group_id': group_id,
                  'unknown0': ref.unknown0,
                  'unknown1': ref.unknown1,
              }
              out.append(item)
              print(json.dumps(item, ensure_ascii=False))
          Path('mainquest-index-assets.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          python - <<'PY' | tee mainquest-index-reconstruct.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          items = json.loads(Path('mainquest-index-assets.json').read_text(encoding='utf-8'))
          rows = parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          done = set()
          for item in items:
              block_id = int(item['block_id'])
              group_id = int(item['group_id'])
              key = (group_id, block_id)
              if key in done:
                  continue
              done.add(key)
              suffix = f'/assetbundles/blocks/{group_id:02x}/{block_id}.blk'
              matches = [r for r in rows if normalized_name(r).endswith(suffix)]
              if len(matches) != 1:
                  # Some manifests render the block group as decimal rather than hex.
                  suffix2 = f'/assetbundles/blocks/{group_id:02d}/{block_id}.blk'
                  matches = [r for r in rows if normalized_name(r).endswith(suffix2)]
              if len(matches) != 1:
                  raise SystemExit(
                      f'block {block_id} group {group_id}: expected one manifest row, got {len(matches)}'
                  )
              target = Path(f'mainquest-index-blocks/{group_id}/{block_id}.blk')
              reconstruct(PROFILE_71.sophon_chunk_prefix, matches[0], target, workers=8)
              print(target, 'size=', target.stat().st_size, 'md5=', matches[0].get('md5'))
          PY

          rm -rf mainquest-index-output
          mkdir -p mainquest-index-output
          python - <<'PY' > /tmp/mainquest-index-block-list
          import json
          from pathlib import Path
          items=json.loads(Path('mainquest-index-assets.json').read_text(encoding='utf-8'))
          seen=set()
          for x in items:
              p=f"mainquest-index-blocks/{x['group_id']}/{x['block_id']}.blk"
              if p not in seen:
                  print(p)
                  seen.add(p)
          PY

          while IFS= read -r block; do
            out="mainquest-index-output/$(basename "$block" .blk)"
            mkdir -p "$out"
            "${cli[@]}" "$block" "$out" --game GI --export_type Raw --logger_flags Error \
              2>&1 | tee -a mainquest-index-animestudio.txt
          done < /tmp/mainquest-index-block-list

          python - <<'PY' | tee mainquest-index-decode.txt
          import json
          import struct
          from pathlib import Path

          from genshinre.assetindex import unwrap_mihoyo_bin_data

          MASK32 = 0xFFFFFFFF
          MASK64 = 0xFFFFFFFFFFFFFFFF

          def decode_index(payload):
              if len(payload) < 4:
                  raise ValueError('truncated index payload')
              encoded_count = struct.unpack_from('<I', payload, 0)[0]
              count = ((encoded_count ^ 0x5785D208) + 0x0A34766E) & MASK32
              expected = 4 + count * 12
              if expected != len(payload):
                  raise ValueError(
                      f'index framing mismatch: count={count} expected={expected} actual={len(payload)}'
                  )
              rows=[]
              pos=4
              for i in range(count):
                  enc_id=struct.unpack_from('<I',payload,pos)[0]
                  enc_handle=struct.unpack_from('<Q',payload,pos+4)[0]
                  pos += 12
                  rows.append({
                      'index': i,
                      'id': enc_id ^ 0x92C938B5,
                      'handle': (enc_handle + 0x2B6567EA) & MASK64,
                  })
              return rows

          items=json.loads(Path('mainquest-index-assets.json').read_text(encoding='utf-8'))
          results=[]
          for item in items:
              if not item['path'].startswith('Data/_BinOutput/IndexDic/'):
                  continue
              root=Path('mainquest-index-output')/str(item['block_id'])/'MiHoYoBinData'
              target=root/(item['exported_name'] + '.dat')
              if not target.is_file():
                  candidates=list(root.glob('*.dat')) if root.is_dir() else []
                  raise SystemExit(
                      f"missing raw export for {item['path']}: expected {target}; candidates={candidates[:20]}"
                  )
              raw=target.read_bytes()
              payload=unwrap_mihoyo_bin_data(raw)
              rows=decode_index(payload)
              ids=[x['id'] for x in rows]
              hit351=[x for x in rows if x['id'] == 351]
              summary={
                  **item,
                  'raw_size': len(raw),
                  'payload_size': len(payload),
                  'count': len(rows),
                  'unique_ids': len(set(ids)),
                  'min_id': min(ids) if ids else None,
                  'max_id': max(ids) if ids else None,
                  'id_351': hit351,
                  'first_entries': rows[:12],
                  'last_entries': rows[-4:],
              }
              results.append(summary)
              print(json.dumps(summary, ensure_ascii=False, indent=2))
          Path('mainquest-index-decode.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Resolve and export exact main quest 351 BinOutput resource
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if (("${#entry[@]}" == 1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi

          python - <<'PY' | tee quest351-asset-summary.txt
          import json
          from pathlib import Path

          from genshinre.assetindex import mihoyo_name_hash, parse_asset_index

          results=json.loads(Path('mainquest-index-decode.json').read_text(encoding='utf-8'))
          full=next(
              x for x in results
              if x['path']=='Data/_BinOutput/IndexDic/MainQuestIndex'
          )
          hits=full.get('id_351') or []
          if len(hits)!=1:
              raise SystemExit(f'expected one mainId 351 index row, got {hits}')
          handle=int(hits[0]['handle'])
          low40=handle & ((1 << 40) - 1)

          path='Data/_BinOutput/Quest/351'
          expected=mihoyo_name_hash(path)
          if low40 != expected:
              raise SystemExit(
                  f'351 handle low40 mismatch: handle=0x{handle:016X} '
                  f'low40=0x{low40:010X} path_hash=0x{expected:010X}'
              )

          index=parse_asset_index(
              Path('design-index-output/MiHoYoBinData/0000006f.dat').read_bytes()
          )
          name=index.name_for_hash(low40)
          ref=index.block_ref_for_asset(name.sub_asset_id)
          group_id=index.block_groups[ref.block_id]

          out={
              'main_id':351,
              'path':path,
              'handle':handle,
              'handle_hex':f'0x{handle:016X}',
              'handle_low40':f'0x{low40:010X}',
              'path_hash':f'0x{expected:010X}',
              'exported_name':name.exported_name,
              'sub_asset_id':name.sub_asset_id,
              'block_id':ref.block_id,
              'group_id':group_id,
              'unknown0':ref.unknown0,
              'unknown1':ref.unknown1,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('quest351-asset.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          python - <<'PY' | tee quest351-reconstruct.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          item=json.loads(Path('quest351-asset.json').read_text(encoding='utf-8'))
          block_id=int(item['block_id'])
          group_id=int(item['group_id'])
          rows=parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))

          suffix=f'/assetbundles/blocks/{group_id:02x}/{block_id}.blk'
          matches=[r for r in rows if normalized_name(r).endswith(suffix)]
          if len(matches)!=1:
              suffix2=f'/assetbundles/blocks/{group_id:02d}/{block_id}.blk'
              matches=[r for r in rows if normalized_name(r).endswith(suffix2)]
          if len(matches)!=1:
              raise SystemExit(
                  f'351 block {block_id} group {group_id}: expected one manifest row, got {len(matches)}'
              )

          target=Path(f'quest351-block/{group_id}/{block_id}.blk')
          reconstruct(PROFILE_71.sophon_chunk_prefix,matches[0],target,workers=8)
          print(target,'size=',target.stat().st_size,'md5=',matches[0].get('md5'))
          PY

          item_block=$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('quest351-asset.json').read_text())
          print(f"quest351-block/{x['group_id']}/{x['block_id']}.blk")
          PY
          )
          rm -rf quest351-output
          mkdir -p quest351-output
          "${cli[@]}" "$item_block" quest351-output --game GI --export_type Raw --logger_flags Error \
            2>&1 | tee quest351-animestudio.txt

          python - <<'PY' | tee quest351-raw-summary.txt
          import json
          from pathlib import Path
          from genshinre.assetindex import unwrap_mihoyo_bin_data

          item=json.loads(Path('quest351-asset.json').read_text(encoding='utf-8'))
          root=Path('quest351-output')/'MiHoYoBinData'
          target=root/(item['exported_name']+'.dat')
          if not target.is_file():
              candidates=list(root.glob('*.dat')) if root.is_dir() else []
              raise SystemExit(
                  f'missing exact quest 351 export: expected {target}; candidates={candidates[:30]}'
              )

          raw=target.read_bytes()
          payload=unwrap_mihoyo_bin_data(raw)
          Path('quest351-payload.bin').write_bytes(payload)
          summary={
              **item,
              'raw_path':str(target),
              'raw_size':len(raw),
              'payload_size':len(payload),
              'payload_prefix_hex':payload[:64].hex(),
              'payload_suffix_hex':payload[-32:].hex() if payload else '',
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          Path('quest351-raw-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

      - name: Resolve and export exact main quest 351 brief BinOutput resource
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if (("${#entry[@]}" == 1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi

          python - <<'PY' | tee quest351-brief-asset-summary.txt
          import json
          from pathlib import Path

          from genshinre.assetindex import mihoyo_name_hash, parse_asset_index

          results=json.loads(Path('mainquest-index-decode.json').read_text(encoding='utf-8'))
          brief=next(
              x for x in results
              if x['path']=='Data/_BinOutput/IndexDic/MainQuestBriefIndex'
          )
          hits=brief.get('id_351') or []
          if len(hits)!=1:
              raise SystemExit(f'expected one brief mainId 351 index row, got {hits}')
          handle=int(hits[0]['handle'])
          low40=handle & ((1 << 40) - 1)

          path='Data/_BinOutput/QuestBrief/351'
          expected=mihoyo_name_hash(path)
          if low40 != expected:
              raise SystemExit(
                  f'351 brief handle low40 mismatch: handle=0x{handle:016X} '
                  f'low40=0x{low40:010X} path_hash=0x{expected:010X}'
              )

          index=parse_asset_index(
              Path('design-index-output/MiHoYoBinData/0000006f.dat').read_bytes()
          )
          name=index.name_for_hash(low40)
          ref=index.block_ref_for_asset(name.sub_asset_id)
          group_id=index.block_groups[ref.block_id]

          out={
              'main_id':351,
              'path':path,
              'handle':handle,
              'handle_hex':f'0x{handle:016X}',
              'handle_low40':f'0x{low40:010X}',
              'path_hash':f'0x{expected:010X}',
              'exported_name':name.exported_name,
              'sub_asset_id':name.sub_asset_id,
              'block_id':ref.block_id,
              'group_id':group_id,
              'unknown0':ref.unknown0,
              'unknown1':ref.unknown1,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('quest351-brief-asset.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          python - <<'PY' | tee quest351-brief-reconstruct.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import (
              decompress_zstd,
              download,
              normalized_name,
              parse_manifest,
              reconstruct,
          )

          item=json.loads(Path('quest351-brief-asset.json').read_text(encoding='utf-8'))
          block_id=int(item['block_id'])
          group_id=int(item['group_id'])
          rows=parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))

          suffix=f'/assetbundles/blocks/{group_id:02x}/{block_id}.blk'
          matches=[r for r in rows if normalized_name(r).endswith(suffix)]
          if len(matches)!=1:
              suffix2=f'/assetbundles/blocks/{group_id:02d}/{block_id}.blk'
              matches=[r for r in rows if normalized_name(r).endswith(suffix2)]
          if len(matches)!=1:
              raise SystemExit(
                  f'351 brief block {block_id} group {group_id}: expected one manifest row, got {len(matches)}'
              )

          target=Path(f'quest351-brief-block/{group_id}/{block_id}.blk')
          reconstruct(PROFILE_71.sophon_chunk_prefix,matches[0],target,workers=8)
          print(target,'size=',target.stat().st_size,'md5=',matches[0].get('md5'))
          PY

          item_block=$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('quest351-brief-asset.json').read_text())
          print(f"quest351-brief-block/{x['group_id']}/{x['block_id']}.blk")
          PY
          )
          rm -rf quest351-brief-output
          mkdir -p quest351-brief-output
          "${cli[@]}" "$item_block" quest351-brief-output --game GI --export_type Raw --logger_flags Error \
            2>&1 | tee quest351-brief-animestudio.txt

          python - <<'PY' | tee quest351-brief-raw-summary.txt
          import json
          from pathlib import Path
          from genshinre.assetindex import unwrap_mihoyo_bin_data

          item=json.loads(Path('quest351-brief-asset.json').read_text(encoding='utf-8'))
          root=Path('quest351-brief-output')/'MiHoYoBinData'
          target=root/(item['exported_name']+'.dat')
          if not target.is_file():
              candidates=list(root.glob('*.dat')) if root.is_dir() else []
              raise SystemExit(
                  f'missing exact quest brief 351 export: expected {target}; candidates={candidates[:30]}'
              )

          raw=target.read_bytes()
          payload=unwrap_mihoyo_bin_data(raw)
          Path('quest351-brief-payload.bin').write_bytes(payload)
          summary={
              **item,
              'raw_path':str(target),
              'raw_size':len(raw),
              'payload_size':len(payload),
              'payload_prefix_hex':payload[:64].hex(),
              'payload_suffix_hex':payload[-32:].hex() if payload else '',
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          Path('quest351-brief-raw-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

      - name: Extract and validate exact QuestExcel Raw object
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if ((${#entry[@]} == 1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi
          rm -rf quest-output
          mkdir -p quest-output
          "${cli[@]}" quest-native/25539185.blk quest-output --game GI --export_type Raw --logger_flags Error 2>&1 | tee quest-animestudio.txt
          python - <<'PY' | tee quest-payload-summary.txt
          import hashlib
          from pathlib import Path
          from genshinre.assetindex import unwrap_mihoyo_bin_data

          target = Path('quest-output/MiHoYoBinData/3b87ae83.dat')
          if not target.is_file():
              raise SystemExit(f'QuestExcel Raw export missing: {target}')
          raw = target.read_bytes()
          payload = unwrap_mihoyo_bin_data(raw)

          value = 0
          shift = 0
          consumed = 0
          for byte in payload:
              consumed += 1
              value |= (byte & 0x7f) << shift
              if not (byte & 0x80):
                  break
              shift += 7
              if shift >= 64:
                  raise SystemExit('leading varint is too wide')
          else:
              raise SystemExit('truncated leading varint')

          print('raw_size=', len(raw))
          print('payload_size=', len(payload))
          print('sha256=', hashlib.sha256(raw).hexdigest())
          print('head=', raw[:64].hex())
          print('leading_uvarint=', value)
          print('leading_uvarint_bytes=', consumed)
          if len(raw) != 2_824_192 or len(payload) != 2_824_188:
              raise SystemExit('unexpected 7.1 QuestExcel Raw export size')
          if value != 7473:
              raise SystemExit(f'unexpected leading uvarint: {value}')
          PY
      - name: Test exact QuestExcel outer length framing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-outer-framing.txt
          import json
          from pathlib import Path

          from genshinre.assetindex import unwrap_mihoyo_bin_data

          raw = Path('quest-output/MiHoYoBinData/3b87ae83.dat').read_bytes()
          payload = unwrap_mihoyo_bin_data(raw)

          def read_uvarint(data, pos):
              value = 0
              shift = 0
              start = pos
              while pos < len(data):
                  b = data[pos]
                  pos += 1
                  value |= (b & 0x7F) << shift
                  if not (b & 0x80):
                      return value, pos, pos - start
                  shift += 7
                  if shift >= 64:
                      raise ValueError(f'uvarint too wide at offset {start}')
              raise EOFError(f'truncated uvarint at offset {start}')

          count, pos, count_bytes = read_uvarint(payload, 0)
          result = {
              'payload_size': len(payload),
              'count': count,
              'count_prefix_bytes': count_bytes,
              'candidate': 'uvarint_count_then_uvarint_length_records',
              'records': [],
              'parsed_records': 0,
              'final_offset': None,
              'exact_consumption': False,
              'error': None,
          }

          try:
              for index in range(count):
                  prefix_offset = pos
                  size, data_offset, prefix_bytes = read_uvarint(payload, pos)
                  end = data_offset + size
                  if end > len(payload):
                      raise ValueError(
                          f'record {index}: size {size} at {prefix_offset} '
                          f'ends at {end} beyond payload {len(payload)}'
                      )
                  if index < 16 or index >= max(0, count - 4):
                      result['records'].append({
                          'index': index,
                          'prefix_offset': prefix_offset,
                          'prefix_bytes': prefix_bytes,
                          'size': size,
                          'data_offset': data_offset,
                          'end_offset': end,
                          'head_hex': payload[data_offset:min(end, data_offset + 16)].hex(),
                      })
                  pos = end
                  result['parsed_records'] = index + 1
              result['final_offset'] = pos
              result['exact_consumption'] = pos == len(payload)
          except Exception as exc:
              result['final_offset'] = pos
              result['error'] = f'{type(exc).__name__}: {exc}'

          print(json.dumps(result, ensure_ascii=False, indent=2))
          Path('quest-outer-framing.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # This step is an evidence test, not an assertion that this candidate
          # framing is correct. The result itself decides whether the hypothesis
          # survives.
          PY
      - name: Locate representative Quest rows and decode acceptCond candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-row-target-scan.txt
          import json
          import struct
          from pathlib import Path

          from genshinre.assetindex import unwrap_mihoyo_bin_data

          MASK32 = 0xFFFFFFFF
          MASK64 = 0xFFFFFFFFFFFFFFFF

          target = Path('quest-output/MiHoYoBinData/3b87ae83.dat')
          payload = unwrap_mihoyo_bin_data(target.read_bytes())

          TARGETS = [
              35100, 35101, 35102, 35103, 35104, 35105, 35106, 35107,
              37504, 37603, 38805,
          ]

          def enc_sub_id(value):
              return (((value ^ 0x54F036F0) - 0xECA43BB1) & MASK32).to_bytes(4, 'little')

          def enc_main_id(value):
              return ((value - 0x37C70F67) & MASK32).to_bytes(4, 'little')

          def all_occurrences(data, needle):
              out = []
              start = 0
              while True:
                  pos = data.find(needle, start)
                  if pos < 0:
                      return out
                  out.append(pos)
                  start = pos + 1

          def printable(data):
              return ''.join(chr(x) if 32 <= x < 127 else '.' for x in data)

          def decode_string_block(raw, size):
              # RandomQuestCond.FromBinaryInner decodes each source qword with:
              #   decoded_qword = encoded_qword + 0xFFB5ABCD75E0AA9F
              # The final partial qword follows the same arithmetic.
              key = 0xFFB5ABCD75E0AA9F
              chunks = bytearray()
              count = (size + 7) // 8
              padded = raw[:count * 8].ljust(count * 8, b'\0')
              for i in range(count):
                  word = struct.unpack_from('<Q', padded, i * 8)[0]
                  chunks += struct.pack('<Q', (word + key) & MASK64)
              return bytes(chunks[:size])

          def decode_random_cond(data, start, string_advance):
              pos = start
              if pos + 2 > len(data):
                  raise ValueError('truncated mask')
              raw_mask = struct.unpack_from('<H', data, pos)[0]
              pos += 2
              mask = raw_mask ^ 0xF5FD
              result = {
                  'start': start,
                  'raw_mask': f'0x{raw_mask:04X}',
                  'mask': f'0x{mask:04X}',
                  'param_present': bool(mask & 0x80),
                  'type_present': bool(mask & 0x10),
              }

              params = []
              if mask & 0x80:
                  if pos + 4 > len(data):
                      raise ValueError('truncated param count')
                  raw_count = struct.unpack_from('<I', data, pos)[0]
                  pos += 4
                  count = raw_count ^ 0xFF097144
                  if count > 16:
                      raise ValueError(f'implausible param count {count}')
                  result['raw_param_count'] = f'0x{raw_count:08X}'
                  result['param_count'] = count
                  for _ in range(count):
                      if pos + 2 > len(data):
                          raise ValueError('truncated string length')
                      raw_len = struct.unpack_from('<H', data, pos)[0]
                      pos += 2
                      size = raw_len ^ 0xAA9F
                      if size > 256:
                          raise ValueError(f'implausible string size {size}')
                      if size == 0:
                          params.append('')
                          continue
                      wire = size if string_advance == 'byte' else ((size + 7) // 8) * 8
                      if pos + wire > len(data):
                          raise ValueError('truncated encoded string')
                      decoded = decode_string_block(data[pos:pos + max(wire, ((size + 7) // 8) * 8)], size)
                      try:
                          text = decoded.decode('utf-8')
                      except UnicodeDecodeError:
                          text = decoded.hex()
                      params.append(text)
                      pos += wire
              result['params'] = params

              if mask & 0x10:
                  if pos + 4 > len(data):
                      raise ValueError('truncated condition type')
                  raw_type = struct.unpack_from('<I', data, pos)[0]
                  pos += 4
                  cond_type = raw_type ^ 0x2630ADFF
                  result['raw_type'] = f'0x{raw_type:08X}'
                  result['type_value'] = cond_type
              else:
                  result['type_value'] = 0

              result['end'] = pos
              result['consumed'] = pos - start
              return result

          def decode_random_cond_array(data, start, string_advance):
              if start + 4 > len(data):
                  raise ValueError('truncated array count')
              raw_count = struct.unpack_from('<I', data, start)[0]
              count = (raw_count + 0x2B808E28) & MASK32
              if count > 16:
                  raise ValueError(f'implausible array count {count}')
              pos = start + 4
              items = []
              for _ in range(count):
                  item = decode_random_cond(data, pos, string_advance)
                  items.append(item)
                  pos = item['end']
              return {
                  'start': start,
                  'raw_count': f'0x{raw_count:08X}',
                  'count': count,
                  'string_advance': string_advance,
                  'items': items,
                  'end': pos,
                  'consumed': pos - start,
              }

          positions = {}
          print('=== encoded subId anchors ===')
          for sub_id in TARGETS:
              needle = enc_sub_id(sub_id)
              hits = all_occurrences(payload, needle)
              positions[sub_id] = hits
              print(
                  f'subId={sub_id} encoded={needle.hex()} '
                  f'hits={[hex(x) for x in hits]}'
              )

          print('=== 351 row anchor order ===')
          cluster = []
          for sub_id in range(35100, 35108):
              for pos in positions.get(sub_id, []):
                  cluster.append((pos, sub_id))
          for pos, sub_id in sorted(cluster):
              print(f'0x{pos:X} subId={sub_id}')

          evidence = {'targets': {}}
          print('=== target row windows / acceptCond-array candidates ===')
          for sub_id in TARGETS:
              hits = positions[sub_id]
              record = {
                  'encoded_sub_id': enc_sub_id(sub_id).hex(),
                  'hits': hits,
                  'anchors': [],
              }
              evidence['targets'][str(sub_id)] = record
              if len(hits) != 1:
                  print(f'-- subId={sub_id}: expected one anchor, got {len(hits)} --')
                  continue

              pos = hits[0]
              main_id = sub_id // 100
              main_hits = [
                  x for x in all_occurrences(payload, enc_main_id(main_id))
                  if pos - 256 <= x <= pos + 768
              ]
              left = max(0, pos - 192)
              right = min(len(payload), pos + 1024)
              window = payload[left:right]

              print(f'-- subId={sub_id} anchor=0x{pos:X} mainId={main_id} --')
              print('mainId_near=', [hex(x) for x in main_hits])
              print('window_base=', hex(left))
              print('window_hex=', window.hex())
              print('window_ascii=', printable(window))

              candidates = []
              # RandomQuestCond[] array count is decoded as:
              #   count = raw_u32 + 0x2B808E28
              # Probe plausible 0..8 counts in the post-subId region.
              scan_end = min(len(payload), pos + 1400)
              for count in range(0, 9):
                  raw = (count - 0x2B808E28) & MASK32
                  needle = struct.pack('<I', raw)
                  start = pos
                  while True:
                      at = payload.find(needle, start, scan_end)
                      if at < 0:
                          break
                      candidate = {
                          'offset': at,
                          'count': count,
                          'raw': f'0x{raw:08X}',
                          'decodes': [],
                      }
                      for strategy in ('byte', 'qword'):
                          try:
                              decoded = decode_random_cond_array(payload, at, strategy)
                              # Keep only structurally plausible masks/types.
                              plausible = all(
                                  (int(item['mask'], 16) & ~0x90) == 0
                                  and item['type_value'] < 512
                                  for item in decoded['items']
                              )
                              decoded['plausible'] = plausible
                              candidate['decodes'].append(decoded)
                          except Exception as exc:
                              candidate['decodes'].append({
                                  'string_advance': strategy,
                                  'error': f'{type(exc).__name__}: {exc}',
                              })
                      candidates.append(candidate)
                      start = at + 1

              # Also report acceptCondComb-like words. Current row decoder uses
              # value = raw_u32 ^ 0x71121A23; enum values should remain small.
              comb = []
              for at in range(pos, scan_end - 3):
                  raw = struct.unpack_from('<I', payload, at)[0]
                  value = raw ^ 0x71121A23
                  if value <= 8:
                      comb.append({
                          'offset': at,
                          'raw': f'0x{raw:08X}',
                          'value': value,
                      })

              anchor_info = {
                  'sub_id_offset': pos,
                  'main_id_near': main_hits,
                  'window_base': left,
                  'window_hex': window.hex(),
                  'array_candidates': candidates,
                  'comb_candidates': comb,
              }
              record['anchors'].append(anchor_info)

              for candidate in candidates:
                  if any(
                      decoded.get('plausible')
                      for decoded in candidate['decodes']
                      if isinstance(decoded, dict)
                  ):
                      print('ARRAY_CANDIDATE', json.dumps(candidate, ensure_ascii=False))
              if comb:
                  print('COMB_CANDIDATES', json.dumps(comb, ensure_ascii=False))

          Path('quest-row-target-scan.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
