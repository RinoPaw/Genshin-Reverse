name: Generate 7.1 reverse artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-7.1-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-7.1-reverse-artifacts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Genshin-Reverse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . requests

      - name: Fetch exact global 7.1 samples from HoYoPlay
        run: |
          mkdir -p inputs/7.1.0-global
          python tools/fetch_hoyoplay_targets.py \
            --version 7.1.0 \
            --output inputs/7.1.0-global \
            --expected-exe-sha256 08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d \
            --expected-metadata-sha256 05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0

      - name: Fetch current AstaPS control set
        run: |
          git clone --depth 1 --branch play/rino https://github.com/RinoPaw/AstaPS.git ../AstaPS

      - name: Regenerate exact-sample data and best-effort research intermediates
        run: |
          bash scripts/regenerate-7.1.sh \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --metadata inputs/7.1.0-global/global-metadata.dat \
            --output work/7.1.0-global/windows-x64 \
            --python python \
            --astaps ../AstaPS

      - name: Publish validated artifacts into version tree
        run: |
          bash scripts/publish-artifacts-7.1.sh \
            --work work/7.1.0-global/windows-x64 \
            --version versions/7.1.0-global/windows-x64 \
            --python python

      - name: Validate published version tree
        run: genshinre validate versions/7.1.0-global/windows-x64 --allow-partial

      - name: Show generated file sizes
        run: |
          find versions/7.1.0-global/windows-x64 -type f -printf '%s %p\n' | sort -nr | head -40
          echo 'Files over 95 MiB:'
          find versions/7.1.0-global/windows-x64 -type f -size +95M -print || true

      - name: Preserve work output as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genshin-7.1-reverse-work
          path: work/7.1.0-global/windows-x64
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Commit generated CSV and JSON artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64
          if git diff --cached --quiet; then
            echo 'No generated artifact changes to commit.'
            exit 0
          fi
          oversized=$(find versions/7.1.0-global/windows-x64 -type f -size +95M -print)
          if [[ -n "$oversized" ]]; then
            echo 'Refusing Git push because generated files exceed 95 MiB:' >&2
            echo "$oversized" >&2
            exit 1
          fi
          git commit -m 'data: publish generated global 7.1 reverse artifacts'
          git pull --rebase origin main
          git push origin HEAD:main
