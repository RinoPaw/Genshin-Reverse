name: Generate 7.1 canonical data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-7.1-samples.sh'
      - 'scripts/regenerate-7.1.sh'
      - 'scripts/publish-artifacts-7.1.sh'
      - 'genshinre/anchors.py'
      - 'genshinre/artifactmanifest.py'
      - 'genshinre/artifactpublish.py'
      - 'genshinre/fingerprint.py'
      - 'genshinre/getcmdid.py'
      - 'genshinre/metadatacsv.py'
      - 'genshinre/metadataindex.py'
      - 'genshinre/mhy71.py'
      - 'genshinre/nativeprofile.py'
      - 'genshinre/param71.py'
      - 'genshinre/pe.py'
      - 'genshinre/registrycontract.py'
      - 'genshinre/registryslots.py'
      - 'genshinre/registryslotxref.py'
      - 'genshinre/registryxrefpublish.py'
      - 'genshinre/rowutil.py'
      - 'genshinre/samplefetch.py'
      - 'genshinre/sampleidentity.py'
      - 'genshinre/typearray.py'
      - 'versions/7.1.0-global/windows-x64/hashes.json'
      - 'versions/7.1.0-global/windows-x64/metadata/anchors.json'
      - 'versions/7.1.0-global/windows-x64/proto/known-opcodes.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-7.1-canonical-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Genshin-Reverse
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . zstandard capstone

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Regenerate exact-sample metadata and GetCmdId evidence
        run: |
          bash scripts/regenerate-7.1.sh \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --metadata inputs/7.1.0-global/global-metadata.dat \
            --output work/7.1.0-global/windows-x64 \
            --python python

      - name: Rebuild canonical registry identity
        run: |
          EXE=inputs/7.1.0-global/GenshinImpact.exe
          ROOT=versions/7.1.0-global/windows-x64
          WORK=work/7.1.0-global/windows-x64
          REGISTRY="$ROOT/registry"
          mkdir -p "$REGISTRY"

          python -m genshinre.registryslots \
            "$EXE" \
            "$REGISTRY/registry-type-slots.csv" \
            --summary "$REGISTRY/registry-type-slots.summary.json"

          python -m genshinre.registryslotxref \
            "$EXE" \
            "$WORK/metadata/methods.csv" \
            "$WORK/getcmdid-candidates.csv" \
            "$REGISTRY/registry-type-slots.csv" \
            "$REGISTRY/registry-slot-xrefs.csv" \
            --summary "$REGISTRY/registry-slot-xrefs.summary.json"

          python -m genshinre.registryxrefpublish \
            "$REGISTRY/registry-slot-xrefs.csv" \
            "$REGISTRY/registry-type-slots.csv" \
            "$ROOT/proto/known-opcodes.csv" \
            "$REGISTRY/registry.csv" \
            --summary "$REGISTRY/registry.summary.json"

          cat "$REGISTRY/registry.summary.json"

      - name: Publish validated artifacts into version tree
        run: |
          bash scripts/publish-artifacts-7.1.sh \
            --work work/7.1.0-global/windows-x64 \
            --version versions/7.1.0-global/windows-x64 \
            --python python

      - name: Validate published version tree
        run: genshinre validate versions/7.1.0-global/windows-x64 --allow-partial

      - name: Show generated file sizes
        run: |
          find versions/7.1.0-global/windows-x64 -type f -printf '%s %p\n' | sort -nr | head -40

      - name: Preserve work output as Actions artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genshin-7.1-reverse-work
          path: work/7.1.0-global/windows-x64
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Commit canonical 7.1 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64
          if git diff --cached --quiet; then
            echo 'No canonical data changes to commit.'
            exit 0
          fi

          oversized=''
          while IFS= read -r path; do
            [[ -f "$path" ]] || continue
            size=$(stat -c '%s' "$path")
            if (( size > 99614720 )); then
              oversized+="$size $path"$'\n'
            fi
          done < <(git diff --cached --name-only --diff-filter=AM)
          if [[ -n "$oversized" ]]; then
            echo 'Refusing Git push because staged generated files exceed 95 MiB:' >&2
            printf '%s' "$oversized" >&2
            exit 1
          fi

          git commit -m 'data: refresh canonical global 7.1 reverse data'
          git pull --rebase origin main
          git push origin HEAD:main
