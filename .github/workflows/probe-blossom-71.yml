name: Probe Global 7.1 blossom protocol metadata
on:
  push:
    branches: [research/blossom-marker-71]
    paths:
      - 'scripts/research-blossom-protocol-71.py'
      - '.github/workflows/probe-blossom-71.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current-client protocol candidates
        run: python3 scripts/research-blossom-protocol-71.py
      - name: Compare imported AstaPS descriptor field tags (non-native control only)
        run: |
          git clone --quiet --depth 1 https://github.com/MeChen618/AstaPS.git /tmp/astaps
          python3 -m pip install --quiet protobuf
          python3 - <<'PY'
          from google.protobuf import descriptor_pb2
          p='/tmp/astaps/protocol/7.1/protocol.desc'
          ds=descriptor_pb2.FileDescriptorSet()
          with open(p,'rb') as f: ds.ParseFromString(f.read())
          names=('BlossomBriefInfoNotify','WorldOwnerBlossomBriefInfoNotify',
                 'GetBlossomBriefInfoListReq','GetBlossomBriefInfoListRsp',
                 'BlossomBriefInfo')
          for fd in ds.file:
              for msg in fd.message_type:
                  if msg.name not in names:continue
                  print('EXTERNAL_CONTROL',fd.name,msg.name,[(f.name,f.number,f.type,f.label) for f in msg.field],flush=True)
          PY
