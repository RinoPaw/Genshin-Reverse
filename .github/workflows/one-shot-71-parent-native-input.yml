name: One-shot original Global 7.1 pre-parent reader input callees

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-71-parent-native-input.yml'
      - 'scripts/probe-7.1-point-parent-pre-input-native.py'

permissions:
  contents: read

jobs:
  original-input-callees:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Fetch exact original 7.1 EXE and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect source original pre-parent reader native callees
        run: |
          python scripts/probe-7.1-point-parent-pre-input-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --previous versions/7.1.0-global/analyses/progression/world/7.1-original-point-parent-reader-kllng-consumer-native.json \
            --output work/7.1-original-pre-parent-reader-callees.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-pre-parent-reader-input-callees
          path: work/7.1-original-pre-parent-reader-callees.json
          retention-days: 7
          if-no-files-found: error
