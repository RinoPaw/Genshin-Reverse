name: Inspect 7.1 unlock RPC submit path

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-dispatch-table-writers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Query submit metadata
        run: |
          python -m genshinre.cli query-methods \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --method-name DMLCLHCBOBJ > /tmp/rpc-submit-methods.json
          cat /tmp/rpc-submit-methods.json

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Inspect submit method and unrelated +0x24F40 controls
        run: |
          python tools/inspect_method_context_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/unlock-rpc-submit-context-71.json \
            --focus rpc_submit:0x7246860 \
            --focus wrapper_control:0xA6FDC79 \
            --focus ilfix_control:0xE023B87 \
            --neighbor-count 8 \
            --max-body 0x4000

      - name: Summarize submit body
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/unlock-rpc-submit-context-71.json'))
          item=d['focus']['rpc_submit']
          print('RPC SUBMIT OWNER',item.get('owner'))
          for insn in item.get('disasm',[]):
              if insn.get('direct_call_target_rva') or insn['mnemonic'] in ('call','jmp'):
                  print(insn['rva'],insn['mnemonic'],insn['op_str'],'target=',insn.get('direct_call_target_rva'),'owner=',insn.get('direct_call_target_owner'))
          print('\nCONTROL OWNERS')
          for label in ('wrapper_control','ilfix_control'):
              print(label,d['focus'][label].get('owner'))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlock-rpc-submit-context-71
          path: |
            /tmp/rpc-submit-methods.json
            /tmp/unlock-rpc-submit-context-71.json
          if-no-files-found: error
