name: Inspect 7.1 dispatch table writers

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-dispatch-table-writers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone
      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'
      - name: Inspect the two ordinary stores to +0x24F40
        run: |
          python tools/inspect_method_context_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/dispatch-table-writer-context-71.json \
            --focus writer_a:0xA6FDC79 \
            --focus writer_b:0xE023B87 \
            --neighbor-count 6 \
            --max-body 0x3000
      - name: Summarize exact stores and call targets
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/dispatch-table-writer-context-71.json'))
          for label,item in d['focus'].items():
              print('\n===',label,'===')
              print('owner',item.get('owner'))
              for insn in item.get('disasm',[]):
                  r=int(insn['rva'],0)
                  if abs(r-int(item['requested_rva'],0)) <= 0x80 or insn.get('direct_call_target_rva'):
                      print(insn['rva'],insn['mnemonic'],insn['op_str'],'call=',insn.get('direct_call_target_owner'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-table-writer-context-71
          path: /tmp/dispatch-table-writer-context-71.json
          if-no-files-found: error
