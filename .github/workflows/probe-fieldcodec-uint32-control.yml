name: Probe repeated uint32 FieldCodec control

on:
  push:
    paths:
      - .github/workflows/probe-fieldcodec-uint32-control.yml
  workflow_dispatch:

concurrency:
  group: probe-fieldcodec-uint32-control-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Resolve confirmed PlayerEnterSceneNotify method cluster
        run: |
          genshinre query-methods versions/7.1.0-global/windows-x64/metadata/methods.csv --type DGGODBOJHNI > control-methods.json
          python - <<'PY'
          import json
          rows=json.load(open('control-methods.json',encoding='utf-8'))
          cctors=[r for r in rows if r['method_name']=='.cctor']
          assert len(cctors)==1, cctors
          print(json.dumps({'methods':rows,'cctor':cctors[0]},indent=2,ensure_ascii=False))
          open('/tmp/cctor-rva','w').write(cctors[0]['rva'])
          PY
      - name: Fetch pinned exact 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Disassemble confirmed control static constructor
        run: |
          RVA=$(cat /tmp/cctor-rva)
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe "$RVA" 0x300 \
            --expected-sha256 08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d \
            --label PlayerEnterSceneNotify-cctor \
            --output player-enter-scene-cctor.json
          python - <<'PY'
          import json
          data=json.load(open('player-enter-scene-cctor.json',encoding='utf-8'))
          ins=data['instructions']
          hits=[]
          for i,row in enumerate(ins):
              if row['mnemonic']=='call' and '14aabbd80' in row['op_str'].lower():
                  hits.append({'index':i,'context':ins[max(0,i-4):i+3]})
          print(json.dumps({'factory_0xAABBD80_hits':hits},indent=2,ensure_ascii=False))
          assert hits, 'confirmed PlayerEnterSceneNotify cctor did not call 0xAABBD80'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repeated-uint32-fieldcodec-control
          path: |
            control-methods.json
            player-enter-scene-cctor.json
          if-no-files-found: error
          retention-days: 7
