name: Probe QuestExcel 7.1 row owner

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-questexcel71-row-owner.yml"

concurrency:
  group: probe-questexcel71-row-owner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone pefile zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Checkout pinned binconfig analyzer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/genshin-7.0-local-re-devkit
          git clone --filter=blob:none https://github.com/owomocha/genshin-7.0-local-re-devkit.git /tmp/genshin-7.0-local-re-devkit
          git -C /tmp/genshin-7.0-local-re-devkit checkout --detach fb91dfad1f6047e30dea2f98727e5af45d9bd6e0
      - name: Intersect native guide and guideHint reader callers
        shell: bash
        env:
          PYTHONPATH: /tmp/genshin-7.0-local-re-devkit/src:/tmp/genshin-7.0-local-re-devkit/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-row-owner.txt
          import bisect,csv,json
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256
          from genshin_re import binconfig as BC
          import gamedata_binconfig_ext as EXT

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS={"guideHint":0xB208D40,"guide":0x1168F230}
          require_sha256(EXE,PROFILE_71.exe_sha256,label="executable")

          def read(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          methods=read("methods.csv")
          fields=read("fields.csv")
          types=read("types.csv")
          tb={int(x["type_definition_index"]):x for x in types}
          by_rva={}
          starts=[]
          for m in methods:
              try:r=int(m.get("rva") or "0",0)
              except Exception:continue
              if r:
                  by_rva.setdefault(r,[]).append(m);starts.append(r)
          starts=sorted(set(starts))
          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i]; e=starts[i+1] if i+1<len(starts) else s+0x10000
              if not s<=rva<e:return None
              return s

          hits={k:[] for k in TARGETS}
          with PEImage(EXE) as image:
              for sec in image.sections:
                  if not(sec.characteristics & 0x20000000):continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  off=0
                  while True:
                      off=blob.find(b"\xE8",off)
                      if off<0 or off+5>len(blob):break
                      rel=int.from_bytes(blob[off+1:off+5],"little",signed=True)
                      site=sec.virtual_address+off
                      target=site+5+rel
                      for name,want in TARGETS.items():
                          if target==want:
                              hits[name].append({"site":site,"owner":owner(site)})
                      off+=1

          owner_sets={k:{x["owner"] for x in v if x["owner"] is not None} for k,v in hits.items()}
          both=sorted(set.intersection(*owner_sets.values()))
          print("guideHint callers",len(owner_sets["guideHint"]))
          print("guide callers",len(owner_sets["guide"]))
          print("direct_call_intersection",len(both),[hex(x) for x in both])

          # Direct calls may disappear behind wrappers. Resolve each target RVA
          # back to its metadata type, then find types that own both fields.
          target_type_names={}
          for label,target in TARGETS.items():
              exact=by_rva.get(target,[])
              target_type_names[label]=sorted({
                  m.get("type_name") for m in exact if m.get("type_name")
              })
          print("target_type_names",json.dumps(target_type_names,ensure_ascii=False))
          guide_types=set(target_type_names.get("guide",[]))
          hint_types=set(target_type_names.get("guideHint",[]))
          metadata_candidates=[]
          fields_by_tdi={}
          for fld in fields:
              fields_by_tdi.setdefault(int(fld["type_definition_index"]),[]).append(fld)
          for tdi,ff in fields_by_tdi.items():
              ftypes={x.get("field_type") for x in ff}
              if guide_types & ftypes and hint_types & ftypes:
                  metadata_candidates.append(tdi)
          print("metadata_owner_candidates",[
              {
                  "tdi":tdi,
                  "type":(tb.get(tdi) or {}).get("type_name"),
                  "guide_fields":[x for x in fields_by_tdi[tdi] if x.get("field_type") in guide_types],
                  "guide_hint_fields":[x for x in fields_by_tdi[tdi] if x.get("field_type") in hint_types],
              }
              for tdi in metadata_candidates
          ])

          # Promote candidate binary readers to the actual disassembly target.
          metadata_reader_rvas=[]
          for tdi in metadata_candidates:
              for m in methods:
                  if int(m.get("type_definition_index") or -1)!=tdi:
                      continue
                  try:params=json.loads(m.get("parameter_types") or "[]")
                  except Exception:continue
                  if params and params[0]=="FNIAHJGHFAK":
                      try:rr=int(m.get("rva") or "0",0)
                      except Exception:rr=0
                      if rr:
                          metadata_reader_rvas.append(rr)
          both=sorted(set(both)|set(metadata_reader_rvas))
          print("candidate_reader_rvas",[hex(x) for x in both])

          deser={}
          one={}
          for m in methods:
              try:rva=int(m.get("rva") or "0",0); params=json.loads(m.get("parameter_types") or "[]")
              except Exception:continue
              if not rva or not params or params[0]!="FNIAHJGHFAK":continue
              cls=m.get("type_name") or "?"
              deser[rva]=(cls,m.get("method_name") or "?",str(params))
              if len(params)==1:
                  ret=(m.get("return_type") or "").lower()
                  pr=0 if m.get("method_name") in {"FromBinaryInner","GMENPOPMKAA"} else (1 if ret=="void" else 2)
                  if cls not in one or pr<one[cls][0]:one[cls]=(pr,rva)
          row_deser={cls:rva for cls,(_p,rva) in one.items()}
          exe=BC.Exe(str(EXE))
          EXT.install(exe,deser,row_deser,clsfields={},deser1=row_deser)
          EXT.install2()

          report={"targets":TARGETS,"hits":hits,"intersection":[]}
          for rva in both:
              meta=by_rva.get(rva,[])
              tdis=sorted({int(x["type_definition_index"]) for x in meta if x.get("type_definition_index")})
              item={
                  "rva":f"0x{rva:X}",
                  "methods":meta,
                  "types":[tb.get(x,{}) for x in tdis],
                  "fields":[f for f in fields if int(f.get("type_definition_index") or -1) in tdis],
              }
              try:item["schema"]=BC.build(exe,rva,deser,cache={})
              except Exception as exc:item["schema_error"]=type(exc).__name__+":"+str(exc)

              # Keep a native instruction trace for the candidate source row
              # reader. Memory stores expose the destination object displacement;
              # nearby reader calls identify which serialized field feeds it.
              next_i=bisect.bisect_right(starts,rva)
              method_end=starts[next_i] if next_i<len(starts) else rva+0x2000
              method_end=min(method_end,rva+0x4000)
              trace=[]
              with PEImage(EXE) as image:
                  body=image.read_rva(rva,method_end-rva)
                  md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
                  for ins in md.disasm(body,image.image_base+rva):
                      rec={
                          "rva":f"0x{ins.address-image.image_base:X}",
                          "bytes":ins.bytes.hex(),
                          "mnemonic":ins.mnemonic,
                          "op_str":ins.op_str,
                      }
                      if ins.mnemonic=="call" and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          target=int(ins.operands[0].imm-image.image_base)
                          rec["call_target"]=f"0x{target:X}"
                          rec["call_meta"]=by_rva.get(target,[])
                      stores=[]
                      if ins.operands and ins.operands[0].type==X86_OP_MEM:
                          mem=ins.operands[0].mem
                          stores.append({
                              "base":ins.reg_name(mem.base) if mem.base else "",
                              "index":ins.reg_name(mem.index) if mem.index else "",
                              "disp":mem.disp,
                              "size":ins.operands[0].size,
                          })
                      if stores:
                          rec["stores"]=stores
                      trace.append(rec)
              item["trace"]=trace
              report["intersection"].append(item)
              print("\nCANDIDATE",json.dumps(item,ensure_ascii=False))
              print("\nSTORE_AND_CALL_TRACE",f"0x{rva:X}")
              for rec in trace:
                  if "stores" in rec or "call_target" in rec:
                      print(json.dumps(rec,ensure_ascii=False))

          Path("questexcel71-row-owner.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: questexcel71-row-owner
          path: |
            questexcel71-row-owner.txt
            questexcel71-row-owner.json
          if-no-files-found: error