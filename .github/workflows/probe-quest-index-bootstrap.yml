name: Probe 7.1 Quest binary index bootstrap

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-index-bootstrap.yml"

concurrency:
  group: probe-quest-index-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Trace index bootstrap and runtime loader
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-index-bootstrap.json \
            --focus odj-set-fnj-index:0x9F9B580 \
            --focus bootstrap-fnj-index:0xFCBC530 \
            --focus bootstrap-peer-index:0xFCBC670 \
            --focus odj-set-peer-index:0x9F886E0 \
            --focus runtime-load-bin:0x6F366E0 \
            --focus runtime-load-bin-zip:0x6F367F0 \
            --max-body 0x10000 \
            | tee quest-index-bootstrap.txt

      - name: Summarize bootstrap semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-bootstrap-summary.txt
          import json
          from pathlib import Path

          data = json.loads(Path("quest-index-bootstrap.json").read_text(encoding="utf-8"))
          keep = {}
          for label, item in data["focus"].items():
              insns = item.get("disassembly", [])
              interesting = []
              for x in insns:
                  op = x.get("op_str", "").lower()
                  mnemonic = x.get("mnemonic", "")
                  if (
                      mnemonic in {"call", "jmp", "lea", "mov", "cmp", "test", "shr", "shl", "and", "or"}
                      and (
                          "rip" in op
                          or "0x312e0" in op
                          or "0x312c8" in op
                          or "0x31318" in op
                          or "0x31370" in op
                          or mnemonic in {"call", "jmp"}
                      )
                  ):
                      interesting.append(x)
              keep[label] = {
                  "owner": item.get("owner"),
                  "direct_edges": item.get("direct_edges", []),
                  "direct_callers": item.get("direct_callers", []),
                  "interesting": interesting,
              }
              print("\n###", label)
              print(json.dumps(keep[label], ensure_ascii=False, indent=2))

          Path("quest-index-bootstrap-summary.json").write_text(
              json.dumps(keep, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve bootstrap string slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-string-slots.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          slots = {
              "fnj_index_resource_name": 0x5A57BA8,
              "peer_index_resource_name": 0x5A57BC8,
          }
          out = {}
          with PEImage(exe) as image:
              base = image.image_base
              for label, rva in slots.items():
                  raw = image.read_rva(rva, 0x20)
                  q = int.from_bytes(raw[:8], "little")
                  item = {
                      "slot_rva": f"0x{rva:X}",
                      "slot_bytes": raw.hex(),
                      "qword": f"0x{q:X}",
                  }
                  if q >= base:
                      target_rva = q - base
                      item["target_rva"] = f"0x{target_rva:X}"
                      try:
                          blob = image.read_rva(target_rva, 0x100)
                          item["target_bytes"] = blob.hex()
                          if len(blob) >= 0x14:
                              n = int.from_bytes(blob[0x10:0x14], "little", signed=True)
                              if 0 <= n <= 100:
                                  chars = blob[0x14:0x14 + n * 2]
                                  if len(chars) == n * 2:
                                      try:
                                          item["il2cpp_string_candidate"] = chars.decode("utf-16-le")
                                      except UnicodeDecodeError:
                                          pass
                      except Exception as exc:
                          item["target_error"] = str(exc)
                  out[label] = item
                  print(label, json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-index-string-slots.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "=== ASCII/UTF-8 metadata candidates ==="
            strings -a -n 5 inputs/7.1.0-global/global-metadata.dat \
              | grep -Ei 'quest|binoutput|bin.*data|data.*bin' \
              | sort -u \
              | head -n 1000 || true
            echo "=== UTF-16LE executable candidates ==="
            strings -a -el -n 5 inputs/7.1.0-global/GenshinImpact.exe \
              | grep -Ei 'quest|binoutput|bin.*data|data.*bin' \
              | sort -u \
              | head -n 1000 || true
          } | tee quest-index-resource-string-candidates.txt

      - name: Resolve LDAB Quest index container schema
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"

          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            0x77F7860 0x160 \
            --expected-sha256 "$expected_sha" \
            --label "LDABEPAGBGK.GMENPOPMKAA(FNIAHJGHFAK,kind_0x15)" \
            --output quest-ldab-reader.json \
            > quest-ldab-reader.txt

          python - <<'PY' | tee quest-ldab-schema.txt
          import csv
          import json
          import re
          from pathlib import Path

          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          TARGET_TDIS = {
              52161: "LDABEPAGBGK",
              67914: "LAABEAMHPJG",
              14351: "ODJJEFFIPFA",
              30748: "FNIAHJGHFAK",
          }

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          types = read_csv("types.csv")
          fields = read_csv("fields.csv")
          methods = read_csv("methods.csv")
          type_by_tdi = {int(x["type_definition_index"]): x for x in types}
          fields_by_tdi = {}
          methods_by_tdi = {}
          for row in fields:
              fields_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)
          for row in methods:
              methods_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)

          report = {"types": {}, "reader_calls": []}
          for tdi, expected in TARGET_TDIS.items():
              typ = type_by_tdi.get(tdi)
              if not typ or typ.get("type_name") != expected:
                  raise AssertionError((tdi, typ, expected))
              item = {
                  "type": typ,
                  "fields": fields_by_tdi.get(tdi, []),
                  "methods": methods_by_tdi.get(tdi, []),
              }
              report["types"][str(tdi)] = item
              print("TYPE", tdi, expected)
              print(json.dumps(item, ensure_ascii=False, indent=2))

          obj = json.loads(Path("quest-ldab-reader.json").read_text(encoding="utf-8"))
          base = int(obj["image_base"], 16)
          by_rva = {}
          for row in methods:
              text = (row.get("rva") or "").strip()
              if not text:
                  continue
              try:
                  by_rva.setdefault(int(text, 0), []).append(row)
              except ValueError:
                  pass

          for ins in obj["instructions"]:
              if ins.get("mnemonic") not in {"call", "jmp"}:
                  continue
              m = re.fullmatch(r"0x([0-9a-fA-F]+)", ins.get("op_str", ""))
              if not m:
                  continue
              trva = int(m.group(1), 16) - base
              item = {
                  "site_rva": ins["rva"],
                  "target_rva": f"0x{trva:X}",
                  "metadata": by_rva.get(trva, []),
              }
              report["reader_calls"].append(item)
              print("CALL", json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-ldab-schema.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY' | tee quest-ldab-reader-primitives.txt
          import json
          from pathlib import Path

          obj = json.loads(Path("quest-ldab-reader.json").read_text(encoding="utf-8"))
          interesting = []
          for x in obj["instructions"]:
              op = x.get("op_str", "").lower()
              if (
                  x.get("mnemonic") in {"call","jmp","mov","lea","cmp","test","add","sub","imul","shl","shr","and","or"}
                  and (
                      x.get("mnemonic") in {"call","jmp"}
                      or any(tok in op for tok in ("[rcx", "[rdx", "[r8", "[r9", "[rax", "[rbx", "[rsi", "[rdi"))
                  )
              ):
                  interesting.append(x)
                  print(json.dumps(x, ensure_ascii=False, sort_keys=True))
          Path("quest-ldab-reader-primitives.json").write_text(
              json.dumps(interesting, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Trace IL2CPP string usage slot registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-string-usage-registration.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          slot_rvas = {
              "fnj_index_resource_name": 0x5A57BA8,
              "peer_index_resource_name": 0x5A57BC8,
          }

          report = {}
          with PEImage(exe) as image:
              base = image.image_base
              # Read the full file-backed image section-by-section. Search for
              # absolute pointers to the BSS usage slots; IL2CPP metadata-usage
              # registration tables commonly contain these destination addresses.
              sections = []
              for sec in image.sections:
                  blob = image.read_rva(sec.virtual_address, sec.raw_size)
                  sections.append((sec, blob))

              for label, slot_rva in slot_rvas.items():
                  slot_va = base + slot_rva
                  pat64 = slot_va.to_bytes(8, "little")
                  pat32 = slot_rva.to_bytes(4, "little")
                  hits = []

                  for sec, blob in sections:
                      for width, pat in ((8, pat64), (4, pat32)):
                          pos = 0
                          while True:
                              pos = blob.find(pat, pos)
                              if pos < 0:
                                  break
                              hit_rva = sec.virtual_address + pos
                              lo = max(0, pos - 0x80)
                              hi = min(len(blob), pos + 0x88)
                              around = blob[lo:hi]
                              qwords = []
                              qbase = (lo // 8) * 8
                              for off in range(qbase, min(len(blob), hi), 8):
                                  chunk = blob[off:off+8]
                                  if len(chunk) < 8:
                                      break
                                  qwords.append({
                                      "rva": f"0x{sec.virtual_address + off:X}",
                                      "value": f"0x{int.from_bytes(chunk, 'little'):X}",
                                  })
                              hits.append({
                                  "width": width,
                                  "section": sec.name,
                                  "hit_rva": f"0x{hit_rva:X}",
                                  "window_start_rva": f"0x{sec.virtual_address + lo:X}",
                                  "window_hex": around.hex(),
                                  "qwords": qwords,
                              })
                              pos += 1

                  item = {
                      "slot_rva": f"0x{slot_rva:X}",
                      "slot_va": f"0x{slot_va:X}",
                      "hits": hits,
                  }
                  report[label] = item
                  print(label, json.dumps(item, ensure_ascii=False, indent=2))

          Path("quest-index-string-usage-registration.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          # The exact 7.1 metadata is MHY-protected. Preserve the decoded layout
          # supplied by the repository's native decoder instead of treating the
          # file as a stock FAB11BAF header.
          python - <<'PY' | tee quest-index-mhy-metadata-layout.txt
          import json
          from pathlib import Path

          from genshinre.mhy71 import BODY_SKIP, decode_metadata_header_71
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          metadata = Path("inputs/7.1.0-global/global-metadata.dat")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          raw = metadata.read_bytes()
          if raw[:4] != b"MHY\0":
              raise SystemExit("expected protected MHY metadata")

          with PEImage(exe) as image:
              header = image.read_rva(PROFILE_71.embedded_header_rva, PROFILE_71.embedded_header_size)
          layout = decode_metadata_header_71(header)
          out = {
              "metadata_magic": raw[:4].decode("ascii", errors="replace"),
              "body_skip": f"0x{BODY_SKIP:X}",
              "embedded_header_rva": f"0x{PROFILE_71.embedded_header_rva:X}",
              "embedded_header_size": PROFILE_71.embedded_header_size,
              "decoded_layout": layout,
          }
          print(json.dumps(out, indent=2))
          Path("quest-index-mhy-metadata-layout.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Recover protected 7.1 string literals with pinned peer implementation
        shell: bash
        run: |
          set -euo pipefail
          peer_sha=1008fd7db28dcbc55729d5bb6b3a585dab86cf8b
          mkdir -p third-party/gi-stringliteral
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/recover_string_literals.py" \
            -o third-party/gi-stringliteral/recover_string_literals.py
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/extract_constants.py" \
            -o third-party/gi-stringliteral/extract_constants.py

          (
            cd third-party/gi-stringliteral
            python recover_string_literals.py \
              ../../inputs/7.1.0-global/global-metadata.dat \
              ../../inputs/7.1.0-global/GenshinImpact.exe \
              -o ../../quest-index-string-literals-all.json \
              2> ../../quest-index-string-literals-recovery.txt
          )

          python - <<'PY' | tee quest-index-string-literals-filtered.txt
          import json
          from pathlib import Path

          rows = json.loads(Path("quest-index-string-literals-all.json").read_text(encoding="utf-8"))
          needles = (
              "quest",
              "binoutput",
              "mainquest",
              "excelbinoutput",
              "index",
          )
          hits = [
              row for row in rows
              if any(n in str(row.get("value", "")).lower() for n in needles)
          ]
          print("total_literals=", len(rows))
          print("filtered_hits=", len(hits))
          for row in hits:
              print(json.dumps(row, ensure_ascii=False))

          Path("quest-index-string-literals-filtered.json").write_text(
              json.dumps({
                  "peer_repository": "kuma-dayo/gi-stringliteral",
                  "peer_commit": "1008fd7db28dcbc55729d5bb6b3a585dab86cf8b",
                  "total_literals": len(rows),
                  "hits": hits,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-index-bootstrap
          path: |
            quest-index-bootstrap.txt
            quest-index-bootstrap.json
            quest-index-bootstrap-summary.txt
            quest-index-bootstrap-summary.json
            quest-ldab-reader.txt
            quest-ldab-reader.json
            quest-ldab-schema.txt
            quest-ldab-schema.json
            quest-ldab-reader-primitives.txt
            quest-ldab-reader-primitives.json
            quest-index-string-slots.txt
            quest-index-string-slots.json
            quest-index-resource-string-candidates.txt
            quest-index-string-usage-registration.txt
            quest-index-string-usage-registration.json
            quest-index-mhy-metadata-layout.txt
            quest-index-mhy-metadata-layout.json
            quest-index-string-literals-recovery.txt
            quest-index-string-literals-filtered.txt
            quest-index-string-literals-filtered.json
          if-no-files-found: error
