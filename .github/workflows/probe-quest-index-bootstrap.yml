name: Probe 7.1 Quest binary index bootstrap

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-index-bootstrap.yml"

concurrency:
  group: probe-quest-index-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Trace index bootstrap and runtime loader
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-index-bootstrap.json \
            --focus odj-set-fnj-index:0x9F9B580 \
            --focus bootstrap-fnj-index:0xFCBC530 \
            --focus bootstrap-peer-index:0xFCBC670 \
            --focus odj-set-peer-index:0x9F886E0 \
            --focus runtime-load-bin:0x6F366E0 \
            --focus runtime-load-bin-zip:0x6F367F0 \
            --max-body 0x10000 \
            | tee quest-index-bootstrap.txt

      - name: Summarize bootstrap semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-bootstrap-summary.txt
          import json
          from pathlib import Path

          data = json.loads(Path("quest-index-bootstrap.json").read_text(encoding="utf-8"))
          keep = {}
          for label, item in data["focus"].items():
              insns = item.get("disassembly", [])
              interesting = []
              for x in insns:
                  op = x.get("op_str", "").lower()
                  mnemonic = x.get("mnemonic", "")
                  if (
                      mnemonic in {"call", "jmp", "lea", "mov", "cmp", "test", "shr", "shl", "and", "or"}
                      and (
                          "rip" in op
                          or "0x312e0" in op
                          or "0x312c8" in op
                          or "0x31318" in op
                          or "0x31370" in op
                          or mnemonic in {"call", "jmp"}
                      )
                  ):
                      interesting.append(x)
              keep[label] = {
                  "owner": item.get("owner"),
                  "direct_edges": item.get("direct_edges", []),
                  "direct_callers": item.get("direct_callers", []),
                  "interesting": interesting,
              }
              print("\n###", label)
              print(json.dumps(keep[label], ensure_ascii=False, indent=2))

          Path("quest-index-bootstrap-summary.json").write_text(
              json.dumps(keep, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve bootstrap string slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-string-slots.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          slots = {
              "fnj_index_resource_name": 0x5A57BA8,
              "peer_index_resource_name": 0x5A57BC8,
          }
          out = {}
          with PEImage(exe) as image:
              base = image.image_base
              for label, rva in slots.items():
                  raw = image.read_rva(rva, 0x20)
                  q = int.from_bytes(raw[:8], "little")
                  item = {
                      "slot_rva": f"0x{rva:X}",
                      "slot_bytes": raw.hex(),
                      "qword": f"0x{q:X}",
                  }
                  if q >= base:
                      target_rva = q - base
                      item["target_rva"] = f"0x{target_rva:X}"
                      try:
                          blob = image.read_rva(target_rva, 0x100)
                          item["target_bytes"] = blob.hex()
                          if len(blob) >= 0x14:
                              n = int.from_bytes(blob[0x10:0x14], "little", signed=True)
                              if 0 <= n <= 100:
                                  chars = blob[0x14:0x14 + n * 2]
                                  if len(chars) == n * 2:
                                      try:
                                          item["il2cpp_string_candidate"] = chars.decode("utf-16-le")
                                      except UnicodeDecodeError:
                                          pass
                      except Exception as exc:
                          item["target_error"] = str(exc)
                  out[label] = item
                  print(label, json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-index-string-slots.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "=== ASCII/UTF-8 metadata candidates ==="
            strings -a -n 5 inputs/7.1.0-global/global-metadata.dat \
              | grep -Ei 'quest|binoutput|bin.*data|data.*bin' \
              | sort -u \
              | head -n 1000 || true
            echo "=== UTF-16LE executable candidates ==="
            strings -a -el -n 5 inputs/7.1.0-global/GenshinImpact.exe \
              | grep -Ei 'quest|binoutput|bin.*data|data.*bin' \
              | sort -u \
              | head -n 1000 || true
          } | tee quest-index-resource-string-candidates.txt

      - name: Resolve LDAB Quest index container schema
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"

          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            0x77F7860 0x160 \
            --expected-sha256 "$expected_sha" \
            --label "LDABEPAGBGK.GMENPOPMKAA(FNIAHJGHFAK,kind_0x15)" \
            --output quest-ldab-reader.json \
            > quest-ldab-reader.txt

          python - <<'PY' | tee quest-ldab-schema.txt
          import csv
          import json
          import re
          from pathlib import Path

          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          TARGET_TDIS = {
              52161: "LDABEPAGBGK",
              67914: "LAABEAMHPJG",
              14351: "ODJJEFFIPFA",
              30748: "FNIAHJGHFAK",
          }

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          types = read_csv("types.csv")
          fields = read_csv("fields.csv")
          methods = read_csv("methods.csv")
          type_by_tdi = {int(x["type_definition_index"]): x for x in types}
          fields_by_tdi = {}
          methods_by_tdi = {}
          for row in fields:
              fields_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)
          for row in methods:
              methods_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)

          report = {"types": {}, "reader_calls": []}
          for tdi, expected in TARGET_TDIS.items():
              typ = type_by_tdi.get(tdi)
              if not typ or typ.get("type_name") != expected:
                  raise AssertionError((tdi, typ, expected))
              item = {
                  "type": typ,
                  "fields": fields_by_tdi.get(tdi, []),
                  "methods": methods_by_tdi.get(tdi, []),
              }
              report["types"][str(tdi)] = item
              print("TYPE", tdi, expected)
              print(json.dumps(item, ensure_ascii=False, indent=2))

          obj = json.loads(Path("quest-ldab-reader.json").read_text(encoding="utf-8"))
          base = int(obj["image_base"], 16)
          by_rva = {}
          for row in methods:
              text = (row.get("rva") or "").strip()
              if not text:
                  continue
              try:
                  by_rva.setdefault(int(text, 0), []).append(row)
              except ValueError:
                  pass

          for ins in obj["instructions"]:
              if ins.get("mnemonic") not in {"call", "jmp"}:
                  continue
              m = re.fullmatch(r"0x([0-9a-fA-F]+)", ins.get("op_str", ""))
              if not m:
                  continue
              trva = int(m.group(1), 16) - base
              item = {
                  "site_rva": ins["rva"],
                  "target_rva": f"0x{trva:X}",
                  "metadata": by_rva.get(trva, []),
              }
              report["reader_calls"].append(item)
              print("CALL", json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-ldab-schema.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY' | tee quest-ldab-reader-primitives.txt
          import json
          from pathlib import Path

          obj = json.loads(Path("quest-ldab-reader.json").read_text(encoding="utf-8"))
          interesting = []
          for x in obj["instructions"]:
              op = x.get("op_str", "").lower()
              if (
                  x.get("mnemonic") in {"call","jmp","mov","lea","cmp","test","add","sub","imul","shl","shr","and","or"}
                  and (
                      x.get("mnemonic") in {"call","jmp"}
                      or any(tok in op for tok in ("[rcx", "[rdx", "[r8", "[r9", "[rax", "[rbx", "[rsi", "[rdi"))
                  )
              ):
                  interesting.append(x)
                  print(json.dumps(x, ensure_ascii=False, sort_keys=True))
          Path("quest-ldab-reader-primitives.json").write_text(
              json.dumps(interesting, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Trace IL2CPP string usage slot registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-string-usage-registration.txt
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          slot_rvas = {
              "fnj_index_resource_name": 0x5A57BA8,
              "peer_index_resource_name": 0x5A57BC8,
          }

          report = {}
          with PEImage(exe) as image:
              base = image.image_base
              # Read the full file-backed image section-by-section. Search for
              # absolute pointers to the BSS usage slots; IL2CPP metadata-usage
              # registration tables commonly contain these destination addresses.
              sections = []
              for sec in image.sections:
                  blob = image.read_rva(sec.virtual_address, sec.raw_size)
                  sections.append((sec, blob))

              for label, slot_rva in slot_rvas.items():
                  slot_va = base + slot_rva
                  pat64 = slot_va.to_bytes(8, "little")
                  pat32 = slot_rva.to_bytes(4, "little")
                  hits = []

                  for sec, blob in sections:
                      for width, pat in ((8, pat64), (4, pat32)):
                          pos = 0
                          while True:
                              pos = blob.find(pat, pos)
                              if pos < 0:
                                  break
                              hit_rva = sec.virtual_address + pos
                              lo = max(0, pos - 0x80)
                              hi = min(len(blob), pos + 0x88)
                              around = blob[lo:hi]
                              qwords = []
                              qbase = (lo // 8) * 8
                              for off in range(qbase, min(len(blob), hi), 8):
                                  chunk = blob[off:off+8]
                                  if len(chunk) < 8:
                                      break
                                  qwords.append({
                                      "rva": f"0x{sec.virtual_address + off:X}",
                                      "value": f"0x{int.from_bytes(chunk, 'little'):X}",
                                  })
                              hits.append({
                                  "width": width,
                                  "section": sec.name,
                                  "hit_rva": f"0x{hit_rva:X}",
                                  "window_start_rva": f"0x{sec.virtual_address + lo:X}",
                                  "window_hex": around.hex(),
                                  "qwords": qwords,
                              })
                              pos += 1

                  item = {
                      "slot_rva": f"0x{slot_rva:X}",
                      "slot_va": f"0x{slot_va:X}",
                      "hits": hits,
                  }
                  report[label] = item
                  print(label, json.dumps(item, ensure_ascii=False, indent=2))

          Path("quest-index-string-usage-registration.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          # The exact 7.1 metadata is MHY-protected. Preserve the decoded layout
          # supplied by the repository's native decoder instead of treating the
          # file as a stock FAB11BAF header.
          python - <<'PY' | tee quest-index-mhy-metadata-layout.txt
          import json
          from pathlib import Path

          from genshinre.mhy71 import BODY_SKIP, decode_metadata_header_71
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          metadata = Path("inputs/7.1.0-global/global-metadata.dat")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          raw = metadata.read_bytes()
          if raw[:4] != b"MHY\0":
              raise SystemExit("expected protected MHY metadata")

          with PEImage(exe) as image:
              header = image.read_rva(PROFILE_71.embedded_header_rva, PROFILE_71.embedded_header_size)
          layout = decode_metadata_header_71(header)
          out = {
              "metadata_magic": raw[:4].decode("ascii", errors="replace"),
              "body_skip": f"0x{BODY_SKIP:X}",
              "embedded_header_rva": f"0x{PROFILE_71.embedded_header_rva:X}",
              "embedded_header_size": PROFILE_71.embedded_header_size,
              "decoded_layout": layout,
          }
          print(json.dumps(out, indent=2))
          Path("quest-index-mhy-metadata-layout.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Recover protected 7.1 string literals with pinned peer implementation
        shell: bash
        run: |
          set -euo pipefail
          peer_sha=1008fd7db28dcbc55729d5bb6b3a585dab86cf8b
          mkdir -p third-party/gi-stringliteral
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/recover_string_literals.py" \
            -o third-party/gi-stringliteral/recover_string_literals.py
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/extract_constants.py" \
            -o third-party/gi-stringliteral/extract_constants.py

          (
            cd third-party/gi-stringliteral
            python recover_string_literals.py \
              ../../inputs/7.1.0-global/global-metadata.dat \
              ../../inputs/7.1.0-global/GenshinImpact.exe \
              -o ../../quest-index-string-literals-all.json \
              2> ../../quest-index-string-literals-recovery.txt
          )

          python - <<'PY' | tee quest-index-string-literals-filtered.txt
          import json
          from pathlib import Path

          rows = json.loads(Path("quest-index-string-literals-all.json").read_text(encoding="utf-8"))
          needles = (
              "quest",
              "binoutput",
              "mainquest",
              "excelbinoutput",
              "index",
          )
          hits = [
              row for row in rows
              if any(n in str(row.get("value", "")).lower() for n in needles)
          ]
          print("total_literals=", len(rows))
          print("filtered_hits=", len(hits))
          for row in hits:
              print(json.dumps(row, ensure_ascii=False))

          Path("quest-index-string-literals-filtered.json").write_text(
              json.dumps({
                  "peer_repository": "kuma-dayo/gi-stringliteral",
                  "peer_commit": "1008fd7db28dcbc55729d5bb6b3a585dab86cf8b",
                  "total_literals": len(rows),
                  "hits": hits,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve exact Quest index genericinst
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-index-genericinst.txt
          import csv
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256
          from genshinre.typearray import ENTRY_SIZE, TYPE_KIND_NAMES, decode_type_entry, is_valid_type_entry

          EXE = Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          METHOD_INDEX = 417406
          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          with (ROOT / "methods.csv").open("r", encoding="utf-8-sig", newline="") as f:
              methods = list(csv.DictReader(f))
          with (ROOT / "types.csv").open("r", encoding="utf-8-sig", newline="") as f:
              types = list(csv.DictReader(f))
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}

          row = next((r for r in methods if int(r["method_index"]) == METHOD_INDEX), None)
          if row is None:
              raise AssertionError(f"method index {METHOD_INDEX} missing")
          if row["type_name"] != "LDABEPAGBGK" or row["method_name"] != "GMENPOPMKAA":
              raise AssertionError(f"method identity drift: {row}")

          param_names = json.loads(row.get("parameter_types") or "[]")
          print("METHOD", json.dumps(row, ensure_ascii=False, sort_keys=True))
          print("PARAM_NAMES", param_names)

          # The checked-in methods.csv predates persistence of
          # parameter_type_indices. Decode the exact two parameter records
          # directly from the protected 7.1 metadata instead.
          from genshinre.mhy71 import BODY_SKIP, decode_metadata_header_71
          from genshinre.param71 import PARAMETER_RECORD_SIZE, decode_parameter_record

          metadata = Path("inputs/7.1.0-global/global-metadata.dat").read_bytes()
          parameter_start = int(row["parameter_start"])
          parameter_count = int(row["parameter_count"])
          if parameter_count != 2:
              raise AssertionError(f"expected 2 parameters, got {parameter_count}")

          with PEImage(EXE) as image:
              header = image.read_rva(
                  PROFILE_71.embedded_header_rva,
                  PROFILE_71.embedded_header_size,
              )
          layout = decode_metadata_header_71(header)
          parameter_base = BODY_SKIP + int(layout["parameter_offset"])
          param_indices = []
          for ordinal in range(parameter_count):
              index = parameter_start + ordinal
              off = parameter_base + index * PARAMETER_RECORD_SIZE
              rec = metadata[off:off + PARAMETER_RECORD_SIZE]
              decoded = decode_parameter_record(rec, index)
              param_indices.append(int(decoded["type_index"]))
          print("PARAM_INDICES", param_indices)
          generic_index = int(param_indices[1])

          def describe(raw, type_by_tdi):
              if len(raw) != ENTRY_SIZE or not is_valid_type_entry(raw):
                  raise AssertionError(f"invalid Il2CppType bytes: {raw.hex()}")
              d = decode_type_entry(raw)
              kind = int(d["kind"])
              out = {
                  "kind": kind,
                  "kind_name": TYPE_KIND_NAMES.get(kind, f"kind_0x{kind:02X}"),
                  "data_u32": int(d["data_u32"]),
                  "data_u64": f"0x{int.from_bytes(raw[:8], 'little'):X}",
                  "raw": raw.hex(),
              }
              if kind in (0x11, 0x12):
                  tdi = int(d["data_u32"])
                  out["type_definition_index"] = tdi
                  out["type_definition"] = type_by_tdi.get(tdi, {})
              return out

          with PEImage(EXE) as image:
              base = image.image_base
              type_array_va = int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva, 8), "little"
              )

              def read_va(va, size):
                  if va < base:
                      raise AssertionError(f"VA 0x{va:X} below image base")
                  data = image.read_rva(va - base, size)
                  if len(data) != size:
                      raise AssertionError(f"truncated VA read 0x{va:X} size {size}")
                  return data

              generic_raw = read_va(type_array_va + generic_index * ENTRY_SIZE, ENTRY_SIZE)
              generic_type = describe(generic_raw, type_by_tdi)
              print("GENERIC_TYPE", json.dumps(generic_type, ensure_ascii=False, sort_keys=True))
              if generic_type["kind"] != 0x15:
                  raise AssertionError(f"parameter type {generic_index} is not genericinst")

              # In this 7.1 runtime type table GENERICINST stores a
              # generic-class INDEX, not a direct pointer.
              generic_class_index = int(generic_type["data_u32"])

              # Locate Il2CppMetadataRegistration by its exact typesCount/types
              # pair. Modern metadata registration layout:
              #   +0x00 genericClassesCount
              #   +0x08 genericClasses
              #   +0x10 genericInstsCount
              #   +0x18 genericInsts
              #   ...
              #   +0x30 typesCount
              #   +0x38 types
              candidates = []
              type_pat = type_array_va.to_bytes(8, "little")
              for sec in image.sections:
                  blob = image.read_rva(sec.virtual_address, sec.raw_size)
                  pos = 0
                  while True:
                      pos = blob.find(type_pat, pos)
                      if pos < 0:
                          break
                      hit_rva = sec.virtual_address + pos
                      if hit_rva >= 8:
                          try:
                              count = int.from_bytes(
                                  image.read_rva(hit_rva - 8, 8), "little"
                              )
                          except Exception:
                              count = -1
                          if count == PROFILE_71.runtime_type_count and hit_rva >= 0x38:
                              reg_rva = hit_rva - 0x38
                              candidates.append(reg_rva)
                      pos += 1

              candidates = sorted(set(candidates))
              print("METADATA_REGISTRATION_CANDIDATES", [f"0x{x:X}" for x in candidates])
              if len(candidates) != 1:
                  # Registration layout/location is not required by the handle
                  # resolution probe below. Preserve the exact parameter/runtime
                  # type evidence without blocking the main Quest loading chain.
                  partial = {
                      "method_index": METHOD_INDEX,
                      "method": row,
                      "runtime_type_index": generic_index,
                      "generic_type": generic_type,
                      "metadata_registration_candidates": [
                          f"0x{x:X}" for x in candidates
                      ],
                      "classification": "genericinst registration unresolved",
                  }
                  print("PARTIAL_RESULT", json.dumps(partial, ensure_ascii=False, sort_keys=True))
                  Path("quest-index-genericinst.json").write_text(
                      json.dumps(partial, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              reg_rva = candidates[0]
              reg = image.read_rva(reg_rva, 0x80)
              if len(reg) != 0x80:
                  raise AssertionError("truncated metadata registration")
              qword = lambda off: int.from_bytes(reg[off:off+8], "little")
              generic_classes_count = qword(0x00)
              generic_classes_va = qword(0x08)
              types_count = qword(0x30)
              types_va = qword(0x38)
              if types_count != PROFILE_71.runtime_type_count or types_va != type_array_va:
                  raise AssertionError("metadata registration anchor mismatch")
              if generic_class_index >= generic_classes_count:
                  raise AssertionError(
                      f"generic class index {generic_class_index} >= {generic_classes_count}"
                  )

              generic_class_va = int.from_bytes(
                  read_va(generic_classes_va + generic_class_index * 8, 8),
                  "little",
              )
              # Unity/IL2CPP v27+ Il2CppGenericClass:
              #   +0x00 Il2CppType* generic type definition
              #   +0x08 class_inst
              #   +0x10 method_inst
              #   +0x18 cached_class
              gc = read_va(generic_class_va, 0x20)
              base_type_va = int.from_bytes(gc[0x00:0x08], "little")
              class_inst_va = int.from_bytes(gc[0x08:0x10], "little")
              method_inst_va = int.from_bytes(gc[0x10:0x18], "little")
              cached_class_va = int.from_bytes(gc[0x18:0x20], "little")

              base_type = describe(read_va(base_type_va, ENTRY_SIZE), type_by_tdi)
              print("METADATA_REGISTRATION", json.dumps({
                  "rva": f"0x{reg_rva:X}",
                  "generic_classes_count": generic_classes_count,
                  "generic_classes_va": f"0x{generic_classes_va:X}",
                  "types_count": types_count,
                  "types_va": f"0x{types_va:X}",
              }, sort_keys=True))
              print("GENERIC_CLASS", json.dumps({
                  "index": generic_class_index,
                  "va": f"0x{generic_class_va:X}",
                  "raw": gc.hex(),
                  "base_type_va": f"0x{base_type_va:X}",
                  "class_inst_va": f"0x{class_inst_va:X}",
                  "method_inst_va": f"0x{method_inst_va:X}",
                  "cached_class_va": f"0x{cached_class_va:X}",
                  "base_type": base_type,
              }, ensure_ascii=False, sort_keys=True))

              # Il2CppGenericInst = native-word argc + Il2CppType** argv.
              inst = read_va(class_inst_va, 0x10)
              argc = int.from_bytes(inst[0x00:0x08], "little")
              argv_va = int.from_bytes(inst[0x08:0x10], "little")
              if argc != 2:
                  raise AssertionError(f"expected generic arity 2, got {argc}")
              ptrs = read_va(argv_va, argc * 8)
              args = []
              for i in range(argc):
                  arg_va = int.from_bytes(ptrs[i*8:(i+1)*8], "little")
                  arg = describe(read_va(arg_va, ENTRY_SIZE), type_by_tdi)
                  arg["va"] = f"0x{arg_va:X}"
                  args.append(arg)
                  print("ARG", i, json.dumps(arg, ensure_ascii=False, sort_keys=True))

              if [x["kind"] for x in args] != [0x09, 0x0B]:
                  raise AssertionError(
                      f"expected <uint32,uint64>, got {[x['kind_name'] for x in args]}"
                  )

              base_tdi = base_type.get("type_definition_index")
              if base_tdi != 1225:
                  raise AssertionError(
                      f"expected System.Collections.Generic.Dictionary`2 typeDef 1225, got {base_type}"
                  )
              base_name = str(base_type["type_definition"].get("type_name", ""))
              base_ns = str(base_type["type_definition"].get("namespace", ""))
              if base_name != "Dictionary`2" or base_ns != "System.Collections.Generic":
                  raise AssertionError(f"unexpected generic definition: {base_type}")

              result = {
                  "method_index": METHOD_INDEX,
                  "method": row,
                  "runtime_type_index": generic_index,
                  "generic_type": generic_type,
                  "metadata_registration_rva": f"0x{reg_rva:X}",
                  "generic_classes_count": generic_classes_count,
                  "generic_class_index": generic_class_index,
                  "generic_class_va": f"0x{generic_class_va:X}",
                  "base_type": base_type,
                  "class_inst_va": f"0x{class_inst_va:X}",
                  "argc": argc,
                  "args": args,
                  "generic_definition_name": "System.Collections.Generic.Dictionary`2",
                  "classification": "Dictionary<uint32,uint64>",
              }
              print("RESULT", json.dumps(result, ensure_ascii=False, sort_keys=True))
              Path("quest-index-genericinst.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Trace MainQuest handle resolution into external resources
        shell: bash
        run: |
          set -euo pipefail

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-handle-resolution.json \
            --focus pmo-load-handle:0x10175A00 \
            --focus common-load-bin:0x6D873C0 \
            --focus provider-load-bin:0x70186B0 \
            --focus provider-load-bin-zip:0x7012D40 \
            --max-body 0x10000 \
            | tee quest-handle-resolution.txt

          python - <<'PY' | tee quest-handle-resolution-summary.txt
          import json
          from pathlib import Path

          data=json.loads(Path("quest-handle-resolution.json").read_text(encoding="utf-8"))
          out={}
          for label,item in data["focus"].items():
              keep=[]
              for x in item.get("disassembly",[]):
                  m=x.get("mnemonic","")
                  op=x.get("op_str","").lower()
                  if (
                      m in {"call","jmp","mov","lea","cmp","test","and","or","xor","add","sub","imul","mul","shr","shl","sar","rol","ror"}
                      and (
                          m in {"call","jmp"}
                          or any(reg in op for reg in ("rdx","r8","r9","rcx","rax","rbx","rsi","rdi"))
                      )
                  ):
                      keep.append(x)
              out[label]={
                  "owner":item.get("owner"),
                  "direct_edges":item.get("direct_edges",[]),
                  "direct_callers":item.get("direct_callers",[]),
                  "interesting":keep,
              }
              print("\n###",label)
              print(json.dumps(out[label],ensure_ascii=False,indent=2))

          # Preserve the exact 351 full-config handle as a hard anchor.
          out["known_handle_351"]={
              "main_id":351,
              "handle_dec":1493294957662636073,
              "handle_hex":f"0x{1493294957662636073:016X}",
          }
          print("\n### known_handle_351")
          print(json.dumps(out["known_handle_351"],indent=2))
          Path("quest-handle-resolution-summary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY' | tee quest-handle-static-scan.txt
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe=Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe,PROFILE_71.exe_sha256,label="executable")
          handle=1493294957662636073
          pats={
              "u64_le":handle.to_bytes(8,"little"),
              "u32_low_le":(handle & 0xffffffff).to_bytes(4,"little"),
              "u32_high_le":((handle >> 32) & 0xffffffff).to_bytes(4,"little"),
          }
          with PEImage(exe) as image:
              for label,pat in pats.items():
                  hits=[]
                  for sec in image.sections:
                      blob=image.read_rva(sec.virtual_address,sec.raw_size)
                      pos=0
                      while True:
                          pos=blob.find(pat,pos)
                          if pos<0: break
                          hits.append((sec.name,sec.virtual_address+pos))
                          pos+=1
                  print(label,"count=",len(hits))
                  for sec,rva in hits[:100]:
                      print(" ",sec,f"0x{rva:X}")
          PY

      - name: Resolve ResourceIndex handle to ResourceIdentifier mapping
        shell: bash
        run: |
          set -euo pipefail

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-resource-identifier-resolution.json \
            --focus get-resource-identifier:0x7109EE0 \
            --focus check-asset-path:0x71068E0 \
            --focus load-bin-resource-id:0x701B590 \
            --focus load-bin-zip-resource-id:0x7012E30 \
            --max-body 0x10000 \
            | tee quest-resource-identifier-resolution.txt

          python - <<'PY' | tee quest-resource-identifier-schema.txt
          import csv
          import json
          from pathlib import Path

          ROOT=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (ROOT/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))

          types=rows("types.csv")
          fields=rows("fields.csv")
          methods=rows("methods.csv")
          type_hits=[x for x in types if x.get("type_name")=="ResourceIdentifier"]
          if not type_hits:
              raise AssertionError("ResourceIdentifier type missing")
          report={"types":[]}
          for typ in type_hits:
              tdi=int(typ["type_definition_index"])
              item={
                  "type":typ,
                  "fields":[x for x in fields if int(x["type_definition_index"])==tdi],
                  "methods":[x for x in methods if int(x["type_definition_index"])==tdi],
              }
              report["types"].append(item)
              print(json.dumps(item,ensure_ascii=False,indent=2))

          Path("quest-resource-identifier-schema.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY' | tee quest-resource-identifier-summary.txt
          import json
          from pathlib import Path

          data=json.loads(Path("quest-resource-identifier-resolution.json").read_text(encoding="utf-8"))
          out={}
          for label,item in data["focus"].items():
              interesting=[]
              for x in item.get("disassembly",[]):
                  m=x.get("mnemonic","")
                  op=x.get("op_str","").lower()
                  if (
                      m in {"call","jmp","mov","movzx","movsxd","lea","cmp","test","and","or","xor","add","sub","imul","mul","shr","shl","sar","rol","ror"}
                      and (
                          m in {"call","jmp"}
                          or any(reg in op for reg in ("rcx","rdx","r8","r9","rax","rbx","rsi","rdi","r10","r11","r12","r13","r14","r15"))
                      )
                  ):
                      interesting.append(x)
              out[label]={
                  "owner":item.get("owner"),
                  "direct_edges":item.get("direct_edges",[]),
                  "direct_callers":item.get("direct_callers",[]),
                  "interesting":interesting,
              }
              print("\n###",label)
              print(json.dumps(out[label],ensure_ascii=False,indent=2))

          Path("quest-resource-identifier-summary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

