name: One-shot original 7.1 Scene Point-compatible array element

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-point-array-element.yml'
      - 'scripts/probe-7.1-scene-point-array-element-native.py'

permissions:
  contents: read

jobs:
  original-element:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native disassembly tools
        run: python -m pip install -e . capstone zstandard
      - name: Fetch source-pinned original Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect exact original array element virtual call and members
        run: |
          python scripts/probe-7.1-scene-point-array-element-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-cb-one-byte-native-proof.json \
            --output work/original-global-71-scene-point-array-element.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-global-71-scene-point-array-element
          path: work/original-global-71-scene-point-array-element.json
          retention-days: 7
          if-no-files-found: error
