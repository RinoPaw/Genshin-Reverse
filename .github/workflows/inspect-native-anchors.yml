name: Inspect 7.1 native anchors

on:
  push:
    paths:
      - '.github/workflows/inspect-native-anchors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Disassemble hard anchors and registry constructor
        run: |
          python - <<'PY'
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from genshinre.pe import PEImage
          from pathlib import Path

          exe = Path('/tmp/gi71/GenshinImpact.exe')
          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = False
          targets = {
              'registry constructor head': (0x07F7D8C0, 192, 256),
              'registry constructor tail': (0x07F8E44D, 160, 768),
              '9369 historical store': (0x07F852AB, 96, 160),
              '26105 GetCmdId': (0x10587260, 32, 128),
              'metadata usage helper': (0x00523400, 32, 256),
          }
          with PEImage(exe) as image:
              print('image_base', hex(image.image_base))
              for name, (rva, before, after) in targets.items():
                  start = rva - before
                  blob = image.read_rva(start, before + after)
                  print(f'\n=== {name}: RVA 0x{rva:X}, window 0x{start:X} ===')
                  print('raw:', blob.hex())
                  for insn in md.disasm(blob, image.image_base + start):
                      irva = insn.address - image.image_base
                      marker = ' <==' if irva == rva else ''
                      print(f'0x{irva:09X}: {insn.bytes.hex():<24} {insn.mnemonic:<8} {insn.op_str}{marker}')
          PY

      - name: Find usage 37523 call sites without requiring a store
        run: |
          python -m genshinre.usage \
            /tmp/gi71/GenshinImpact.exe \
            /tmp/usage-all.csv \
            --summary /tmp/usage-all.summary.json \
            --all-calls
          cat /tmp/usage-all.summary.json
          echo '--- usage 37523 ---'
          grep '^37523,' /tmp/usage-all.csv || true
          echo '--- historical store/slot ---'
          grep -i -E '7F852AB|57E6498' /tmp/usage-all.csv || true
