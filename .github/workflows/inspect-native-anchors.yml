name: Verify 7.1 runtime type boundary

on:
  push:
    paths:
      - '.github/workflows/inspect-native-anchors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-type-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Verify exact runtime type-array boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          from genshinre.mhy71 import EXPECTED_TYPE_COUNT, TYPE_ARRAY_POINTER_RVA
          from genshinre.pe import PEImage

          exe = Path('/tmp/gi71/GenshinImpact.exe')
          ENTRY_SIZE = 16
          EXPECTED_RUNTIME_TYPE_COUNT = 683_574
          TYPE_KINDS = {
              0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07,
              0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F,
              0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16,
              0x18, 0x19, 0x1B, 0x1C, 0x1D, 0x1E, 0x1F, 0x20, 0x21,
              0x40, 0x41, 0x45, 0x55,
          }

          def valid_type_entry(entry: bytes) -> bool:
              if len(entry) != ENTRY_SIZE:
                  return False
              kind = entry[0x0A]
              if kind not in TYPE_KINDS:
                  return False
              if entry[0x0C:0x10] != b'\0' * 4:
                  return False
              if kind in (0x11, 0x12):
                  data64 = struct.unpack_from('<Q', entry, 0)[0]
                  if (data64 >> 32) != 0 or (data64 & 0xFFFFFFFF) >= EXPECTED_TYPE_COUNT:
                      return False
              return True

          with PEImage(exe) as image:
              pointer = image.read_rva(TYPE_ARRAY_POINTER_RVA, 8)
              if len(pointer) != 8:
                  raise SystemExit('cannot read runtime type-array pointer')
              type_array_va = struct.unpack('<Q', pointer)[0]
              type_array_rva = type_array_va - image.image_base
              total = EXPECTED_RUNTIME_TYPE_COUNT + 1
              data = image.read_rva(type_array_rva, total * ENTRY_SIZE)
              if len(data) != total * ENTRY_SIZE:
                  raise SystemExit('truncated runtime type-array boundary read')

              invalid = []
              kind_counts = {}
              for index in range(EXPECTED_RUNTIME_TYPE_COUNT):
                  entry = data[index * ENTRY_SIZE:(index + 1) * ENTRY_SIZE]
                  kind = entry[0x0A]
                  kind_counts[kind] = kind_counts.get(kind, 0) + 1
                  if not valid_type_entry(entry):
                      invalid.append((index, entry.hex(), kind))
                      if len(invalid) >= 16:
                          break

              boundary = data[
                  EXPECTED_RUNTIME_TYPE_COUNT * ENTRY_SIZE:
                  (EXPECTED_RUNTIME_TYPE_COUNT + 1) * ENTRY_SIZE
              ]

              print('type_array_rva', hex(type_array_rva))
              print('expected_runtime_type_count', EXPECTED_RUNTIME_TYPE_COUNT)
              print('expected_boundary_rva', hex(type_array_rva + EXPECTED_RUNTIME_TYPE_COUNT * ENTRY_SIZE))
              print('invalid_inside_count', len(invalid))
              print('invalid_inside_examples', invalid)
              print('boundary_entry', boundary.hex())
              print('boundary_entry_valid_type', valid_type_entry(boundary))
              print('kind_counts', {f'0x{k:02X}': v for k, v in sorted(kind_counts.items())})
              print('last_entries')
              for index in range(EXPECTED_RUNTIME_TYPE_COUNT - 8, EXPECTED_RUNTIME_TYPE_COUNT):
                  entry = data[index * ENTRY_SIZE:(index + 1) * ENTRY_SIZE]
                  print(index, hex(type_array_rva + index * ENTRY_SIZE), entry.hex())

              if invalid:
                  raise SystemExit('runtime type-array contains structurally invalid entries before expected boundary')
              if valid_type_entry(boundary):
                  raise SystemExit('first entry after expected runtime type-array boundary still looks like Il2CppType')
          PY
