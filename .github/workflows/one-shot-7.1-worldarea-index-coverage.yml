name: One-shot original 7.1 WorldArea index/export coverage

on:
  push:
    branches: [research/worldarea-index-coverage-71]
    paths:
      - '.github/workflows/one-shot-7.1-worldarea-index-coverage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard
      - name: Fetch pinned original design blocks
        run: python scripts/fetch-7.1-design-blocks.py --output work/design
      - name: Reconstruct verified original WorldArea block
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("scripts/probe-7.1-world-area-bundle-object-types.py")
          spec=importlib.util.spec_from_file_location("original_worldarea_source",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print(mod.verify_manifest_and_fetch(Path("work/24230448.blk")))
          PY
      - name: Download SHA-256-pinned original Raw exporter
        run: |
          mkdir -p work/cli
          curl -fLsS --retry 3 https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz -o work/exporter.tar.gz
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  work/exporter.tar.gz' | sha256sum --check
          tar -xzf work/exporter.tar.gz -C work/cli
      - name: Export exact original index and native WorldArea-block files
        run: |
          dotnet work/cli/AnimeStudio.CLI.dll work/design/31049741.blk work/index --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
          dotnet work/cli/AnimeStudio.CLI.dll work/24230448.blk work/worldarea --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
      - name: Cross-check original hashed names without inferring semantic fields
        run: |
          python scripts/audit-7.1-original-worldarea-index-coverage.py \
            --index-raw work/index/MiHoYoBinData/0000006f.dat \
            --world-export work/worldarea \
            --output work/original-71-worldarea-index-coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-worldarea-design-index-coverage
          path: work/original-71-worldarea-index-coverage.json
          retention-days: 7
          if-no-files-found: error
