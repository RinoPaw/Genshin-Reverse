name: Probe 7.1 QuestExcel loader count transform

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-questexcel71-loader-count.yml"

concurrency:
  group: probe-questexcel71-loader-count-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Find reader methods that decode the exact native row count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-loader-count.txt
          import bisect
          import csv
          import json
          from pathlib import Path

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE = Path("inputs/7.1.0-global/GenshinImpact.exe")
          META = Path("versions/7.1.0-global/windows-x64/metadata")
          RAW = 0x40233AB1
          EXPECT = 33214
          MASK = 0xFFFFFFFF

          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          with (META / "methods.csv").open("r", encoding="utf-8-sig", newline="") as fh:
              methods = list(csv.DictReader(fh))

          method_rows = []
          for row in methods:
              try:
                  rva = int((row.get("rva") or "0").strip(), 0)
              except ValueError:
                  continue
              if rva:
                  method_rows.append((rva, row))
          method_rows.sort(key=lambda item: item[0])
          starts = [rva for rva, _ in method_rows]
          by_rva = {}
          for rva, row in method_rows:
              by_rva.setdefault(rva, []).append(row)

          def canon(name):
              name = name.lower()
              aliases = {
                  "rax": "a", "eax": "a", "ax": "a", "al": "a",
                  "rbx": "b", "ebx": "b", "bx": "b", "bl": "b",
                  "rcx": "c", "ecx": "c", "cx": "c", "cl": "c",
                  "rdx": "d", "edx": "d", "dx": "d", "dl": "d",
                  "rsi": "si", "esi": "si", "sil": "si",
                  "rdi": "di", "edi": "di", "dil": "di",
                  "rbp": "bp", "ebp": "bp", "bpl": "bp",
                  "rsp": "sp", "esp": "sp", "spl": "sp",
              }
              if name in aliases:
                  return aliases[name]
              if name.startswith("r") and len(name) > 1:
                  suffix = name[1:].rstrip("dwb")
                  if suffix.isdigit():
                      return "r" + suffix
              return name

          def owner(rva):
              i = bisect.bisect_right(starts, rva) - 1
              if i < 0:
                  return None
              start, _ = method_rows[i]
              end = method_rows[i + 1][0] if i + 1 < len(method_rows) else start + 0x2000
              if not start <= rva < end:
                  return None
              return {
                  "rva": f"0x{start:X}",
                  "end_rva": f"0x{end:X}",
                  "metadata": by_rva.get(start, []),
              }

          def regname(ins, op):
              return canon(ins.reg_name(op.reg) or "")

          reader_methods = [
              (rva, row)
              for rva, row in method_rows
              if "FNIAHJGHFAK" in (row.get("parameter_types") or "")
          ]

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          candidates = []

          with PEImage(EXE) as image:
              base = image.image_base
              for rva, meta in reader_methods:
                  j = bisect.bisect_right(starts, rva)
                  method_end = starts[j] if j < len(starts) else rva + 0x1000
                  size = max(0x80, min(method_end - rva, 0x1200))
                  insns = list(md.disasm(image.read_rva(rva, size), base + rva))
                  vals = {}
                  hits = []
                  calls = []
                  backward = []
                  stream_reads = []

                  for ins in insns:
                      ops = ins.operands

                      if ins.mnemonic == "call" and ops and ops[0].type == X86_OP_IMM:
                          target = ops[0].imm - base if ops[0].imm >= base else ops[0].imm
                          calls.append({
                              "site_rva": f"0x{ins.address - base:X}",
                              "target_rva": f"0x{target:X}",
                              "owner": owner(target),
                          })

                      if ins.mnemonic.startswith("j") and ops and ops[0].type == X86_OP_IMM:
                          target = ops[0].imm - base if ops[0].imm >= base else ops[0].imm
                          if target < ins.address - base:
                              backward.append({
                                  "site_rva": f"0x{ins.address - base:X}",
                                  "target_rva": f"0x{target:X}",
                                  "mnemonic": ins.mnemonic,
                              })

                      if (
                          ins.mnemonic in ("mov", "movabs")
                          and len(ops) == 2
                          and ops[0].type == X86_OP_REG
                      ):
                          dst = regname(ins, ops[0])
                          if ops[1].type == X86_OP_IMM:
                              vals[dst] = (
                                  ops[1].imm & MASK,
                                  hex(ops[1].imm & MASK),
                                  False,
                              )
                              continue
                          if ops[1].type == X86_OP_REG:
                              src = regname(ins, ops[1])
                              if src in vals:
                                  vals[dst] = vals[src]
                              else:
                                  vals.pop(dst, None)
                              continue

                      is_stream = False
                      if (
                          len(ops) == 2
                          and ops[1].type == X86_OP_MEM
                          and ops[1].size == 4
                      ):
                          mem = ops[1].mem
                          is_stream = (
                              mem.disp == 0x20
                              and mem.base != 0
                              and mem.index != 0
                              and mem.scale == 1
                          )

                      if is_stream and ops[0].type == X86_OP_REG:
                          dst = regname(ins, ops[0])
                          before = vals.get(dst)
                          if ins.mnemonic == "mov":
                              vals[dst] = (RAW, "raw_u32", True)
                          elif ins.mnemonic in ("xor", "add", "sub") and before is not None:
                              a, expr, dep = before
                              if ins.mnemonic == "xor":
                                  value = (a ^ RAW) & MASK
                              elif ins.mnemonic == "add":
                                  value = (a + RAW) & MASK
                              else:
                                  value = (a - RAW) & MASK
                              vals[dst] = (
                                  value,
                                  f"({expr} {ins.mnemonic} raw_u32)",
                                  True,
                              )
                          else:
                              vals.pop(dst, None)
                          stream_reads.append({
                              "rva": f"0x{ins.address - base:X}",
                              "mnemonic": ins.mnemonic,
                              "op_str": ins.op_str,
                          })

                      if (
                          ins.mnemonic in ("xor", "add", "sub")
                          and len(ops) == 2
                          and ops[0].type == X86_OP_REG
                      ):
                          dst = regname(ins, ops[0])
                          if dst not in vals:
                              continue
                          a, expr, dep = vals[dst]
                          b = None
                          bexpr = None
                          bdep = False
                          if ops[1].type == X86_OP_IMM:
                              b = ops[1].imm & MASK
                              bexpr = hex(b)
                          elif ops[1].type == X86_OP_REG:
                              src = regname(ins, ops[1])
                              if src in vals:
                                  b, bexpr, bdep = vals[src]
                          if b is None:
                              continue
                          if ins.mnemonic == "xor":
                              value = (a ^ b) & MASK
                          elif ins.mnemonic == "add":
                              value = (a + b) & MASK
                          else:
                              value = (a - b) & MASK
                          vals[dst] = (
                              value,
                              f"({expr} {ins.mnemonic} {bexpr})",
                              dep or bdep,
                          )

                      if (
                          ins.mnemonic == "lea"
                          and len(ops) == 2
                          and ops[0].type == X86_OP_REG
                          and ops[1].type == X86_OP_MEM
                      ):
                          dst = regname(ins, ops[0])
                          mem = ops[1].mem
                          if mem.index == 0 and mem.base != 0:
                              src = canon(ins.reg_name(mem.base) or "")
                              if src in vals:
                                  a, expr, dep = vals[src]
                                  value = (a + mem.disp) & MASK
                                  vals[dst] = (
                                      value,
                                      f"({expr} add {hex(mem.disp & MASK)})",
                                      dep,
                                  )

                      for reg, (value, expr, dep) in list(vals.items()):
                          if dep and value == EXPECT:
                              hit = {
                                  "rva": f"0x{ins.address - base:X}",
                                  "reg": reg,
                                  "expr": expr,
                              }
                              if hit not in hits:
                                  hits.append(hit)

                  if hits:
                      candidates.append({
                          "method": meta,
                          "rva": f"0x{rva:X}",
                          "hits": hits,
                          "stream_reads": stream_reads[:16],
                          "backward_branches": backward[:24],
                          "calls": calls[:100],
                          "score": 100 + 10 * bool(backward) + min(len(calls), 20),
                      })

          candidates.sort(key=lambda item: (-item["score"], int(item["rva"], 16)))
          report = {
              "raw_count_u32": f"0x{RAW:08X}",
              "expected_rows": EXPECT,
              "reader_method_count": len(reader_methods),
              "candidate_count": len(candidates),
              "candidates": candidates,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path("questexcel71-loader-count.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: questexcel71-loader-count
          path: |
            questexcel71-loader-count.txt
            questexcel71-loader-count.json
          if-no-files-found: error
