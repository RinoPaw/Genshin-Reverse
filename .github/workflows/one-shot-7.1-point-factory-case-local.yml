name: One-shot original 7.1 Point factory case native audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-point-factory-case-local.yml'
      - 'scripts/probe-7.1-point-factory-case-local-native.py'

permissions:
  contents: read

jobs:
  original-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install exact sample inspection dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256-pinned original Global 7.1 executable and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect original factory case 1 and 14 native code
        run: |
          python scripts/probe-7.1-point-factory-case-local-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --factory versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-array-element-factory-native-evidence.json \
            --output work/7.1-original-point-factory-case-local-native.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-factory-cases-1-14-local-native
          path: work/7.1-original-point-factory-case-local-native.json
          retention-days: 7
          if-no-files-found: error
