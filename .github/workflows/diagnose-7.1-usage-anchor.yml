name: Diagnose 7.1 usage anchor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-7.1-usage-anchor.yml'
      - 'genshinre/usageanchordiag.py'
      - 'genshinre/registrycorridordiag.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Diagnose UnlockTransPointReq declaring-type xref method
        run: |
          ROOT=versions/7.1.0-global/windows-x64
          python -m genshinre.usageanchordiag \
            /tmp/gi71/GenshinImpact.exe \
            "$ROOT/metadata/methods.csv" \
            "$ROOT/registry/type-cache-xrefs.csv" \
            /tmp/usage-anchor-9369.json \
            --cmd-id 9369 \
            --context-before 40 \
            --context-after 16
          cat /tmp/usage-anchor-9369.json

      - name: Diagnose UnlockTransPointReq registry constructor corridor
        run: |
          python -m genshinre.registrycorridordiag \
            /tmp/gi71/GenshinImpact.exe \
            /tmp/registry-corridor-9369.json \
            --center-rva 0x7F852AB \
            --before 0x500 \
            --after 0x200 \
            --slot-rva 0x57E6498 \
            --expected-usage 37523
          cat /tmp/registry-corridor-9369.json
