name: One-shot original 7.1 native class initializer CFG

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-type-post-init-cfg.yml'
      - 'scripts/probe-7.1-kind1-post-init-cfg.py'

permissions:
  contents: read

jobs:
  native-type-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source-pinned native scan dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch original Global 7.1 exe with exact SHA-256
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify reachable native IL2CPP class-initializer branches
        run: |
          python scripts/probe-7.1-kind1-post-init-cfg.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-metadata-kind1-type-resolver-30-case-native.json \
            --output work/original-71-kind1-post-type-cfg.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-post-type-cfg
          path: work/original-71-kind1-post-type-cfg.json
          if-no-files-found: error
          retention-days: 7
