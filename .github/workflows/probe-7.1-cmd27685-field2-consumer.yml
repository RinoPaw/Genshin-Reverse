name: Audit original 7.1 Cmd27685 field2 callee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-7.1-cmd27685-field2-consumer.yml'
      - 'scripts/probe-7.1-cmd27685-field2-consumer.py'
      - 'scripts/probe-7.1-cmd27685-collector-owner.py'

permissions:
  contents: read

concurrency:
  group: original-71-field2-callee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard capstone
      - name: Obtain SHA-pinned original Global 7.1 EXE
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Check original callee address, method owner and registers
        run: |
          python scripts/probe-7.1-cmd27685-field2-consumer.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/cmd27685-native-field2-callee.json
      - name: Recover native JLDCJCKHJEM class fields and constructor
        run: |
          python scripts/probe-7.1-cmd27685-collector-owner.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/cmd27685-native-collector-owner.json
      - uses: actions/upload-artifact@v7
        with:
          name: exact-71-cmd27685-field2-callee
          path: |
            work/cmd27685-native-field2-callee.json
            work/cmd27685-native-collector-owner.json
          retention-days: 7
          if-no-files-found: error
