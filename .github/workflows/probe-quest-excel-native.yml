name: Probe 7.1 QuestExcel native deserializers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-excel-native.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Disassemble row and condition deserializers
        run: |
          expected_sha=$(python - <<'PY'
          from genshinre.nativeprofile import PROFILE_71
          print(PROFILE_71.exe_sha256)
          PY
          )
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            0xCF24560 0xB00 \
            --expected-sha256 "$expected_sha" \
            --label "RandomQuestExcelConfig.FromBinaryInner" \
            --output quest-row-disassembly.json
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            0x115825D0 0x500 \
            --expected-sha256 "$expected_sha" \
            --label "QuestCond.FromBinaryInner" \
            --output quest-cond-disassembly.json
          echo '=== RandomQuestExcelConfig.FromBinaryInner disassembly ==='
          cat quest-row-disassembly.json
          echo '=== QuestCond.FromBinaryInner disassembly ==='
          cat quest-cond-disassembly.json

      - name: Trace metadata-resolved call edges
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-native-call-edges.json \
            --focus row-from-binary-inner:0xCF24560 \
            --focus quest-cond-from-binary-inner:0x115825D0 \
            --max-body 0x4000
          echo '=== native call edges ==='
          cat quest-native-call-edges.json
