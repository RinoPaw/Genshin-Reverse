name: Probe Quest 7.1 condition reachability

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-condition-reachability.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . pefile zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Build ordinary Quest type reachability graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-condition-reachability.txt
          import csv,json
          from collections import defaultdict,deque
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          ROOTS=("AFIOOHMJHDM","LAIMPNDEFCL")

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv"); fields=rows("fields.csv")
          tb={int(t["type_definition_index"]):t for t in types}
          by_name={t.get("type_name") or "":int(t["type_definition_index"]) for t in types}
          fb=defaultdict(list)
          for f in fields: fb[int(f["type_definition_index"])].append(f)

          cond_tdis={
              int(f["type_definition_index"])
              for f in fields
              if (f.get("field_type") or "")=="QuestCondType"
              and (f.get("type_name") or "")!="QuestCondType"
          }
          print("COND_TYPES",json.dumps({tdi:(tb.get(tdi) or {}).get("type_name") for tdi in sorted(cond_tdis)},ensure_ascii=False))

          primitive={
              "bool","byte","sbyte","short","ushort","int16","uint16","int32","uint32",
              "int64","uint64","float","double","string","object","QuestCondType",
          }

          with PEImage(EXE) as image:
              base=image.image_base
              type_array_va=int.from_bytes(image.read_rva(PROFILE_71.type_array_pointer_rva,8),"little")
              type_array_rva=type_array_va-base
              n=PROFILE_71.runtime_type_count
              type_blob=image.read_rva(type_array_rva,n*16)
              if len(type_blob)!=n*16:
                  raise SystemExit("truncated runtime type array")

              def entry(ix):
                  if not (0<=ix<n):return None
                  raw=type_blob[ix*16:(ix+1)*16]
                  return {
                      "kind":raw[10],
                      "data_u32":int.from_bytes(raw[:4],"little"),
                      "data_u64":int.from_bytes(raw[:8],"little"),
                  }

              def class_tdi(e):
                  if e and e["kind"] in (0x11,0x12) and e["data_u32"] in tb:
                      return e["data_u32"]
                  return None

              def resolve_szarray(ix):
                  e=entry(ix)
                  if not e or e["kind"]!=0x1D:return None
                  candidates=[]
                  ptr=e["data_u64"]
                  if base<=ptr:
                      delta=(ptr-base)-type_array_rva
                      if delta>=0 and delta%16==0:
                          candidates.append(delta//16)
                  candidates.append(e["data_u32"])
                  for j in candidates:
                      tdi=class_tdi(entry(j))
                      if tdi is not None:return tdi
                  return None

              edges=defaultdict(list)
              for owner_tdi,ff in fb.items():
                  for f in ff:
                      ft=f.get("field_type") or ""
                      target=None; how=None
                      if ft=="kind_0x1D":
                          try:ix=int(f.get("field_type_index") or "-1")
                          except ValueError:ix=-1
                          target=resolve_szarray(ix); how="szarray"
                      elif ft and not ft.startswith("kind_") and ft not in primitive and ft in by_name:
                          target=by_name[ft]; how="direct"
                      if target is not None:
                          edges[owner_tdi].append({
                              "to":target,
                              "field_name":f.get("field_name"),
                              "field_type":ft,
                              "field_type_index":f.get("field_type_index"),
                              "how":how,
                          })

              for root_name in ROOTS:
                  root=by_name[root_name]
                  q=deque([root]); parent={root:None}; pedge={}
                  found=[]
                  while q:
                      cur=q.popleft()
                      if cur in cond_tdis and cur!=root:
                          found.append(cur)
                      for e in edges.get(cur,[]):
                          nxt=e["to"]
                          if nxt in parent:continue
                          parent[nxt]=cur; pedge[nxt]=e; q.append(nxt)

                  paths=[]
                  for tdi in found:
                      chain=[]; cur=tdi
                      while parent[cur] is not None:
                          e=pedge[cur]; prev=parent[cur]
                          chain.append({
                              "from_tdi":prev,
                              "from_type":(tb.get(prev) or {}).get("type_name"),
                              "field_name":e["field_name"],
                              "how":e["how"],
                              "to_tdi":cur,
                              "to_type":(tb.get(cur) or {}).get("type_name"),
                          })
                          cur=prev
                      paths.append(list(reversed(chain)))

                  print("\nROOT",root_name)
                  print("REACHABLE_TYPES",len(parent))
                  print("REACHABLE_COND_TYPES",len(found))
                  print(json.dumps(paths,ensure_ascii=False,indent=2))

                  # Show unresolved erased/generic fields in reachable nodes so
                  # any remaining structural loophole is explicit.
                  unresolved=[]
                  for tdi in parent:
                      for f in fb.get(tdi,[]):
                          ft=f.get("field_type") or ""
                          if ft.startswith("kind_") and ft!="kind_0x1D":
                              unresolved.append({
                                  "owner_tdi":tdi,
                                  "owner_type":(tb.get(tdi) or {}).get("type_name"),
                                  "field":f,
                              })
                  print("UNRESOLVED_ERASED_FIELDS",len(unresolved))
                  print(json.dumps(unresolved,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-condition-reachability
          path: quest71-condition-reachability.txt
          if-no-files-found: error
