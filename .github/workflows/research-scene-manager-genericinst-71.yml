name: Temporary original 7.1 Scene manager generic type pointers

on:
  push:
    paths:
      - '.github/workflows/research-scene-manager-genericinst-71.yml'

permissions:
  contents: read

concurrency:
  group: research-scene-manager-genericinst-71
  cancel-in-progress: true

jobs:
  generic-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install maintained native research package
        run: python -m pip install -e . zstandard
      - name: Fetch exact original 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/original-71 --python python
      - name: Trace manager Dictionary field Il2CppType generic class pointers
        run: |
          python scripts/probe-7.1-scene-manager-genericinst.py \
            --exe inputs/original-71/GenshinImpact.exe \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/scene-manager-generic-types.json
      - name: Preserve tiny source-bound generic-instance evidence only
        uses: actions/upload-artifact@v7
        with:
          name: exact-global-71-scene-manager-generic-type-data
          path: work/scene-manager-generic-types.json
          if-no-files-found: error
          retention-days: 2
