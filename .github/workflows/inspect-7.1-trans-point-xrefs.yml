name: Inspect 7.1 trans point external xrefs

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-trans-point-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Trace external type-slot xrefs
        run: |
          python - <<'PY'
          import bisect
          import csv
          import json
          from pathlib import Path

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from genshinre.pe import PEImage
          from genshinre.xrefs import scan_rip_xrefs

          base = Path('versions/7.1.0-global/windows-x64')
          exe = Path('/tmp/gi71/GenshinImpact.exe')
          rsp_path = base / 'analyses/unlock-trans-point/retcode6-single-field-candidates.csv'
          registry_path = base / 'registry/registry.csv'
          methods_path = base / 'metadata/methods.csv'

          with rsp_path.open(newline='', encoding='utf-8') as f:
              rsp_ids = {int(r['cmd_id']) for r in csv.DictReader(f)}

          controls = {9369, 25567, 26105, 4385, 22899}
          target_ids = rsp_ids | controls

          registry = {}
          with registry_path.open(newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  try:
                      cid = int(row['cmd_id'])
                  except (ValueError, KeyError):
                      continue
                  if cid in target_ids:
                      registry[cid] = row

          missing = sorted(target_ids - set(registry))
          if missing:
              print('missing registry ids:', missing)

          slots = {
              cid: int(row['type_slot_rva'], 0)
              for cid, row in registry.items()
              if row.get('type_slot_rva')
          }
          slot_to_id = {slot: cid for cid, slot in slots.items()}

          # Build a global method-RVA index so arbitrary xrefs can be attributed to their owner method/type.
          methods = []
          with methods_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  rv = row.get('rva') or row.get('method_rva')
                  if not rv:
                      continue
                  try:
                      rva = int(rv, 0)
                  except ValueError:
                      continue
                  methods.append((rva, {
                      'method_index': row.get('method_index', ''),
                      'type_definition_index': row.get('type_definition_index', ''),
                      'type_name': row.get('type_name', ''),
                      'method_name': row.get('method_name', ''),
                      'rva': rv,
                  }))
          methods.sort(key=lambda x: x[0])
          method_rvas = [x[0] for x in methods]

          def owner_for(rva):
              i = bisect.bisect_right(method_rvas, rva) - 1
              if i < 0:
                  return None
              start, row = methods[i]
              end = method_rvas[i + 1] if i + 1 < len(method_rvas) else start + 0x10000
              if not (start <= rva < end):
                  return None
              return {**row, 'offset': rva - start, 'next_method_rva': f'0x{end:X}'}

          scan = scan_rip_xrefs(exe, list(slots.values()), window=48)
          annotated = {}
          registry_ctor_start = 0x07F7D8C0
          registry_ctor_end = 0x07F8E44D + 0x1000

          for slot_hex, rows in scan['matches'].items():
              slot = int(slot_hex, 0)
              cid = slot_to_id[slot]
              msg_type = registry[cid]['type_name']
              out = []
              for x in rows:
                  xrva = int(x['instruction_rva'], 0)
                  owner = owner_for(xrva)
                  category = 'unattributed'
                  if registry_ctor_start <= xrva < registry_ctor_end:
                      category = 'registry-constructor'
                  elif owner and owner.get('type_name') == msg_type:
                      category = 'self-type'
                  elif owner:
                      category = 'external-method'
                  out.append({**x, 'owner': owner, 'category': category})
              annotated[str(cid)] = out

          def external_owner_types(cid):
              return {
                  x['owner']['type_name']
                  for x in annotated.get(str(cid), [])
                  if x['category'] == 'external-method' and x.get('owner') and x['owner'].get('type_name')
              }

          def external_owner_methods(cid):
              return {
                  (x['owner']['type_name'], x['owner']['method_name'], x['owner']['rva'])
                  for x in annotated.get(str(cid), [])
                  if x['category'] == 'external-method' and x.get('owner')
              }

          born_req_types = external_owner_types(26105)
          born_rsp_types = external_owner_types(4385)
          trans_req_types = external_owner_types(9369)
          notify_types = external_owner_types(25567)

          ranking = []
          for cid in sorted(rsp_ids):
              types = external_owner_types(cid)
              methods_set = external_owner_methods(cid)
              shared = sorted(types & trans_req_types)
              ranking.append({
                  'cmd_id': cid,
                  'type_name': registry.get(cid, {}).get('type_name'),
                  'external_owner_types': sorted(types),
                  'external_owner_method_count': len(methods_set),
                  'shared_owner_types_with_9369': shared,
                  'shared_count': len(shared),
                  'xref_total': len(annotated.get(str(cid), [])),
                  'external_xref_count': sum(1 for x in annotated.get(str(cid), []) if x['category'] == 'external-method'),
              })
          ranking.sort(key=lambda r: (r['shared_count'], r['external_xref_count'], r['xref_total']), reverse=True)

          # Disassemble external owner methods for the request, notify, born control pair, and any response sharing a controller type with 9369.
          focus_ids = {9369, 25567, 26105, 4385}
          focus_ids.update(r['cmd_id'] for r in ranking if r['shared_count'])
          method_dump_keys = set()
          for cid in focus_ids:
              for x in annotated.get(str(cid), []):
                  if x['category'] == 'external-method' and x.get('owner'):
                      o = x['owner']
                      method_dump_keys.add((int(o['rva'], 0), o['type_name'], o['method_name']))

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          method_disasm = []
          with PEImage(exe) as image:
              for rva, tname, mname in sorted(method_dump_keys):
                  blob = image.read_rva(rva, 2400)
                  lines = []
                  for insn in md.disasm(blob, image.image_base + rva):
                      irva = insn.address - image.image_base
                      lines.append(f'0x{irva:X}: {insn.mnemonic} {insn.op_str}')
                      if insn.mnemonic == 'ret' and irva > rva + 32:
                          break
                      if len(lines) >= 260:
                          break
                  method_disasm.append({
                      'type_name': tname,
                      'method_name': mname,
                      'rva': f'0x{rva:X}',
                      'disasm': lines,
                  })

          summary = {
              'control_check': {
                  'born_req_26105_owner_types': sorted(born_req_types),
                  'born_rsp_4385_owner_types': sorted(born_rsp_types),
                  'born_shared_owner_types': sorted(born_req_types & born_rsp_types),
                  'trans_req_9369_owner_types': sorted(trans_req_types),
                  'scene_point_notify_25567_owner_types': sorted(notify_types),
                  'trans_req_notify_shared_owner_types': sorted(trans_req_types & notify_types),
              },
              'registry': {str(k): v for k, v in registry.items()},
              'annotated_xrefs': annotated,
              'response_ranking': ranking,
              'method_disasm': method_disasm,
          }

          out = Path('/tmp/trans-point-xrefs.json')
          out.write_text(json.dumps(summary, indent=2), encoding='utf-8')

          print('=== control check ===')
          print(json.dumps(summary['control_check'], indent=2))
          print('\n=== top response candidates by shared external owner type with 9369 ===')
          for row in ranking[:20]:
              print(json.dumps(row))
          PY

      - name: Upload xref analysis
        uses: actions/upload-artifact@v4
        with:
          name: trans-point-xrefs
          path: /tmp/trans-point-xrefs.json
          if-no-files-found: error
