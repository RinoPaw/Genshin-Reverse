name: One-shot original 7.1 factory NLDEP reader chain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-71-factory-nldep-reader.yml'
      - 'scripts/probe-7.1-point-factory-nldep-overloads-native.py'

permissions:
  contents: read

jobs:
  original-nldep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Fetch original SHA-verified Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify original factory reader to NLDEP native call chain
        run: |
          python scripts/probe-7.1-point-factory-nldep-overloads-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --previous versions/7.1.0-global/analyses/progression/world/7.1-original-point-factory-case-1-14-ctor-owner-reader-native.json \
            --array versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-array-element-factory-native-evidence.json \
            --output work/7.1-original-factory-nldep-native.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-factory-nldep-native
          path: work/7.1-original-factory-nldep-native.json
          retention-days: 7
          if-no-files-found: error
