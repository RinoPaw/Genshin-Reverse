name: Temporary Amber 7.1 field-4 response native comparison

on:
  push:
    branches:
      - research/amber-pause-ack-71
    paths:
      - .github/workflows/research-amber-field4-native.yml

concurrency:
  group: amber-field4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire pinned Global 7.1 executable
        run: |
          python -m pip install zstandard capstone
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect the two field-4 int32 native receiver handlers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.disassemble_rva import disassemble_rva
          from genshinre.nativeprofile import PROFILE_71

          exe=Path("inputs/7.1.0-global/GenshinImpact.exe")
          targets={
              "22120":{"type_name":"IGNKDDIOJEO","handler":"LLCGIEDMIIG.HBCNAMCDHAH","rva":0xC257AF0},
              "24380":{"type_name":"HIADLALFEFD","handler":"LLCGIEDMIIG.DDABJLEOBCD","rva":0xC2433E0}
          }
          report={
              "status":"CANDIDATE_ONLY",
              "conditional_hypothesis":"Only if native pause response retains server descriptor retcode field 4 and is a one-int32 LLCGIEDMIIG inbound message",
              "sample_sha256":PROFILE_71.exe_sha256,
              "candidates":{}
          }
          for cmd,info in targets.items():
              disasm=disassemble_rva(exe,info["rva"],0x180,expected_sha256=PROFILE_71.exe_sha256,label=info["handler"])
              report["candidates"][cmd]={**info,"instructions":disasm["instructions"]}
              print("HANDLER",cmd,info["handler"])
              for insn in disasm["instructions"]:
                  print("  "+insn["rva"]+" "+insn["mnemonic"]+" "+insn["op_str"])
          output=Path("versions/7.1.0-global/windows-x64/analyses/amber-pause-ack/field4-receiver-candidates.json")
          output.write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish source-bound candidate handler disassembly
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/analyses/amber-pause-ack/field4-receiver-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record exact 7.1 field4 response candidate handlers'
            git push origin HEAD:research/amber-pause-ack-71
          fi
