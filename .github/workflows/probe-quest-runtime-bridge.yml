name: Probe 7.1 Quest runtime bridge

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-runtime-bridge.yml"

concurrency:
  group: probe-quest-runtime-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Trace LAIMPNDEFCL manager consumers
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-runtime-bridge.json \
            --focus consume-a:0x9F8C1B0 \
            --focus consume-b:0x9F92E10 \
            --focus consume-c:0x9F92F60 \
            --focus gpc-reader:0xCAB9080 \
            --max-body 0x10000 \
            | tee quest-runtime-bridge.txt

      - name: Resolve suspicious GPC runtime field types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-gpc-runtime-types.txt
          import csv
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          EXE = Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          GPC_TDI = 82662
          FOCUS = {662656, 662657, 662658}
          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          types = read_csv("types.csv")
          fields = read_csv("fields.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          gpc_fields = [r for r in fields if int(r["type_definition_index"]) == GPC_TDI]

          with PEImage(EXE) as image:
              base = image.image_base
              type_array_va = int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva, 8), "little"
              )

              def raw_by_index(index):
                  raw = image.read_rva(type_array_va + index * ENTRY_SIZE - base, ENTRY_SIZE)
                  if len(raw) != ENTRY_SIZE or not is_valid_type_entry(raw):
                      raise ValueError(f"bad runtime type index {index}")
                  return raw

              def raw_by_va(va):
                  raw = image.read_rva(va - base, ENTRY_SIZE)
                  if len(raw) != ENTRY_SIZE or not is_valid_type_entry(raw):
                      raise ValueError(f"bad runtime type VA 0x{va:X}")
                  return raw

              def describe(raw, depth=0):
                  d = decode_type_entry(raw)
                  kind = int(d["kind"])
                  data_u64 = int.from_bytes(raw[:8], "little")
                  out = {
                      "kind": d["kind_name"],
                      "kind_value": kind,
                      "data_u32": int(d["data_u32"]),
                      "data_u64": f"0x{data_u64:X}",
                      "raw": raw.hex(),
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(d["data_u32"])
                      out["type_definition_index"] = tdi
                      out["type"] = type_by_tdi.get(tdi, {})
                  elif kind in (0x0F, 0x10, 0x1D) and depth < 4:
                      nested = raw_by_va(data_u64)
                      out["target"] = describe(nested, depth + 1)
                  return out

              report = {"gpc_fields": [], "focus": {}}
              for ordinal, field in enumerate(gpc_fields):
                  idx = int(field["field_type_index"])
                  item = {
                      "ordinal": ordinal,
                      "field": field,
                      "runtime_type_index": idx,
                  }
                  if idx in FOCUS:
                      item["runtime_type"] = describe(raw_by_index(idx))
                  report["gpc_fields"].append(item)

              for idx in sorted(FOCUS):
                  report["focus"][str(idx)] = describe(raw_by_index(idx))

          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path("quest-gpc-runtime-types.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Find GPC source-to-runtime bridge candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-gpc-bridge-candidates.txt
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS = ("GPCFGOEJFJK", "FNJLMNMEKLN", "AFIOOHMJHDM", "LAIMPNDEFCL")

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          types = read_csv("types.csv")
          fields = read_csv("fields.csv")
          methods = read_csv("methods.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          methods_by_tdi = defaultdict(list)
          fields_by_tdi = defaultdict(list)
          for r in methods:
              methods_by_tdi[int(r["type_definition_index"])].append(r)
          for r in fields:
              fields_by_tdi[int(r["type_definition_index"])].append(r)

          mentions = []
          owner_tdis = set()
          for m in methods:
              sig = " ".join([
                  str(m.get("return_type", "")),
                  str(m.get("parameter_types", "")),
              ])
              if "GPCFGOEJFJK" not in sig:
                  continue
              tdi = int(m["type_definition_index"])
              owner_tdis.add(tdi)
              mentions.append({
                  "method": m,
                  "owner": type_by_tdi.get(tdi, {}),
                  "target_hits": [x for x in TARGETS if x in sig],
              })

          owners = []
          for tdi in sorted(owner_tdis):
              owned = methods_by_tdi[tdi]
              cross = []
              for m in owned:
                  sig = " ".join([
                      str(m.get("return_type", "")),
                      str(m.get("parameter_types", "")),
                  ])
                  hits = [x for x in TARGETS if x in sig]
                  if hits:
                      cross.append({"method": m, "target_hits": hits})
              owners.append({
                  "owner": type_by_tdi.get(tdi, {}),
                  "fields": fields_by_tdi.get(tdi, []),
                  "cross_methods": cross,
              })

          # Also preserve GPC's own methods, because a conversion may be an
          # instance method whose only explicit parameter is the destination.
          gpc_tdi = 82662
          result = {
              "signature_mentions": mentions,
              "owners": owners,
              "gpc_type": type_by_tdi[gpc_tdi],
              "gpc_fields": fields_by_tdi[gpc_tdi],
              "gpc_methods": methods_by_tdi[gpc_tdi],
          }
          print("signature_mentions=", len(mentions))
          for x in mentions:
              print("MENTION", json.dumps(x, ensure_ascii=False, sort_keys=True))
          print("owners=", len(owners))
          for x in owners:
              print("OWNER", json.dumps({
                  "owner": x["owner"],
                  "cross_methods": x["cross_methods"],
              }, ensure_ascii=False, sort_keys=True))
          print("GPC_METHODS")
          for m in methods_by_tdi[gpc_tdi]:
              print(json.dumps(m, ensure_ascii=False, sort_keys=True))

          Path("quest-gpc-bridge-candidates.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY' | tee quest-gpc-bridge-disasm-plan.txt
          import json
          from pathlib import Path
          d = json.loads(Path("quest-gpc-bridge-candidates.json").read_text())
          rows = []
          for x in d["signature_mentions"]:
              m=x["method"]
              r=(m.get("rva") or "").strip()
              if not r:
                  continue
              rows.append({
                  "label": f'{m.get("type_name")}.{m.get("method_name")}',
                  "rva": r,
                  "parameter_types": m.get("parameter_types"),
                  "return_type": m.get("return_type"),
                  "target_hits": x.get("target_hits"),
              })
          # Keep exact-scope candidates only; a second step can disassemble the
          # handful that actually bridge GPC to the established runtime types.
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          Path("quest-gpc-bridge-disasm-plan.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n"
          )
          PY
      - name: Disassemble GPC source-object methods and map shared fields
        shell: bash
        run: |
          set -euo pipefail

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-gpc-instance-methods.json \
            --focus gpc-init:0xCAB9010 \
            --focus gpc-postread:0xCABAC90 \
            --focus gpc-set-a:0xCABAD70 \
            --focus gpc-set-b:0xCABAE90 \
            --max-body 0x4000 \
            | tee quest-gpc-instance-methods.txt

          python - <<'PY' | tee quest-gpc-fnj-field-map.txt
          import csv
          import json
          import re
          from pathlib import Path

          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          GPC_TDI = 82662
          FNJ_TDI = 85802

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          fields = read_csv("fields.csv")
          gpc = [x for x in fields if int(x["type_definition_index"]) == GPC_TDI]
          fnj = [x for x in fields if int(x["type_definition_index"]) == FNJ_TDI]

          def size_align(field_type):
              if field_type in {"string", "kind_0x1D"}:
                  return 8, 8
              if field_type == "bool":
                  return 1, 1
              return 4, 4

          offset = 0x10
          gpc_layout = {}
          for ordinal, field in enumerate(gpc):
              size, align = size_align(field["field_type"])
              offset = (offset + align - 1) & ~(align - 1)
              gpc_layout[field["field_name"]] = {
                  "ordinal": ordinal,
                  "offset": offset,
                  "offset_hex": f"0x{offset:X}",
                  "field": field,
              }
              offset += size

          gn = {x["field_name"]: x for x in gpc}
          fn = {x["field_name"]: x for x in fnj}
          common = []
          for name in sorted(set(gn) & set(fn)):
              common.append({
                  "name": name,
                  "gpc": gpc_layout[name],
                  "fnj": fn[name],
              })

          methods = json.loads(Path("quest-gpc-instance-methods.json").read_text(encoding="utf-8"))
          touched = {}
          known_offsets = {v["offset"]: k for k, v in gpc_layout.items()}
          for label, item in methods["focus"].items():
              hits = []
              for ins in item.get("disassembly", []):
                  op = ins.get("op_str", "").lower()
                  for off, name in known_offsets.items():
                      # Match explicit object-relative field displacements. Keep
                      # this as evidence only; register provenance is inspected in
                      # the artifact before assigning semantics.
                      forms = {
                          f"+ 0x{off:x}]",
                          f"+ {off}]",
                      }
                      if any(form in op for form in forms):
                          hits.append({
                              "field": name,
                              "offset": f"0x{off:X}",
                              "instruction": ins,
                          })
              touched[label] = hits

          report = {
              "gpc_field_count": len(gpc),
              "fnj_field_count": len(fnj),
              "common_field_count": len(common),
              "common": common,
              "gpc_only": sorted(set(gn) - set(fn)),
              "fnj_only": sorted(set(fn) - set(gn)),
              "gpc_layout": gpc_layout,
              "method_field_hits": touched,
          }

          # Exact reader anchors prove the computed managed field layout before
          # it is used to label instance-method offsets.
          expected_anchors = {
              "PHDIEJAPFJO": 0x64,
              "KLMMPLDJAHJ": 0xA4,
              "NMNCIHHMLFP": 0x98,
              "GHHBGDKMJIC": 0x30,
              "DJADGDCICCB": 0x48,
          }
          for name, expected in expected_anchors.items():
              actual = gpc_layout[name]["offset"]
              if actual != expected:
                  raise AssertionError(
                      f"GPC layout anchor {name}: 0x{actual:X} != 0x{expected:X}"
                  )

          print("GPC fields", len(gpc), "FNJ fields", len(fnj), "common", len(common))
          for x in common:
              print(
                  "COMMON",
                  x["name"],
                  x["gpc"]["offset_hex"],
                  x["gpc"]["field"]["field_type"],
                  "FNJ",
                  x["fnj"]["field_type"],
              )
          print("GPC_ONLY", report["gpc_only"])
          print("FNJ_ONLY", report["fnj_only"])
          for label, hits in touched.items():
              print("METHOD", label)
              for hit in hits:
                  print(json.dumps(hit, ensure_ascii=False, sort_keys=True))

          Path("quest-gpc-fnj-field-map.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Assert evidence
        run: |
          test -s quest-runtime-bridge.json
          test -s quest-gpc-runtime-types.json
          test -s quest-gpc-bridge-candidates.json
          test -s quest-gpc-bridge-disasm-plan.json
          test -s quest-gpc-instance-methods.json
          test -s quest-gpc-fnj-field-map.json

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-runtime-bridge
          path: |
            quest-runtime-bridge.txt
            quest-runtime-bridge.json
            quest-gpc-runtime-types.txt
            quest-gpc-runtime-types.json
            quest-gpc-bridge-candidates.txt
            quest-gpc-bridge-candidates.json
            quest-gpc-bridge-disasm-plan.txt
            quest-gpc-bridge-disasm-plan.json
            quest-gpc-instance-methods.txt
            quest-gpc-instance-methods.json
            quest-gpc-fnj-field-map.txt
            quest-gpc-fnj-field-map.json
          if-no-files-found: error
