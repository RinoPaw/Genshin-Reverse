name: Temporary exact 7.1 chest scene path gate

on:
  push:
    paths:
      - '.github/workflows/research-chest-scene-index-71.yml'
      - 'scripts/probe-7.1-chest-scene-index.py'

permissions:
  contents: read

concurrency:
  group: original-71-chest-scene-index
  cancel-in-progress: true

jobs:
  scene-index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install maintained tooling
        run: python -m pip install -e . zstandard
      - name: Acquire exact official Global 7.1 Sophon design blocks
        run: |
          python scripts/fetch-7.1-design-blocks.py \
            --output inputs/design-blocks --report work/original-source.json
      - name: Verify pinned original AnimeStudio exporter
        run: |
          curl --fail --location --retry 3 \
            --output inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz
          echo "12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz" | sha256sum --check
      - name: Extract authentic source index with Quest/Gadget controls
        run: |
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks inputs/design-blocks \
            --cli-archive inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --work work/asset-export \
            --report work/chest-raw-controls.json
      - name: Audit historical scene-group path hypotheses in original design index
        run: |
          python scripts/probe-7.1-chest-scene-index.py \
            --index-raw work/asset-export/export-31049741/MiHoYoBinData/0000006f.dat \
            --output versions/7.1.0-global/analyses/progression/economy/7.1-chest-native-scene-index-hypotheses.json --check
      - name: Authenticate original SceneExcel and SceneTag exports
        run: |
          python scripts/audit-7.1-native-scene-entrypoints.py \
            --index-raw work/asset-export/export-31049741/MiHoYoBinData/0000006f.dat \
            --block-export work/asset-export/export-25539185 \
            --output versions/7.1.0-global/analyses/progression/economy/7.1-chest-scene-native-excel-entrypoints.json --check
      - name: Retain source evidence without publishing original asset bytes
        uses: actions/upload-artifact@v7
        with:
          name: original-global-71-chest-scene-index-hypotheses
          path: |
            work/original-source.json
          if-no-files-found: error
          retention-days: 2
