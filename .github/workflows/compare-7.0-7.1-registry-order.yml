name: Compare 7.0 and 7.1 protocol registry order

on:
  push:
    paths:
      - '.github/workflows/compare-7.0-7.1-registry-order.yml'
      - 'tools/compare_registry_order_70_71.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch published 7.0 packetIds
        run: |
          curl --fail --location \
            'https://raw.githubusercontent.com/kuma-dayo/protos/main/7.0.0/packetIds.json' \
            -o /tmp/packetIds-7.0.json

      - name: Compare semantic control order
        run: |
          python tools/compare_registry_order_70_71.py \
            /tmp/packetIds-7.0.json \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            /tmp/registry-order-70-71.json \
            --pair UnlockTransPointReq:8813:9369 \
            --pair GetScenePointReq:26108:1649 \
            --pair GetScenePointRsp:6529:26 \
            --pair SceneTransToPointReq:1837:1252 \
            --pair SceneTransToPointRsp:4731:23515 \
            --pair EnterWorldAreaReq:26017:25407 \
            --pair EnterWorldAreaRsp:24557:6774 \
            --pair ScenePointUnlockNotify:7929:25567 \
            --pair SceneAreaUnlockNotify:5912:27420 \
            --pair GetSceneAreaReq:1014:24721 \
            --pair GetSceneAreaRsp:4722:23366 \
            --old-target 1776 \
            --candidate 36641 \
            --candidate 20290 \
            --candidate 2666

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-order-70-71
          path: /tmp/registry-order-70-71.json
