name: One-shot original 7.1 Scene Point reader producer direct method proof (source path corrected)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-71-reader-producers.yml'

permissions:
  contents: read

jobs:
  original-native-callees:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source-verification requirements
        run: python -m pip install -e . capstone zstandard
      - name: Fetch pinned original Global 7.1 client bytes
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Examine original provider native callees and declarations
        run: |
          python scripts/probe-7.1-point-parent-loader-callees.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-parent-native-pre-input-callees.json \
            --output work/7.1-original-parent-data-producer-callees.json
      - name: Log complete source report
        run: |
          echo ORIGINAL_71_PARENT_LOADER_COMPLETE_BEGIN
          cat work/7.1-original-parent-data-producer-callees.json
          echo ORIGINAL_71_PARENT_LOADER_COMPLETE_END
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-parent-data-producer-callee-proof
          path: work/7.1-original-parent-data-producer-callees.json
          retention-days: 7
          if-no-files-found: error
