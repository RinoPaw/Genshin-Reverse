name: Probe original 7.1 Gadget auxiliary count loaders

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-7.1-gadget-aux-headers.yml']

permissions:
  contents: read

concurrency:
  group: research-71-gadget-aux-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard capstone
      - name: Acquire original hash-pinned client and Sophon blocks
        run: |
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
          python scripts/fetch-7.1-design-blocks.py --output work/blocks
          curl --fail --location --retry 3 \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --output work/animestudio.tar.gz
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks work/blocks --cli-archive work/animestudio.tar.gz \
            --work work/export --report work/source-verification.json
      - name: Check exact original native count-transform sites
        run: |
          python scripts/probe-7.1-gadget-aux-loaders.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --exports work/export/export-25539185/MiHoYoBinData \
            --output work/gadget-aux-count-probe.json
      - name: Disassemble both original candidate loader entrypoints
        run: |
          EXPECTED_SHA=$(python -c "from genshinre.nativeprofile import PROFILE_71;print(PROFILE_71.exe_sha256)")
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe \
            0x124F2CF0 0x320 --expected-sha256 "$EXPECTED_SHA" \
            --output work/gadget-prop-loader-disassembly.json > /dev/null
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe \
            0x11072FA0 0x320 --expected-sha256 "$EXPECTED_SHA" \
            --output work/gadget-interact-loader-disassembly.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for label, file in [
              ("GadgetPropExcel", "work/gadget-prop-loader-disassembly.json"),
              ("GadgetInteractExcel", "work/gadget-interact-loader-disassembly.json"),
          ]:
              data = json.loads(Path(file).read_text(encoding="utf-8"))
              print("ORIGINAL_LOADER_BEGIN", label, data["start_rva"])
              for row in data["instructions"][:125]:
                  print(row["rva"], row["bytes"], row["mnemonic"], row["op_str"])
                  if row["mnemonic"] == "ret":
                      break
              print("ORIGINAL_LOADER_END", label)
          PY
      - name: Verify native Gadget auxiliary loader ownership and original source
        run: |
          python scripts/audit-7.1-gadget-aux-native-loaders.py \
            --prop-disasm work/gadget-prop-loader-disassembly.json \
            --interact-disasm work/gadget-interact-loader-disassembly.json \
            --exports work/export/export-25539185/MiHoYoBinData \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/gadget-aux-native-evidence.json
          cat work/gadget-aux-native-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-aux-count-probe
          path: |
            work/gadget-aux-native-evidence.json
            work/gadget-aux-count-probe.json
            work/gadget-prop-loader-disassembly.json
            work/gadget-interact-loader-disassembly.json
          retention-days: 7
          if-no-files-found: error
