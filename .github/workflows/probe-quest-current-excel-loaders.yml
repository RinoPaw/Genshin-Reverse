name: Probe 7.1 current Quest Excel loaders

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-current-excel-loaders.yml"

concurrency:
  group: probe-quest-current-excel-loaders-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Locate Quest Excel path literal xrefs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-current-excel-xrefs.txt
          import bisect,csv,json,struct
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT=Path("versions/7.1.0-global/windows-x64/metadata")
          require_sha256(EXE,PROFILE_71.exe_sha256,label="executable")

          literals={
              "MainQuestExcelConfigData":{
                  "index":51971,
                  "value":"Data/_ExcelBinOutput/MainQuestExcelConfigData",
              },
              "RandomQuestExcelConfigData":{
                  "index":41646,
                  "value":"Data/_ExcelBinOutput/RandomQuestExcelConfigData",
              },
              "RandomMainQuestExcelConfigData":{
                  "index":80316,
                  "value":"Data/_ExcelBinOutput/RandomMainQuestExcelConfigData",
              },
          }
          SLOT_BASE=0x59D9260
          for v in literals.values():
              v["slot_rva"]=SLOT_BASE+v["index"]*8

          with (ROOT/"methods.csv").open("r",encoding="utf-8-sig",newline="") as fh:
              methods=list(csv.DictReader(fh))
          starts=[]; by={}
          for row in methods:
              try:r=int(row.get("rva") or "0",0)
              except ValueError:continue
              if r:
                  starts.append(r); by.setdefault(r,[]).append(row)
          starts=sorted(set(starts))

          def compact(rows):
              return [{
                  "method_index":x.get("method_index"),
                  "type_name":x.get("type_name"),
                  "method_name":x.get("method_name"),
                  "parameter_types":x.get("parameter_types"),
                  "return_type":x.get("return_type"),
                  "type_definition_index":x.get("type_definition_index"),
                  "rva":x.get("rva"),
              } for x in rows]

          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i]; e=starts[i+1] if i+1<len(starts) else s+0x10000
              if not(s<=rva<e):return None
              return {"start":s,"end":e,"metadata":compact(by[s])}

          # RIP-rel MOV/LEA forms with 3-byte opcode prefix + rel32.
          prefixes={
              bytes.fromhex(x) for x in (
                  "488b05","488b0d","488b15","488b1d","488b25","488b2d","488b35","488b3d",
                  "4c8b05","4c8b0d","4c8b15","4c8b1d",
                  "488d05","488d0d","488d15","488d1d","488d25","488d2d","488d35","488d3d",
                  "4c8d05","4c8d0d","4c8d15","4c8d1d",
              )
          }

          report={"literals":literals,"hits":{},"owners":[]}
          with PEImage(EXE) as image:
              base=image.image_base
              targets={base+v["slot_rva"]:name for name,v in literals.items()}
              found={name:[] for name in literals}
              for sec in image.sections:
                  if not(sec.characteristics & 0x20000000):
                      continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  for off in range(max(0,len(blob)-7)):
                      if blob[off:off+3] not in prefixes:
                          continue
                      disp=struct.unpack_from("<i",blob,off+3)[0]
                      rva=sec.virtual_address+off
                      target=base+rva+7+disp
                      name=targets.get(target)
                      if name:
                          found[name].append({
                              "rva":rva,
                              "section":sec.name,
                              "bytes":blob[off:off+7].hex(),
                              "owner":owner(rva),
                          })
              report["hits"]=found

              md=Cs(CS_ARCH_X86,CS_MODE_64)
              seen=set()
              for name,hits in found.items():
                  print("\n===",name,"slot",hex(literals[name]["slot_rva"]),"===")
                  print("xref_count",len(hits))
                  for h in hits:
                      print("XREF",hex(h["rva"]),json.dumps(h["owner"],ensure_ascii=False))
                      ow=h["owner"]
                      if not ow or ow["start"] in seen:
                          continue
                      seen.add(ow["start"])
                      start=ow["start"]; end=min(ow["end"],start+0x5000)
                      rows=[]
                      for ins in md.disasm(image.read_rva(start,end-start),base+start):
                          irva=ins.address-base
                          rows.append({
                              "rva":f"0x{irva:X}",
                              "bytes":ins.bytes.hex(),
                              "mnemonic":ins.mnemonic,
                              "op_str":ins.op_str,
                          })
                      item={"literal":name,"owner":ow,"instructions":rows}
                      report["owners"].append(item)
                      print("OWNER",f"0x{start:X}",json.dumps(ow["metadata"],ensure_ascii=False))
                      for x in rows:
                          if x["mnemonic"] in {
                              "call","jmp","je","jne","ja","jae","jb","jbe",
                              "mov","lea","add","sub","xor","or","and","cmp","test",
                              "imul","shl","shr","sar","inc","dec"
                          }:
                              print(x["rva"],x["mnemonic"],x["op_str"])

          Path("quest-current-excel-xrefs.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-current-excel-loaders
          path: |
            quest-current-excel-xrefs.txt
            quest-current-excel-xrefs.json
          if-no-files-found: error
