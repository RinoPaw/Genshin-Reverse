name: Temporary original 7.1 scene native strings

on:
  push:
    paths:
      - '.github/workflows/research-scene-native-strings-71.yml'
      - 'scripts/probe-7.1-scene-native-string-leads.py'

permissions:
  contents: read

concurrency:
  group: research-scene-native-strings-71
  cancel-in-progress: true

jobs:
  native-strings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install maintained source tools
        run: python -m pip install -e . zstandard
      - name: Fetch pinned original 7.1 executable and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Probe exact SceneExcel, SceneTag, scene group and drop_tag literals
        run: |
          python scripts/probe-7.1-scene-native-string-leads.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/scene-native-string-leads.json
      - name: Retain brief native evidence only
        uses: actions/upload-artifact@v7
        with:
          name: global-71-scene-native-string-leads
          path: work/scene-native-string-leads.json
          if-no-files-found: error
          retention-days: 2
