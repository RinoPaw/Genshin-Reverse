name: Probe Quest 7.1 community sibling coverage

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-community-siblings.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned sibling resources
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" sha="$3"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set 'BinOutput/Quest/*.json'
            git -C "$dir" checkout "$sha"
          }
          fetch_repo https://github.com/DimbreathBot/AnimeGameData.git /tmp/raw71 792978e5503ecfba73dcb3562ed44a0d35a2abe2
          fetch_repo https://github.com/capyb2222/LunaGC-Resources.git /tmp/capyb 395a5ee6442142a803691f60d541ee1706ae9cd7
          fetch_repo https://github.com/invoker-bot/LunaGC-Resources.git /tmp/invoker e2c1d3ca53ec7b6add27cf6f46ac9d1c377dc5f7

      - name: Compare Quest row coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-community-siblings.txt
          import json
          from collections import Counter
          from pathlib import Path

          def load_raw(root):
              out={}
              for p in Path(root).glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("JIJKODHIEED",[])
                  if not isinstance(seq,list):continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("NFGFDHPPBIF"),int):
                          out[r["NFGFDHPPBIF"]]=r
              return out

          def load_normal(root):
              out={}
              for p in Path(root).glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("subQuests",[])
                  if not isinstance(seq,list):continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("subId"),int):
                          out[r["subId"]]=r
              return out

          def meaningful(v,field):
              if not isinstance(v,list):return []
              out=[]
              for x in v:
                  if not isinstance(x,dict) or not x.get("type"):continue
                  if field=="acceptCond" and x.get("type")=="QUEST_COND_UNKNOWN":
                      continue
                  out.append(x)
              return out

          raw=load_raw("/tmp/raw71/BinOutput/Quest")
          cap=load_normal("/tmp/capyb/BinOutput/Quest")
          inv=load_normal("/tmp/invoker/BinOutput/Quest")
          sr,sc,si=set(raw),set(cap),set(inv)

          print("ROWS",{"raw":len(sr),"capyb":len(sc),"invoker":len(si)})
          print("INV_ONLY_VS_CAPYB",len(si-sc))
          print("CAPYB_ONLY_VS_INV",len(sc-si))
          print("RAW_MISSING_CAPYB",len(sr-sc))
          print("RAW_MISSING_INVOKER",len(sr-si))
          print("INV_FILLS_CAPYB_RAW_GAP",len((si-sc)&sr))
          print("CAPYB_FILLS_INV_RAW_GAP",len((sc-si)&sr))

          for field in ("acceptCond","beginExec"):
              stats=Counter()
              extra=[]
              conflicts=[]
              for sid in sorted(sr):
                  a=meaningful(cap.get(sid,{}).get(field),field)
                  b=meaningful(inv.get(sid,{}).get(field),field)
                  if a:stats["capyb_nonempty"]+=1
                  if b:stats["invoker_nonempty"]+=1
                  if a==b:stats["equal"]+=1
                  else:
                      stats["different"]+=1
                      if b and not a:
                          stats["invoker_adds_value"]+=1
                          if len(extra)<100:extra.append({"subId":sid,"value":b})
                      if a and b and len(conflicts)<50:
                          conflicts.append({"subId":sid,"capyb":a,"invoker":b})
              print("\nFIELD",field,dict(stats))
              print("invoker_add_examples",json.dumps(extra,ensure_ascii=False,indent=2))
              print("conflict_examples",json.dumps(conflicts,ensure_ascii=False,indent=2))

          missing_cap=sorted(sr-sc)
          missing_inv=sorted(sr-si)
          print("\nRAW_MISSING_CAPYB_IDS",missing_cap)
          print("RAW_MISSING_INVOKER_IDS",missing_inv)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-community-siblings
          path: quest71-community-siblings.txt
          if-no-files-found: error
