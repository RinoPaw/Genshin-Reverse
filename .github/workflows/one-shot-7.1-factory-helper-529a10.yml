name: One-shot original 7.1 factory helper native audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-factory-helper-529a10.yml'
      - 'scripts/probe-7.1-point-factory-helper-529a10.py'

permissions:
  contents: read

jobs:
  original-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source binary auditor
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify original shared helper source
        run: |
          python scripts/probe-7.1-point-factory-helper-529a10.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-point-factory-case-1-14-local-native-paths.json \
            --output work/7.1-original-shared-factory-helper-529a10.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-shared-factory-helper-529a10
          path: work/7.1-original-shared-factory-helper-529a10.json
          retention-days: 7
          if-no-files-found: error
