name: Probe QuestExcel 7.1 guide helper

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-questexcel71-guide-helper.yml"

concurrency:
  group: probe-questexcel71-guide-helper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone pefile zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Checkout pinned binconfig analyzer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/genshin-7.0-local-re-devkit
          git clone --filter=blob:none https://github.com/owomocha/genshin-7.0-local-re-devkit.git /tmp/genshin-7.0-local-re-devkit
          git -C /tmp/genshin-7.0-local-re-devkit checkout --detach fb91dfad1f6047e30dea2f98727e5af45d9bd6e0
      - name: Disassemble guide helper and dump exact metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-guide-helper.txt
          import bisect, csv, json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS=[0xFD53090,0xB8B0230,0xB208D40,0x1168F230,0x11E96800,0xA11B400,0xCF246E0]
          NAMES={"OOPFBIEAILL","NBLEHPOBCEB","KPHLFFOELCG","HCFAOAJBPHB","LNNJKAPJIEH"}

          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))

          methods=rows("methods.csv")
          fields=rows("fields.csv")
          types=rows("types.csv")
          type_by_tdi={int(x["type_definition_index"]):x for x in types}
          methods_by_rva={}
          starts=[]
          for m in methods:
              try:r=int(m.get("rva") or "0",0)
              except Exception:continue
              if r:
                  methods_by_rva.setdefault(r,[]).append(m)
                  starts.append(r)
          starts=sorted(set(starts))

          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i]
              e=starts[i+1] if i+1<len(starts) else s+0x1000
              return {"start":s,"end":e,"methods":methods_by_rva.get(s,[])}

          wanted_types={}
          for t in types:
              if t.get("type_name") in NAMES:
                  wanted_types[int(t["type_definition_index"])]=t

          print("=== TYPES ===")
          for tdi,t in sorted(wanted_types.items()):
              print(json.dumps(t,ensure_ascii=False))

          print("=== FIELDS ===")
          for f in fields:
              try:tdi=int(f["type_definition_index"])
              except Exception:continue
              if tdi in wanted_types:
                  print(json.dumps(f,ensure_ascii=False))

          print("=== NBLE FIELD OWNERS ===")
          parent_tdis=set()
          for f in fields:
              if f.get("field_type")!="NBLEHPOBCEB":
                  continue
              try:ptdi=int(f["type_definition_index"])
              except Exception:continue
              parent_tdis.add(ptdi)
              print(json.dumps({
                  "field":f,
                  "owner_type":type_by_tdi.get(ptdi),
              },ensure_ascii=False))
          for ptdi in sorted(parent_tdis):
              print("OWNER METHODS",json.dumps({
                  "type":type_by_tdi.get(ptdi),
                  "methods":[m for m in methods if int(m.get("type_definition_index") or -1)==ptdi],
              },ensure_ascii=False))

          print("=== METHODS ===")
          for m in methods:
              try:tdi=int(m["type_definition_index"])
              except Exception:continue
              if tdi in wanted_types:
                  print(json.dumps(m,ensure_ascii=False))

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          md.detail=True
          report={"targets":{}}
          with PEImage(EXE) as image:
              base=image.image_base
              for target in TARGETS:
                  ow=owner(target)
                  if not ow:
                      raise SystemExit(f"no owner for 0x{target:X}")
                  start=ow["start"]
                  end=min(ow["end"],start+0x1800)
                  body=image.read_rva(start,end-start)
                  insns=list(md.disasm(body,base+start))
                  out=[]
                  for ins in insns:
                      rec={
                          "rva":f"0x{ins.address-base:X}",
                          "bytes":ins.bytes.hex(),
                          "mnemonic":ins.mnemonic,
                          "op_str":ins.op_str,
                      }
                      if ins.mnemonic=="call" and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          tr=int(ins.operands[0].imm-base)
                          rec["call_target"]=f"0x{tr:X}"
                          rec["call_owner"]=owner(tr)
                      out.append(rec)
                  report["targets"][f"0x{target:X}"]={
                      "owner_start":f"0x{start:X}",
                      "owner_end":f"0x{ow['end']:X}",
                      "metadata":ow["methods"],
                      "instructions":out,
                  }
                  print(f"=== DISASM 0x{target:X} owner 0x{start:X}..0x{ow['end']:X} ===")
                  for rec in out:
                      suffix=""
                      if "call_target" in rec:
                          meth=(rec["call_owner"] or {}).get("methods",[])
                          names=[f"{x.get('type_name')}.{x.get('method_name')}{x.get('parameter_types')}" for x in meth]
                          suffix=" -> "+rec["call_target"]+" "+repr(names)
                      print(rec["rva"],rec["bytes"],rec["mnemonic"],rec["op_str"]+suffix)

          # Exact QuestExcel guide-string fingerprint recovered from native rows.
          GUIDE_STRING_QWORD_ADD=0xFE73512F02263E11
          GUIDE_STRING_LEN_XOR=0x3E11
          key=GUIDE_STRING_QWORD_ADD.to_bytes(8,"little")
          fingerprint=[]
          seen=set()
          with PEImage(EXE) as image:
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  at=0
                  while True:
                      x=blob.find(key,at)
                      if x<0:
                          break
                      rva=sec.virtual_address+x
                      ow=owner(rva)
                      ident=None if ow is None else ow["start"]
                      if ident not in seen:
                          seen.add(ident)
                          fingerprint.append({
                              "hit_rva":f"0x{rva:X}",
                              "owner":ow,
                          })
                      at=x+1
          report["guide_string_fingerprint"]={
              "length_xor":f"0x{GUIDE_STRING_LEN_XOR:04X}",
              "qword_add":f"0x{GUIDE_STRING_QWORD_ADD:016X}",
              "owners":fingerprint,
          }
          print("=== GUIDE STRING FINGERPRINT ===")
          print(json.dumps(report["guide_string_fingerprint"],ensure_ascii=False,indent=2))

          # Find direct E8 rel32 callers without disassembling every method.
          target=0x1168F230
          callers=[]
          with PEImage(EXE) as image:
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  off=0
                  while True:
                      off=blob.find(b"\\xE8",off)
                      if off<0 or off+5>len(blob):
                          break
                      rel=int.from_bytes(blob[off+1:off+5],"little",signed=True)
                      call_rva=sec.virtual_address+off
                      if call_rva+5+rel==target:
                          ow=owner(call_rva)
                          callers.append({
                              "caller_rva":None if ow is None else f"0x{ow['start']:X}",
                              "call_rva":f"0x{call_rva:X}",
                              "metadata":[] if ow is None else ow["methods"],
                          })
                      off+=1
          report["guide_reader_callers"]=callers
          print("=== GUIDE READER CALLERS ===")
          print(json.dumps(callers,ensure_ascii=False,indent=2))

          Path("questexcel71-guide-helper.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Extract NBLEHPOBCEB native schema
        shell: bash
        env:
          PYTHONPATH: /tmp/genshin-7.0-local-re-devkit/src:/tmp/genshin-7.0-local-re-devkit/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-guide-schema.txt
          import csv,json
          from pathlib import Path
          from genshin_re import binconfig as BC
          import gamedata_binconfig_ext as EXT

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS=[0xB208D40,0x1168F230,0x11E96800,0xA11B400,0xCF246E0]

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))

          methods=rows("methods.csv")
          deser={}
          one_by_class={}
          for m in methods:
              try:rva=int(m.get("rva") or "0",0)
              except Exception:continue
              if not rva:continue
              try:params=json.loads(m.get("parameter_types") or "[]")
              except Exception:continue
              if not params or params[0]!="FNIAHJGHFAK":continue
              cls=m.get("type_name") or "?"
              deser[rva]=(cls,m.get("method_name") or "?",str(params))
              if len(params)==1:
                  ret=(m.get("return_type") or "").lower()
                  pr=0 if m.get("method_name")=="FromBinaryInner" else (1 if ret=="void" else 2)
                  prev=one_by_class.get(cls)
                  if prev is None or pr<prev[0]:
                      one_by_class[cls]=(pr,rva)

          row_deser={cls:rva for cls,(_pr,rva) in one_by_class.items()}
          exe=BC.Exe(str(EXE))
          EXT.install(exe,deser,row_deser,clsfields={},deser1=row_deser)
          EXT.install2()
          schemas={}
          for target in TARGETS:
              try:
                  schema=BC.build(exe,target,deser,cache={})
              except Exception as exc:
                  schema={"error":repr(exc)}
              schemas[f"0x{target:X}"]=schema
              print(f"=== SCHEMA 0x{target:X} ===")
              print(json.dumps(schema,ensure_ascii=False,indent=2))
          Path("questexcel71-guide-schema.json").write_text(
              json.dumps(schemas,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Locate QuestExcel guideHint source reader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-guidehint-reader.txt
          import bisect,csv,json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          QWORD_SUB=0xE0AD7FB32B279A2B
          LEN_XOR=0x65D5
          require_sha256(EXE,PROFILE_71.exe_sha256,label="executable")

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))
          methods=rows("methods.csv"); fields=rows("fields.csv"); types=rows("types.csv")
          tb={int(x["type_definition_index"]):x for x in types}
          starts=[]; by={}
          for m in methods:
              try:r=int(m.get("rva") or "0",0)
              except Exception:continue
              if r:
                  starts.append(r); by.setdefault(r,[]).append(m)
          starts=sorted(set(starts))
          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i]; e=starts[i+1] if i+1<len(starts) else s+0x1000
              if not(s<=rva<e):return None
              meta=by.get(s,[])
              tdis=sorted({int(x["type_definition_index"]) for x in meta if x.get("type_definition_index")})
              return {
                  "start":s,"end":e,"methods":meta,
                  "types":[tb.get(x,{}) for x in tdis],
                  "fields":[f for f in fields if int(f.get("type_definition_index") or -1) in tdis],
              }

          key=QWORD_SUB.to_bytes(8,"little")
          hits=[]
          with PEImage(EXE) as image:
              for sec in image.sections:
                  if not(sec.characteristics & 0x20000000):continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  at=0
                  while True:
                      x=blob.find(key,at)
                      if x<0:break
                      rva=sec.virtual_address+x
                      hits.append({"rva":f"0x{rva:X}","owner":owner(rva)})
                      at=x+1
          print("QWORD_SUB",f"0x{QWORD_SUB:016X}","hits",len(hits))
          print(json.dumps(hits,ensure_ascii=False,indent=2))
          Path("questexcel71-guidehint-reader.json").write_text(
              json.dumps({"qword_sub":f"0x{QWORD_SUB:016X}","len_xor":f"0x{LEN_XOR:04X}","hits":hits},
                         ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Find native guideHint-shaped reader types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-guidehint-types.txt
          import csv,json
          from collections import defaultdict
          from pathlib import Path
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))
          types=rows("types.csv"); fields=rows("fields.csv"); methods=rows("methods.csv")
          fb=defaultdict(list); mb=defaultdict(list)
          for f in fields: fb[int(f["type_definition_index"])].append(f)
          for m in methods: mb[int(m["type_definition_index"])].append(m)
          out=[]
          for t in types:
              tdi=int(t["type_definition_index"]); ff=fb.get(tdi,[])
              ftypes=[x.get("field_type") or "" for x in ff]
              strings=sum(x=="string" for x in ftypes)
              hint=sum("QuestGuideHintType" in x for x in ftypes)
              if strings<2 or hint<1: continue
              readers=[]
              for m in mb.get(tdi,[]):
                  try:params=json.loads(m.get("parameter_types") or "[]")
                  except Exception:continue
                  if params and params[0]=="FNIAHJGHFAK":
                      readers.append(m)
              if not readers:continue
              out.append({"type":t,"fields":ff,"readers":readers})
          print("candidates",len(out))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("questexcel71-guidehint-types.json").write_text(
              json.dumps({"candidates":out},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: questexcel71-guide-helper
          path: |
            questexcel71-guide-helper.txt
            questexcel71-guide-helper.json
            questexcel71-guidehint-reader.txt
            questexcel71-guidehint-reader.json
            questexcel71-guidehint-types.txt
            questexcel71-guidehint-types.json
          if-no-files-found: error