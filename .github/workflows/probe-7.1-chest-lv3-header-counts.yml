name: Temporary original 7.1 audio chest full native wire verification
on:
  push:
    paths:
      - '.github/workflows/probe-7.1-chest-lv3-header-counts.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: native-chest-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-pinned-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard
      - name: Check exact Audio row wire decoder regression tests
        run: python -m unittest tests.test_chest_audio_native_rows_71 -v
      - name: Reacquire SHA-256-verified original Global 7.1 Sophon blocks
        run: python scripts/fetch-7.1-design-blocks.py --output work/blocks
      - name: Fetch pinned Raw exporter
        run: |
          mkdir -p work
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --output work/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz
      - name: Verify Quest and Gadget original Raw positive controls
        run: |
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks work/blocks \
            --cli-archive work/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --work work/export \
            --report work/source-control.json > /dev/null
      - name: Decode original Audio chest rows from source bytes
        run: |
          python scripts/audit-7.1-chest-audio-native-rows.py \
            --audio-raw work/export/export-25539185/MiHoYoBinData/5560e262.dat \
            --output work/original-71-audio-chest-rows.json
      - name: Publish bounded original Audio row findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('work/original-71-audio-chest-rows.json').read_text())
          lines=[
            'Original Global 7.1 Audio chest source-wire decode (#31)',
            '',
            f'- Exact sample source: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
            f'- Raw source SHA-256: {report["sourceRawSha256"]}',
            f'- Original table count: {report["nativeHeaderCount"]}; parsed rows: {report["decodedRecords"]}; bytes consumed: {report["bytesConsumed"]}/{report["payloadBytes"]}',
            f'- Original class-value histogram: {report["nativeClassScalarHistogram"]}',
            f'- Source mask histogram: {report["maskLow16Histogram"]}',
            f'- Unique decoded pre-wrapper Gadget key scalars: {report["uniquePreWrapperGadgetKeyScalars"]}',
            f'- First 4 native pre-wrapper keys: {[r["gadgetIdPreWrapperScalar"] for r in report["firstRecords"][:4]]}',
            'No original runtime wrapper round trip/vtable registration or server chest reward grade, drop_tag, item amounts or rates are yet proven.',
          ]
          Path('work/chest-audio-wire-comment.md').write_text(chr(10).join(lines)+chr(10),encoding='utf-8')
          PY
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file work/chest-audio-wire-comment.md
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-audio-chest-full-wire-evidence
          path: work/original-71-audio-chest-rows.json
          if-no-files-found: error
          retention-days: 3
