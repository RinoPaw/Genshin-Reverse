name: Temporary exact 7.1 chest table loader disassembly
on:
  push:
    paths:
      - '.github/workflows/probe-7.1-chest-lv3-header-counts.yml'
      - 'scripts/audit-7.1-chest-native-loaders.py'
      - 'scripts/audit-7.1-chest-native-loaders.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: native-chest-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-7-1-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard capstone
      - name: Check native disassembly assertions
        run: python -m unittest tests.test_chest_native_loaders_71 -v
      - name: Fetch exact SHA-256-pinned Global 7.1 EXE
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Audit original native table loader and row-reader candidates
        run: |
          python scripts/audit-7.1-chest-native-loaders.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --output work/chest-original-native-loader-disassembly.json
      - name: Publish bounded evidence in issue 31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('work/chest-original-native-loader-disassembly.json').read_text())
          lines=[
            'Original Global 7.1 chest audio/investigation loader aligned native disassembly (#31)',
            '',
            f'- Source: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
            f'- Source executable SHA-256: {r["originalExeSha256"]}',
          ]
          for key,reg in r['regions'].items():
            lines.append(f'- {key}: entry={reg["candidateMethodEntryRva"]}, count transform={reg["fixedCountHypothesisFromHeaderAndNativeXor"]}, native MOV/XOR instruction anchors verified={reg["nativeCountInstructionAnchorsVerified"]}, vtable +0xF0 callsites in bounded region={reg["observedVirtualF0CallsInWindow"]}')
          lines.append('These aligned native instructions and candidate row method still need runtime row class/vtable attribution and complete exact source-asset byte consumption. No chest grade, scene location or server reward is claimed.')
          Path('work/chest-native-method-comment.md').write_text(chr(10).join(lines)+chr(10), encoding='utf-8')
          PY
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file work/chest-native-method-comment.md
      - uses: actions/upload-artifact@v7
        with:
          name: exact-71-chest-native-loader-disassembly
          path: work/chest-original-native-loader-disassembly.json
          if-no-files-found: error
          retention-days: 3
