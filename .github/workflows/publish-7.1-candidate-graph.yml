name: Publish 7.1 GetCmdId candidate graph

on:
  push:
    paths:
      - '.github/workflows/publish-7.1-candidate-graph.yml'
      - 'genshinre/getcmdidgraph.py'
      - 'versions/7.1.0-global/windows-x64/registry/getcmdid-candidates.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GetCmdId candidate graph
        run: |
          ROOT=versions/7.1.0-global/windows-x64/registry
          python -m genshinre.getcmdidgraph \
            "$ROOT/getcmdid-candidates.csv" \
            "$ROOT/getcmdid-candidate-graph.csv" \
            "$ROOT/getcmdid-candidate-graph.summary.json" \
            --anchor-cmd-id 26105 \
            --anchor-type HJDNCHODGOL \
            --anchor-rva 0x10587260 \
            --focus 186,9369,22899,26105
      - name: Commit generated graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/getcmdid-candidate-graph.csv \
                  versions/7.1.0-global/windows-x64/registry/getcmdid-candidate-graph.summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: publish 7.1 GetCmdId candidate graph'
          git pull --rebase origin main
          git push origin HEAD:main
