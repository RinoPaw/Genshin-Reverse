name: Temporary exact Gadget reader caller trace

on:
  push:
    paths:
      - '.github/workflows/research-gadget-reader-callers-71.yml'

permissions:
  contents: read

concurrency:
  group: research-gadget-reader-callers-71
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing reverse engineering package
        run: python -m pip install -e . zstandard
      - name: Fetch the exact SHA-256-pinned Global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace exact Gadget reader direct calls and function-pointer holders
        run: |
          python scripts/probe-7.1-gadget-reader-callers.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/gadget-reader-callers.json
      - name: Preserve bounded xref evidence
        uses: actions/upload-artifact@v7
        with:
          name: pinned-7.1-gadget-reader-caller-xrefs
          path: work/gadget-reader-callers.json
          if-no-files-found: error
          retention-days: 2
