name: Temporary exact Gadget inherited reader

on:
  push:
    paths:
      - '.github/workflows/research-gadget-reader-callers-71.yml'

permissions:
  contents: read

concurrency:
  group: research-gadget-reader-callers-71
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install maintained tools
        run: python -m pip install -e . zstandard capstone
      - name: Fetch exact 7.1 Global executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Identify metadata method owning inherited Gadget reader
        run: |
          mkdir -p work
          python - <<'PY'
          import json
          from pathlib import Path
          from genshinre.callxref import attach_caller_methods
          src=Path("versions/7.1.0-global/windows-x64/metadata/methods.csv")
          lookup=attach_caller_methods([0xBD56F60],src,max_method_body=0x10000)
          methods=lookup.get(0xBD56F60,[])
          print(json.dumps(methods,indent=2))
          Path("work/gadget-inherited-reader-metadata.json").write_text(
              json.dumps({"targetRva":"0xBD56F60","candidateMetadataMethods":methods},
                         indent=2)+"\n")
          PY
      - name: Disassemble inherited native reader
        run: |
          expected_sha=$(python -c 'from genshinre.nativeprofile import PROFILE_71;print(PROFILE_71.exe_sha256)')
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe 0xBD56F60 0x2000 \
            --expected-sha256 "$expected_sha" --label inherited-Gadget-reader \
            --output work/gadget-inherited-reader.json > /dev/null
      - name: Disassemble native Gadget key conversion helpers
        run: |
          expected_sha=$(python -c 'from genshinre.nativeprofile import PROFILE_71;print(PROFILE_71.exe_sha256)')
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe 0xBB16020 0x400 \
            --expected-sha256 "$expected_sha" --label Gadget-native-u32-wrapper \
            --output work/gadget-native-u32-wrapper.json > /dev/null
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe 0xBB15F50 0x300 \
            --expected-sha256 "$expected_sha" --label Gadget-native-map-key \
            --output work/gadget-native-map-key.json > /dev/null
      - name: Disassemble and validate exact Gadget table loader evidence
        run: |
          expected_sha=$(python -c 'from genshinre.nativeprofile import PROFILE_71;print(PROFILE_71.exe_sha256)')
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe 0x968F690 0x1000 \
            --expected-sha256 "$expected_sha" --label Gadget-caller-197827 \
            --output work/gadget-caller-197827.json > /dev/null
          python scripts/probe-7.1-gadget-key-wrapper.py \
            --inherited work/gadget-inherited-reader.json \
            --wrapper work/gadget-native-u32-wrapper.json \
            --getter work/gadget-native-map-key.json \
            --loader work/gadget-caller-197827.json \
            --check
      - name: Fetch exact pinned Gadget source and exporter
        run: |
          python scripts/fetch-7.1-design-blocks.py \
            --output inputs/gadget-source \
            --report work/sophon-source.json
          mkdir -p inputs
          curl --fail --location --retry 3 \
            --output inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz
          echo "12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz" | sha256sum --check
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks inputs/gadget-source \
            --cli-archive inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --work work/native-gadget \
            --report work/chest-evidence.json
      - name: Reproduce exact Gadget table and native prefab audits
        run: |
          python scripts/audit-7.1-gadget-native-rows.py \
            --raw-export work/native-gadget/export-25539185/MiHoYoBinData/d65ab32f.dat --check
          python scripts/audit-7.1-chest-prefab-controls.py \
            --raw-export work/native-gadget/export-25539185/MiHoYoBinData/d65ab32f.dat --check
      - name: Preserve bounded inherited reader evidence
        uses: actions/upload-artifact@v7
        with:
          name: pinned-7.1-gadget-inherited-reader
          path: |
            work/gadget-inherited-reader-metadata.json
            work/gadget-inherited-reader.json
            work/gadget-native-u32-wrapper.json
            work/gadget-native-map-key.json
            work/gadget-caller-197827.json
          if-no-files-found: error
          retention-days: 2
