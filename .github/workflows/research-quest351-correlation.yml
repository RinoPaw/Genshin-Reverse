name: Research Quest 351 native correlation

on:
  push:
    branches:
      - research/quest351-return
    paths:
      - '.github/workflows/research-quest351-correlation.yml'
      - 'tools/research_quest351_native_correlation.py'

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Correlate literal 351 with quest-core calls
        run: |
          python tools/research_quest351_native_correlation.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest351-native-correlation.json
      - name: Preserve correlation report
        uses: actions/upload-artifact@v7
        with:
          name: quest351-native-correlation
          path: quest351-native-correlation.json
          if-no-files-found: error
          retention-days: 7
