name: One-shot original 7.1 Scene Point source assets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-point-payload.yml'

permissions:
  contents: read

jobs:
  source-point:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install original asset-index source dependencies
        run: python -m pip install -e . zstandard
      - name: Fetch exact original 7.1 design-index source
        run: python scripts/fetch-7.1-design-blocks.py --output work/design
      - name: Fetch exact original Global 7.1 WorldArea/Point block
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          script=Path("scripts/probe-7.1-world-area-bundle-object-types.py")
          spec=importlib.util.spec_from_file_location("pinned_original_world_source",script)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          data=mod.verify_manifest_and_fetch(Path("work/24230448.blk"))
          assert data["sha256"] == "71fbe2d10404655fa20e5d612daf5fa2f2336c1d6250ae209b722c894169aff7"
          print(data)
          PY
      - name: Get source-verified AnimeStudio Raw exporter
        run: |
          mkdir -p work/cli
          curl -fLsS --retry 3 https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz -o work/exporter.tar.gz
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  work/exporter.tar.gz' | sha256sum --check
          tar -xzf work/exporter.tar.gz -C work/cli
      - name: Export pinned original design-index and scene resource block
        run: |
          dotnet work/cli/AnimeStudio.CLI.dll work/design/31049741.blk work/index --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
          dotnet work/cli/AnimeStudio.CLI.dll work/24230448.blk work/world --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
      - name: Verify original Scene/Point path, byte identities, framing
        run: |
          python scripts/audit-7.1-original-scene-point-assets.py \
            --index-raw work/index/MiHoYoBinData/0000006f.dat \
            --worldarea-export work/world \
            --output work/original-71-scene-point-asset-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-point-asset-report
          path: work/original-71-scene-point-asset-report.json
          retention-days: 7
          if-no-files-found: error
