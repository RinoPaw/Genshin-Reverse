name: Temporary exact 7.1 chest Lv3 native table path evidence
on:
  push:
    paths:
      - '.github/workflows/probe-7.1-chest-lv3-tables.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chest-lv3-native-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-client-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard
      - name: Fetch exact pinned 7.1 Sophon design blocks
        run: |
          python scripts/fetch-7.1-design-blocks.py --output work/blocks --report work/sophon-source.json
      - name: Acquire hash-gated pinned AnimeStudio exporter
        run: |
          mkdir -p work
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --output work/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz
      - name: Independently reproduce pinned design index and original control
        run: |
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks work/blocks \
            --cli-archive work/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --work work/export \
            --report work/chest-source-control.json
      - name: Check original 7.1 audio and handbook table path hashes
        run: |
          python scripts/probe-7.1-chest-lv3-native-index.py \
            --index-raw work/export/export-31049741/MiHoYoBinData/0000006f.dat \
            --output work/chest-lv3-original-index.json
      - name: Record bounded original-index result under research issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('work/chest-lv3-original-index.json').read_text())
          lines=[
              'Original Global 7.1 design-index check for issue #31',
              '',
              f'- Action: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              f'- Original index SHA-256: {report["indexRawSha256"]}',
              f'- Original index name count: {report["indexNameCount"]}',
          ]
          for key, entry in report['candidates'].items():
              result=entry['indexResult']
              lines.append(f'- {key} ({entry["expectedPathHash"]}): {result["status"]}; block: {result.get("groupId", "unknown")}/{result.get("blockId", "unknown")}')
          lines.append('Name-hash membership does not establish reward grade, source scene placement or payout. HASH_ABSENT only applies to the guessed path. Loot remains unchanged.')
          Path('work/chest-lv3-note.md').write_text(chr(10).join(lines)+chr(10),encoding='utf-8')
          PY
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file work/chest-lv3-note.md
      - uses: actions/upload-artifact@v7
        with:
          name: chest-lv3-exact-71-original-index
          path: |
            work/sophon-source.json
            work/chest-lv3-original-index.json
          if-no-files-found: error
          retention-days: 3
