name: Probe 7.1 Quest full/brief loader binding

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-full-brief-binding.yml"

concurrency:
  group: probe-quest-full-brief-binding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Disassemble full and brief handle lookup paths
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x9F92800 0x180 \
            --expected-sha256 "$sha" --label "ODJJEFFIPFA.LFDEMLPDDFL(uint32,uint64)" \
            --output quest-full-lookup.json > quest-full-lookup.txt

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x9F891F0 0x180 \
            --expected-sha256 "$sha" --label "ODJJEFFIPFA.HGBAJLEGHGA(uint32,uint64)" \
            --output quest-brief-lookup.json > quest-brief-lookup.txt

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x9F9A130 0x420 \
            --expected-sha256 "$sha" --label "ODJJEFFIPFA.LDJGPDBKIEO(uint32,Action,bool)" \
            --output quest-full-loader.json > quest-full-loader.txt

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x9F88D40 0x420 \
            --expected-sha256 "$sha" --label "ODJJEFFIPFA.PFPFCHBANIH(uint32)" \
            --output quest-brief-loader.json > quest-brief-loader.txt

      - name: Summarize static-field and direct-call evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-full-brief-binding.txt
          import csv,json,re
          from pathlib import Path

          root=Path("versions/7.1.0-global/windows-x64/metadata")
          with (root/"methods.csv").open("r",encoding="utf-8-sig",newline="") as f:
              methods=list(csv.DictReader(f))
          with (root/"types.csv").open("r",encoding="utf-8-sig",newline="") as f:
              types=list(csv.DictReader(f))
          tb={int(x["type_definition_index"]):x for x in types}
          by_rva={}
          for m in methods:
              s=(m.get("rva") or "").strip()
              if not s: continue
              try: by_rva.setdefault(int(s,0),[]).append(m)
              except ValueError: pass

          files=[
              ("full_lookup","quest-full-lookup.json"),
              ("brief_lookup","quest-brief-lookup.json"),
              ("full_loader","quest-full-loader.json"),
              ("brief_loader","quest-brief-loader.json"),
          ]
          out={}
          for label,fn in files:
              d=json.loads(Path(fn).read_text(encoding="utf-8"))
              base=int(d["image_base"],16)
              rows=[]
              for x in d["instructions"]:
                  item={
                      "rva":x["rva"],
                      "mnemonic":x["mnemonic"],
                      "op_str":x["op_str"],
                  }
                  if x["mnemonic"] in {"call","jmp"}:
                      mm=re.fullmatch(r"0x([0-9a-fA-F]+)",x["op_str"])
                      if mm:
                          va=int(mm.group(1),16)
                          rva=va-base if va>=base else va
                          item["target_rva"]=f"0x{rva:X}"
                          item["metadata"]=by_rva.get(rva,[])
                          item["owners"]=[tb.get(int(m["type_definition_index"]),{}) for m in item["metadata"]]
                  op=x["op_str"].lower()
                  if (
                      x["mnemonic"] in {"call","jmp","mov","lea","cmp","test","and","or","xor","add","sub","shr","shl"}
                      and (
                          x["mnemonic"] in {"call","jmp"}
                          or "rip" in op
                          or any(r in op for r in ("rcx","rdx","r8","r9","rax","rbx","rsi","rdi","r12","r13","r14","r15"))
                      )
                  ):
                      rows.append(item)
              out[label]=rows
              print("\n###",label)
              for row in rows:
                  print(json.dumps(row,ensure_ascii=False,sort_keys=True))

          Path("quest-full-brief-binding.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Bind full and brief index bootstrap slots
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xFCBBB40 0x180 \
            --expected-sha256 "$sha" --label "LAABEAMHPJG bootstrap A" \
            --output quest-bootstrap-a.json > quest-bootstrap-a.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xFCBC250 0x160 \
            --expected-sha256 "$sha" --label "LAABEAMHPJG bootstrap B" \
            --output quest-bootstrap-b.json > quest-bootstrap-b.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xFCBC390 0x160 \
            --expected-sha256 "$sha" --label "LAABEAMHPJG bootstrap C" \
            --output quest-bootstrap-c.json > quest-bootstrap-c.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xFCBC530 0x160 \
            --expected-sha256 "$sha" --label "LAABEAMHPJG bootstrap brief candidate" \
            --output quest-bootstrap-brief.json > quest-bootstrap-brief.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xFCBC670 0x170 \
            --expected-sha256 "$sha" --label "LAABEAMHPJG bootstrap E" \
            --output quest-bootstrap-e.json > quest-bootstrap-e.txt

          python - <<'PY' | tee quest-bootstrap-slot-summary.txt
          import json,re
          from pathlib import Path

          files=[
              ('A','quest-bootstrap-a.json'),
              ('B','quest-bootstrap-b.json'),
              ('C','quest-bootstrap-c.json'),
              ('brief_candidate','quest-bootstrap-brief.json'),
              ('E','quest-bootstrap-e.json'),
          ]
          out={}
          for label,fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              rows=[]
              for x in d['instructions']:
                  op=x.get('op_str','').lower()
                  if (
                      x.get('mnemonic') in {'call','jmp','mov','lea'}
                      and (
                          x.get('mnemonic') in {'call','jmp'}
                          or 'rip' in op
                          or any(k in op for k in ('0x31350','0x312e0','0x312c8'))
                      )
                  ):
                      rows.append(x)
              out[label]=rows
              print('\n###',label)
              for x in rows:
                  print(x['rva'],x['mnemonic'],x['op_str'])
          Path('quest-bootstrap-slot-summary.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Disassemble ordinary Quest condition and exec array readers
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x1386F140 0x150 \
            --expected-sha256 "$sha" --label "KIMCPAKMJMH.GMENPOPMKAA(FNIAHJGHFAK,array) QuestExec[]" \
            --output quest-exec-array-reader.json > quest-exec-array-reader.txt

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xB4082D0 0x160 \
            --expected-sha256 "$sha" --label "JPGNLOPMNHN.GMENPOPMKAA(FNIAHJGHFAK,array) QuestContent[]" \
            --output quest-cond-array-reader.json > quest-cond-array-reader.txt

          python - <<'PY' | tee quest-array-reader-calls.txt
          import csv,json,re
          from pathlib import Path
          root=Path('versions/7.1.0-global/windows-x64/metadata')
          with (root/'methods.csv').open('r',encoding='utf-8-sig',newline='') as f:
              methods=list(csv.DictReader(f))
          by_rva={}
          for m in methods:
              s=(m.get('rva') or '').strip()
              if not s: continue
              try: by_rva.setdefault(int(s,0),[]).append(m)
              except ValueError: pass
          out={}
          for fn in ('quest-exec-array-reader.json','quest-cond-array-reader.json'):
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              base=int(d['image_base'],16)
              calls=[]
              for x in d['instructions']:
                  if x.get('mnemonic') not in {'call','jmp'}: continue
                  mm=re.fullmatch(r'0x([0-9a-fA-F]+)',x.get('op_str',''))
                  if not mm: continue
                  va=int(mm.group(1),16); rva=va-base if va>=base else va
                  item={'site_rva':x['rva'],'target_rva':f'0x{rva:X}','metadata':by_rva.get(rva,[])}
                  calls.append(item)
                  print(fn,json.dumps(item,ensure_ascii=False,sort_keys=True))
              out[fn]=calls
          Path('quest-array-reader-calls.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Disassemble ordinary Quest condition and exec scalar entry readers
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x1386F2A0 0x580 \
            --expected-sha256 "$sha" --label "KIMCPAKMJMH.GMENPOPMKAA(FNIAHJGHFAK) QuestExec" \
            --output quest-exec-scalar-reader.json > quest-exec-scalar-reader.txt

          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xB407BB0 0x720 \
            --expected-sha256 "$sha" --label "JPGNLOPMNHN.GMENPOPMKAA(FNIAHJGHFAK) QuestContent" \
            --output quest-cond-scalar-reader.json > quest-cond-scalar-reader.txt

          python - <<'PY' | tee quest-scalar-reader-calls.txt
          import csv,json,re
          from pathlib import Path
          root=Path('versions/7.1.0-global/windows-x64/metadata')
          with (root/'methods.csv').open('r',encoding='utf-8-sig',newline='') as f:
              methods=list(csv.DictReader(f))
          with (root/'types.csv').open('r',encoding='utf-8-sig',newline='') as f:
              types=list(csv.DictReader(f))
          by_rva={}
          tb={int(x['type_definition_index']):x for x in types}
          for m in methods:
              s=(m.get('rva') or '').strip()
              if not s: continue
              try: by_rva.setdefault(int(s,0),[]).append(m)
              except ValueError: pass
          out={}
          for fn in ('quest-exec-scalar-reader.json','quest-cond-scalar-reader.json'):
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              base=int(d['image_base'],16)
              calls=[]
              for x in d['instructions']:
                  if x.get('mnemonic') not in {'call','jmp'}: continue
                  mm=re.fullmatch(r'0x([0-9a-fA-F]+)',x.get('op_str',''))
                  if not mm: continue
                  va=int(mm.group(1),16); rva=va-base if va>=base else va
                  meta=by_rva.get(rva,[])
                  item={
                      'site_rva':x['rva'],
                      'target_rva':f'0x{rva:X}',
                      'metadata':meta,
                      'owners':[tb.get(int(m['type_definition_index']),{}) for m in meta],
                  }
                  calls.append(item)
                  print(fn,json.dumps(item,ensure_ascii=False,sort_keys=True))
              out[fn]=calls
          Path('quest-scalar-reader-calls.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-full-brief-binding
          path: |
            quest-full-lookup.txt
            quest-full-lookup.json
            quest-brief-lookup.txt
            quest-brief-lookup.json
            quest-full-loader.txt
            quest-full-loader.json
            quest-brief-loader.txt
            quest-brief-loader.json
            quest-full-brief-binding.txt
            quest-full-brief-binding.json
            quest-exec-array-reader.txt
            quest-exec-array-reader.json
            quest-cond-array-reader.txt
            quest-cond-array-reader.json
            quest-array-reader-calls.txt
            quest-array-reader-calls.json
            quest-exec-scalar-reader.txt
            quest-exec-scalar-reader.json
            quest-cond-scalar-reader.txt
            quest-cond-scalar-reader.json
            quest-scalar-reader-calls.txt
            quest-scalar-reader-calls.json
            quest-bootstrap-a.txt
            quest-bootstrap-a.json
            quest-bootstrap-b.txt
            quest-bootstrap-b.json
            quest-bootstrap-c.txt
            quest-bootstrap-c.json
            quest-bootstrap-brief.txt
            quest-bootstrap-brief.json
            quest-bootstrap-e.txt
            quest-bootstrap-e.json
            quest-bootstrap-slot-summary.txt
            quest-bootstrap-slot-summary.json
          if-no-files-found: error
