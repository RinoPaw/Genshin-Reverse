name: Probe Quest legacy field stability

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest-legacy-stability.yml"

concurrency:
  group: probe-quest-legacy-stability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned 4.0 and 7.1 quest controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agd71 /tmp/gc4000

          git clone --filter=blob:none --no-checkout \
            https://github.com/DimbreathBot/AnimeGameData.git /tmp/agd71
          git -C /tmp/agd71 sparse-checkout init --no-cone
          git -C /tmp/agd71 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/agd71 checkout 792978e5503ecfba73dcb3562ed44a0d35a2abe2

          git clone --filter=blob:none --no-checkout \
            https://github.com/TomyJan/GCResource.git /tmp/gc4000
          git -C /tmp/gc4000 sparse-checkout init --no-cone
          git -C /tmp/gc4000 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/gc4000 checkout ede70f1e23c1a494fe4258837d963b1d63004911

      - name: Compare retained Quest fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-stability.txt
          import json
          from collections import Counter
          from pathlib import Path

          def meaningful(value):
              if not isinstance(value,list):
                  return []
              return [x for x in value if isinstance(x,dict) and x.get("type")]

          def norm_entries(value):
              out=[]
              for x in meaningful(value):
                  out.append({
                      "type":x.get("type"),
                      "param":x.get("param",[]),
                      "param_str":x.get("param_str",x.get("paramStr","")) or "",
                      "count":int(x.get("count") or 0),
                  })
              return out

          def load_old(root):
              rows={}
              for p in root.glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  for r in o.get("subQuests",[]) if isinstance(o,dict) else []:
                      if isinstance(r,dict) and isinstance(r.get("subId"),int):
                          rows[r["subId"]]=r
              return rows

          def load_new(root):
              rows={}
              for p in root.glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  seq=o.get("JIJKODHIEED") if isinstance(o,dict) else None
                  if not isinstance(seq,list):
                      seq=o.get("subQuests",[]) if isinstance(o,dict) else []
                  for r in seq:
                      if not isinstance(r,dict):continue
                      sid=r.get("NFGFDHPPBIF")
                      if not isinstance(sid,int):sid=r.get("subId")
                      if isinstance(sid,int):rows[sid]=r
              return rows

          old=load_old(Path("/tmp/gc4000/BinOutput/Quest"))
          new=load_new(Path("/tmp/agd71/BinOutput/Quest"))
          common=sorted(set(old)&set(new))

          aliases={
              "finishCond":("finishCond","finishCond"),
              "failCond":("failCond","KHEBAEMAPPJ"),
              "finishExec":("finishExec","FAPCNCGCEBJ"),
              "failExec":("failExec","CNPOFCKIBDL"),
          }

          # 3.7 had 17,954 rows; 4.0-only rows are the 1,509 rows whose subId
          # is not in 3.7. Fetch the exact 3.7 id set from the pinned branch
          # using git show through a temporary worktree is avoided here; the
          # 4.0 repository's own addition history is not needed for field
          # stability. We validate all common rows and report mismatches.
          report={}
          print("COMMON_ROWS",len(common))
          for label,(old_key,new_key) in aliases.items():
              stats=Counter()
              mismatches=[]
              for sid in common:
                  a=norm_entries(old[sid].get(old_key))
                  b=norm_entries(new[sid].get(new_key))
                  if a:stats["old_meaningful"]+=1
                  if b:stats["new_meaningful"]+=1
                  if not a and not b:
                      stats["both_empty"]+=1
                  elif a==b:
                      stats["exact_equal"]+=1
                      if a:stats["exact_equal_meaningful"]+=1
                  else:
                      stats["different"]+=1
                      if len(mismatches)<100:
                          mismatches.append({"subId":sid,"4.0":a,"7.1":b})
              print(f"\n=== {label} ===")
              for k,v in sorted(stats.items()):print(k,v)
              denom=stats["exact_equal"]+stats["different"]
              print("row_equality_ratio",stats["exact_equal"]/denom if denom else 1.0)
              md=stats["exact_equal_meaningful"]+sum(
                  1 for m in mismatches if m["4.0"] or m["7.1"]
              )
              print("mismatch_examples",json.dumps(mismatches,ensure_ascii=False,indent=2))
              report[label]={"stats":dict(stats),"mismatches":mismatches}

          Path("quest-legacy-stability.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-stability
          path: |
            quest-legacy-stability.txt
            quest-legacy-stability.json
          if-no-files-found: error
