name: Temporary 7.1 scene row class static cross-references

on:
  push:
    paths:
      - '.github/workflows/research-scene-row-class-xrefs-71.yml'

permissions:
  contents: read

concurrency:
  group: research-scene-row-class-xrefs-71
  cancel-in-progress: true

jobs:
  class-xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install maintained tools
        run: python -m pip install -e . zstandard
      - name: Fetch original SHA-256-pinned Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/client --python python
      - name: Find class static pointer xrefs from two confirmed native loaders
        run: |
          python scripts/probe-7.1-scene-row-class-xrefs.py \
            --exe inputs/client/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/scene-row-class-xrefs.json
      - name: Retain bounded source evidence
        uses: actions/upload-artifact@v7
        with:
          name: pinned-7.1-scene-row-class-xrefs
          path: work/scene-row-class-xrefs.json
          if-no-files-found: error
          retention-days: 2
