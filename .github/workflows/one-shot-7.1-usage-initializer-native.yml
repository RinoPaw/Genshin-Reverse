name: One-shot original 7.1 metadata usage initializer native

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-usage-initializer-native.yml'
      - 'scripts/probe-7.1-usage-initializer-native.py'

permissions:
  contents: read

jobs:
  original-usage-initializer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned 7.1 source tools
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-pinned Global 7.1 original client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Disassemble original usage initializer and registration root
        run: |
          python scripts/probe-7.1-usage-initializer-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-point-factory-metadata-usage-table-boundary.json \
            --output work/original71-usage-initializer-native.json
      - uses: actions/upload-artifact@v7
        with:
          name: original71-usage-initializer-native
          path: work/original71-usage-initializer-native.json
          retention-days: 7
          if-no-files-found: error
