name: Probe Quest 7.1 Excel fill provenance

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-excel-fill-provenance.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned sources
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" sha="$3" pattern="$4"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set "$pattern"
            git -C "$dir" checkout "$sha"
          }

          fetch_repo https://github.com/DimbreathBot/AnimeGameData.git \
            /tmp/raw71 792978e5503ecfba73dcb3562ed44a0d35a2abe2 'BinOutput/Quest/*.json'
          fetch_repo https://github.com/capyb2222/LunaGC-Resources.git \
            /tmp/community71 395a5ee6442142a803691f60d541ee1706ae9cd7 'BinOutput/Quest/*.json'
          fetch_repo https://github.com/chenlin996/LunaGC-Resources7.0.git \
            /tmp/community70 0991d8a9d82b37a7400774764c0b6e04e7c66a9d 'BinOutput/Quest/*.json'

          fetch_repo https://github.com/MeChen618/AstaPS-Resource.git \
            /tmp/asta f2a495e0a314c5c604f7453d1b29a30e66e2090f 'ExcelBinOutput/QuestExcelConfigData.json'
          fetch_repo https://github.com/capyb2222/LunaGC-Resources.git \
            /tmp/luna 395a5ee6442142a803691f60d541ee1706ae9cd7 'ExcelBinOutput/QuestExcelConfigData.json'
          fetch_repo https://github.com/invoker-bot/LunaGC-Resources.git \
            /tmp/invoker e2c1d3ca53ec7b6add27cf6f46ac9d1c377dc5f7 'ExcelBinOutput/QuestExcelConfigData.json'

      - name: Audit unresolved row fill patterns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-excel-fill-provenance.txt
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from genshinre.questrecovery71 import (
              build_from_directories,
              _comparison_value,
          )

          manifest, unresolved = build_from_directories(
              Path("/tmp/raw71/BinOutput/Quest"),
              Path("/tmp/community71/BinOutput/Quest"),
              Path("/tmp/community70/BinOutput/Quest"),
              raw_71_source="DimbreathBot/AnimeGameData@792978e5",
              community_71_source="capyb2222/LunaGC-Resources@395a5ee6",
              community_70_source="chenlin996/LunaGC-Resources7.0@0991d8a9",
          )
          unresolved_ids={int(x) for x in unresolved["rows"]}
          print("UNRESOLVED_IDS",len(unresolved_ids))

          SOURCES={
              "asta":Path("/tmp/asta/ExcelBinOutput/QuestExcelConfigData.json"),
              "luna":Path("/tmp/luna/ExcelBinOutput/QuestExcelConfigData.json"),
              "invoker":Path("/tmp/invoker/ExcelBinOutput/QuestExcelConfigData.json"),
          }

          def load_rows(path):
              obj=json.loads(path.read_text(encoding="utf-8"))
              if isinstance(obj,dict):
                  for key in ("data","rows","list"):
                      if isinstance(obj.get(key),list):
                          obj=obj[key];break
              if not isinstance(obj,list):
                  raise TypeError(f"{path}: expected list, got {type(obj).__name__}")
              rows={}
              for r in obj:
                  if not isinstance(r,dict):continue
                  sid=r.get("subId")
                  if not isinstance(sid,int):sid=r.get("id")
                  if isinstance(sid,int):rows[sid]=r
              return rows

          loaded={name:load_rows(path) for name,path in SOURCES.items()}
          for name,rows in loaded.items():
              print(name,"rows",len(rows),"unresolved_present",len(unresolved_ids&set(rows)))

          def typed(v, field):
              if not isinstance(v,list):return []
              out=[]
              for x in v:
                  if not isinstance(x,dict):continue
                  t=x.get("type")
                  if not isinstance(t,str) or not t:continue
                  if field=="acceptCond" and t=="QUEST_COND_UNKNOWN":continue
                  out.append(x)
              return out

          def build_prev(rows):
              groups=defaultdict(list)
              for sid,r in rows.items():
                  mid=r.get("mainId")
                  order=r.get("order")
                  if isinstance(mid,int) and isinstance(order,int):
                      groups[mid].append((order,sid))
              prev={}
              first=set()
              for mid,arr in groups.items():
                  arr.sort()
                  for i,(_order,sid) in enumerate(arr):
                      if i==0:first.add(sid)
                      else:prev[sid]=arr[i-1][1]
              return prev,first

          reports={}
          values={}
          for name,rows in loaded.items():
              prev,first=build_prev(rows)
              st=Counter()
              complex_examples=[]
              values[name]={}
              for sid in sorted(unresolved_ids):
                  r=rows.get(sid)
                  if r is None:
                      st["missing_row"]+=1
                      continue
                  st["present"]+=1
                  ac=typed(r.get("acceptCond"),"acceptCond")
                  be=typed(r.get("beginExec"),"beginExec")
                  if be:
                      st["begin_meaningful"]+=1
                  if ac:
                      st["accept_meaningful"]+=1
                      norm=_comparison_value(ac,field="acceptCond")
                      values[name][sid]=norm
                      if len(norm)==1 and norm[0]["type"]=="QUEST_COND_STATE_EQUAL":
                          p=norm[0]["param"]
                          target=p[0] if p else None
                          state=p[1] if len(p)>1 else None
                          if sid in first and target==0 and state==3:
                              st["accept_first_zero_chain"]+=1
                          elif prev.get(sid)==target and state==3:
                              st["accept_previous_order_chain"]+=1
                          else:
                              st["accept_single_state_equal_other"]+=1
                              if len(complex_examples)<60:
                                  complex_examples.append({
                                      "subId":sid,"mainId":r.get("mainId"),"order":r.get("order"),
                                      "prev":prev.get(sid),"acceptCond":norm,
                                  })
                      else:
                          st["accept_complex_or_non_state"]+=1
                          if len(complex_examples)<60:
                              complex_examples.append({
                                  "subId":sid,"mainId":r.get("mainId"),"order":r.get("order"),
                                  "prev":prev.get(sid),"acceptCond":norm,
                              })
                  else:
                      st["accept_empty"]+=1
                  if not be:st["begin_empty"]+=1
              reports[name]=dict(st)
              print("\n===",name,"===")
              print(json.dumps(dict(st),indent=2))
              print("NON_SYNTHETIC_EXAMPLES")
              print(json.dumps(complex_examples,ensure_ascii=False,indent=2))

          print("\n=== CROSS-SOURCE ACCEPT AGREEMENT ===")
          names=list(SOURCES)
          all_sids=set().union(*(set(v) for v in values.values()))
          agree=Counter()
          disagreement=[]
          for sid in sorted(all_sids):
              present={n:values[n][sid] for n in names if sid in values[n]}
              if len(present)<2:continue
              sigs={json.dumps(v,sort_keys=True,ensure_ascii=False) for v in present.values()}
              if len(sigs)==1:
                  agree["agree"]+=1
              else:
                  agree["disagree"]+=1
                  if len(disagreement)<80:
                      disagreement.append({"subId":sid,"values":present})
          print(dict(agree))
          print("DISAGREEMENT_EXAMPLES")
          print(json.dumps(disagreement,ensure_ascii=False,indent=2))

          Path("quest71-excel-fill-provenance.json").write_text(
              json.dumps({"unresolved_ids":len(unresolved_ids),"reports":reports},
                         ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-excel-fill-provenance
          path: |
            quest71-excel-fill-provenance.txt
            quest71-excel-fill-provenance.json
          if-no-files-found: error
