name: Generate 7.1 reverse artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-7.1-artifacts.yml'
      - 'genshinre/usageslots.py'
      - 'genshinre/usagejoin.py'
      - 'tools/fetch_sophon_targets.py'
      - 'tools/publish_generated_71.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . zstandard

      - name: Handle anonymous 7.1 metadata string sentinel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('genshinre/mhy71.py')
          text = path.read_text(encoding='utf-8')
          needle = 'def decode_string_token(metadata: mmap.mmap | bytes, string_base: int, token: int) -> str:\n    length = (token >> 24) & 0xFF\n'
          replacement = 'def decode_string_token(metadata: mmap.mmap | bytes, string_base: int, token: int) -> str:\n    if token == MASK32:\n        return ""\n    length = (token >> 24) & 0xFF\n'
          if needle not in text:
              raise SystemExit('decode_string_token shape changed; refusing runtime patch')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Fetch exact official global 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sh256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Fetch current AstaPS control set
        run: git clone --depth 1 --branch play/rino https://github.com/RinoPaw/AstaPS.git /tmp/AstaPS

      - name: Regenerate metadata and early 7.1 intermediates
        shell: bash
        run: |
          set +e
          bash scripts/regenerate-7.1.sh \
            --exe /tmp/gi71/GenshinImpact.exe \
            --metadata /tmp/gi71/global-metadata.dat \
            --output work/7.1.0-global/windows-x64
          echo "regenerate exit=$? (later recovery paths continue independently)"
          exit 0

      - name: Import current AstaPS opcodes from the real path
        run: |
          test -f /tmp/AstaPS/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java
          mkdir -p work/7.1.0-global/windows-x64
          python -m genshinre import-opcodes-java \
            /tmp/AstaPS/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java \
            work/7.1.0-global/windows-x64/known-opcodes.csv

      - name: Probe direct native 4,896-row registry layout first
        shell: bash
        run: |
          set -u
          OUT=work/7.1.0-global/windows-x64
          EXE=/tmp/gi71/GenshinImpact.exe
          test -s "$OUT/metadata/types.csv"
          test -s "$OUT/metadata/methods.csv"
          test -s "$OUT/metadata/runtime-types.csv"
          test -s "$OUT/getcmdid-candidates.csv"

          python -m genshinre.registrylayout \
            "$EXE" "$OUT/registry-layout-probe.json"
          echo '--- registry-layout-probe.json ---'
          cat "$OUT/registry-layout-probe.json"

          set +e
          python -m genshinre.registryraw \
            "$EXE" "$OUT/registry-layout-probe.json" \
            "$OUT/registry-native-direct.csv" \
            --summary "$OUT/registry-native-direct.summary.json" \
            --require-4896-unique
          direct_status=$?
          set -e
          echo "direct raw registry exit=$direct_status"
          test ! -f "$OUT/registry-native-direct.summary.json" || cat "$OUT/registry-native-direct.summary.json"

      - name: Recover usage mappings and candidate registry graph
        shell: bash
        run: |
          set -u
          OUT=work/7.1.0-global/windows-x64
          EXE=/tmp/gi71/GenshinImpact.exe

          python -m genshinre.metareg \
            "$EXE" "$OUT/metadata-registration-probe.json"

          set +e
          python -m genshinre.metausage \
            "$EXE" "$OUT/metadata-usage-slots.csv" \
            --summary "$OUT/metadata-usage-slots.summary.json"
          registration_status=$?
          set -e
          echo "registration-backed usage recovery exit=$registration_status"

          if [ "$registration_status" -ne 0 ]; then
            echo 'Falling back to direct initializer call-site evidence.'
            test -s "$OUT/metadata-usage-sites.csv"
            python -m genshinre.usageslots \
              "$OUT/metadata-usage-sites.csv" \
              "$OUT/metadata-usage-slots.csv" \
              --summary "$OUT/metadata-usage-slots.summary.json"
          fi

          echo '--- metadata-usage-slots.summary.json ---'
          cat "$OUT/metadata-usage-slots.summary.json"

          set +e
          python -m genshinre.usagejoin \
            "$EXE" "$OUT/metadata-usage-slots.csv" \
            "$OUT/metadata/runtime-types.csv" \
            "$OUT/metadata-usage-types.csv" \
            --summary "$OUT/metadata-usage-types.summary.json"
          join_status=$?
          set -e
          echo "usage/type join exit=$join_status"

          if [ "$join_status" -eq 0 ]; then
            python -m genshinre.registrygraph \
              "$OUT/metadata-usage-types.csv" \
              "$OUT/getcmdid-candidates.csv" \
              "$OUT/registry-candidate-graph.csv" \
              --summary "$OUT/registry-candidate-graph.summary.json"

            python -m genshinre.registryselect \
              "$OUT/registry-candidate-graph.csv" \
              "$OUT/registry-static-candidates.csv" \
              --summary "$OUT/registry-static-candidates.summary.json"

            set +e
            python -m genshinre.registryusagelayout \
              "$EXE" "$OUT/metadata-usage-types.csv" \
              "$OUT/registry-usage-layout-probe.json"
            usage_layout_status=$?
            set -e
            echo "usage-backed native registry layout exit=$usage_layout_status"
            test ! -f "$OUT/registry-usage-layout-probe.json" || cat "$OUT/registry-usage-layout-probe.json"
          fi
          exit 0

      - name: Attempt strict canonical registry closure
        shell: bash
        run: |
          set +e
          OUT=work/7.1.0-global/windows-x64
          if [ -f "$OUT/registry-layout-probe.json" ] && [ -f "$OUT/registry-usage-layout-probe.json" ]; then
            bash scripts/close-registry-7.1.sh \
              --exe /tmp/gi71/GenshinImpact.exe \
              --output "$OUT" \
              --require-direction-perfect
            status=$?
            if [ "$status" -eq 0 ]; then
              bash scripts/publish-registry-7.1.sh \
                --work "$OUT" \
                --destination "$OUT/canonical-registry"
              status=$?
            fi
          else
            status=3
            echo 'canonical closure skipped: one or both native layout paths are still unresolved'
          fi
          echo "canonical registry exit=$status"
          exit 0

      - name: Publish available computation-friendly artifacts
        run: |
          python tools/publish_generated_71.py \
            work/7.1.0-global/windows-x64 \
            versions/7.1.0-global/windows-x64

      - name: Validate minimum useful artifact set
        run: |
          test -s versions/7.1.0-global/windows-x64/registry/getcmdid-candidates.csv
          test -s versions/7.1.0-global/windows-x64/metadata/runtime-types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/methods.csv
          test -s versions/7.1.0-global/windows-x64/metadata/type-methods.json
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          root = Path('versions/7.1.0-global/windows-x64')
          for path in root.rglob('*'):
              if path.is_file() and path.stat().st_size >= limit:
                  raise SystemExit(f'GitHub hard-limit risk: {path} = {path.stat().st_size} bytes')
          PY

      - name: Preserve full work directory for follow-up analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genshin-7.1-reverse-work
          path: work/7.1.0-global/windows-x64
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Commit derived CSV and JSON artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- genshinre/mhy71.py
          git add -A versions/7.1.0-global/windows-x64
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish generated global 7.1 reverse artifacts'
          git pull --rebase origin main
          git push origin HEAD:main
