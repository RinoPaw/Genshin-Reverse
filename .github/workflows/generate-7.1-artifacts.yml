name: Generate 7.1 reverse artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-7.1-artifacts.yml'
      - 'tools/fetch_sophon_targets.py'
      - 'tools/publish_generated_71.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . zstandard

      - name: Handle anonymous 7.1 metadata string sentinel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('genshinre/mhy71.py')
          text = path.read_text(encoding='utf-8')
          needle = 'def decode_string_token(metadata: mmap.mmap | bytes, string_base: int, token: int) -> str:\n    length = (token >> 24) & 0xFF\n'
          replacement = 'def decode_string_token(metadata: mmap.mmap | bytes, string_base: int, token: int) -> str:\n    if token == MASK32:\n        return ""\n    length = (token >> 24) & 0xFF\n'
          if needle not in text:
              raise SystemExit('decode_string_token shape changed; refusing runtime patch')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Fetch exact official global 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Fetch current AstaPS control set
        if: always()
        run: git clone --depth 1 --branch play/rino https://github.com/RinoPaw/AstaPS.git /tmp/AstaPS

      - name: Regenerate 7.1 intermediate artifacts
        id: regenerate
        shell: bash
        run: |
          set +e
          bash scripts/regenerate-7.1.sh \
            --exe /tmp/gi71/GenshinImpact.exe \
            --metadata /tmp/gi71/global-metadata.dat \
            --output work/7.1.0-global/windows-x64
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Import current AstaPS opcodes from the real path
        if: always()
        run: |
          test -f /tmp/AstaPS/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java
          mkdir -p work/7.1.0-global/windows-x64
          python -m genshinre import-opcodes-java \
            /tmp/AstaPS/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java \
            work/7.1.0-global/windows-x64/known-opcodes.csv

      - name: Attempt strict 4,896-row registry closure
        if: always()
        id: closure
        shell: bash
        run: |
          set +e
          bash scripts/close-registry-7.1.sh \
            --exe /tmp/gi71/GenshinImpact.exe \
            --output work/7.1.0-global/windows-x64 \
            --require-direction-perfect
          status=$?
          if [ "$status" -eq 0 ]; then
            bash scripts/publish-registry-7.1.sh \
              --work work/7.1.0-global/windows-x64 \
              --destination work/7.1.0-global/windows-x64/canonical-registry
            status=$?
          fi
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish requested computation-friendly artifacts
        if: always()
        run: |
          python tools/publish_generated_71.py \
            work/7.1.0-global/windows-x64 \
            versions/7.1.0-global/windows-x64

      - name: Validate requested artifacts
        run: |
          test -s versions/7.1.0-global/windows-x64/registry/registry-candidate-graph.csv
          test -s versions/7.1.0-global/windows-x64/registry/metadata-usage-types.csv
          test -s versions/7.1.0-global/windows-x64/registry/getcmdid-candidates.csv
          test -s versions/7.1.0-global/windows-x64/metadata/runtime-types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/types.csv
          test -s versions/7.1.0-global/windows-x64/metadata/methods.csv
          test -s versions/7.1.0-global/windows-x64/metadata/type-methods.json
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          root = Path('versions/7.1.0-global/windows-x64')
          for path in root.rglob('*'):
              if path.is_file() and path.stat().st_size >= limit:
                  raise SystemExit(f'GitHub hard-limit risk: {path} = {path.stat().st_size} bytes')
          PY

      - name: Commit derived artifacts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            versions/7.1.0-global/windows-x64/generated-artifacts.json \
            versions/7.1.0-global/windows-x64/registry/registry-candidate-graph.csv \
            versions/7.1.0-global/windows-x64/registry/metadata-usage-types.csv \
            versions/7.1.0-global/windows-x64/registry/getcmdid-candidates.csv \
            versions/7.1.0-global/windows-x64/metadata/runtime-types.csv \
            versions/7.1.0-global/windows-x64/metadata/types.csv \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            versions/7.1.0-global/windows-x64/metadata/type-methods.json
          if test -f versions/7.1.0-global/windows-x64/registry/registry.csv; then
            git add versions/7.1.0-global/windows-x64/registry/registry.csv
            test ! -f versions/7.1.0-global/windows-x64/registry/registry.json || git add versions/7.1.0-global/windows-x64/registry/registry.json
            test ! -f versions/7.1.0-global/windows-x64/registry/summary.json || git add versions/7.1.0-global/windows-x64/registry/summary.json
          fi
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'data: publish generated 7.1 reverse artifacts'
          git pull --rebase origin main
          git push origin HEAD:main
