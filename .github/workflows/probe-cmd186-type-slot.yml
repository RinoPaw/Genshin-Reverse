name: Probe CmdId 186 type-slot xrefs

on:
  push:
    paths:
      - .github/workflows/probe-cmd186-type-slot.yml
  workflow_dispatch:

concurrency:
  group: probe-cmd186-type-slot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard
      - name: Fetch pinned exact 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Resolve type-slot code xrefs and caller methods
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from genshinre.xrefs import scan_rip_xrefs, write_json
          result=scan_rip_xrefs(
              Path('inputs/7.1.0-global/GenshinImpact.exe'),
              [0x057F3858],
              window=48,
              methods_csv=Path('versions/7.1.0-global/windows-x64/metadata/methods.csv'),
              max_method_body=0x10000,
          )
          write_json(result, Path('cmdid-186-type-slot-xrefs.json'))
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cmdid-186-type-slot-xrefs
          path: cmdid-186-type-slot-xrefs.json
          if-no-files-found: error
          retention-days: 7
