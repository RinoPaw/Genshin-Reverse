name: Map scene handler static fields across 7.0 and 7.1

on:
  push:
    paths:
      - '.github/workflows/map-7.0-7.1-scene-handler-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact 7.0 and 7.1 samples plus 7.0 dump
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/3XnPviMfoILi/manifest_2efe39d995f47170_29ad2bc6e42fe4af2086ae58c7e81b33' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/3XnPviMfoILi' \
            --output /tmp/gi70 \
            --expected-exe-sha256 'a1a23cb76d941df28c5156ca3152fa49421ec98842221b7d71633d42ee76ca45' \
            --expected-metadata-sha256 'd361ff11f6ca123f4126004db13cdf1956e00d95231f84c1e5437f560e79128b'
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'
          curl --fail --location 'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' -o /tmp/data.7z
          curl --fail --location 'https://raw.githubusercontent.com/kuma-dayo/protos/main/7.0.0/packetIds.json' -o /tmp/packetIds-7.0.json
          mkdir -p /tmp/data && 7z x -y /tmp/data.7z -o/tmp/data >/dev/null

      - name: Map known scene handler memory fields
        run: |
          python - <<'PY' > /tmp/scene-handler-field-map.json
          import bisect, csv, difflib, json, re
          from collections import Counter, defaultdict
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG, X86_REG_RIP
          from genshinre.pe import PEImage

          OLD_OWNER='KGCKOFPFBLA'; NEW_OWNER='KLLNGCPBLMM'
          controls=[
            ('GetScenePointRsp',6529,26),
            ('SceneTransToPointRsp',4731,23515),
            ('EnterWorldAreaRsp',24557,6774),
            ('GetSceneAreaRsp',4722,23366),
            ('ScenePointUnlockNotify',7929,25567),
            ('SceneAreaUnlockNotify',5912,27420),
          ]
          old_ids=json.load(open('/tmp/packetIds-7.0.json',encoding='utf-8'))
          old_cmd_type={int(v):k for k,v in old_ids.items()}
          new_cmd_type={}
          with open('versions/7.1.0-global/windows-x64/registry/registry.csv',encoding='utf-8',newline='') as f:
            for row in csv.DictReader(f): new_cmd_type[int(row['cmd_id'])]=row['type_name']

          # Read the historical scene owner and collect global method RVAs.
          old_owner=None; old_all=set(); rva_re=re.compile(r'"rva":(\d+)')
          with Path('/tmp/data/data/dump.json').open(encoding='utf-8',errors='replace') as f:
            for line in f:
              if '"rva":' in line:
                old_all.update(int(x) for x in rva_re.findall(line) if int(x)>0)
              if old_owner is None and f'"name":"{OLD_OWNER}"' in line:
                obj,_=json.JSONDecoder().raw_decode(line.strip())
                if obj.get('name')==OLD_OWNER: old_owner=obj
          if old_owner is None: raise RuntimeError('old owner missing')
          old_all=sorted(old_all)

          old_methods=[]
          for pos,m in enumerate(old_owner.get('methods',[])):
            start=int(m.get('rva') or 0)
            if start<=0: continue
            i=bisect.bisect_right(old_all,start)
            if i>=len(old_all): continue
            old_methods.append({'pos':pos,'name':m.get('name'),'index':m.get('idx'),'rva':start,'end':old_all[i],
                                'params':[p.get('type') for p in (m.get('params') or [])]})

          # Current decoded methods are one CSV row per method.
          new_all=[]; new_owner_methods=[]
          with open('versions/7.1.0-global/windows-x64/metadata/methods.csv',encoding='utf-8',newline='') as f:
            for row in csv.DictReader(f):
              rva=int(row['rva'],0) if row.get('rva') else 0
              if rva>0: new_all.append(rva)
              if row.get('type_name')==NEW_OWNER and rva>0:
                try: params=json.loads(row.get('parameter_types') or '[]')
                except Exception: params=[]
                new_owner_methods.append({'name':row['method_name'],'index':int(row['method_index']), 'rva':rva,'params':params})
          new_all=sorted(set(new_all))
          for pos,m in enumerate(new_owner_methods):
            m['pos']=pos
            i=bisect.bisect_right(new_all,m['rva'])
            m['end']=new_all[i] if i<len(new_all) else m['rva']+0x1000

          def find_unique(methods,param):
            hits=[m for m in methods if len(m['params'])==1 and m['params'][0]==param]
            return hits

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          def insns(image,start,end):
            rows=[]
            for ins in md.disasm(image.read_rva(start,end-start),image.image_base+start):
              ops=[]; large=[]
              for op in ins.operands:
                if op.type==X86_OP_REG: ops.append('R')
                elif op.type==X86_OP_IMM: ops.append('T' if ins.mnemonic=='call' or ins.mnemonic.startswith('j') else 'I')
                elif op.type==X86_OP_MEM:
                  if op.mem.base==X86_REG_RIP: ops.append('MRIP')
                  else:
                    disp=int(op.mem.disp)
                    ops.append('MBIG' if abs(disp)>=0x1000 else f'M{disp:+#x}')
                    if abs(disp)>=0x1000: large.append(disp)
                else: ops.append('O')
              rows.append({'rva':ins.address-image.image_base,'mnemonic':ins.mnemonic,'token':ins.mnemonic+':'+':'.join(ops),'large':large,'op_str':ins.op_str})
            return rows

          def align_fields(old_rows,new_rows):
            a=[r['token'] for r in old_rows]; b=[r['token'] for r in new_rows]
            sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
            pairs=[]
            for block in sm.get_matching_blocks():
              for k in range(block.size):
                o=old_rows[block.a+k]; n=new_rows[block.b+k]
                if len(o['large'])==1 and len(n['large'])==1:
                  pairs.append({'old_disp':o['large'][0],'new_disp':n['large'][0],
                                'old_rva':f"0x{o['rva']:X}",'new_rva':f"0x{n['rva']:X}",
                                'mnemonic':o['mnemonic'],'old_op':o['op_str'],'new_op':n['op_str']})
            return sm.ratio(),pairs

          result={'controls':[],'explicit_sender':None,'field_pair_counts':{},'old_unlock_rsp_slot':'0x36E970',
                  'current_candidate_slots':{'36641':'0x4B2A90','20290':'0x4B2AB0'}}
          aggregate=Counter(); evidence=defaultdict(list)
          with PEImage(Path('/tmp/gi70/GenshinImpact.exe')) as im70, PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as im71:
            for semantic,oc,nc in controls:
              ot=old_cmd_type[oc]; nt=new_cmd_type[nc]
              oh=find_unique(old_methods,ot); nh=find_unique(new_owner_methods,nt)
              item={'semantic':semantic,'old_cmd':oc,'old_type':ot,'new_cmd':nc,'new_type':nt,
                    'old_hits':len(oh),'new_hits':len(nh)}
              if len(oh)==1 and len(nh)==1:
                o,n=oh[0],nh[0]
                orows=insns(im70,o['rva'],o['end']); nrows=insns(im71,n['rva'],n['end'])
                ratio,pairs=align_fields(orows,nrows)
                item.update({'old_method':o,'new_method':n,'instruction_token_similarity':ratio,'field_pairs':pairs})
                # Only high-structure controls contribute to field-map consensus.
                if ratio>=0.70 and len(orows)>=20 and len(nrows)>=20:
                  for p in pairs:
                    key=(p['old_disp'],p['new_disp']); aggregate[key]+=1; evidence[key].append(semantic)
              result['controls'].append(item)

            # Known sender fingerprint is an independent control pair.
            o={'rva':0xB6EA6B0,'end':0xB6EAA40}; n={'rva':0xF0452B0,'end':0xF045640}
            ratio,pairs=align_fields(insns(im70,o['rva'],o['end']),insns(im71,n['rva'],n['end']))
            result['explicit_sender']={'old_rva':'0xB6EA6B0','new_rva':'0xF0452B0','instruction_token_similarity':ratio,'field_pairs':pairs}
            if ratio>=0.70:
              for p in pairs:
                key=(p['old_disp'],p['new_disp']); aggregate[key]+=1; evidence[key].append('UnlockSenderFingerprint')

          mapped=[]
          for (od,nd),count in aggregate.most_common():
            mapped.append({'old_disp':f'0x{od:X}','new_disp':f'0x{nd:X}','count':count,'controls':evidence[(od,nd)]})
          result['field_pair_counts']=mapped

          # Report mappings nearest the old UnlockTransPointRsp delegate field.
          target=0x36E970
          delegate_domain=[m for m in mapped if 0x300000<=int(m['old_disp'],0)<=0x400000]
          delegate_domain.sort(key=lambda m:abs(int(m['old_disp'],0)-target))
          result['nearest_old_delegate_domain_mappings']=delegate_domain[:20]
          print(json.dumps(result,indent=2))
          PY
          python - <<'PY'
          import json
          d=json.load(open('/tmp/scene-handler-field-map.json'))
          for c in d['controls']:
            print(c['semantic'],'hits',c['old_hits'],c['new_hits'],'sim',c.get('instruction_token_similarity'))
            for p in c.get('field_pairs',[]):
              od=p['old_disp']; nd=p['new_disp']
              if 0x300000 <= od <= 0x500000 or 0x300000 <= nd <= 0x600000:
                print(' ',hex(od),'->',hex(nd),p['mnemonic'])
          print('nearest mappings to old unlock rsp slot:')
          for m in d['nearest_old_delegate_domain_mappings']: print(m)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: scene-handler-field-map-70-71
          path: /tmp/scene-handler-field-map.json
