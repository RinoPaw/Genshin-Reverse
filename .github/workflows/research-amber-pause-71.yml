name: Amber 7.1 pause native evidence

on:
  push:
    branches: [research/amber-pause-ack-71]
    paths:
      - 'tools/research_amber_pause_71.py'
      - '.github/workflows/research-amber-pause-71.yml'
  workflow_dispatch:

concurrency:
  group: research-amber-pause-71-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire pinned Global 7.1 sample
        run: |
          python -m pip install zstandard capstone
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace exact-sample request and candidate native xrefs
        run: |
          PYTHONPATH=. python tools/research_amber_pause_71.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --output versions/7.1.0-global/windows-x64/analyses/amber-pause-ack/native-probe.json
      - name: Publish only static evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/analyses/amber-pause-ack/native-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record exact 7.1 Amber pause static registry evidence'
            git push origin HEAD:research/amber-pause-ack-71
          fi
