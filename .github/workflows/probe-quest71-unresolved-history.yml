name: Probe Quest 7.1 unresolved historical recovery

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-unresolved-history.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned Quest snapshots
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" sha="$3"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set 'BinOutput/Quest/*.json'
            git -C "$dir" checkout "$sha"
          }
          fetch_repo https://github.com/DimbreathBot/AnimeGameData.git /tmp/raw71 792978e5503ecfba73dcb3562ed44a0d35a2abe2
          fetch_repo https://github.com/capyb2222/LunaGC-Resources.git /tmp/c71 395a5ee6442142a803691f60d541ee1706ae9cd7
          fetch_repo https://github.com/chenlin996/LunaGC-Resources7.0.git /tmp/c70 0991d8a9d82b37a7400774764c0b6e04e7c66a9d
          fetch_repo https://github.com/TomyJan/GCResource.git /tmp/c37 609730bf63568baee1eb77a605b6c273a064dbc1
          fetch_repo https://github.com/TomyJan/GCResource.git /tmp/c40 ede70f1e23c1a494fe4258837d963b1d63004911
          fetch_repo https://github.com/Kei-Luna/LunaGC_Resources_4.6.0.git /tmp/c46 e7e0204a273a82efd3c86507bb19cb0d9e760c53
          fetch_repo https://github.com/Kei-Luna/LunaGC_Resources_5.0.0.git /tmp/c50 e7a7cf1fbe4f9d44f7bb70e284f8be9a3ce6e076
          fetch_repo https://github.com/Rafs-kk/LunaGC-6.6-res.git /tmp/c66 b0501c5d89767ead5f647869a2412521447f7682

      - name: Recover unresolved rows from older snapshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-unresolved-history.txt
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          SNAP_PATHS={
              "3.7":Path("/tmp/c37/BinOutput/Quest"),
              "4.0":Path("/tmp/c40/BinOutput/Quest"),
              "4.6":Path("/tmp/c46/BinOutput/Quest"),
              "5.0":Path("/tmp/c50/BinOutput/Quest"),
              "6.6":Path("/tmp/c66/BinOutput/Quest"),
              "7.0":Path("/tmp/c70/BinOutput/Quest"),
              "7.1-community":Path("/tmp/c71/BinOutput/Quest"),
          }

          def load_raw(root):
              out={}
              for p in root.glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("JIJKODHIEED",[])
                  if not isinstance(seq,list):continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("NFGFDHPPBIF"),int):
                          out[r["NFGFDHPPBIF"]]=r
              return out

          def load_normal(root):
              out={}
              for p in root.glob("*.json"):
                  try:o=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:continue
                  if not isinstance(o,dict):continue
                  seq=o.get("subQuests",[])
                  if not isinstance(seq,list):continue
                  for r in seq:
                      if isinstance(r,dict) and isinstance(r.get("subId"),int):
                          out[r["subId"]]=r
              return out

          def norm(value,field):
              if not isinstance(value,list):
                  return None
              out=[]
              for x in value:
                  if not isinstance(x,dict):continue
                  typ=x.get("type")
                  if not isinstance(typ,str) or not typ:continue
                  if field=="acceptCond" and typ=="QUEST_COND_UNKNOWN":
                      continue
                  params=list(x.get("param",[])) if isinstance(x.get("param"),list) else []
                  while params and params[-1] in (0,"0",""):
                      params.pop()
                  out.append({
                      "type":typ,
                      "param":params,
                      "param_str":x.get("param_str",x.get("paramStr",x.get("JBELGECAIIL",""))) or "",
                      "count":int(x.get("count") or 0),
                  })
              return out

          raw=load_raw(Path("/tmp/raw71/BinOutput/Quest"))
          snaps={ver:load_normal(path) for ver,path in SNAP_PATHS.items()}
          ids=set(raw)
          # Match durable manifest's initial unresolved gate: a raw row is
          # unresolved if either current 7.1 community or 7.0 predecessor lacks it.
          unresolved=ids-(set(snaps["7.0"])&set(snaps["7.1-community"]))
          print("RAW_ROWS",len(ids))
          print("INITIAL_UNRESOLVED",len(unresolved))

          report={"initial_unresolved":len(unresolved),"fields":{}}
          for field in ("acceptCond","beginExec"):
              st=Counter()
              recovered_value={}
              recovered_empty={}
              conflicts={}
              single={}
              no_evidence=[]
              for sid in sorted(unresolved):
                  groups=defaultdict(list)
                  payload={}
                  observations=0
                  for ver in ("3.7","4.0","4.6","5.0","6.6","7.0","7.1-community"):
                      row=snaps[ver].get(sid)
                      if row is None:continue
                      nv=norm(row.get(field),field)
                      if nv is None:continue
                      observations+=1
                      key=json.dumps(nv,ensure_ascii=False,sort_keys=True,separators=(",",":"))
                      groups[key].append(ver);payload[key]=nv

                  if not groups:
                      no_evidence.append(sid); st["no_evidence"]+=1
                      continue

                  # Require at least two version snapshots to agree. Shared
                  # repository lineage is still compatibility evidence only.
                  ranked=sorted(groups.items(),key=lambda kv:(len(kv[1]),kv[1][-1]),reverse=True)
                  best_key,best_versions=ranked[0]
                  best=payload[best_key]
                  if len(best_versions)>=2:
                      if len(groups)>1:
                          st["has_conflict"]+=1
                          conflicts[sid]=[
                              {"versions":vs,"value":payload[k]} for k,vs in ranked
                          ]
                      if best:
                          st["recovered_value"]+=1
                          recovered_value[sid]={"value":best,"versions":best_versions}
                      else:
                          st["recovered_empty"]+=1
                          recovered_empty[sid]={"versions":best_versions}
                  else:
                      st["single_only"]+=1
                      single[sid]={"value":best,"versions":best_versions}

              remaining=set(unresolved)-set(recovered_value)-set(recovered_empty)
              st["remaining_unresolved"]=len(remaining)
              print("\nFIELD",field,dict(st))
              print("VALUE_EXAMPLES",json.dumps(
                  [{"subId":sid,**v} for sid,v in list(recovered_value.items())[:80]],
                  ensure_ascii=False,indent=2
              ))
              print("EMPTY_EXAMPLES",json.dumps(
                  [{"subId":sid,**v} for sid,v in list(recovered_empty.items())[:80]],
                  ensure_ascii=False,indent=2
              ))
              print("SINGLE_EXAMPLES",json.dumps(
                  [{"subId":sid,**v} for sid,v in list(single.items())[:50]],
                  ensure_ascii=False,indent=2
              ))
              print("CONFLICT_EXAMPLES",json.dumps(
                  [{"subId":sid,"variants":v} for sid,v in list(conflicts.items())[:50]],
                  ensure_ascii=False,indent=2
              ))
              print("REMAINING_IDS_SAMPLE",sorted(remaining)[:300])
              report["fields"][field]={
                  "stats":dict(st),
                  "recovered_value":{str(k):v for k,v in recovered_value.items()},
                  "recovered_empty":{str(k):v for k,v in recovered_empty.items()},
                  "single_only":{str(k):v for k,v in single.items()},
                  "conflicts":{str(k):v for k,v in conflicts.items()},
                  "remaining_unresolved":sorted(remaining),
              }

          Path("quest71-unresolved-history.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-unresolved-history
          path: |
            quest71-unresolved-history.txt
            quest71-unresolved-history.json
          if-no-files-found: error
