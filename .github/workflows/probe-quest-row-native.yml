              return out

          report = {
              "reader_calls": summarize("quest-fnj-reader.json"),
              "side_reader_calls": summarize("quest-fnj-side-reader.json"),
          }

          for group, rows in report.items():
              print("===", group, "===")
              for row in rows:
                  names = [
                      f'{x["owner"].get("type_name","?")}::{x["method"].get("method_name","?")}'
                      for x in row["metadata"]
                  ]
                  print(row["site_rva"], "->", row["target_rva"], names or ["<unmapped>"])
                  for x in row["context"]:
                      print(f'  {x["rva"]:>12} {x["mnemonic"]:<8} {x["op_str"]}')

          Path("quest-fnj-reader-calls.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          obj = json.loads(Path("quest-fnj-reader.json").read_text(encoding="utf-8"))
          Path("quest-fnj-reader-head.json").write_text(
              json.dumps(obj["instructions"][:120], ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("=== first 120 instructions ===")
          for x in obj["instructions"][:120]:
              print(f'{x["rva"]:>12} {x["mnemonic"]:<8} {x["op_str"]}')
          PY
