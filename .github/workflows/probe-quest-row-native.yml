          import bisect
          import csv
          import json
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE = Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          FOCUS = {
              "afio_to_fnj": 0x1269C4A0,
              "odj_read_afio": 0x9F90210,
              "odj_load_afio": 0x9F9A130,
              "odj_read_fnj": 0x9F892D0,
              "odj_load_fnj": 0x9F88D40,
              "odj_consume_afio": 0x9F8C280,
          }
          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          methods = read_csv("methods.csv")
          types = read_csv("types.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          by_rva = {}
          starts = []
          for row in methods:
              text = (row.get("rva") or "").strip()
              if not text:
                  continue
              try:
                  rva = int(text, 16)
              except ValueError:
                  continue
              by_rva.setdefault(rva, []).append(row)
              starts.append(rva)
          starts = sorted(set(starts))

          def owner(rva):
              pos = bisect.bisect_right(starts, rva) - 1
              if pos < 0:
                  return None
              start = starts[pos]
              end = starts[pos + 1] if pos + 1 < len(starts) else start + 0x10000
              if not (start <= rva < end):
                  return None
              rows = by_rva[start]
              return {
                  "start_rva": f"0x{start:X}",
                  "end_rva": f"0x{end:X}",
                  "methods": rows,
                  "owners": [
                      type_by_tdi.get(int(r["type_definition_index"]), {})
                      for r in rows
                  ],
              }

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          report = {}

          with PEImage(EXE) as image:
              base = image.image_base
              for label, start in FOCUS.items():
                  pos = bisect.bisect_right(starts, start)
                  end = starts[pos] if pos < len(starts) else start + 0x2000
                  if end <= start or end - start > 0x10000:
                      end = start + 0x4000
                  blob = image.read_rva(start, end - start)
                  rows = []
                  for ins in md.disasm(blob, base + start):
                      item = {
                          "rva": f"0x{ins.address - base:X}",
                          "mnemonic": ins.mnemonic,
                          "op_str": ins.op_str,
                      }
                      for op in ins.operands:
                          if op.type == X86_OP_IMM and ins.mnemonic in {"call", "jmp"}:
                              target = int(op.imm)
                              trva = target - base if target >= base else target
                              item["direct_target_rva"] = f"0x{trva:X}"
                              item["direct_target_owner"] = owner(trva)
                              break
                      for op in ins.operands:
                          if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                              target = (ins.address - base) + ins.size + op.mem.disp
                              item["rip_target_rva"] = f"0x{target:X}"
                              break
                      rows.append(item)
                  report[label] = {
                      "start_rva": f"0x{start:X}",
                      "owner": owner(start),
                      "instructions": rows,
                  }
                  print("METHOD", label, json.dumps(report[label]["owner"], ensure_ascii=False))
                  for item in rows:
                      if (
                          "direct_target_rva" in item
                          or "rip_target_rva" in item
                          or ("[" in item["op_str"] and any(
                              reg in item["op_str"].lower()
                              for reg in ("rcx", "rdx", "r8", "r9", "rsi", "rdi")
                          ))
                      ):
                          print(json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-container-projection-native.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
