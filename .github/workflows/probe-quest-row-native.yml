name: Probe ordinary 7.1 Quest row native schema

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-row-native.yml"

concurrency:
  group: probe-quest-row-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Resolve LAIMPNDEFCL runtime field types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-row-runtime-types.txt
          import csv
          import json
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          root = Path("versions/7.1.0-global/windows-x64/metadata")
          ROW_TDI = 17589
          FOCUS_TYPE_INDICES = {495576, 495577}

          def read_csv(name):
              with (root / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          types = read_csv("types.csv")
          fields = read_csv("fields.csv")
          methods = read_csv("methods.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          fields_by_tdi = {}
          methods_by_tdi = {}
          for row in fields:
              fields_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)
          for row in methods:
              methods_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)

          with PEImage(exe) as image:
              base = image.image_base
              type_array_va = int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva, 8), "little"
              )

              def read_entry_by_index(index):
                  va = type_array_va + index * ENTRY_SIZE
                  data = image.read_rva(va - base, ENTRY_SIZE)
                  if len(data) != ENTRY_SIZE:
                      raise ValueError(f"truncated runtime type {index}")
                  return data

              def read_entry_by_va(va):
                  data = image.read_rva(va - base, ENTRY_SIZE)
                  if len(data) != ENTRY_SIZE:
                      raise ValueError(f"truncated Il2CppType @ 0x{va:X}")
                  return data

              def describe_entry(entry, depth=0):
                  decoded = decode_type_entry(entry)
                  kind = int(decoded["kind"])
                  data_u64 = int.from_bytes(entry[:8], "little")
                  out = {
                      "kind": decoded["kind_name"],
                      "kind_value": kind,
                      "data_u64": f"0x{data_u64:X}",
                      "data_u32": int(decoded["data_u32"]),
                      "raw": entry.hex(),
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded["data_u32"])
                      out["type_definition_index"] = tdi
                      out["type"] = type_by_tdi.get(tdi)
                  elif kind in (0x0F, 0x10, 0x1D) and depth < 5:
                      nested = read_entry_by_va(data_u64)
                      out["target_valid"] = is_valid_type_entry(nested)
                      if out["target_valid"]:
                          out["target"] = describe_entry(nested, depth + 1)
                  return out

              row_fields = fields_by_tdi[ROW_TDI]
              report = {
                  "row_type": type_by_tdi[ROW_TDI],
                  "fields": [],
                  "focus_element_types": {},
              }

              print("=== LAIMPNDEFCL fields ===")
              for ordinal, field in enumerate(row_fields, 1):
                  type_index = int(field["field_type_index"])
                  entry = read_entry_by_index(type_index)
                  info = describe_entry(entry)
                  item = {
                      "ordinal": ordinal,
                      "field": field,
                      "runtime_type_index": type_index,
                      "runtime_type": info,
                  }
                  report["fields"].append(item)
                  print(json.dumps(item, ensure_ascii=False, sort_keys=True))

              print("=== focus runtime array types ===")
              for index in sorted(FOCUS_TYPE_INDICES):
                  entry = read_entry_by_index(index)
                  info = describe_entry(entry)
                  report["focus_element_types"][str(index)] = info
                  print("FOCUS", index, json.dumps(info, ensure_ascii=False, sort_keys=True))

                  target = info.get("target")
                  tdi = target.get("type_definition_index") if isinstance(target, dict) else None
                  if tdi is None:
                      continue

                  print(f"=== element typeDefinition {tdi} ===")
                  print(json.dumps(type_by_tdi.get(tdi, {}), ensure_ascii=False, sort_keys=True))
                  nested_type_defs = set()
                  for nested_field in fields_by_tdi.get(tdi, []):
                      nested_index = int(nested_field["field_type_index"])
                      nested_info = describe_entry(read_entry_by_index(nested_index))
                      print(
                          "ELEMENT_FIELD",
                          json.dumps(
                              {
                                  "field": nested_field,
                                  "runtime_type_index": nested_index,
                                  "runtime_type": nested_info,
                              },
                              ensure_ascii=False,
                              sort_keys=True,
                          ),
                      )
                      nested_tdi = nested_info.get("type_definition_index")
                      if isinstance(nested_tdi, int):
                          nested_type_defs.add(nested_tdi)
                  for method in methods_by_tdi.get(tdi, []):
                      print("ELEMENT_METHOD", json.dumps(method, ensure_ascii=False, sort_keys=True))

                  for nested_tdi in sorted(nested_type_defs):
                      print(
                          "NESTED_TYPE",
                          json.dumps(
                              type_by_tdi.get(nested_tdi, {}),
                              ensure_ascii=False,
                              sort_keys=True,
                          ),
                      )
                      for enum_field in fields_by_tdi.get(nested_tdi, []):
                          print(
                              "NESTED_TYPE_FIELD",
                              json.dumps(enum_field, ensure_ascii=False, sort_keys=True),
                          )

              Path("quest-row-runtime-types.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Disassemble complete LAIMPNDEFCL row reader
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=$(python - <<'PY'
          from genshinre.nativeprofile import PROFILE_71
          print(PROFILE_71.exe_sha256)
          PY
          )
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x9C15DF0 0x1630 --expected-sha256 "$expected_sha" --label LAIMPNDEFCL_GMENPOPMKAA_full --output quest-row-reader-full.json

          python - <<'PY' | tee quest-row-reader-calls.txt
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path("versions/7.1.0-global/windows-x64/metadata")
          body = json.loads(Path("quest-row-reader-full.json").read_text(encoding="utf-8"))

          with (root / "methods.csv").open("r", encoding="utf-8-sig", newline="") as f:
              methods = list(csv.DictReader(f))
          with (root / "types.csv").open("r", encoding="utf-8-sig", newline="") as f:
              types = list(csv.DictReader(f))

          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          by_rva = defaultdict(list)
          for row in methods:
              text = row.get("rva", "").strip()
              if not text:
                  continue
              try:
                  by_rva[int(text, 16)].append(row)
              except ValueError:
                  pass

          calls = []
          for insn in body["instructions"]:
              if insn["mnemonic"] != "call":
                  continue
              text = insn["op_str"].strip()
              if not text.startswith("0x"):
                  continue
              target_va = int(text, 16)
              target_rva = target_va - 0x140000000
              rows = by_rva.get(target_rva, [])
              item = {
                  "site_rva": insn["rva"],
                  "target_rva": f"0x{target_rva:X}",
                  "methods": rows,
                  "owners": [
                      type_by_tdi.get(int(r["type_definition_index"]), {})
                      for r in rows
                  ],
              }
              calls.append(item)
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-row-reader-calls.json").write_text(
              json.dumps(calls, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Trace named QuestProxy consumers of ordinary row arrays
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-proxy-array-consumers.txt
          import csv
          import json
          import re
          from bisect import bisect_right
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          root = Path("versions/7.1.0-global/windows-x64/metadata")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          def rows(name):
              with (root / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          methods = rows("methods.csv")
          types = rows("types.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          methods_by_tdi = {}
          all_rvas = []
          by_rva = {}
          for m in methods:
              tdi = int(m["type_definition_index"])
              methods_by_tdi.setdefault(tdi, []).append(m)
              text = m.get("rva", "").strip()
              if not text:
                  continue
              try:
                  rva = int(text, 16)
              except ValueError:
                  continue
              all_rvas.append(rva)
              by_rva.setdefault(rva, []).append(m)
          all_rvas = sorted(set(all_rvas))

          QUEST_PROXY = 87002
          FACADE = 40413
          ARRAY_OFFSETS = {0x10, 0x18, 0x20, 0x58}
          semantic_name = re.compile(
              r"(finish|fail|cond|exec|rewind|guide|content|valid|check|questconfig)",
              re.I,
          )

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = False

          with PEImage(exe) as image:
              base = image.image_base

              def method_body(m):
                  rva = int(m["rva"], 16)
                  pos = bisect_right(all_rvas, rva)
                  next_rva = all_rvas[pos] if pos < len(all_rvas) else rva + 0x800
                  size = min(max(1, next_rva - rva), 0x2000)
                  code = image.read_rva(rva, size)
                  return [
                      {
                          "rva": ins.address - base,
                          "mnemonic": ins.mnemonic,
                          "op_str": ins.op_str,
                      }
                      for ins in md.disasm(code, base + rva)
                  ]

              facade_rvas = {
                  int(m["rva"], 16): m
                  for m in methods_by_tdi.get(FACADE, [])
                  if m.get("rva", "").strip()
              }

              def relevant_accesses(insns):
                  hits = []
                  for ins in insns:
                      text = ins["op_str"].lower()
                      for off in ARRAY_OFFSETS:
                          if re.search(rf"\+ 0x{off:x}\]", text):
                              hits.append(
                                  {
                                      "rva": f"0x{ins['rva']:X}",
                                      "offset": f"0x{off:X}",
                                      "mnemonic": ins["mnemonic"],
                                      "op_str": ins["op_str"],
                                  }
                              )
                  return hits

              report = {
                  "quest_proxy_type": type_by_tdi[QUEST_PROXY],
                  "facade_type": type_by_tdi[FACADE],
                  "named_methods": [],
                  "facade_methods": {},
              }

              for m in methods_by_tdi.get(QUEST_PROXY, []):
                  if not m.get("rva", "").strip():
                      continue
                  if not semantic_name.search(m.get("method_name", "")):
                      continue
                  insns = method_body(m)
                  calls = []
                  for ins in insns:
                      if ins["mnemonic"] != "call":
                          continue
                      target = ins["op_str"].strip()
                      if not target.startswith("0x"):
                          continue
                      target_rva = int(target, 16) - base
                      if target_rva in facade_rvas:
                          fm = facade_rvas[target_rva]
                          calls.append(
                              {
                                  "site_rva": f"0x{ins['rva']:X}",
                                  "target_rva": f"0x{target_rva:X}",
                                  "facade_method": fm,
                              }
                          )
                  item = {
                      "method": m,
                      "ordinary_array_accesses": relevant_accesses(insns),
                      "facade_calls": calls,
                  }
                  report["named_methods"].append(item)
                  print("QUEST_PROXY", json.dumps(item, ensure_ascii=False, sort_keys=True))

              called_facade = {
                  int(call["target_rva"], 16)
                  for item in report["named_methods"]
                  for call in item["facade_calls"]
              }
              for rva in sorted(called_facade):
                  m = facade_rvas[rva]
                  insns = method_body(m)
                  item = {
                      "method": m,
                      "ordinary_array_accesses": relevant_accesses(insns),
                  }
                  report["facade_methods"][f"0x{rva:X}"] = item
                  print("FACADE", json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-proxy-array-consumers.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Cross-map ordinary arrays through RandomQuestExcelConfig facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-facade-array-map.txt
          import csv
          import json
          import re
          from bisect import bisect_right
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry
          from genshinre.sampleidentity import require_sha256

          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          root = Path("versions/7.1.0-global/windows-x64/metadata")
          require_sha256(exe, PROFILE_71.exe_sha256, label="executable")

          def read_csv(name):
              with (root / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          fields = read_csv("fields.csv")
          methods = read_csv("methods.csv")
          types = read_csv("types.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}
          fields_by_tdi = {}
          methods_by_tdi = {}
          for row in fields:
              fields_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)
          all_method_rvas = []
          for row in methods:
              methods_by_tdi.setdefault(int(row["type_definition_index"]), []).append(row)
              text = row.get("rva", "").strip()
              if text:
                  try:
                      all_method_rvas.append(int(text, 16))
                  except ValueError:
                      pass
          all_method_rvas = sorted(set(all_method_rvas))

          RANDOM_TDI = 36711
          FACADE_TDI = 40413
          ordinary_offsets = {0x10, 0x18, 0x20, 0x58}
          wanted_random_names = {
              "_finishCond", "_failCond", "_finishExec", "_failExec",
              "_acceptCond", "_beginExec",
          }

          with PEImage(exe) as image:
              base = image.image_base
              type_array_va = int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva, 8), "little"
              )

              def entry(index):
                  va = type_array_va + index * ENTRY_SIZE
                  return image.read_rva(va - base, ENTRY_SIZE)

              def size_align(type_index):
                  e = entry(type_index)
                  d = decode_type_entry(e)
                  k = int(d["kind"])
                  if k in (0x02, 0x04, 0x05):
                      return 1, 1
                  if k in (0x03, 0x06, 0x07):
                      return 2, 2
                  if k in (0x08, 0x09, 0x0C, 0x55):
                      return 4, 4
                  if k in (0x0A, 0x0B, 0x0D, 0x18, 0x19):
                      return 8, 8
                  if k in (0x0E, 0x0F, 0x10, 0x12, 0x14, 0x15, 0x1C, 0x1D):
                      return 8, 8
                  if k == 0x11:
                      # RandomQuestExcelConfig uses enum-valued fields here. Metadata
                      # also lists enum literals as fields, so field-count is not a
                      # valid enum/struct discriminator. The six exact-native layout
                      # anchors below reject any wrong size assumption.
                      return 4, 4
                  raise ValueError(f"unsupported runtime kind 0x{k:02X} for field type {type_index}")

              def align_up(v, a):
                  return (v + a - 1) & ~(a - 1)

              random_fields = fields_by_tdi[RANDOM_TDI]
              offset = 0x10
              layout = {}
              for fld in random_fields:
                  sz, al = size_align(int(fld["field_type_index"]))
                  offset = align_up(offset, al)
                  layout[fld["field_name"]] = offset
                  offset += sz

              anchors = {
                  "_acceptCond": 0x20,
                  "_mainId": 0x5C,
                  "_subId": 0x64,
                  "_acceptCondComb": 0x74,
                  "_order": 0x94,
                  "_subIdSet": 0x98,
              }
              for name, expected in anchors.items():
                  actual = layout.get(name)
                  if actual != expected:
                      raise AssertionError(
                          f"RandomQuest layout anchor {name}: got {actual!r}, expected 0x{expected:X}"
                      )

              wanted = {name: layout[name] for name in wanted_random_names if name in layout}
              print("RANDOM_LAYOUT", json.dumps(layout, ensure_ascii=False, sort_keys=True))
              print("WANTED_RANDOM", json.dumps(wanted, ensure_ascii=False, sort_keys=True))

              md = Cs(CS_ARCH_X86, CS_MODE_64)
              report = {
                  "random_layout": layout,
                  "wanted_random": wanted,
                  "candidates": [],
              }

              for m in methods_by_tdi[FACADE_TDI]:
                  text = m.get("rva", "").strip()
                  if not text:
                      continue
                  rva = int(text, 16)
                  pos = bisect_right(all_method_rvas, rva)
                  next_rva = all_method_rvas[pos] if pos < len(all_method_rvas) else rva + 0x400
                  size = min(max(1, next_rva - rva), 0x800)
                  code = image.read_rva(rva, size)
                  insns = [
                      {
                          "rva": ins.address - base,
                          "mnemonic": ins.mnemonic,
                          "op_str": ins.op_str,
                      }
                      for ins in md.disasm(code, base + rva)
                  ]

                  ordinary_hits = []
                  random_hits = []
                  for ins in insns:
                      op = ins["op_str"].lower()
                      for off in ordinary_offsets:
                          if re.search(rf"\+ 0x{off:x}\]", op):
                              ordinary_hits.append((off, ins))
                      for name, off in wanted.items():
                          if re.search(rf"\+ 0x{off:x}\]", op):
                              random_hits.append((name, off, ins))

                  if not ordinary_hits or not random_hits:
                      continue

                  item = {
                      "method": m,
                      "ordinary_hits": [
                          {
                              "offset": f"0x{off:X}",
                              "rva": f"0x{ins['rva']:X}",
                              "mnemonic": ins["mnemonic"],
                              "op_str": ins["op_str"],
                          }
                          for off, ins in ordinary_hits
                      ],
                      "random_hits": [
                          {
                              "field": name,
                              "offset": f"0x{off:X}",
                              "rva": f"0x{ins['rva']:X}",
                              "mnemonic": ins["mnemonic"],
                              "op_str": ins["op_str"],
                          }
                          for name, off, ins in random_hits
                      ],
                      "instructions": [
                          {
                              "rva": f"0x{ins['rva']:X}",
                              "mnemonic": ins["mnemonic"],
                              "op_str": ins["op_str"],
                          }
                          for ins in insns
                      ],
                  }
                  report["candidates"].append(item)
                  print("CANDIDATE", json.dumps(item, ensure_ascii=False, sort_keys=True))

          Path("quest-facade-array-map.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Trace ordinary Quest row array wrapper and table-binding xrefs
        shell: bash
        run: |
          set -euo pipefail

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-row-table-binding.json \
            --focus ordinary-row-array:0x9C15C80 \
            --focus ordinary-row-scalar:0x9C15DF0 \
            --max-body 0x4000 \
            | tee quest-row-table-binding.txt

          python - <<'PY' | tee quest-row-array-wrapper.txt
          import bisect
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE = Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT = Path("versions/7.1.0-global/windows-x64/metadata")
          ARRAY_RVA = 0x9C15C80
          SCALAR_RVA = 0x9C15DF0
          require_sha256(EXE, PROFILE_71.exe_sha256, label="executable")

          def read_csv(name):
              with (ROOT / name).open("r", encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          methods = read_csv("methods.csv")
          types = read_csv("types.csv")
          type_by_tdi = {int(r["type_definition_index"]): r for r in types}

          by_rva = defaultdict(list)
          starts = []
          for row in methods:
              text = (row.get("rva") or "").strip()
              if not text:
                  continue
              try:
                  rva = int(text, 16)
              except ValueError:
                  continue
              by_rva[rva].append(row)
              starts.append(rva)
          starts = sorted(set(starts))

          def owner(rva):
              pos = bisect.bisect_right(starts, rva) - 1
              if pos < 0:
                  return None
              start = starts[pos]
              end = starts[pos + 1] if pos + 1 < len(starts) else start + 0x10000
              if not (start <= rva < end):
                  return None
              return {
                  "start_rva": f"0x{start:X}",
                  "end_rva": f"0x{end:X}",
                  "methods": by_rva[start],
                  "owners": [
                      type_by_tdi.get(int(m["type_definition_index"]), {})
                      for m in by_rva[start]
                  ],
              }

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          report = {
              "array_rva": f"0x{ARRAY_RVA:X}",
              "scalar_rva": f"0x{SCALAR_RVA:X}",
              "array_metadata": by_rva.get(ARRAY_RVA, []),
              "scalar_metadata": by_rva.get(SCALAR_RVA, []),
              "array_body": [],
              "pointer_occurrences": [],
              "rip_xrefs_to_pointer_occurrences": [],
          }

          with PEImage(EXE) as image:
              base = image.image_base
              array_va = base + ARRAY_RVA
              scalar_va = base + SCALAR_RVA

              # The next metadata method is the scalar reader, so this is the exact
              # array-wrapper body range.
              blob = image.read_rva(ARRAY_RVA, SCALAR_RVA - ARRAY_RVA)
              for ins in md.disasm(blob, array_va):
                  item = {
                      "rva": f"0x{ins.address - base:X}",
                      "mnemonic": ins.mnemonic,
                      "op_str": ins.op_str,
                      "bytes": bytes(ins.bytes).hex(),
                  }
                  if ins.mnemonic in {"call", "jmp"}:
                      for op in ins.operands:
                          if op.type == X86_OP_IMM:
                              target = int(op.imm)
                              target_rva = target - base if target >= base else target
                              item["direct_target_rva"] = f"0x{target_rva:X}"
                              item["direct_target_owner"] = owner(target_rva)
                              break
                  report["array_body"].append(item)
                  print(
                      f"{item['rva']:>12} {item['mnemonic']:<7} "
                      f"{item['op_str']}"
                      + (
                          f" -> {item.get('direct_target_rva')} "
                          f"{item.get('direct_target_owner')}"
                          if item.get("direct_target_rva")
                          else ""
                      )
                  )

              # Locate literal method pointers to the array/scalar readers anywhere
              # in the image. These are useful when the table loader calls through
              # a registration/vtable/generic slot instead of a direct E8.
              wanted = {
                  struct.pack("<Q", array_va): "array",
                  struct.pack("<Q", scalar_va): "scalar",
              }
              pointer_sites = []
              for sec in image.sections:
                  data = image.read_rva(sec.virtual_address, sec.raw_size)
                  for packed, label in wanted.items():
                      pos = 0
                      while True:
                          pos = data.find(packed, pos)
                          if pos < 0:
                              break
                          site = sec.virtual_address + pos
                          pointer_sites.append((site, label))
                          item = {
                              "label": label,
                              "rva": f"0x{site:X}",
                              "section": sec.name,
                          }
                          report["pointer_occurrences"].append(item)
                          print("POINTER", json.dumps(item, ensure_ascii=False))
                          pos += 1

              # Resolve RIP-relative code references to any discovered method-pointer
              # slots. This catches indirect table-loader dispatch paths.
              site_set = {site for site, _ in pointer_sites}
              if site_set:
                  for sec in image.sections:
                      if not (sec.characteristics & 0x20000000):
                          continue
                      data = image.read_rva(sec.virtual_address, sec.raw_size)
                      for ins in md.disasm(data, base + sec.virtual_address):
                          irva = ins.address - base
                          for op in ins.operands:
                              if op.type != X86_OP_MEM or op.mem.base != X86_REG_RIP:
                                  continue
                              target = irva + ins.size + op.mem.disp
                              if target not in site_set:
                                  continue
                              item = {
                                  "site_rva": f"0x{irva:X}",
                                  "target_pointer_rva": f"0x{target:X}",
                                  "mnemonic": ins.mnemonic,
                                  "op_str": ins.op_str,
                                  "owner": owner(irva),
                              }
                              report["rip_xrefs_to_pointer_occurrences"].append(item)
                              print("RIP_XREF", json.dumps(item, ensure_ascii=False))

          Path("quest-row-array-wrapper.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
