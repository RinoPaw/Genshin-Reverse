name: Original 7.1 GadgetExcel raw u32 positive decoder control

on:
  push:
    branches: [main]
    paths: ['.github/workflows/control-7.1-gadget-raw-id-byte-scan.yml']

permissions:
  contents: read
concurrency:
  group: original-71-gadget-id-byte-positive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.x'}
      - run: python -m pip install -e . zstandard
      - name: Reconstruct pinned original Global 7.1 design blocks
        run: python scripts/fetch-7.1-design-blocks.py --output work/blocks
      - name: Fetch exact original exporter
        shell: bash
        run: |
          mkdir -p work
          curl -fLsS --retry 3 https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz -o work/AnimeStudio.tar.gz
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  work/AnimeStudio.tar.gz' | sha256sum --check
          mkdir -p work/cli
          tar -xzf work/AnimeStudio.tar.gz -C work/cli
      - name: Compare native-decoded original rows to raw byte patterns
        shell: bash
        run: |
          dotnet work/cli/AnimeStudio.CLI.dll work/blocks/25539185.blk work/raw --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
          python scripts/control-7.1-gadget-raw-id-byte-scan.py \
            --gadget-raw work/raw/MiHoYoBinData/d65ab32f.dat \
            --output work/original-71-gadget-source-raw-id-control.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-source-raw-id-control
          path: work/original-71-gadget-source-raw-id-control.json
          retention-days: 7
          if-no-files-found: error
