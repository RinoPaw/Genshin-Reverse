name: Publish 7.1 registry from xrefs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-7.1-registry-xrefs.yml'
      - 'genshinre/registryxrefpublish.py'
      - 'versions/7.1.0-global/windows-x64/registry/type-cache-xrefs.csv'
      - 'versions/7.1.0-global/windows-x64/registry/registry-type-slots.csv'
      - 'versions/7.1.0-global/windows-x64/proto/known-opcodes.csv'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Validate strict xref bijection and publish registry
        run: |
          ROOT=versions/7.1.0-global/windows-x64
          python -m genshinre.registryxrefpublish \
            "$ROOT/registry/type-cache-xrefs.csv" \
            "$ROOT/registry/registry-type-slots.csv" \
            "$ROOT/proto/known-opcodes.csv" \
            "$ROOT/registry/registry.csv" \
            --summary "$ROOT/registry/registry.summary.json"
          cat "$ROOT/registry/registry.summary.json"

      - name: Commit registry artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/registry.csv \
                  versions/7.1.0-global/windows-x64/registry/registry.summary.json
          if git diff --cached --quiet; then
            echo 'No registry changes.'
            exit 0
          fi
          git commit -m 'data: publish complete 7.1 registry from verified xrefs'
          git pull --rebase origin main
          git push origin HEAD:main
