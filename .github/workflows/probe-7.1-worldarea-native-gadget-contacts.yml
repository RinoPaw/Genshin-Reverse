name: Original 7.1 WorldArea native Gadget byte contacts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-worldarea-native-gadget-contacts.yml']

permissions:
  contents: read

concurrency:
  group: original-71-worldarea-gadget-id-contacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.x'}
      - run: python -m pip install -e . zstandard
      - name: Acquire pinned original binary exporter
        shell: bash
        run: |
          mkdir -p work
          curl -fLsS --retry 3 https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz -o work/AnimeStudio.tar.gz
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  work/AnimeStudio.tar.gz' | sha256sum --check
          mkdir -p work/cli
          tar -xzf work/AnimeStudio.tar.gz -C work/cli
      - name: Re-scan original WorldArea-containing Unity block with original GadgetExcel controls
        run: |
          python scripts/probe-7.1-worldarea-native-gadget-id-contacts.py \
            --block work/24230448.blk \
            --cli-dll work/cli/AnimeStudio.CLI.dll \
            --export work/bin-data \
            --output work/original-71-gadget-id-contacts.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-worldarea-gadget-id-contacts
          path: work/original-71-gadget-id-contacts.json
          retention-days: 7
          if-no-files-found: error
