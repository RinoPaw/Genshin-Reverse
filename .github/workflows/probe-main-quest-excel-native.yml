name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/typearray.py"
      - "genshinre/pe.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Decode generic field types and find Quest owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-generic-field-probe.txt
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, TYPE_KIND_NAMES, decode_type_entry, is_valid_type_entry

          root = Path('versions/7.1.0-global/windows-x64/metadata')
          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          type_rows = read_csv('types.csv')
          field_rows = read_csv('fields.csv')
          method_rows = read_csv('methods.csv')
          types = {int(r['type_definition_index']): r for r in type_rows}
          fields_by_type = defaultdict(list)
          methods_by_type = defaultdict(list)
          for row in field_rows:
              fields_by_type[int(row['type_definition_index'])].append(row)
          for row in method_rows:
              methods_by_type[int(row['type_definition_index'])].append(row)

          target_types = {
              54128: 'QuestCond',
              21416: 'QuestContent',
              71568: 'QuestExec',
          }

          with PEImage(exe) as image:
              image_base = image.image_base
              pointer_blob = image.read_rva(PROFILE_71.type_array_pointer_rva, 8)
              type_array_va = int.from_bytes(pointer_blob, 'little')
              type_array_rva = type_array_va - image_base

              def read_va(va, size):
                  if va < image_base:
                      raise ValueError(f'not an image VA: 0x{va:X}')
                  return image.read_rva(va - image_base, size)

              def runtime_entry(index):
                  if not (0 <= index < PROFILE_71.runtime_type_count):
                      raise ValueError(f'runtime type index out of range: {index}')
                  data = image.read_rva(type_array_rva + index * ENTRY_SIZE, ENTRY_SIZE)
                  if len(data) != ENTRY_SIZE or not is_valid_type_entry(data):
                      raise ValueError(f'invalid runtime Il2CppType entry {index}')
                  return data

              def direct_type(entry):
                  decoded = decode_type_entry(entry)
                  kind = int(decoded['kind'])
                  data_u64 = int.from_bytes(entry[:8], 'little')
                  result = {
                      'kind': TYPE_KIND_NAMES.get(kind, f'kind_0x{kind:02X}'),
                      'kind_value': kind,
                      'data_u64': f'0x{data_u64:X}',
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      if tdi in types:
                          result['type_definition_index'] = tdi
                          result['type_name'] = types[tdi].get('type_name', '')
                          result['namespace'] = types[tdi].get('namespace', '')
                  return result

              seen_vas = set()
              def describe_entry(entry, depth=0):
                  result = direct_type(entry)
                  kind = result['kind_value']
                  data_u64 = int(result['data_u64'], 0)
                  if depth >= 5:
                      result['truncated'] = True
                      return result
                  if kind == 0x1D:
                      try:
                          child = read_va(data_u64, ENTRY_SIZE)
                          if is_valid_type_entry(child):
                              result['element'] = describe_entry(child, depth + 1)
                      except (OSError, ValueError):
                          result['element_error'] = f'bad Il2CppType* 0x{data_u64:X}'
                  elif kind == 0x15:
                      generic_va = data_u64
                      if generic_va in seen_vas:
                          result['generic_error'] = 'recursive generic class'
                          return result
                      seen_vas.add(generic_va)
                      try:
                          blob = read_va(generic_va, 32)
                          first = struct.unpack_from('<Q', blob, 0)[0]
                          class_inst_va = struct.unpack_from('<Q', blob, 8)[0]
                          method_inst_va = struct.unpack_from('<Q', blob, 16)[0]
                          cached_class_va = struct.unpack_from('<Q', blob, 24)[0]
                          generic = {
                              'generic_class_va': f'0x{generic_va:X}',
                              'class_inst_va': f'0x{class_inst_va:X}',
                              'method_inst_va': f'0x{method_inst_va:X}',
                              'cached_class_va': f'0x{cached_class_va:X}',
                          }
                          if first in types:
                              generic['definition_layout'] = 'type_definition_index'
                              generic['definition'] = {
                                  'type_definition_index': first,
                                  'type_name': types[first].get('type_name', ''),
                                  'namespace': types[first].get('namespace', ''),
                              }
                          elif first >= image_base:
                              generic['definition_layout'] = 'type_pointer'
                              generic['definition_type_va'] = f'0x{first:X}'
                              definition_entry = read_va(first, ENTRY_SIZE)
                              if is_valid_type_entry(definition_entry):
                                  generic['definition'] = describe_entry(definition_entry, depth + 1)
                          else:
                              generic['definition_layout'] = 'unknown'
                              generic['definition_raw'] = f'0x{first:X}'

                          inst = read_va(class_inst_va, 16)
                          argc = struct.unpack_from('<I', inst, 0)[0]
                          argv_va = struct.unpack_from('<Q', inst, 8)[0]
                          generic['argument_count'] = argc
                          generic['argument_vector_va'] = f'0x{argv_va:X}'
                          if not (1 <= argc <= 16):
                              raise ValueError(f'implausible generic argc={argc}')
                          argv_blob = read_va(argv_va, argc * 8)
                          args = []
                          for i in range(argc):
                              arg_va = struct.unpack_from('<Q', argv_blob, i * 8)[0]
                              arg = {'type_va': f'0x{arg_va:X}'}
                              arg_entry = read_va(arg_va, ENTRY_SIZE)
                              if is_valid_type_entry(arg_entry):
                                  arg['type'] = describe_entry(arg_entry, depth + 1)
                              else:
                                  arg['error'] = 'invalid Il2CppType'
                              args.append(arg)
                          generic['arguments'] = args
                          result['generic'] = generic
                      except (OSError, ValueError, struct.error) as exc:
                          result['generic_error'] = str(exc)
                      finally:
                          seen_vas.discard(generic_va)
                  return result

              runtime_cache = {}
              def describe_runtime(index):
                  if index not in runtime_cache:
                      runtime_cache[index] = describe_entry(runtime_entry(index))
                  return runtime_cache[index]

              def argument_tdis(desc):
                  out = set()
                  if desc.get('kind_value') == 0x1D:
                      elem = desc.get('element') or {}
                      tdi = elem.get('type_definition_index')
                      if tdi is not None:
                          out.add(int(tdi))
                      out.update(argument_tdis(elem))
                  generic = desc.get('generic') or {}
                  for arg in generic.get('arguments', []):
                      item = arg.get('type') or {}
                      tdi = item.get('type_definition_index')
                      if tdi is not None:
                          out.add(int(tdi))
                      out.update(argument_tdis(item))
                  return out

              # Calibrate the runtime GenericInst layout with a field known from
              # earlier client dumps to be List<uint>.
              talk_tdi = 50151
              talk_field = next(
                  (r for r in fields_by_type[talk_tdi] if r.get('field_name') == '_nextValidTalkList'),
                  None,
              )
              if talk_field is None:
                  raise SystemExit('TalkExcelConfig._nextValidTalkList calibration field missing')
              talk_index = int(talk_field['field_type_index'])
              talk_desc = describe_runtime(talk_index)
              print('=== GENERIC LAYOUT CALIBRATION ===')
              print('TalkExcelConfig._nextValidTalkList', talk_index, json.dumps(talk_desc, ensure_ascii=False, sort_keys=True))
              if talk_desc.get('kind_value') != 0x15:
                  raise SystemExit('calibration field is not genericinst')
              talk_args = (talk_desc.get('generic') or {}).get('arguments') or []
              if len(talk_args) != 1 or (talk_args[0].get('type') or {}).get('kind') != 'u4':
                  raise SystemExit('7.1 Il2CppGenericClass layout calibration failed: expected List<uint>')

              print('=== QUEST CHILD TYPE FIELD USERS ===')
              matches = []
              owner_hits = defaultdict(list)
              for row in field_rows:
                  raw = row.get('field_type_index')
                  if not raw:
                      continue
                  index = int(raw)
                  try:
                      desc = describe_runtime(index)
                  except (OSError, ValueError):
                      continue
                  hits = sorted(argument_tdis(desc).intersection(target_types))
                  if not hits:
                      continue
                  owner_tdi = int(row['type_definition_index'])
                  item = {
                      'owner_tdi': owner_tdi,
                      'owner_type': types.get(owner_tdi, {}),
                      'field_index': row.get('field_index', ''),
                      'field_name': row.get('field_name', ''),
                      'field_type': row.get('field_type', ''),
                      'field_type_index': index,
                      'target_types': [{'tdi': tdi, 'name': target_types[tdi]} for tdi in hits],
                      'decoded_type': desc,
                  }
                  matches.append(item)
                  owner_hits[owner_tdi].append(item)
                  print(json.dumps(item, ensure_ascii=False, sort_keys=True))

              ranked = []
              for owner_tdi, items in owner_hits.items():
                  families = sorted({hit['name'] for item in items for hit in item['target_types']})
                  fields = fields_by_type[owner_tdi]
                  binary_methods = [
                      r for r in methods_by_type[owner_tdi]
                      if 'Binary' in (r.get('method_name') or '')
                  ]
                  score = 100 * len(families) + min(len(fields), 80) + 20 * bool(binary_methods)
                  ranked.append((score, owner_tdi, families, fields, binary_methods, items))
              ranked.sort(reverse=True, key=lambda x: x[0])

              print('=== RANKED QUEST OWNER CANDIDATES ===')
              candidates = []
              for score, owner_tdi, families, fields, binary_methods, items in ranked[:30]:
                  candidate = {
                      'score': score,
                      'type_definition_index': owner_tdi,
                      'type': types.get(owner_tdi, {}),
                      'families': families,
                      'field_count': len(fields),
                      'matched_fields': [
                          {
                              'field_index': x['field_index'],
                              'field_name': x['field_name'],
                              'field_type': x['field_type'],
                              'field_type_index': x['field_type_index'],
                              'target_types': x['target_types'],
                          }
                          for x in items
                      ],
                      'binary_methods': binary_methods,
                  }
                  candidates.append(candidate)
                  print(json.dumps(candidate, ensure_ascii=False, sort_keys=True))

              Path('quest-generic-field-users.json').write_text(
                  json.dumps({'matches': matches, 'candidates': candidates}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

              strong = [x for x in ranked if {'QuestCond', 'QuestContent'}.issubset(set(x[2]))]
              if not strong:
                  raise SystemExit('no field owner references both QuestCond and QuestContent through decoded array/generic types')

              score, owner_tdi, families, fields, binary_methods, items = strong[0]
              selected = {
                  'score': score,
                  'type_definition_index': owner_tdi,
                  'type': types.get(owner_tdi, {}),
                  'families': families,
                  'field_count': len(fields),
                  'fields': fields,
                  'binary_methods': binary_methods,
                  'matched_fields': items,
              }
              Path('selected-quest-row.json').write_text(
                  json.dumps(selected, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print('=== SELECTED MAIN QUEST ROW ===')
              print(json.dumps(selected, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-main-generic-field-types
          path: |
            quest-generic-field-probe.txt
            quest-generic-field-users.json
            selected-quest-row.json
          if-no-files-found: warn
