name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/typearray.py"
      - "genshinre/pe.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Resolve array element types and rank main Quest row
        run: |
          python - <<'PY' | tee quest-array-signature.txt
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, TYPE_KIND_NAMES, decode_type_entry, is_valid_type_entry

          root = Path('versions/7.1.0-global/windows-x64/metadata')
          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')

          def read(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types_rows = read('types.csv')
          field_rows = read('fields.csv')
          method_rows = read('methods.csv')
          types = {int(r['type_definition_index']): r for r in types_rows}
          fields_by_type = defaultdict(list)
          methods_by_type = defaultdict(list)
          for row in field_rows:
              fields_by_type[int(row['type_definition_index'])].append(row)
          for row in method_rows:
              methods_by_type[int(row['type_definition_index'])].append(row)

          with PEImage(exe) as image:
              pointer_blob = image.read_rva(PROFILE_71.type_array_pointer_rva, 8)
              type_array_va = int.from_bytes(pointer_blob, 'little')
              type_array_rva = type_array_va - image.image_base

              def entry_for_runtime_index(index):
                  if not (0 <= index < PROFILE_71.runtime_type_count):
                      raise ValueError(f'runtime type index out of range: {index}')
                  entry = image.read_rva(type_array_rva + index * ENTRY_SIZE, ENTRY_SIZE)
                  if not is_valid_type_entry(entry):
                      raise ValueError(f'invalid runtime Il2CppType entry {index}')
                  return entry

              def describe_entry(entry, depth=0):
                  if depth > 4:
                      return {'kind': 'recursive-limit'}
                  decoded = decode_type_entry(entry)
                  kind = int(decoded['kind'])
                  data_u64 = int.from_bytes(entry[:8], 'little')
                  result = {
                      'kind': TYPE_KIND_NAMES.get(kind, f'kind_0x{kind:02X}'),
                      'kind_value': kind,
                      'data_u64': f'0x{data_u64:X}',
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      row = types.get(tdi, {})
                      result['type_definition_index'] = tdi
                      result['type_name'] = row.get('type_name', '')
                      result['namespace'] = row.get('namespace', '')
                  elif kind == 0x1D:
                      target_rva = data_u64 - image.image_base
                      target = image.read_rva(target_rva, ENTRY_SIZE)
                      if len(target) != ENTRY_SIZE or not is_valid_type_entry(target):
                          result['element_error'] = f'invalid Il2CppType* 0x{data_u64:X}'
                      else:
                          result['element_rva'] = f'0x{target_rva:X}'
                          result['element'] = describe_entry(target, depth + 1)
                  return result

              cache = {}
              def describe_runtime(index):
                  if index not in cache:
                      cache[index] = describe_entry(entry_for_runtime_index(index))
                  return cache[index]

              def semantic_key(index):
                  desc = describe_runtime(index)
                  kind = desc['kind']
                  if kind == 'szarray':
                      elem = desc.get('element') or {}
                      if 'type_definition_index' in elem:
                          return f"array:tdi:{elem['type_definition_index']}:{elem.get('type_name','')}"
                      return f"array:{elem.get('kind','unknown')}"
                  if 'type_definition_index' in desc:
                      return f"tdi:{desc['type_definition_index']}:{desc.get('type_name','')}"
                  return kind

              anchors = {
                  548701: 71568,  # RandomQuest begin/fail/finishExec -> QuestExec[]
                  548703: 54128,  # acceptCond -> QuestCond[]
                  548704: 21416,  # finish/failCond -> QuestContent[]
              }
              print('=== KNOWN RANDOM QUEST ARRAY ANCHORS ===')
              for index, expected_tdi in anchors.items():
                  desc = describe_runtime(index)
                  print(index, json.dumps(desc, ensure_ascii=False, sort_keys=True))
                  actual = ((desc.get('element') or {}).get('type_definition_index'))
                  if actual != expected_tdi:
                      raise SystemExit(f'array anchor {index} resolved to typeDef {actual}, expected {expected_tdi}')

              random_tdi = 36711
              random_signature = Counter(
                  semantic_key(int(row['field_type_index']))
                  for row in fields_by_type[random_tdi]
                  if row.get('field_type_index')
              )
              print('=== RANDOM QUEST SEMANTIC SIGNATURE ===')
              for key, count in random_signature.most_common():
                  print(count, key)

              # Main QuestExcel historically shares the core Quest condition/exec/show
              # shape with RandomQuest, but has extra uint arrays and text-map fields.
              # Score every plausible row type; do not require preserved method names.
              weighted_targets = {
                  'array:tdi:71568:QuestExec': (3, 22),
                  'array:tdi:54128:QuestCond': (1, 28),
                  'array:tdi:21416:QuestContent': (2, 26),
                  semantic_key(495518): (3, 14),  # LogicType-equivalent
                  semantic_key(501812): (2, 12),  # QuestShowType
                  semantic_key(548705): (1, 12),  # ShowQuestGuideType
              }
              ranked = []
              for tdi, rows in fields_by_type.items():
                  if tdi in {19426, 36711} or not (24 <= len(rows) <= 60):
                      continue
                  sig = Counter(
                      semantic_key(int(row['field_type_index']))
                      for row in rows
                      if row.get('field_type_index')
                  )
                  score = 0
                  hits = []
                  for key, (wanted, weight) in weighted_targets.items():
                      found = sig.get(key, 0)
                      overlap = min(found, wanted)
                      if overlap:
                          score += overlap * weight
                          hits.append((key, found, wanted, overlap * weight))
                  # Historical QuestExcel is around thirty instance fields. Keep this a
                  # weak tie-breaker only; semantic nested types dominate the score.
                  score += max(0, 12 - abs(len(rows) - 32))
                  row = types.get(tdi, {})
                  ranked.append((score, tdi, len(rows), row, sig, hits))

              ranked.sort(key=lambda item: (item[0], -abs(item[2] - 32)), reverse=True)
              print('=== MAIN QUEST STRUCTURAL CANDIDATES ===')
              for score, tdi, field_count, type_row, sig, hits in ranked[:40]:
                  print('CANDIDATE', score, 'tdi=', tdi, 'fields=', field_count,
                        json.dumps(type_row, ensure_ascii=False, sort_keys=True))
                  print(' HITS', json.dumps(hits, ensure_ascii=False))
                  print(' SIGNATURE', json.dumps(sig.most_common(), ensure_ascii=False))
                  binary = [r for r in methods_by_type.get(tdi, ()) if 'Binary' in (r.get('method_name') or '')]
                  print(' BINARY_METHODS', json.dumps(binary, ensure_ascii=False, sort_keys=True))
                  print(' ALL_METHODS', json.dumps(methods_by_type.get(tdi, ()), ensure_ascii=False, sort_keys=True))
                  print(' FIELDS', json.dumps([
                      [r.get('field_index'), r.get('field_name'), r.get('field_type'), r.get('field_type_index'), semantic_key(int(r['field_type_index']))]
                      for r in sorted(rows if tdi == int(rows[0]['type_definition_index']) else fields_by_type[tdi], key=lambda x: int(x['field_index']))
                  ], ensure_ascii=False))

              if not ranked or ranked[0][0] < 80:
                  raise SystemExit(f'no strong main Quest structural candidate; top score={ranked[0][0] if ranked else None}')
          PY
      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-main-array-signature
          path: quest-array-signature.txt
          if-no-files-found: error
