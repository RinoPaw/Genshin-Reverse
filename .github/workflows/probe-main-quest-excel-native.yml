name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/typearray.py"
      - "genshinre/pe.py"
      - "genshinre/xrefs.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace compact generic table owner initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-generic-owner-xrefs.txt
          import json
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry
          from genshinre.xrefs import scan_rip_xrefs

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          generic_owner_slot_rva = 0x5AD4E98
          type_base_slot_rva = 0x5AD4E90
          resolver_rva = 0x51CD50
          known_runtime_index = 476756
          known_generic_handle = 0x12F8

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = False

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              types_va = int.from_bytes(read_rva(PROFILE_71.type_array_pointer_rva, 8), 'little')
              entry = read_rva(types_va - base + known_runtime_index * ENTRY_SIZE, ENTRY_SIZE)
              if not is_valid_type_entry(entry):
                  raise SystemExit('known generic runtime type entry invalid')
              decoded = decode_type_entry(entry)
              handle = int.from_bytes(entry[:8], 'little')
              print('known_runtime_type=', {'index': known_runtime_index, 'kind': decoded['kind_name'], 'handle': hex(handle)})
              if decoded['kind'] != 0x15 or handle != known_generic_handle:
                  raise SystemExit('List<uint> generic handle drifted')

              targets = [generic_owner_slot_rva, type_base_slot_rva]
              scan = scan_rip_xrefs(exe, targets, window=128)
              print('=== SLOT XREF SUMMARY ===')
              print(json.dumps(scan['matches'], indent=2))
              if not any(scan['matches'].values()):
                  raise SystemExit('no direct code xrefs to compact generic owner slots')

              print('=== SLOT XREF WINDOWS ===')
              windows = []
              seen = set()
              for target, rows in scan['matches'].items():
                  for row in rows:
                      rva = int(row['instruction_rva'], 0)
                      if rva in seen:
                          continue
                      seen.add(rva)
                      start = max(0, rva - 112)
                      blob = read_rva(start, 320)
                      print(f'--- xref RVA 0x{rva:X} target {target} ---')
                      lines = []
                      for insn in md.disasm(blob, base + start):
                          irva = insn.address - base
                          marker = ' <==' if irva == rva else ''
                          text = f'0x{irva:09X}: {insn.bytes.hex():<24} {insn.mnemonic:<8} {insn.op_str}{marker}'
                          print(text)
                          lines.append(text)
                      windows.append({'target': target, 'xref_rva': hex(rva), 'lines': lines})

              print('=== TYPE RESOLVER 0x51CD50 ===')
              start = resolver_rva - 0x40
              blob = read_rva(start, 0x300)
              resolver_lines = []
              for insn in md.disasm(blob, base + start):
                  irva = insn.address - base
                  marker = ' <==' if irva == resolver_rva else ''
                  text = f'0x{irva:09X}: {insn.bytes.hex():<24} {insn.mnemonic:<8} {insn.op_str}{marker}'
                  print(text)
                  resolver_lines.append(text)

              Path('quest-generic-owner-xrefs.json').write_text(
                  json.dumps({
                      'known_runtime_index': known_runtime_index,
                      'known_generic_handle': handle,
                      'slots': {
                          'type_base': hex(type_base_slot_rva),
                          'generic_owner': hex(generic_owner_slot_rva),
                      },
                      'xrefs': scan['matches'],
                      'windows': windows,
                      'resolver_rva': hex(resolver_rva),
                      'resolver_lines': resolver_lines,
                  }, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-generic-owner-xrefs
          path: |
            quest-generic-owner-xrefs.txt
            quest-generic-owner-xrefs.json
          if-no-files-found: warn
