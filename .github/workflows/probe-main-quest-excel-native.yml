name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/typearray.py"
      - "genshinre/pe.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Locate MetadataRegistration and inspect generic handle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-generic-registration-probe.txt
          import json
          import struct
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          known_runtime_index = 476756
          known_generic_handle = 0x12F8

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              def read_va(va, size):
                  if va < base:
                      raise ValueError(f'not image VA: 0x{va:X}')
                  return read_rva(va - base, size)

              def qword_rva(rva):
                  return struct.unpack('<Q', read_rva(rva, 8))[0]

              def qword_va(va):
                  return struct.unpack('<Q', read_va(va, 8))[0]

              types_va = qword_rva(PROFILE_71.type_array_pointer_rva)
              types_count = PROFILE_71.runtime_type_count
              needle = struct.pack('<QQ', types_count, types_va)
              sites = []
              for section in image.sections:
                  blob = image.read_rva(section.virtual_address, section.raw_size)
                  start = 0
                  while True:
                      pos = blob.find(needle, start)
                      if pos < 0:
                          break
                      sites.append((section.name, section.virtual_address + pos))
                      start = pos + 1

              print('types_count=', types_count)
              print('types_va=', hex(types_va), 'types_rva=', hex(types_va - base))
              print('registration_type_pair_sites=', [(name, hex(rva)) for name, rva in sites])
              if len(sites) != 1:
                  raise SystemExit(f'expected exactly one MetadataRegistration type pair, got {len(sites)}')

              section_name, types_pair_rva = sites[0]
              registration_rva = types_pair_rva - 0x30
              print('registration_section=', section_name)
              print('registration_rva=', hex(registration_rva), 'registration_va=', hex(base + registration_rva))

              labels = [
                  ('genericClassesCount', 0x00),
                  ('genericClasses', 0x08),
                  ('genericInstsCount', 0x10),
                  ('genericInsts', 0x18),
                  ('genericMethodTableCount', 0x20),
                  ('genericMethodTable', 0x28),
                  ('typesCount', 0x30),
                  ('types', 0x38),
                  ('methodSpecsCount', 0x40),
                  ('methodSpecs', 0x48),
                  ('fieldOffsetsCount', 0x50),
                  ('fieldOffsets', 0x58),
                  ('typeDefinitionsSizesCount', 0x60),
                  ('typeDefinitionsSizes', 0x68),
                  ('metadataUsagesCount', 0x70),
                  ('metadataUsages', 0x78),
              ]
              registration = {}
              for label, off in labels:
                  value = qword_rva(registration_rva + off)
                  registration[label] = value
                  suffix = f' rva=0x{value-base:X}' if value >= base else ''
                  print(f'{label:28s} 0x{value:X}{suffix}')

              if registration['typesCount'] != types_count or registration['types'] != types_va:
                  raise SystemExit('MetadataRegistration standard pair layout did not validate')

              type_entry = read_va(types_va + known_runtime_index * ENTRY_SIZE, ENTRY_SIZE)
              if not is_valid_type_entry(type_entry):
                  raise SystemExit('known List<uint> runtime type entry is invalid')
              decoded = decode_type_entry(type_entry)
              data_u64 = int.from_bytes(type_entry[:8], 'little')
              print('known_runtime_type=', {
                  'index': known_runtime_index,
                  'kind': decoded['kind_name'],
                  'data_u64': hex(data_u64),
              })
              if decoded['kind'] != 0x15 or data_u64 != known_generic_handle:
                  raise SystemExit('known List<uint> compact generic handle drifted')

              evidence = {'registration': registration, 'handle': known_generic_handle, 'views': {}}
              for table_name, count_name in (('genericClasses', 'genericClassesCount'), ('genericInsts', 'genericInstsCount')):
                  table_va = registration[table_name]
                  count = registration[count_name]
                  view = {'count': count, 'table_va': hex(table_va)}
                  if 0 <= known_generic_handle < count and table_va >= base:
                      entry_va = qword_va(table_va + known_generic_handle * 8)
                      view['entry_va'] = hex(entry_va)
                      if entry_va >= base:
                          raw = read_va(entry_va, 64)
                          view['raw64'] = raw.hex()
                          view['qwords'] = [hex(x) for x in struct.unpack('<8Q', raw)]
                  evidence['views'][table_name] = view
                  print(table_name, json.dumps(view, sort_keys=True))

              Path('quest-generic-registration.json').write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
          PY
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-generic-registration
          path: |
            quest-generic-registration-probe.txt
            quest-generic-registration.json
          if-no-files-found: warn
