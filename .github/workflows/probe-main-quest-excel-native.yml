name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Map Quest field-type structure
        run: |
          python - <<'PY' | tee quest-field-type-map.txt
          import csv, json, math
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64/metadata')

          def read(name):
              path = root / name
              if not path.exists():
                  return []
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          tables = {}
          for path in sorted(root.glob('*.csv')):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  tables[path.name] = list(reader)
                  print('HEADER', path.name, json.dumps(reader.fieldnames, ensure_ascii=False))

          types = {r['type_definition_index']: r for r in tables['types.csv']}
          fields = tables['fields.csv']
          methods = tables['methods.csv']
          fields_by_type = defaultdict(list)
          methods_by_type = defaultdict(list)
          for row in fields:
              fields_by_type[row['type_definition_index']].append(row)
          for row in methods:
              methods_by_type[row['type_definition_index']].append(row)

          semantic = {
              'RandomMainQuestExcelConfig': '19426',
              'QuestContent': '21416',
              'RandomQuestExcelConfig': '36711',
              'QuestCond': '54128',
              'QuestExec': '71568',
              'RandomQuestCond': '76090',
          }
          print('=== SEMANTIC TYPE ROWS / FIELDS ===')
          seed_field_type_indices = set()
          for label, tdi in semantic.items():
              print('TYPE', label, tdi, json.dumps(types.get(tdi), ensure_ascii=False, sort_keys=True))
              rows = sorted(fields_by_type.get(tdi, ()), key=lambda r: int(r['field_index']))
              for row in rows:
                  print(' FIELD', label, json.dumps(row, ensure_ascii=False, sort_keys=True))
                  if row.get('field_type_index'):
                      seed_field_type_indices.add(row['field_type_index'])
              for row in methods_by_type.get(tdi, ()):
                  if row.get('method_name') in {'FromBinary', 'FromBinaryInner'}:
                      print(' METHOD', label, json.dumps(row, ensure_ascii=False, sort_keys=True))

          type_frequency = Counter(row.get('field_type_index') or '' for row in fields)
          random_indices = Counter(
              row.get('field_type_index') or ''
              for row in fields_by_type.get(semantic['RandomQuestExcelConfig'], ())
              if row.get('field_type_index')
          )
          print('=== RANDOM QUEST FIELD-TYPE INDEX FREQUENCIES ===')
          for index, count in random_indices.items():
              print('INDEX', index, 'random_count=', count, 'global_field_count=', type_frequency[index])

          print('=== CROSS-TABLE REFERENCES TO SEMANTIC TDIs / FIELD-TYPE INDICES ===')
          needles = set(semantic.values()) | seed_field_type_indices
          for filename, rows in tables.items():
              hits = []
              for row in rows:
                  if any(str(value) in needles for value in row.values()):
                      hits.append(row)
              if hits:
                  print('TABLE', filename, 'HITS', len(hits))
                  for row in hits[:300]:
                      print(' REF', filename, json.dumps(row, ensure_ascii=False, sort_keys=True))

          # Compare large binary-deserialized row types to RandomQuestExcelConfig by
          # exact field-type indices. Rare shared indices carry more information than
          # primitive indices used by thousands of fields.
          excluded = {
              '19426', '36711', '35267', '48659', '28858', '48735',
          }
          ranked = []
          for tdi, rows in fields_by_type.items():
              if tdi in excluded or not (15 <= len(rows) <= 90):
                  continue
              method_rows = methods_by_type.get(tdi, ())
              one_arg_inner = [
                  r for r in method_rows
                  if r.get('method_name') == 'FromBinaryInner'
                  and r.get('parameter_count') == '1'
                  and r.get('rva') not in ('', '0', '0x0', None)
              ]
              if len(one_arg_inner) != 1:
                  continue
              candidate_indices = Counter(
                  row.get('field_type_index') or '' for row in rows if row.get('field_type_index')
              )
              common = random_indices.keys() & candidate_indices.keys()
              score = 0.0
              detail = []
              for index in common:
                  freq = max(1, type_frequency[index])
                  overlap = min(random_indices[index], candidate_indices[index])
                  weight = math.log2((len(fields) + 1) / freq)
                  score += overlap * weight
                  detail.append((index, overlap, freq, round(weight, 3)))
              detail.sort(key=lambda x: (x[3], x[1]), reverse=True)
              type_row = types.get(tdi) or {}
              ranked.append((score, len(detail), len(rows), tdi, one_arg_inner[0]['rva'], detail, type_row))

          ranked.sort(key=lambda x: (x[0], x[1], x[2]), reverse=True)
          print('=== RARE FIELD-TYPE OVERLAP CANDIDATES ===')
          for score, distinct, field_count, tdi, rva, detail, type_row in ranked[:50]:
              print('CANDIDATE', f'{score:.3f}', 'shared=', distinct, 'fields=', field_count,
                    'tdi=', tdi, 'rva=', rva, json.dumps(type_row, ensure_ascii=False, sort_keys=True))
              print(' SHARED', json.dumps(detail, ensure_ascii=False))
              print(' FIELD_TYPES', json.dumps([
                  [row.get('field_index'), row.get('field_name'), row.get('field_type_index')]
                  for row in sorted(fields_by_type[tdi], key=lambda r: int(r['field_index']))
              ], ensure_ascii=False))
          PY
      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-main-field-type-map
          path: quest-field-type-map.txt
          if-no-files-found: error
