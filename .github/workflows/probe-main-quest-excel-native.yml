name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "tools/trace_native_call_edges.py"
      - "tools/disassemble_rva.py"
      - "genshinre/nativeprofile.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Locate current QuestExcel accessor owners
        run: |
          python - <<'PY' | tee quest-accessor-candidates.txt
          import csv, json
          from collections import defaultdict
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64/metadata')
          def read(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types = {r['type_definition_index']: r for r in read('types.csv')}
          fields = read('fields.csv')
          methods = read('methods.csv')
          by_type = defaultdict(list)
          for row in methods:
              by_type[row['type_definition_index']].append(row)

          needles = {
              '_g_get_mainId', '_g_get_subId', '_g_get_order',
              '_g_get_acceptCond', '_g_get_finishCond', '_g_get_failCond',
              '_s_set_mainId', '_s_set_subId', '_s_set_acceptCond', '_s_set_failCond',
          }
          scored = []
          for tdi, rows in by_type.items():
              names = {r.get('method_name') or '' for r in rows}
              hits = sorted(needles & names)
              if hits:
                  scored.append((len(hits), tdi, hits, rows))
          scored.sort(reverse=True)
          print('=== ACCESSOR OWNER CANDIDATES ===')
          for score, tdi, hits, rows in scored[:30]:
              print('OWNER', score, json.dumps(types.get(tdi), ensure_ascii=False))
              print('HITS', hits)
              for row in rows:
                  name = row.get('method_name') or ''
                  if name in needles or 'Quest' in name or 'quest' in name:
                      print(' METHOD', json.dumps(row, ensure_ascii=False))

          print('=== SEMANTIC QUEST TYPE NAMES ===')
          for tdi, row in types.items():
              name = row.get('type_name') or ''
              ns = row.get('namespace') or ''
              if 'questexcel' in name.lower() or ('quest' in name.lower() and 'config' in ns.lower()):
                  print('TYPE', json.dumps(row, ensure_ascii=False))

          print('=== TYPES WITH FromBinaryInner + LARGE FIELD SET ===')
          for tdi, rows in by_type.items():
              method_names = {r.get('method_name') or '' for r in rows}
              t = types.get(tdi) or {}
              try:
                  fc = int(t.get('field_count') or 0)
              except ValueError:
                  fc = 0
              if 'FromBinaryInner' in method_names and 20 <= fc <= 80:
                  print('TYPE', json.dumps(t, ensure_ascii=False))
                  for row in rows:
                      if row.get('method_name') in {'.ctor','FromBinary','FromBinaryInner'}:
                          print(' METHOD', json.dumps(row, ensure_ascii=False))
          PY
      - name: Upload focused metadata evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-accessor-owner-probe
          path: quest-accessor-candidates.txt
          if-no-files-found: error
