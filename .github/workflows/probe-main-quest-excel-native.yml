name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "tools/trace_native_call_edges.py"
      - "genshinre/nativeprofile.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Dump obfuscated candidate contracts
        run: |
          python - <<'PY' | tee quest-candidate-contracts.txt
          import csv, json
          from pathlib import Path
          root = Path('versions/7.1.0-global/windows-x64/metadata')
          def read(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          types = {r['type_definition_index']: r for r in read('types.csv')}
          fields = read('fields.csv')
          methods = read('methods.csv')
          for tdi in ('35267','48659'):
              print('=== TYPE', tdi, '===')
              print(json.dumps(types[tdi], ensure_ascii=False))
              for row in fields:
                  if row.get('type_definition_index') == tdi:
                      print('FIELD', json.dumps(row, ensure_ascii=False))
              for row in methods:
                  if row.get('type_definition_index') == tdi:
                      print('METHOD', json.dumps(row, ensure_ascii=False))
          PY
      - name: Trace both candidate FromBinaryInner methods
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-candidate-call-edges.json \
            --focus candidate-35267:0x11098B90 \
            --focus candidate-48659:0x0EB4B400 \
            --focus quest-cond-inner:0x115825D0 \
            --max-body 0x6000 | tee quest-candidate-call-summary.txt
      - name: Summarize candidate calls and stores
        run: |
          python - <<'PY' | tee quest-candidate-native-summary.txt
          import json, re
          report=json.load(open('quest-candidate-call-edges.json',encoding='utf-8'))
          for key in ('candidate-35267','candidate-48659'):
              item=report['focus'][key]
              print('===',key,'===')
              print('OWNER',json.dumps(item['owner'],ensure_ascii=False))
              print('CALLERS',item['validated_direct_caller_count'])
              for caller in item['direct_callers']:
                  print('CALLER',json.dumps(caller,ensure_ascii=False))
              for row in item['direct_edges']:
                  print('EDGE',json.dumps(row,ensure_ascii=False))
              print('FIRST')
              for row in item['disassembly'][:180]:
                  print(f"{row['rva']}\t{row['mnemonic']}\t{row['op_str']}")
          PY
      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-obfuscated-candidate-probe
          path: |
            quest-candidate-contracts.txt
            quest-candidate-call-edges.json
            quest-candidate-call-summary.txt
            quest-candidate-native-summary.txt
          if-no-files-found: error
