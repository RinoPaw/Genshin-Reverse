name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/pe.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Find main Quest row from child FromBinaryInner calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-child-caller-probe.txt
          import bisect
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86 import X86_OP_IMM

          from genshinre.pe import PEImage

          root = Path('versions/7.1.0-global/windows-x64/metadata')
          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          type_rows = read_csv('types.csv')
          field_rows = read_csv('fields.csv')
          method_rows = read_csv('methods.csv')
          types = {int(r['type_definition_index']): r for r in type_rows}
          fields_by_type = defaultdict(list)
          methods_by_type = defaultdict(list)
          methods_by_rva = defaultdict(list)
          for row in field_rows:
              fields_by_type[int(row['type_definition_index'])].append(row)
          for row in method_rows:
              tdi = int(row['type_definition_index'])
              methods_by_type[tdi].append(row)
              raw = row.get('rva') or ''
              if raw:
                  try:
                      rva = int(raw, 0)
                  except ValueError:
                      continue
                  if rva > 0:
                      methods_by_rva[rva].append(row)

          starts = sorted(methods_by_rva)

          def compact_method(row):
              return {
                  'method_index': row.get('method_index', ''),
                  'type_definition_index': row.get('type_definition_index', ''),
                  'type_name': row.get('type_name', ''),
                  'method_name': row.get('method_name', ''),
                  'parameter_count': row.get('parameter_count', ''),
                  'parameter_types': row.get('parameter_types', ''),
                  'rva': row.get('rva', ''),
              }

          def owner_start_for(rva):
              i = bisect.bisect_right(starts, rva) - 1
              if i < 0:
                  return None
              start = starts[i]
              end = starts[i + 1] if i + 1 < len(starts) else start + 0x10000
              if start <= rva < end:
                  return start
              return None

          child_types = {
              'QuestCond': 54128,
              'QuestContent': 21416,
              'QuestExec': 71568,
          }
          target_family = {}
          print('=== CHILD DESERIALIZERS ===')
          for family, tdi in child_types.items():
              rows = [
                  row for row in methods_by_type[tdi]
                  if row.get('method_name') == 'FromBinaryInner' and row.get('rva')
              ]
              print(family, 'tdi=', tdi, json.dumps([compact_method(r) for r in rows], ensure_ascii=False))
              if not rows:
                  raise SystemExit(f'no FromBinaryInner method for {family} TDI {tdi}')
              for row in rows:
                  target_family[int(row['rva'], 0)] = family

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def direct_call_target(image_base, insn):
              if insn.mnemonic != 'call':
                  return None
              for operand in insn.operands:
                  if operand.type == X86_OP_IMM:
                      value = int(operand.imm)
                      return value - image_base if value >= image_base else value
              return None

          with PEImage(exe) as image:
              raw_sites = defaultdict(list)
              wanted = set(target_family)
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob = image.read_rva(sec.virtual_address, sec.raw_size)
                  pos = 0
                  while True:
                      pos = blob.find(b'\xE8', pos)
                      if pos < 0:
                          break
                      if pos + 5 <= len(blob):
                          rel = struct.unpack_from('<i', blob, pos + 1)[0]
                          site = sec.virtual_address + pos
                          target = site + 5 + rel
                          if target in wanted:
                              raw_sites[target].append(site)
                      pos += 1

              owner_candidate_sites = defaultdict(set)
              for target, sites in raw_sites.items():
                  for site in sites:
                      owner = owner_start_for(site)
                      if owner is not None:
                          owner_candidate_sites[owner].add(site)

              validated = []
              for owner_start, candidate_sites in owner_candidate_sites.items():
                  i = bisect.bisect_left(starts, owner_start)
                  owner_end = starts[i + 1] if i + 1 < len(starts) else owner_start + 0x10000
                  owner_end = min(owner_end, owner_start + 0x20000)
                  body = image.read_rva(owner_start, owner_end - owner_start)
                  for insn in md.disasm(body, image.image_base + owner_start):
                      site = insn.address - image.image_base
                      if site not in candidate_sites:
                          continue
                      target = direct_call_target(image.image_base, insn)
                      if target in target_family:
                          validated.append((owner_start, site, target, target_family[target]))

          hits_by_owner = defaultdict(list)
          for owner_start, site, target, family in validated:
              hits_by_owner[owner_start].append({
                  'site_rva': f'0x{site:X}',
                  'target_rva': f'0x{target:X}',
                  'family': family,
              })

          ranked = []
          for owner_start, hits in hits_by_owner.items():
              owner_rows = methods_by_rva[owner_start]
              families = sorted({h['family'] for h in hits})
              binary_inner = any(r.get('method_name') == 'FromBinaryInner' for r in owner_rows)
              config_owner = any((types.get(int(r['type_definition_index']), {}).get('namespace') or '') == 'MoleMole.Config' for r in owner_rows)
              field_count = max((len(fields_by_type[int(r['type_definition_index'])]) for r in owner_rows), default=0)
              score = 100 * len(families) + 20 * int(binary_inner) + 10 * int(config_owner) + min(field_count, 80) / 10
              ranked.append((score, owner_start, families, hits, owner_rows, field_count))
          ranked.sort(reverse=True, key=lambda item: item[0])

          print('=== VALIDATED DIRECT CALLER CANDIDATES ===')
          report_candidates = []
          for score, owner_start, families, hits, owner_rows, field_count in ranked[:40]:
              td_indices = sorted({int(r['type_definition_index']) for r in owner_rows})
              entry = {
                  'score': score,
                  'owner_rva': f'0x{owner_start:X}',
                  'families': families,
                  'field_count': field_count,
                  'methods': [compact_method(r) for r in owner_rows],
                  'types': [types.get(tdi, {}) for tdi in td_indices],
                  'hits': hits,
              }
              report_candidates.append(entry)
              print(json.dumps(entry, ensure_ascii=False, sort_keys=True))

          all_three = [item for item in ranked if set(item[2]) == set(child_types)]
          if not all_three:
              Path('quest-child-callers.json').write_text(
                  json.dumps({'child_types': child_types, 'candidates': report_candidates}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit('no native method directly calls QuestCond, QuestContent, and QuestExec FromBinaryInner')

          score, owner_start, families, hits, owner_rows, field_count = all_three[0]
          owner_tdis = sorted({int(r['type_definition_index']) for r in owner_rows})
          selected_tdi = None
          for tdi in owner_tdis:
              if any(r.get('method_name') == 'FromBinaryInner' for r in methods_by_type[tdi]):
                  selected_tdi = tdi
                  break
          if selected_tdi is None:
              selected_tdi = owner_tdis[0]

          selected = {
              'score': score,
              'owner_rva': f'0x{owner_start:X}',
              'type_definition_index': selected_tdi,
              'type': types.get(selected_tdi, {}),
              'field_count': len(fields_by_type[selected_tdi]),
              'families': families,
              'hits': hits,
              'methods_at_rva': [compact_method(r) for r in owner_rows],
              'binary_methods': [compact_method(r) for r in methods_by_type[selected_tdi] if 'Binary' in (r.get('method_name') or '')],
              'fields': [
                  {
                      'field_index': r.get('field_index', ''),
                      'field_name': r.get('field_name', ''),
                      'field_type': r.get('field_type', ''),
                      'field_type_index': r.get('field_type_index', ''),
                  }
                  for r in sorted(fields_by_type[selected_tdi], key=lambda r: int(r['field_index']))
              ],
          }
          Path('quest-child-callers.json').write_text(
              json.dumps({'child_types': child_types, 'candidates': report_candidates}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('selected-quest-row.json').write_text(
              json.dumps(selected, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('=== SELECTED MAIN QUEST ROW ===')
          print(json.dumps(selected, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-main-native-child-callers
          path: |
            quest-child-caller-probe.txt
            quest-child-callers.json
            selected-quest-row.json
          if-no-files-found: warn
