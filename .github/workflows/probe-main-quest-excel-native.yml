      - name: Recover actual QuestExcelConfig row schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-excel-row-schema.txt
          import bisect
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_IMM

          from genshinre.pe import PEImage

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          root = Path('versions/7.1.0-global/windows-x64/metadata')

          QUEST_COND_ARRAY_OUTER = 0x115828F0
          QUEST_COND_ARRAY_INNER = 0x11582950
          QUEST_COND_SCALAR_INNER = 0x115825D0
          QUEST_COND_SCALAR_OUTER = 0x11582570
          TARGETS = {
              QUEST_COND_ARRAY_OUTER: 'QuestCond.FromBinary(reader, kind_0x1D)',
              QUEST_COND_ARRAY_INNER: 'QuestCond.FromBinaryInner(reader, kind_0x1D)',
              QUEST_COND_SCALAR_INNER: 'QuestCond.FromBinaryInner(reader)',
              QUEST_COND_SCALAR_OUTER: 'QuestCond.FromBinary(reader)',
          }

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types = read_csv('types.csv')
          fields = read_csv('fields.csv')
          methods = read_csv('methods.csv')

          type_by_tdi = {int(row['type_definition_index']): row for row in types}
          fields_by_owner = defaultdict(list)
          methods_by_owner = defaultdict(list)
          for row in fields:
              fields_by_owner[int(row['type_definition_index'])].append(row)
          for row in methods:
              methods_by_owner[int(row['type_definition_index'])].append(row)

          method_rows = []
          for row in methods:
              rva_text = row.get('rva', '').strip()
              if not rva_text:
                  continue
              try:
                  rva = int(rva_text, 16)
              except ValueError:
                  continue
              method_rows.append((rva, row))
          method_rows.sort(key=lambda item: item[0])
          method_rvas = [item[0] for item in method_rows]

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              def method_context(site_rva):
                  pos = bisect.bisect_right(method_rvas, site_rva)
                  prev = []
                  for i in range(max(0, pos - 5), pos):
                      rva, row = method_rows[i]
                      prev.append({
                          'rva': f'0x{rva:X}',
                          'distance': site_rva - rva,
                          'method': row,
                          'owner_type': type_by_tdi.get(
                              int(row['type_definition_index']), {}
                          ),
                      })
                  nxt = None
                  if pos < len(method_rows):
                      rva, row = method_rows[pos]
                      nxt = {
                          'rva': f'0x{rva:X}',
                          'distance': rva - site_rva,
                          'method': row,
                          'owner_type': type_by_tdi.get(
                              int(row['type_definition_index']), {}
                          ),
                      }
                  containing = prev[-1] if prev else None
                  if containing is not None and nxt is not None:
                      start_rva = int(containing['rva'], 16)
                      end_rva = int(nxt['rva'], 16)
                      if not (start_rva <= site_rva < end_rva):
                          containing = None
                  return {
                      'containing_by_next_method_boundary': containing,
                      'previous_methods': prev,
                      'next_method': nxt,
                  }

              print('=== direct rel32 call xrefs to QuestCond binary readers ===')
              xrefs = []
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  data = image.read_rva(sec.virtual_address, sec.raw_size)
                  for i in range(0, max(0, len(data) - 5)):
                      if data[i] != 0xE8:
                          continue
                      disp = struct.unpack_from('<i', data, i + 1)[0]
                      site_rva = sec.virtual_address + i
                      target_rva = (site_rva + 5 + disp) & 0xFFFFFFFFFFFFFFFF
                      if target_rva not in TARGETS:
                          continue
                      item = {
                          'site_rva': f'0x{site_rva:X}',
                          'target_rva': f'0x{target_rva:X}',
                          'target_name': TARGETS[target_rva],
                          'section': sec.name,
                          'context': method_context(site_rva),
                      }
                      xrefs.append(item)
                      print(json.dumps(item, ensure_ascii=False))

              if not xrefs:
                  raise SystemExit('no direct call xrefs to QuestCond readers found')

              print('=== candidate caller owners ===')
              owner_hits = defaultdict(list)
              for item in xrefs:
                  containing = item['context'].get('containing_by_next_method_boundary')
                  if not containing:
                      continue
                  row = containing['method']
                  owner = int(row['type_definition_index'])
                  owner_hits[owner].append(item)

              candidates = []
              for owner, hits in owner_hits.items():
                  owner_type = type_by_tdi.get(owner, {})
                  owner_fields = fields_by_owner[owner]
                  owner_methods = methods_by_owner[owner]
                  score = 0
                  score += 140 * sum(
                      1 for h in hits
                      if h['target_rva'] == f'0x{QUEST_COND_ARRAY_OUTER:X}'
                  )
                  score += 100 * sum(
                      1 for h in hits
                      if h['target_rva'] == f'0x{QUEST_COND_ARRAY_INNER:X}'
                  )
                  score += 20 * sum(
                      1 for h in hits
                      if h['target_rva'] == f'0x{QUEST_COND_SCALAR_INNER:X}'
                  )
                  score += min(len(owner_fields), 60)
                  score += 20 * sum(
                      1 for row in owner_methods if row['method_name'] == 'FromBinaryInner'
                  )
                  score += 10 * sum(
                      1 for row in owner_methods if row['method_name'] == 'FromBinary'
                  )
                  item = {
                      'owner': owner,
                      'score': score,
                      'type': owner_type,
                      'field_count': len(owner_fields),
                      'hits': hits,
                  }
                  candidates.append(item)
                  print(json.dumps(item, ensure_ascii=False))

              if not candidates:
                  raise SystemExit('QuestCond reader xrefs did not map to metadata methods')

              candidates.sort(key=lambda x: (-x['score'], x['owner']))
              best = candidates[0]
              if (
                  len(candidates) > 1
                  and candidates[1]['score'] == best['score']
              ):
                  print(
                      'WARNING: top candidate score tie; keeping all evidence, '
                      'not claiming owner confirmation'
                  )

              print('=== top candidate owner fields ===')
              quest_tdi = best['owner']
              quest_type = type_by_tdi.get(quest_tdi, {})
              for row in fields_by_owner[quest_tdi]:
                  print(json.dumps(row, ensure_ascii=False))

              print('=== top candidate owner methods ===')
              for row in methods_by_owner[quest_tdi]:
                  if row['method_name'] in (
                      'FromBinary',
                      'FromBinaryInner',
                      '.ctor',
                      'ParseFromLine',
                  ):
                      print(json.dumps(row, ensure_ascii=False))

              def dump_method(row, size):
                  start_rva = int(row['rva'], 16)
                  data = image.read_rva(start_rva, size)
                  body = list(md.disasm(data, base + start_rva))
                  out = []
                  for insn in body:
                      item = {
                          'rva': f'0x{insn.address-base:X}',
                          'bytes': insn.bytes.hex(),
                          'mnemonic': insn.mnemonic,
                          'op_str': insn.op_str,
                      }
                      out.append(item)
                      print(
                          f'{item["rva"]:>11}: {item["bytes"]:<24} '
                          f'{item["mnemonic"]:<8} {item["op_str"]}'
                      )
                      if insn.mnemonic == 'ret' and insn.address > base + start_rva + 0x20:
                          break
                  return out

              caller_dumps = []
              seen = set()
              print('=== xref caller disassembly ===')
              for hit in best['hits']:
                  containing = hit['context'].get('containing_by_next_method_boundary')
                  if not containing:
                      continue
                  row = containing['method']
                  key = (row.get('method_index'), row.get('rva'))
                  if key in seen:
                      continue
                  seen.add(key)
                  start_rva = int(row['rva'], 16)
                  next_info = hit['context'].get('next_method')
                  if next_info:
                      next_rva = int(next_info['rva'], 16)
                      size = max(0x100, min(0x5000, next_rva - start_rva))
                  else:
                      size = 0x2000
                  print(
                      f'--- {quest_type.get("type_name")}::{row["method_name"]} '
                      f'@ 0x{start_rva:X} ---'
                  )
                  caller_dumps.append({
                      'method': row,
                      'instructions': dump_method(row, size),
                  })

              Path('quest-excel-row-schema.json').write_text(
                  json.dumps(
                      {
                          'targets': {
                              f'0x{k:X}': v for k, v in TARGETS.items()
                          },
                          'xrefs': xrefs,
                          'candidates': candidates,
                          'top_candidate': best,
                          'top_candidate_type': quest_type,
                          'top_candidate_fields': fields_by_owner[quest_tdi],
                          'top_candidate_methods': methods_by_owner[quest_tdi],
                          'caller_dumps': caller_dumps,
                      },
                      ensure_ascii=False,
                      indent=2,
                  ) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Resolve ordinary Quest row native field types and call graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee ordinary-quest-row-native.txt
          import bisect
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_IMM

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          ROOT = Path('versions/7.1.0-global/windows-x64/metadata')
          EXE = Path('inputs/7.1.0-global/GenshinImpact.exe')
          META = Path('inputs/7.1.0-global/global-metadata.dat')
          ROW_TDI = 17589
          ROW_SCALAR_RVA = 0x9C15DF0
          ROW_ARRAY_RVA = 0x9C15C80
          TARGETS = {
              ROW_SCALAR_RVA: 'LAIMPNDEFCL.GMENPOPMKAA(reader)',
              ROW_ARRAY_RVA: 'LAIMPNDEFCL.GMENPOPMKAA(reader, kind_0x1D)',
          }

          def read_csv(name):
              with (ROOT / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types = read_csv('types.csv')
          fields = read_csv('fields.csv')
          methods = read_csv('methods.csv')
          type_by_tdi = {int(r['type_definition_index']): r for r in types}
          row_fields = [
              r for r in fields
              if int(r['type_definition_index']) == ROW_TDI
          ]
          row_methods = [
              r for r in methods
              if int(r['type_definition_index']) == ROW_TDI
          ]
          print('=== ordinary row metadata ===')
          print(json.dumps(type_by_tdi[ROW_TDI], ensure_ascii=False))
          for row in row_fields:
              print('FIELD', json.dumps(row, ensure_ascii=False))
          for row in row_methods:
              print('METHOD', json.dumps(row, ensure_ascii=False))

          method_rows = []
          methods_by_rva = defaultdict(list)
          for row in methods:
              text = str(row.get('rva', '')).strip()
              if not text:
                  continue
              try:
                  rva = int(text, 16)
              except ValueError:
                  continue
              method_rows.append((rva, row))
              methods_by_rva[rva].append(row)
          method_rows.sort(key=lambda x: x[0])
          method_rvas = [x[0] for x in method_rows]

          def method_context(site_rva):
              pos = bisect.bisect_right(method_rvas, site_rva)
              containing = None
              if pos:
                  start, row = method_rows[pos - 1]
                  end = method_rows[pos][0] if pos < len(method_rows) else None
                  if end is None or start <= site_rva < end:
                      containing = {
                          'start_rva': f'0x{start:X}',
                          'method': row,
                          'owner': type_by_tdi.get(int(row['type_definition_index']), {}),
                      }
              return containing

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          evidence = {
              'sample': {
                  'version': '7.1.0-global',
                  'exe_sha256': PROFILE_71.exe_sha256,
              },
              'row_type_definition_index': ROW_TDI,
              'runtime_field_types': [],
              'direct_xrefs': [],
              'scalar_calls': [],
              'literal_search': {},
          }

          with PEImage(EXE) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated RVA 0x{rva:X} size=0x{size:X}')
                  return data

              def read_va(va, size):
                  if va < base:
                      raise ValueError(f'not image VA: 0x{va:X}')
                  return read_rva(va - base, size)

              type_array_va = int.from_bytes(
                  read_rva(PROFILE_71.type_array_pointer_rva, 8), 'little'
              )

              def describe_entry(entry, depth=0, seen=None):
                  if seen is None:
                      seen = set()
                  decoded = decode_type_entry(entry)
                  kind = int(decoded['kind'])
                  data_u64 = int.from_bytes(entry[:8], 'little')
                  out = {
                      'kind': decoded['kind_name'],
                      'kind_value': kind,
                      'data_u64': f'0x{data_u64:X}',
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      out['type_definition_index'] = tdi
                      if tdi in type_by_tdi:
                          out['type_name'] = type_by_tdi[tdi].get('type_name', '')
                          out['namespace'] = type_by_tdi[tdi].get('namespace', '')
                  elif kind in (0x0F, 0x10, 0x1D) and depth < 4 and data_u64 >= base:
                      if data_u64 in seen:
                          out['nested_cycle'] = True
                      else:
                          seen = set(seen)
                          seen.add(data_u64)
                          nested = read_va(data_u64, ENTRY_SIZE)
                          out['nested_valid'] = is_valid_type_entry(nested)
                          if out['nested_valid']:
                              out['element_or_target'] = describe_entry(
                                  nested, depth + 1, seen
                              )
                  return out

              print('=== recursive runtime field types ===')
              for ordinal, row in enumerate(row_fields, start=1):
                  index = int(row['field_type_index'])
                  entry = read_va(type_array_va + index * ENTRY_SIZE, ENTRY_SIZE)
                  if not is_valid_type_entry(entry):
                      info = {
                          'ordinal': ordinal,
                          'field_name': row.get('field_name', ''),
                          'field_type_index': index,
                          'status': 'invalid-runtime-type-entry',
                      }
                  else:
                      info = {
                          'ordinal': ordinal,
                          'field_name': row.get('field_name', ''),
                          'field_type_index': index,
                          'runtime_type': describe_entry(entry),
                      }
                  evidence['runtime_field_types'].append(info)
                  print(json.dumps(info, ensure_ascii=False, sort_keys=True))

              print('=== direct rel32 xrefs to ordinary row readers ===')
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  data = image.read_rva(sec.virtual_address, sec.raw_size)
                  for i in range(max(0, len(data) - 5)):
                      opcode = data[i]
                      if opcode not in (0xE8, 0xE9):
                          continue
                      disp = struct.unpack_from('<i', data, i + 1)[0]
                      site = sec.virtual_address + i
                      target = (site + 5 + disp) & 0xFFFFFFFFFFFFFFFF
                      if target not in TARGETS:
                          continue
                      item = {
                          'site_rva': f'0x{site:X}',
                          'opcode': 'call' if opcode == 0xE8 else 'jmp',
                          'target_rva': f'0x{target:X}',
                          'target': TARGETS[target],
                          'containing_method': method_context(site),
                      }
                      evidence['direct_xrefs'].append(item)
                      print(json.dumps(item, ensure_ascii=False))

              pos = bisect.bisect_right(method_rvas, ROW_SCALAR_RVA)
              next_rva = method_rows[pos][0] if pos < len(method_rows) else ROW_SCALAR_RVA + 0x1800
              if next_rva <= ROW_SCALAR_RVA:
                  raise SystemExit('failed to determine scalar reader boundary')
              scalar_size = next_rva - ROW_SCALAR_RVA
              print(
                  f'=== scalar reader direct calls size=0x{scalar_size:X} '
                  f'next=0x{next_rva:X} ==='
              )
              insns = list(md.disasm(read_rva(ROW_SCALAR_RVA, scalar_size), base + ROW_SCALAR_RVA))
              for idx, insn in enumerate(insns):
                  if insn.mnemonic != 'call':
                      continue
                  target = None
                  for operand in insn.operands:
                      if operand.type == X86_OP_IMM:
                          target = int(operand.imm) - base
                          break
                  if target is None:
                      continue
                  meta_rows = methods_by_rva.get(target, [])
                  item = {
                      'site_rva': f'0x{insn.address - base:X}',
                      'target_rva': f'0x{target:X}',
                      'metadata_methods': [
                          {
                              'method': row,
                              'owner': type_by_tdi.get(
                                  int(row['type_definition_index']), {}
                              ),
                          }
                          for row in meta_rows
                      ],
                      'context': [
                          {
                              'rva': f'0x{x.address-base:X}',
                              'mnemonic': x.mnemonic,
                              'op_str': x.op_str,
                          }
                          for x in insns[max(0, idx - 5): min(len(insns), idx + 6)]
                      ],
                  }
                  evidence['scalar_calls'].append(item)
                  if meta_rows:
                      owners = ', '.join(
                          f'{type_by_tdi.get(int(r["type_definition_index"]), {}).get("type_name", "?")}::{r.get("method_name", "?")}'
                          for r in meta_rows
                      )
                  else:
                      owners = '<no exact metadata method>'
                  print(
                      f'CALL 0x{insn.address-base:X} -> 0x{target:X} {owners}'
                  )
                  for x in item['context']:
                      print(f'  {x["rva"]:>11} {x["mnemonic"]:<8} {x["op_str"]}')

          print('=== exact literal search ===')
          needles = (
              b'Data/_ExcelBinOutput/QuestExcelConfigData',
              b'QuestExcelConfigData',
          )
          for path in (EXE, META):
              raw = path.read_bytes()
              for needle in needles:
                  key = f'{path.name}:{needle.decode()}'
                  hits = []
                  start = 0
                  while True:
                      pos = raw.find(needle, start)
                      if pos < 0:
                          break
                      hits.append(pos)
                      start = pos + 1
                  utf16 = needle.decode().encode('utf-16-le')
                  start = 0
                  utf16_hits = []
                  while True:
                      pos = raw.find(utf16, start)
                      if pos < 0:
                          break
                      utf16_hits.append(pos)
                      start = pos + 2
                  evidence['literal_search'][key] = {
                      'ascii_offsets': [f'0x{x:X}' for x in hits],
                      'utf16le_offsets': [f'0x{x:X}' for x in utf16_hits],
                  }
                  print(key, json.dumps(evidence['literal_search'][key]))

          Path('ordinary-quest-row-native.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Trace ordinary Quest row types and loader callers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-ordinary-row-loader.txt
          import bisect
          import csv
          import json
          import struct
          from collections import defaultdict
          from pathlib import Path

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          root = Path('versions/7.1.0-global/windows-x64/metadata')

          ORDINARY_TDI = 17589
          FACADE_TDI = 40413
          QUEST_COND_TDI = 54128
          QUEST_EXEC_TDI = 71568
          RANDOM_CONTENT_TDI = 23509

          ORDINARY_ARRAY_RVA = 0x9C15C80
          ORDINARY_ROW_RVA = 0x9C15DF0
          ORDINARY_INIT_BY_ID_RVA = 0x9C174D0
          TARGETS = {
              ORDINARY_ARRAY_RVA: 'LAIMPNDEFCL.GMENPOPMKAA(reader, kind_0x1D)',
              ORDINARY_ROW_RVA: 'LAIMPNDEFCL.GMENPOPMKAA(reader)',
              ORDINARY_INIT_BY_ID_RVA: 'LAIMPNDEFCL.FOEOGNHBBMJ(uint32)',
          }

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types = read_csv('types.csv')
          fields = read_csv('fields.csv')
          methods = read_csv('methods.csv')
          type_by_tdi = {int(row['type_definition_index']): row for row in types}
          fields_by_owner = defaultdict(list)
          methods_by_owner = defaultdict(list)
          for row in fields:
              fields_by_owner[int(row['type_definition_index'])].append(row)
          for row in methods:
              methods_by_owner[int(row['type_definition_index'])].append(row)

          if len(fields_by_owner[ORDINARY_TDI]) != 35:
              raise SystemExit(
                  f'ordinary row field count drift: {len(fields_by_owner[ORDINARY_TDI])} != 35'
              )

          method_rows = []
          for row in methods:
              text = row.get('rva', '').strip()
              if not text:
                  continue
              try:
                  method_rows.append((int(text, 16), row))
              except ValueError:
                  pass
          method_rows.sort(key=lambda item: item[0])
          method_rvas = [item[0] for item in method_rows]

          def method_context(site_rva):
              pos = bisect.bisect_right(method_rvas, site_rva)
              prev = method_rows[pos - 1] if pos else None
              nxt = method_rows[pos] if pos < len(method_rows) else None
              containing = None
              if prev is not None:
                  start, row = prev
                  end = nxt[0] if nxt else start + 0x10000
                  if start <= site_rva < end:
                      containing = {
                          'rva': f'0x{start:X}',
                          'distance': site_rva - start,
                          'method': row,
                          'owner_type': type_by_tdi.get(int(row['type_definition_index']), {}),
                      }
              return containing

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              def read_va(va, size):
                  if va < base:
                      raise ValueError(f'not image VA: 0x{va:X}')
                  return read_rva(va - base, size)

              type_array_va = int.from_bytes(
                  read_rva(PROFILE_71.type_array_pointer_rva, 8), 'little'
              )

              def describe_entry(entry, depth=0):
                  decoded = decode_type_entry(entry)
                  kind = int(decoded['kind'])
                  data_u64 = int.from_bytes(entry[:8], 'little')
                  result = {
                      'kind': decoded['kind_name'],
                      'kind_value': kind,
                      'data_u64': f'0x{data_u64:X}',
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      result['type_definition_index'] = tdi
                      t = type_by_tdi.get(tdi)
                      if t:
                          result['type_name'] = t.get('type_name', '')
                          result['namespace'] = t.get('namespace', '')
                  elif kind in (0x0F, 0x10, 0x1D) and depth < 3 and data_u64 >= base:
                      try:
                          nested = read_va(data_u64, ENTRY_SIZE)
                          if is_valid_type_entry(nested):
                              result['element_or_target'] = describe_entry(nested, depth + 1)
                      except Exception as exc:
                          result['target_error'] = f'{type(exc).__name__}: {exc}'
                  return result

              ordinary_fields = sorted(
                  fields_by_owner[ORDINARY_TDI], key=lambda row: int(row['field_index'])
              )
              runtime_types = {}
              candidate_element_tdis = set()
              print('=== ordinary row fields and exact runtime types ===')
              for ordinal, field in enumerate(ordinary_fields, start=1):
                  type_index = int(field['field_type_index'])
                  entry = read_va(type_array_va + type_index * ENTRY_SIZE, ENTRY_SIZE)
                  if not is_valid_type_entry(entry):
                      info = {'index': type_index, 'status': 'invalid'}
                  else:
                      info = {'index': type_index, **describe_entry(entry)}
                      nested = info.get('element_or_target')
                      if isinstance(nested, dict) and 'type_definition_index' in nested:
                          candidate_element_tdis.add(int(nested['type_definition_index']))
                  runtime_types[str(type_index)] = info
                  print(json.dumps({
                      'ordinal': ordinal,
                      'field': field,
                      'runtime_type': info,
                  }, ensure_ascii=False, sort_keys=True))

              print('=== candidate array element structures ===')
              control_tdis = {QUEST_COND_TDI, QUEST_EXEC_TDI, RANDOM_CONTENT_TDI}
              structural_tdis = sorted(candidate_element_tdis | control_tdis)
              structures = {}
              for tdi in structural_tdis:
                  structures[str(tdi)] = {
                      'type': type_by_tdi.get(tdi, {'type_definition_index': tdi}),
                      'fields': fields_by_owner.get(tdi, []),
                      'methods': methods_by_owner.get(tdi, []),
                  }
                  print(json.dumps(structures[str(tdi)], ensure_ascii=False, sort_keys=True))

              print('=== direct rel32 call xrefs to ordinary row methods ===')
              xrefs = []
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  data = image.read_rva(sec.virtual_address, sec.raw_size)
                  for i in range(max(0, len(data) - 4)):
                      if data[i] != 0xE8:
                          continue
                      disp = struct.unpack_from('<i', data, i + 1)[0]
                      site_rva = sec.virtual_address + i
                      target_rva = (site_rva + 5 + disp) & 0xFFFFFFFFFFFFFFFF
                      if target_rva not in TARGETS:
                          continue
                      item = {
                          'site_rva': f'0x{site_rva:X}',
                          'target_rva': f'0x{target_rva:X}',
                          'target_name': TARGETS[target_rva],
                          'section': sec.name,
                          'containing_method': method_context(site_rva),
                      }
                      xrefs.append(item)
                      print(json.dumps(item, ensure_ascii=False, sort_keys=True))

              external_array_xrefs = [
                  item for item in xrefs
                  if item['target_rva'] == f'0x{ORDINARY_ARRAY_RVA:X}'
                  and not (
                      item.get('containing_method')
                      and int(item['containing_method']['method']['type_definition_index']) == ORDINARY_TDI
                  )
              ]
              print('external_array_xref_count=', len(external_array_xrefs))

              print('=== metadata methods mentioning ordinary/facade types ===')
              metadata_mentions = []
              for row in methods:
                  hay = ' '.join([
                      str(row.get('return_type', '')),
                      str(row.get('parameter_types', '')),
                      str(row.get('type_name', '')),
                      str(row.get('method_name', '')),
                  ])
                  if 'LAIMPNDEFCL' in hay or 'BEAEOMIOFDE' in hay:
                      metadata_mentions.append(row)
                      print(json.dumps(row, ensure_ascii=False, sort_keys=True))

              print('=== executable path literal search ===')
              literal_hits = {}
              needles = [
                  b'Data/_ExcelBinOutput/QuestExcelConfigData',
                  b'QuestExcelConfigData',
                  b'_ExcelBinOutput',
              ]
              for needle in needles:
                  found = []
                  for sec in image.sections:
                      blob = image.read_rva(sec.virtual_address, sec.raw_size)
                      start = 0
                      while True:
                          pos = blob.find(needle, start)
                          if pos < 0:
                              break
                          found.append({
                              'section': sec.name,
                              'rva': f'0x{sec.virtual_address + pos:X}',
                              'encoding': 'ascii',
                          })
                          start = pos + 1
                      wide = needle.decode('ascii').encode('utf-16le')
                      start = 0
                      while True:
                          pos = blob.find(wide, start)
                          if pos < 0:
                              break
                          found.append({
                              'section': sec.name,
                              'rva': f'0x{sec.virtual_address + pos:X}',
                              'encoding': 'utf-16le',
                          })
                          start = pos + 2
                  literal_hits[needle.decode('ascii')] = found
                  print(needle.decode('ascii'), json.dumps(found, ensure_ascii=False))

              evidence = {
                  'sample': {
                      'version': '7.1.0-global',
                      'exe_sha256': PROFILE_71.exe_sha256,
                  },
                  'ordinary_type': type_by_tdi[ORDINARY_TDI],
                  'facade_type': type_by_tdi[FACADE_TDI],
                  'ordinary_fields': ordinary_fields,
                  'runtime_types': runtime_types,
                  'array_element_structures': structures,
                  'targets': {f'0x{k:X}': v for k, v in TARGETS.items()},
                  'xrefs': xrefs,
                  'external_array_xrefs': external_array_xrefs,
                  'metadata_mentions': metadata_mentions,
                  'path_literal_hits': literal_hits,
              }
              Path('quest-ordinary-row-loader.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Compare 7.1 QuestExcel rows across resource sources
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/DimbreathBot/AnimeGameData/792978e5503ecfba73dcb3562ed44a0d35a2abe2/ExcelBinOutput/QuestExcelConfigData.json" \
            -o dimbreath-quest-excel.json

          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/RinoPaw/AstaPS-Resource/main/ExcelBinOutput/QuestExcelConfigData.json" \
            -o astaps-quest-excel.json

          python - <<'PY' | tee quest-excel-source-compare.txt
          import json
          from pathlib import Path

          TARGETS = {35100,35101,35102,35103,35104,35105,35106,35107,37504,37603,38805}
          SEMANTIC_ID_KEYS = ('subId', 'SubId', 'NFGFDHPPBIF')
          INTEREST_KEYS = {
              'subId', 'SubId', 'NFGFDHPPBIF',
              'mainId', 'MainId', 'PCOMHEOJPOO',
              'order', 'Order', 'GBFIFKGFKHD',
              'acceptCond', 'AcceptCond',
              'acceptCondComb', 'AcceptCondComb',
              'finishCond', 'failCond',
              'showType', 'isRewind',
          }

          def load(path):
              raw = Path(path).read_bytes()
              print(f'FILE {path} size={len(raw)}')
              return json.loads(raw)

          def direct_target_id(obj):
              if not isinstance(obj, dict):
                  return None
              for key in SEMANTIC_ID_KEYS:
                  value = obj.get(key)
                  if isinstance(value, int) and value in TARGETS:
                      return value
              return None

          def shallow_target_values(obj):
              if not isinstance(obj, dict):
                  return []
              hits = []
              for key, value in obj.items():
                  if isinstance(value, int) and value in TARGETS:
                      hits.append((key, value))
              return hits

          def summarize(obj):
              if not isinstance(obj, dict):
                  return obj
              picked = {}
              for key, value in obj.items():
                  if key in INTEREST_KEYS:
                      picked[key] = value
              if not picked:
                  picked = obj
              return picked

          def extract(root, label):
              print(f'=== {label}: root={type(root).__name__} ===')
              if isinstance(root, list):
                  print('top_level_count=', len(root))
                  top = root
              elif isinstance(root, dict):
                  list_values = [
                      (key, value) for key, value in root.items()
                      if isinstance(value, list)
                  ]
                  print('top_level_keys=', list(root.keys())[:50])
                  print('list_fields=', [(k, len(v)) for k, v in list_values[:20]])
                  top = max(list_values, key=lambda kv: len(kv[1]))[1] if list_values else []
              else:
                  top = []

              exact = {}
              fallback = []
              for index, obj in enumerate(top):
                  tid = direct_target_id(obj)
                  if tid is not None:
                      exact.setdefault(tid, []).append({'index': index, 'row': obj})
                      continue
                  vals = shallow_target_values(obj)
                  if vals:
                      fallback.append({'index': index, 'hits': vals, 'row': obj})

              print('exact_target_ids=', sorted(exact))
              for tid in sorted(exact):
                  for item in exact[tid]:
                      print(
                          'ROW',
                          tid,
                          'index=', item['index'],
                          json.dumps(summarize(item['row']), ensure_ascii=False, sort_keys=True),
                      )

              print('fallback_count=', len(fallback))
              for item in fallback[:80]:
                  print(
                      'FALLBACK',
                      item['index'],
                      item['hits'],
                      json.dumps(summarize(item['row']), ensure_ascii=False, sort_keys=True),
                  )

              return {
                  'root_type': type(root).__name__,
                  'top_level_count': len(top),
                  'exact': exact,
                  'fallback': fallback,
              }

          dim = extract(load('dimbreath-quest-excel.json'), 'Dimbreath 7.1 Excel')
          asta = extract(load('astaps-quest-excel.json'), 'AstaPS current Excel')

          report = {
              'targets': sorted(TARGETS),
              'dimbreath_commit': '792978e5503ecfba73dcb3562ed44a0d35a2abe2',
              'dimbreath_commit_title': 'CNRELWin7.1.0_R48379043_S48511369_D48533839',
              'dimbreath': dim,
              'astaps': asta,
          }
          Path('quest-excel-source-compare.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          rm -f dimbreath-quest-excel.json astaps-quest-excel.json
      - name: Assert source comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s quest-excel-source-compare.txt
          test -s quest-excel-source-compare.json
