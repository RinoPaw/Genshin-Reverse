name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "genshinre/nativeprofile.py"
      - "genshinre/typearray.py"
      - "genshinre/pe.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Recover Quest row prerequisite field schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-row-prereq-schema.txt
          import csv
          import json
          import re
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_IMM, X86_OP_MEM

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          root = Path('versions/7.1.0-global/windows-x64/metadata')

          ROW_TDI = 36711
          RANDOM_COND_TDI = 76090
          QUEST_COND_TDI = 54128
          ROW_RVA = 0xCF246E0
          RANDOM_COND_RVA = 0xB647530
          QUEST_COND_RVA = 0x115825D0

          SEMANTIC_FIELDS = {
              'order': {
                  'offset': 0x94,
                  'test_rva': 0xCF249B5,
                  'store_rva': 0xCF249FA,
              },
              'subId': {
                  'offset': 0x64,
                  'test_rva': 0xCF24A25,
                  'store_rva': 0xCF24AB6,
              },
              'mainId': {
                  'offset': 0x5C,
                  'test_rva': 0xCF24B99,
                  'store_rva': 0xCF24BDE,
              },
              'acceptCondComb': {
                  'offset': 0x74,
                  'test_rva': 0xCF24DB3,
                  'store_rva': 0xCF24DF8,
              },
              'acceptCond': {
                  'offset': 0x20,
                  'test_rva': 0xCF24F7C,
                  'store_rva': 0xCF24FA1,
              },
          }

          WRAPPER_GETTERS = {
              'acceptCond': 0x87D2B80,
              'acceptCondComb': 0x87D1490,
              'mainId': 0x87D4130,
              'subId': 0x87D2740,
              'order': 0x87D47A0,
          }

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          type_rows = read_csv('types.csv')
          field_rows = read_csv('fields.csv')
          method_rows = read_csv('methods.csv')
          types = {int(row['type_definition_index']): row for row in type_rows}

          def fields_for(tdi):
              return [
                  row for row in field_rows
                  if int(row['type_definition_index']) == tdi
              ]

          def methods_for(tdi):
              return [
                  row for row in method_rows
                  if int(row['type_definition_index']) == tdi
              ]

          metadata_evidence = {}
          for label, tdi in (
              ('row', ROW_TDI),
              ('random_cond', RANDOM_COND_TDI),
              ('quest_cond', QUEST_COND_TDI),
          ):
              metadata_evidence[label] = {
                  'type': types[tdi],
                  'fields': fields_for(tdi),
                  'methods': methods_for(tdi),
              }
              print(f'=== {label} type {tdi} {types[tdi]["type_name"]} fields ===')
              for row in fields_for(tdi):
                  print(json.dumps(row, ensure_ascii=False))
              print(f'=== {label} methods ===')
              for row in methods_for(tdi):
                  print(json.dumps(row, ensure_ascii=False))

          wrapper_types = [
              row for row in type_rows
              if 'RandomQuestCondWrap' in row.get('type_name', '')
          ]
          print('=== RandomQuestCond wrapper candidates ===')
          for row in wrapper_types:
              print(json.dumps(row, ensure_ascii=False))
              tdi = int(row['type_definition_index'])
              for method in methods_for(tdi):
                  if method.get('method_name', '').startswith(('_g_get_', '_s_set_')):
                      print('WRAP_METHOD', json.dumps(method, ensure_ascii=False))

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              def read_va(va, size):
                  if va < base:
                      raise ValueError(f'not image VA: 0x{va:X}')
                  return read_rva(va - base, size)

              def disassemble(start_rva, size):
                  return list(md.disasm(read_rva(start_rva, size), base + start_rva))

              def insn_rva(insn):
                  return insn.address - base

              def line(insn):
                  return {
                      'rva': f'0x{insn_rva(insn):X}',
                      'bytes': insn.bytes.hex(),
                      'mnemonic': insn.mnemonic,
                      'op_str': insn.op_str,
                  }

              def text_line(insn):
                  return (
                      f'0x{insn_rva(insn):09X}: {insn.bytes.hex():<24} '
                      f'{insn.mnemonic:<8} {insn.op_str}'
                  )

              def describe_entry(entry, depth=0):
                  decoded = decode_type_entry(entry)
                  kind = int(decoded['kind'])
                  data_u64 = int.from_bytes(entry[:8], 'little')
                  result = {
                      'kind': decoded['kind_name'],
                      'kind_value': kind,
                      'data_u64': f'0x{data_u64:X}',
                  }
                  if kind in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      result['type_definition_index'] = tdi
                      if tdi in types:
                          result['type_name'] = types[tdi].get('type_name', '')
                          result['namespace'] = types[tdi].get('namespace', '')
                  elif kind in (0x0F, 0x10, 0x1D) and depth < 2 and data_u64 >= base:
                      try:
                          nested = read_va(data_u64, ENTRY_SIZE)
                          if is_valid_type_entry(nested):
                              result['element_or_target'] = describe_entry(nested, depth + 1)
                      except Exception as exc:
                          result['target_error'] = f'{type(exc).__name__}: {exc}'
                  return result

              type_array_va = int.from_bytes(
                  read_rva(PROFILE_71.type_array_pointer_rva, 8), 'little'
              )
              runtime_type_evidence = {}
              wanted_type_indices = sorted({
                  int(row['field_type_index'])
                  for row in fields_for(ROW_TDI) + fields_for(RANDOM_COND_TDI)
                  if str(row.get('field_type_index', '')).strip().isdigit()
              })
              print('=== relevant runtime Il2CppType entries ===')
              for index in wanted_type_indices:
                  entry = read_va(type_array_va + index * ENTRY_SIZE, ENTRY_SIZE)
                  if not is_valid_type_entry(entry):
                      info = {'index': index, 'status': 'invalid'}
                  else:
                      info = {'index': index, **describe_entry(entry)}
                  runtime_type_evidence[str(index)] = info
                  print(json.dumps(info, ensure_ascii=False, sort_keys=True))

              row_insns = disassemble(ROW_RVA, 0x980)
              row_by_rva = {insn_rva(insn): insn for insn in row_insns}

              print('=== row mask decode ===')
              mask_window = [
                  insn for insn in row_insns
                  if 0xCF24751 <= insn_rva(insn) <= 0xCF247D0
              ]
              for insn in mask_window:
                  print(text_line(insn))

              mask_xor = [
                  insn for insn in mask_window
                  if insn.mnemonic == 'xor'
                  and re.search(r'\br12\b', insn.op_str.lower())
              ]
              if not mask_xor:
                  raise SystemExit('row presence-mask XOR anchor disappeared')

              field_evidence = {}
              for name, spec in SEMANTIC_FIELDS.items():
                  test = row_by_rva.get(spec['test_rva'])
                  store = row_by_rva.get(spec['store_rva'])
                  if test is None or store is None:
                      raise SystemExit(f'{name}: expected test/store RVA missing')
                  if test.mnemonic != 'test':
                      raise SystemExit(f'{name}: expected test instruction at 0x{spec["test_rva"]:X}')
                  if f'0x{spec["offset"]:x}]' not in store.op_str.lower():
                      raise SystemExit(
                          f'{name}: store no longer targets object +0x{spec["offset"]:X}: '
                          f'{store.mnemonic} {store.op_str}'
                      )
                  test_imm = next(
                      (
                          operand.imm & 0xFFFFFFFFFFFFFFFF
                          for operand in test.operands
                          if operand.type == X86_OP_IMM
                      ),
                      None,
                  )
                  start = spec['test_rva']
                  end = spec['store_rva']
                  context = [
                      line(insn) for insn in row_insns
                      if start <= insn_rva(insn) <= end
                  ]
                  field_evidence[name] = {
                      'object_offset': f'0x{spec["offset"]:X}',
                      'presence_test_rva': f'0x{spec["test_rva"]:X}',
                      'presence_test': line(test),
                      'presence_bit': None if test_imm is None else f'0x{test_imm:X}',
                      'store_rva': f'0x{spec["store_rva"]:X}',
                      'store': line(store),
                      'decode_path': context,
                  }
                  print(
                      f'=== semantic field {name} offset=0x{spec["offset"]:X} '
                      f'presence={field_evidence[name]["presence_bit"]} ==='
                  )
                  for item in context:
                      print(
                          f'{item["rva"]:>11} {item["mnemonic"]:<8} {item["op_str"]}'
                      )

              accept_context = field_evidence['acceptCond']['decode_path']
              if not any(
                  item['mnemonic'] == 'call'
                  and '0x14b6473f0' in item['op_str'].lower()
                  for item in accept_context
              ):
                  raise SystemExit(
                      'acceptCond path no longer calls RandomQuestCond.FromBinaryInner(reader,array)'
                  )

              print('=== independent XLua getter offsets ===')
              wrapper_evidence = {}
              for name, rva in WRAPPER_GETTERS.items():
                  insns = disassemble(rva, 0x120)
                  spec = SEMANTIC_FIELDS[name]
                  matching = []
                  for insn in insns:
                      text = insn.op_str.lower()
                      if f'+ 0x{spec["offset"]:x}]' in text:
                          matching.append(line(insn))
                      if insn.mnemonic == 'ret':
                          break
                  if not matching:
                      raise SystemExit(
                          f'{name}: XLua getter no longer exposes object +0x{spec["offset"]:X}'
                      )
                  wrapper_evidence[name] = {
                      'getter_rva': f'0x{rva:X}',
                      'object_offset': f'0x{spec["offset"]:X}',
                      'matches': matching,
                  }
                  print(name, json.dumps(wrapper_evidence[name], ensure_ascii=False))

              def summarize_deserializer(label, start_rva, size):
                  insns = disassemble(start_rva, size)
                  stores = []
                  tests = []
                  calls = []
                  for insn in insns:
                      irva = insn_rva(insn)
                      low = insn.op_str.lower()
                      if insn.mnemonic.startswith('mov') and re.search(
                          r'\[(r(?:bx|bp|si|di|12|13|14|15))\s*\+\s*0x[0-9a-f]+\]',
                          low,
                      ):
                          stores.append(line(insn))
                      if insn.mnemonic == 'test':
                          tests.append(line(insn))
                      if insn.mnemonic == 'call':
                          calls.append(line(insn))
                      if insn.mnemonic == 'ret' and irva > start_rva + 0x20:
                          break
                  result = {
                      'rva': f'0x{start_rva:X}',
                      'stores': stores,
                      'tests': tests,
                      'calls': calls,
                  }
                  print(f'=== {label} stores/tests/calls ===')
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  return result

              random_cond = summarize_deserializer(
                  'RandomQuestCond.FromBinaryInner(reader)',
                  RANDOM_COND_RVA,
                  0x5C0,
              )
              quest_cond = summarize_deserializer(
                  'QuestCond.FromBinaryInner(reader)',
                  QUEST_COND_RVA,
                  0x280,
              )

              evidence = {
                  'sample': {
                      'version': '7.1.0-global',
                      'exe_sha256': PROFILE_71.exe_sha256,
                  },
                  'metadata': metadata_evidence,
                  'runtime_types': runtime_type_evidence,
                  'row': {
                      'type_definition_index': ROW_TDI,
                      'deserializer_rva': f'0x{ROW_RVA:X}',
                      'mask_decode': [line(insn) for insn in mask_window],
                      'semantic_fields': field_evidence,
                      'wrapper_offsets': wrapper_evidence,
                  },
                  'random_quest_cond': random_cond,
                  'quest_cond_control': quest_cond,
              }
              Path('quest-row-prereq-schema.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Disassemble prerequisite condition binary readers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-cond-binary-reader.txt
          import csv
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86_const import X86_OP_MEM, X86_REG_RAX

          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.typearray import ENTRY_SIZE, decode_type_entry, is_valid_type_entry

          exe = Path('inputs/7.1.0-global/GenshinImpact.exe')
          root = Path('versions/7.1.0-global/windows-x64/metadata')

          def read_csv(name):
              with (root / name).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          types = read_csv('types.csv')
          fields = read_csv('fields.csv')
          methods = read_csv('methods.csv')
          type_by_tdi = {int(row['type_definition_index']): row for row in types}
          methods_by_rva = defaultdict(list)
          for row in methods:
              text = row.get('rva', '').strip()
              if text:
                  methods_by_rva[int(text, 16)].append(row)

          random_tdi = 76090
          quest_tdi = 54128
          random_fields = [r for r in fields if int(r['type_definition_index']) == random_tdi]
          quest_fields = [r for r in fields if int(r['type_definition_index']) == quest_tdi]

          def method(tdi, name, parameter_count):
              rows = [
                  r for r in methods
                  if int(r['type_definition_index']) == tdi
                  and r['method_name'] == name
                  and int(r['parameter_count']) == parameter_count
              ]
              if len(rows) != 1:
                  raise SystemExit(f'{tdi} {name}/{parameter_count}: expected 1 row, got {len(rows)}')
              return rows[0]

          random_inner = method(random_tdi, 'FromBinaryInner', 1)
          quest_inner = method(quest_tdi, 'FromBinaryInner', 1)

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          with PEImage(exe) as image:
              base = image.image_base

              def read_rva(rva, size):
                  data = image.read_rva(rva, size)
                  if len(data) != size:
                      raise ValueError(f'truncated read rva=0x{rva:X} size={size}')
                  return data

              def read_va(va, size):
                  if va < base:
                      raise ValueError(f'not image VA: 0x{va:X}')
                  return read_rva(va - base, size)

              def decode_runtime_type(index):
                  array_va = int.from_bytes(
                      read_rva(PROFILE_71.type_array_pointer_rva, 8), 'little'
                  )
                  entry = read_va(array_va + index * ENTRY_SIZE, ENTRY_SIZE)
                  if not is_valid_type_entry(entry):
                      return {'index': index, 'status': 'invalid'}
                  decoded = decode_type_entry(entry)
                  out = {
                      'index': index,
                      'kind': decoded['kind_name'],
                      'data_u64': hex(int.from_bytes(entry[:8], 'little')),
                  }
                  if decoded['kind'] in (0x11, 0x12):
                      tdi = int(decoded['data_u32'])
                      out['type_definition'] = type_by_tdi.get(tdi, {'type_definition_index': tdi})
                  elif decoded['kind'] == 0x1D:
                      target = int.from_bytes(entry[:8], 'little')
                      nested = read_va(target, ENTRY_SIZE)
                      if is_valid_type_entry(nested):
                          nd = decode_type_entry(nested)
                          elem = {
                              'kind': nd['kind_name'],
                              'data_u64': hex(int.from_bytes(nested[:8], 'little')),
                          }
                          if nd['kind'] in (0x11, 0x12):
                              tdi = int(nd['data_u32'])
                              elem['type_definition'] = type_by_tdi.get(
                                  tdi, {'type_definition_index': tdi}
                              )
                          out['element'] = elem
                  return out

              print('=== FIELD RUNTIME TYPES ===')
              field_runtime = {}
              for owner, rows in (('RandomQuestCond', random_fields), ('QuestCond', quest_fields)):
                  for row in rows:
                      idx = int(row['field_type_index'])
                      info = decode_runtime_type(idx)
                      field_runtime[f'{owner}.{row["field_name"]}'] = info
                      print(owner, row['field_name'], json.dumps(info, ensure_ascii=False))

              def find_wrap(type_fragment):
                  matches = [
                      row for row in types
                      if type_fragment in row.get('type_name', '')
                  ]
                  if len(matches) != 1:
                      raise SystemExit(f'{type_fragment}: expected one wrapper type, got {len(matches)}')
                  return int(matches[0]['type_definition_index'])

              wrapper_specs = {}
              for owner, fragment in (
                  ('RandomQuestCond', 'MoleMoleConfigRandomQuestCondWrap'),
                  ('QuestCond', 'MoleMoleConfigQuestCondWrap'),
              ):
                  tdi = find_wrap(fragment)
                  for prop in ('type', 'param'):
                      row = method(tdi, f'_g_get_{prop}', 1)
                      wrapper_specs[f'{owner}.{prop}'] = int(row['rva'], 16)

              def insns(start, end):
                  blob = read_rva(start, end - start)
                  return list(md.disasm(blob, base + start))

              def line(insn):
                  return (
                      f'0x{insn.address-base:09X}: {insn.bytes.hex():<24} '
                      f'{insn.mnemonic:<8} {insn.op_str}'
                  )

              wrapper_offsets = {}
              print('=== XLUA FIELD GETTERS ===')
              for name, start in wrapper_specs.items():
                  body = insns(start, start + 0x180)
                  offsets = []
                  print(f'--- {name} @ 0x{start:X} ---')
                  for insn in body:
                      print(line(insn))
                      for op in insn.operands:
                          if op.type == X86_OP_MEM and op.mem.base == X86_REG_RAX:
                              if op.mem.disp in (0x10, 0x18):
                                  offsets.append(op.mem.disp)
                      if insn.mnemonic == 'ret':
                          break
                  wrapper_offsets[name] = sorted(set(offsets))
                  print('candidate_offsets=', [hex(x) for x in wrapper_offsets[name]])
                  if len(wrapper_offsets[name]) != 1:
                      raise SystemExit(f'{name}: could not isolate one +0x10/+0x18 field offset')

              if wrapper_offsets['RandomQuestCond.type'] == wrapper_offsets['RandomQuestCond.param']:
                  raise SystemExit('RandomQuestCond type/param getters resolved to same field')
              if wrapper_offsets['QuestCond.type'] == wrapper_offsets['QuestCond.param']:
                  raise SystemExit('QuestCond type/param getters resolved to same field')

              def dump_reader(label, row, expected_end):
                  start = int(row['rva'], 16)
                  body = insns(start, expected_end)
                  calls = []
                  print(f'=== {label} 0x{start:X}..0x{expected_end:X} ===')
                  for insn in body:
                      print(line(insn))
                      if insn.mnemonic == 'call' and insn.operands:
                          op = insn.operands[0]
                          if op.type == 2:
                              target = op.imm - base
                              calls.append({
                                  'site_rva': hex(insn.address - base),
                                  'target_rva': hex(target),
                                  'metadata': methods_by_rva.get(target, []),
                              })
                  print('=== direct calls ===')
                  for call in calls:
                      print(json.dumps(call, ensure_ascii=False))
                  return {
                      'start_rva': hex(start),
                      'end_rva': hex(expected_end),
                      'calls': calls,
                      'bytes': read_rva(start, expected_end - start).hex(),
                  }

              random_dump = dump_reader(
                  'RandomQuestCond.FromBinaryInner(reader)',
                  random_inner,
                  0xB647AF0,
              )
              quest_dump = dump_reader(
                  'QuestCond.FromBinaryInner(reader)',
                  quest_inner,
                  0x11582850,
              )

              evidence = {
                  'field_runtime_types': field_runtime,
                  'wrapper_offsets': {
                      key: [hex(x) for x in value]
                      for key, value in wrapper_offsets.items()
                  },
                  'random_quest_cond': random_dump,
                  'quest_cond': quest_dump,
              }
              Path('quest-cond-binary-reader.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-row-prereq-schema
          path: |
            quest-row-prereq-schema.txt
            quest-row-prereq-schema.json
            quest-cond-binary-reader.txt
            quest-cond-binary-reader.json
          if-no-files-found: warn
