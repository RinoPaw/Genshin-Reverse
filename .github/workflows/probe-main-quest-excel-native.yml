name: Probe main 7.1 QuestExcel native loader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-main-quest-excel-native.yml"
      - "tools/trace_native_call_edges.py"
      - "genshinre/nativeprofile.py"
      - "genshinre/samplefetch.py"
      - "scripts/fetch-7.1-samples.sh"

concurrency:
  group: probe-main-quest-excel-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Search metadata for surviving QuestExcel identities
        run: |
          python - <<'PY' | tee quest-metadata-search.txt
          import csv, json
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64/metadata')
          needles = ('questexcel', 'questexcelconfig')
          hits = 0
          for path in sorted(root.glob('*.csv')):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  for row in csv.DictReader(f):
                      haystack = '\n'.join(str(value) for value in row.values()).lower()
                      if any(needle in haystack for needle in needles):
                          print(path.name, json.dumps(row, ensure_ascii=False, sort_keys=True))
                          hits += 1
          print('HIT_COUNT', hits)
          PY
      - name: Trace all QuestCond binary entry points
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-cond-call-edges.json \
            --focus quest-cond-from-binary-1:0x11582570 \
            --focus quest-cond-inner-1:0x115825D0 \
            --focus quest-cond-from-binary-2:0x115828F0 \
            --focus quest-cond-inner-2:0x11582950 \
            --max-body 0x4000 | tee quest-cond-call-summary.txt
      - name: Summarize caller owners
        run: |
          python - <<'PY' | tee quest-main-caller-summary.txt
          import json

          report = json.load(open('quest-cond-call-edges.json', encoding='utf-8'))
          for key, item in report['focus'].items():
              print('===', key, '===')
              print('OWNER', json.dumps(item['owner'], ensure_ascii=False, sort_keys=True))
              print('CALLER_COUNT', item['validated_direct_caller_count'])
              for caller in item['direct_callers']:
                  print('CALLER', json.dumps(caller, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload focused evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-main-caller-probe
          path: |
            quest-metadata-search.txt
            quest-cond-call-edges.json
            quest-cond-call-summary.txt
            quest-main-caller-summary.txt
          if-no-files-found: error
