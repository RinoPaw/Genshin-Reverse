name: Probe QuestExcel wire transition

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-transition.yml"
      - "genshinre/questlegacy.py"

concurrency:
  group: probe-quest-legacy-transition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.2"
            build: "A7MXB8KyIJQg"
            manifest: "b142c9f962d5da2c_41726ac4de910b1bb494cb01646c330f"
          - version: "5.0"
            build: "Xjsq5P6brXRg"
            manifest: "a840226e3d67bc2e_8553accd71b3242c98b3cbc0589825cc"
          - version: "6.0"
            build: "R6VKQTMPUUBa"
            manifest: "e64ca10c417ae850_028ff30ff105d093df1df15a46fed16a"
          - version: "6.7"
            build: "E2zvp18oyzw6"
            manifest: "ccce2f7066358067_b659db7d40b8ac7311addf76f7edf5b5"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned AnimeStudio CLI
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if (("${#apphosts[@]}")); then
            chmod +x "${apphosts[0]}"
            printf '%s\n' "${apphosts[0]}" >/tmp/animestudio-entry
          elif (("${#dlls[@]}")); then
            printf 'dotnet\n%s\n' "${dlls[0]}" >/tmp/animestudio-entry
          else
            exit 2
          fi

      - name: Reconstruct exact historical Quest block
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          BUILD: ${{ matrix.build }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-wire-transition-sample.txt
          import hashlib,os
          from pathlib import Path
          from genshinre.samplefetch import (
              download,decompress_zstd,parse_manifest,normalized_name,reconstruct,
          )

          version=os.environ["VERSION"]
          build=os.environ["BUILD"]
          manifest_id=os.environ["MANIFEST"]
          path="cxhpq4g4rgg0"
          manifest_url=(
              "https://autopatchhk.yuanshen.com/client_app/sophon/manifests/"
              f"{path}/{build}/manifest_{manifest_id}"
          )
          chunk_prefix=(
              "https://autopatchhk.yuanshen.com/client_app/sophon/chunks/"
              f"{path}/{build}"
          )
          rows=parse_manifest(decompress_zstd(download(manifest_url)))
          suffix="/assetbundles/blocks/00/25539185.blk"
          hits=[r for r in rows if normalized_name(r).endswith(suffix)]
          if len(hits)!=1:
              alt=[r for r in rows if normalized_name(r).endswith("/25539185.blk")]
              raise SystemExit(
                  f"{version}: Quest block missing/ambiguous exact={len(hits)} alt={len(alt)}"
              )
          target=Path("inputs")/version/"25539185.blk"
          reconstruct(chunk_prefix,hits[0],target,workers=8)
          raw=target.read_bytes()
          print("version",version)
          print("manifest_files",len(rows))
          print("source",hits[0].get("filename"))
          print("block_size",len(raw))
          print("block_md5",hashlib.md5(raw).hexdigest())
          print("block_sha256",hashlib.sha256(raw).hexdigest())
          PY

      - name: Export exact historical QuestExcel object
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mapfile -t entry </tmp/animestudio-entry
          if (("${#entry[@]}"==1)); then
            cli=("${entry[0]}")
          else
            cli=("${entry[0]}" "${entry[1]}")
          fi
          rm -rf quest-output
          mkdir -p quest-output
          "${cli[@]}" "inputs/$VERSION/25539185.blk" quest-output \
            --game GI --export_type Raw --logger_flags Error 2>&1 \
            | tee quest-wire-transition-animestudio.txt
          test -s quest-output/MiHoYoBinData/3b87ae83.dat

      - name: Fingerprint wire and test 3.x decoder family
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-wire-transition.txt
          import hashlib,json,os
          from pathlib import Path

          from genshinre.questlegacy import (
              LegacyQuestParseError,
              detect_legacy_quest_xor_key,
              find_quest_rows,
              parse_legacy_quest_prefix,
              unwrap_legacy_mihoyo_bin_data,
          )

          version=os.environ["VERSION"]
          raw=Path("quest-output/MiHoYoBinData/3b87ae83.dat").read_bytes()
          payload=unwrap_legacy_mihoyo_bin_data(raw)
          result={
              "version":version,
              "raw_size":len(raw),
              "raw_sha256":hashlib.sha256(raw).hexdigest(),
              "payload_size":len(payload),
              "payload_sha256":hashlib.sha256(payload).hexdigest(),
              "payload_head64":payload[:64].hex(),
              "matches_3x_single_byte_xor_wire":False,
          }

          try:
              key,row_count=detect_legacy_quest_xor_key(raw,probe_rows=100)
              prefix=parse_legacy_quest_prefix(raw,xor_key=key,max_rows=100)
              quest351=find_quest_rows(prefix,main_id=351)
              result.update({
                  "matches_3x_single_byte_xor_wire":True,
                  "xor_key":f"0x{key:02X}",
                  "row_count":row_count,
                  "prefix_consumed":prefix.consumed,
                  "quest_351":[
                      {
                          "row_index":row.index,
                          "start":row.start,
                          "end":row.end,
                          **row.fields,
                      }
                      for row in quest351
                  ],
              })
          except LegacyQuestParseError as exc:
              result["legacy_decoder_error"]=str(exc)

          print(json.dumps(result,ensure_ascii=False,indent=2))
          Path("quest-wire-transition.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-wire-transition-${{ matrix.version }}
          path: |
            quest-wire-transition-sample.txt
            quest-wire-transition-animestudio.txt
            quest-wire-transition.txt
            quest-wire-transition.json
            quest-output/MiHoYoBinData/3b87ae83.dat
          if-no-files-found: warn
