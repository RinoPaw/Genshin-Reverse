name: Probe QuestExcel legacy-loader transition

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-transition.yml"

concurrency:
  group: probe-quest-legacy-transition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.2"
            build: "A7MXB8KyIJQg"
            manifest: "b142c9f962d5da2c_41726ac4de910b1bb494cb01646c330f"
          - version: "5.0"
            build: "Xjsq5P6brXRg"
            manifest: "a840226e3d67bc2e_8553accd71b3242c98b3cbc0589825cc"
          - version: "6.0"
            build: "R6VKQTMPUUBa"
            manifest: "e64ca10c417ae850_028ff30ff105d093df1df15a46fed16a"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard

      - name: Reconstruct exact executable and metadata
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          BUILD: ${{ matrix.build }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-transition-sample.txt
          import os
          from pathlib import Path
          from genshinre.samplefetch import (
              download,decompress_zstd,parse_manifest,choose_executable,
              choose_managed_metadata,reconstruct,
          )
          from genshinre.sampleidentity import sha256_file

          version=os.environ["VERSION"]
          build=os.environ["BUILD"]
          manifest_id=os.environ["MANIFEST"]
          path="cxhpq4g4rgg0"
          manifest_url=(
              f"https://autopatchhk.yuanshen.com/client_app/sophon/manifests/"
              f"{path}/{build}/manifest_{manifest_id}"
          )
          chunk_prefix=(
              f"https://autopatchhk.yuanshen.com/client_app/sophon/chunks/"
              f"{path}/{build}"
          )
          manifest=parse_manifest(decompress_zstd(download(manifest_url)))
          exe_row=choose_executable(manifest)
          meta_row=choose_managed_metadata(manifest)
          out=Path("inputs")/f"{version}.0-global"
          exe=out/"GenshinImpact.exe"
          meta=out/"global-metadata.dat"
          reconstruct(chunk_prefix,exe_row,exe,8)
          reconstruct(chunk_prefix,meta_row,meta,8)
          print("version",version)
          print("manifest_files",len(manifest))
          print("exe_sha256",sha256_file(exe))
          print("metadata_sha256",sha256_file(meta))
          print("exe_size",exe.stat().st_size)
          print("metadata_size",meta.stat().st_size)
          PY

      - name: Recover protected literals and classify QuestExcel presence
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          root=/tmp/gi-stringliteral
          commit=1008fd7db28dcbc55729d5bb6b3a585dab86cf8b
          mkdir -p "$root"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$commit/recover_string_literals.py"             -o "$root/recover_string_literals.py"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$commit/extract_constants.py"             -o "$root/extract_constants.py"

          (
            cd "$root"
            python recover_string_literals.py               "$GITHUB_WORKSPACE/inputs/$VERSION.0-global/global-metadata.dat"               "$GITHUB_WORKSPACE/inputs/$VERSION.0-global/GenshinImpact.exe"               -o "$GITHUB_WORKSPACE/quest-legacy-transition-literals-all.json"
          ) 2>&1 | tee quest-legacy-transition-recovery.txt

          python - <<'PY' | tee quest-legacy-transition-summary.txt
          import json,os
          from pathlib import Path
          rows=json.loads(Path("quest-legacy-transition-literals-all.json").read_text(encoding="utf-8"))
          exact="Data/_ExcelBinOutput/QuestExcelConfigData"
          names={
              "ordinary_path": exact,
              "main_path":"Data/_ExcelBinOutput/MainQuestExcelConfigData",
              "random_path":"Data/_ExcelBinOutput/RandomQuestExcelConfigData",
              "acceptCond":"acceptCond",
              "acceptCondComb":"acceptCondComb",
              "beginExec":"beginExec",
          }
          hits={k:[r for r in rows if r.get("value")==v] for k,v in names.items()}
          contains_quest=[
              r for r in rows
              if "QuestExcelConfig" in r.get("value","")
          ]
          out={
              "version":os.environ["VERSION"],
              "total_literals":len(rows),
              "exact_hits":hits,
              "quest_excel_literals":contains_quest,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("quest-legacy-transition-summary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-transition-${{ matrix.version }}
          path: |
            quest-legacy-transition-sample.txt
            quest-legacy-transition-recovery.txt
            quest-legacy-transition-summary.txt
            quest-legacy-transition-summary.json
          if-no-files-found: error
