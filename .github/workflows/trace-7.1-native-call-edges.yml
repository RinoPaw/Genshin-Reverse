name: Trace 7.1 Native Call Edges

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Comma-separated LABEL:RVA entries, for example born-handler:0xC227790
        required: true
        type: string
      max_body:
        description: Maximum bytes disassembled per metadata method
        required: true
        default: '0x8000'
        type: string
      label:
        description: Optional research label
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOCUS: ${{ inputs.focus }}
      MAX_BODY: ${{ inputs.max_body }}
      LABEL: ${{ inputs.label }}
    steps:
      - name: Checkout Genshin-Reverse
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused research dependencies
        run: |
          python -m pip install -e . capstone zstandard

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Verify pinned executable
        run: |
          python - <<'PY'
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.sampleidentity import require_profile_exe

          path = Path('inputs/7.1.0-global/GenshinImpact.exe')
          print(require_profile_exe(path, PROFILE_71))
          PY

      - name: Trace selected native call edges
        shell: bash
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -r -a values <<< "$FOCUS"
          for value in "${values[@]}"; do
            value="${value// /}"
            if [[ -n "$value" ]]; then
              args+=(--focus "$value")
            fi
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "at least one LABEL:RVA focus is required" >&2
            exit 2
          fi

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            native-call-edges.json \
            "${args[@]}" \
            --max-body "$MAX_BODY"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('native-call-edges.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['sample'] = '7.1.0-global/windows-x64'
          data['research_label'] = os.environ.get('LABEL', '')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Preserve native call-edge trace
        uses: actions/upload-artifact@v7
        with:
          name: 7.1-native-call-edges
          path: native-call-edges.json
          if-no-files-found: error
          retention-days: 7
