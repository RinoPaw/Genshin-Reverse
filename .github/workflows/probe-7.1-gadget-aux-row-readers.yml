name: Probe original 7.1 auxiliary Gadget row readers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-7.1-gadget-aux-row-readers.yml'
      - 'scripts/probe-7.1-gadget-aux-row-readers.py'

permissions:
  contents: read

concurrency:
  group: research-71-gadget-aux-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard capstone
      - name: Fetch original hash-pinned Global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Check original native row key and TypeInfo references
        run: |
          python scripts/probe-7.1-gadget-aux-row-readers.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/native-gadget-aux-reader-candidates.json
      - name: Disassemble nearest native Gadget auxiliary reader candidates
        run: |
          EXPECTED_SHA=$(python -c "from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)")
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe \
            0x9EB86F0 0x1000 --expected-sha256 "$EXPECTED_SHA" \
            --output work/prop-closest-native-reader.json > /dev/null
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe \
            0xBE94FB0 0x1000 --expected-sha256 "$EXPECTED_SHA" \
            --output work/interact-closest-native-reader.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for label, filename in [
              ("GadgetProp", "work/prop-closest-native-reader.json"),
              ("GadgetInteract", "work/interact-closest-native-reader.json"),
          ]:
              rows = json.loads(Path(filename).read_text())["instructions"]
              until_ret = next((i + 1 for i, ins in enumerate(rows)
                                if ins["mnemonic"] == "ret"), len(rows))
              print(label, "disassembledInstructions", len(rows),
                    "throughFirstRet", until_ret, "firstRetRva",
                    rows[until_ret - 1]["rva"])
              for ins in rows[:min(until_ret, 40)]:
                  print(ins["rva"], ins["mnemonic"], ins["op_str"])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-aux-reader-candidates
          path: |
            work/native-gadget-aux-reader-candidates.json
            work/prop-closest-native-reader.json
            work/interact-closest-native-reader.json
          if-no-files-found: error
          retention-days: 7
