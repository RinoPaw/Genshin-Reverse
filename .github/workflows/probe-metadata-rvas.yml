name: Probe metadata RVAs

on:
  push:
    paths:
      - .github/workflows/probe-metadata-rvas.yml
  workflow_dispatch:

concurrency:
  group: probe-metadata-rvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Resolve helper RVAs and codec type
        run: |
          set -euo pipefail
          METHODS=versions/7.1.0-global/windows-x64/metadata/methods.csv
          FIELDS=versions/7.1.0-global/windows-x64/metadata/fields.csv
          for rva in 0xAABBD80 0x182C3AA0 0x182C3E20 0x182C4710 0x529A10 0x1184DFE0 0x510BE0; do
            echo "=== $rva ==="
            genshinre query-methods "$METHODS" --rva "$rva" || true
          done
          echo '=== typeDefinition 84808 methods ==='
          genshinre query-methods "$METHODS" --type-definition-index 84808 || true
          echo '=== typeDefinition 84808 fields ==='
          genshinre query-fields "$FIELDS" --type-definition-index 84808 || true
