name: Probe 7.1 native BinData source

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-native-bin-source.yml"

concurrency:
  group: probe-quest-native-bin-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Disassemble native BinData entrypoints
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x1111C50 0x500 \
            --expected-sha256 "$sha" --label "native GetBinDataLength" \
            --output quest-native-bin-length.json > quest-native-bin-length.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x1112930 0x1000 \
            --expected-sha256 "$sha" --label "native LoadBinDataZip source" \
            --output quest-native-bin-zip-source.json > quest-native-bin-zip-source.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x11260D0 0x80 \
            --expected-sha256 "$sha" --label "native BinData source length query core" \
            --output quest-native-bin-source-length-core.json > quest-native-bin-source-length-core.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x1126100 0x500 \
            --expected-sha256 "$sha" --label "native BinData source read core" \
            --output quest-native-bin-source-read-core.json > quest-native-bin-source-read-core.txt

      - name: Summarize native BinData source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-native-bin-source-summary.txt
          import json,re
          from pathlib import Path

          out={}
          for fn in (
              "quest-native-bin-length.json",
              "quest-native-bin-zip-source.json",
              "quest-native-bin-source-length-core.json",
              "quest-native-bin-source-read-core.json",
          ):
              d=json.loads(Path(fn).read_text())
              rows=[]
              for x in d["instructions"]:
                  m=x.get("mnemonic","")
                  op=x.get("op_str","").lower()
                  if (
                      m in {
                          "call","jmp","mov","movzx","movsxd","lea","cmp","test",
                          "and","or","xor","add","sub","imul","mul","div","idiv",
                          "shr","shl","sar","rol","ror"
                      }
                      and (
                          m in {"call","jmp"}
                          or any(r in op for r in (
                              "rcx","rdx","r8","r9","rax","rbx","rsi","rdi",
                              "r10","r11","r12","r13","r14","r15"
                          ))
                      )
                  ):
                      rows.append(x)
              out[fn]=rows
              print("\n###",fn)
              for x in rows:
                  print(x["rva"],x["mnemonic"],x["op_str"])
          Path("quest-native-bin-source-summary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-native-bin-source
          path: |
            quest-native-bin-length.txt
            quest-native-bin-length.json
            quest-native-bin-zip-source.txt
            quest-native-bin-zip-source.json
            quest-native-bin-source-length-core.txt
            quest-native-bin-source-length-core.json
            quest-native-bin-source-read-core.txt
            quest-native-bin-source-read-core.json
            quest-native-bin-source-summary.txt
            quest-native-bin-source-summary.json
          if-no-files-found: error
