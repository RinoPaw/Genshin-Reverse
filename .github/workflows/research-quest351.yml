name: Research Quest 351 return state

on:
  push:
    branches:
      - research/quest351-return
    paths:
      - 'tools/research_quest351_metadata.py'
      - 'tools/research_quest351_keywords.py'
      - 'tools/research_quest351_types.py'
      - '.github/workflows/research-quest351.yml'

permissions:
  contents: read

# Ephemeral research compute for issue #9; keep it isolated from main CI.
# Candidate dump pass: generic-heavy core module + return-button UI owners.
jobs:
  metadata-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Correlate historical QuestModule layout with 7.1 metadata
        run: python tools/research_quest351_metadata.py

      - name: Sweep semantic quest anchors
        run: python tools/research_quest351_keywords.py

      - name: Dump QuestModule and return-button candidates
        run: python tools/research_quest351_types.py

      - name: Preserve candidate reports
        uses: actions/upload-artifact@v7
        with:
          name: quest351-metadata-research
          path: |
            quest351-metadata-candidates.json
            quest351-keyword-sweep.json
            quest351-target-types.json
          if-no-files-found: error
          retention-days: 7
