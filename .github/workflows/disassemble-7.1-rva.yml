name: Disassemble 7.1 RVA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disassemble-7.1-rva.yml'
  workflow_dispatch:
    inputs:
      rva:
        description: Start RVA, for example 0x9ED2100
        required: true
        type: string
      size:
        description: Byte size, for example 0x60
        required: true
        default: '0x100'
        type: string
      label:
        description: Optional research label
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RVA: ${{ inputs.rva || '0x9ED2100' }}
      SIZE: ${{ inputs.size || '0x60' }}
      LABEL: ${{ inputs.label || 'cmdid-186-parser' }}
    steps:
      - name: Checkout Genshin-Reverse
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused research dependencies
        run: |
          python -m pip install -e . capstone zstandard

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Disassemble requested RVA range
        run: |
          expected_sha=$(python - <<'PY'
          from genshinre.mhy71 import EXPECTED_EXE_SHA256
          print(EXPECTED_EXE_SHA256)
          PY
          )
          python tools/disassemble_rva.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            "$RVA" "$SIZE" \
            --expected-sha256 "$expected_sha" \
            --label "$LABEL" \
            --output method-disassembly.json

      - name: Preserve disassembly
        uses: actions/upload-artifact@v4
        with:
          name: 7.1-rva-disassembly
          path: method-disassembly.json
          if-no-files-found: error
          retention-days: 7
