name: Probe 7.1 RandomQuestCond layout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-random-quest-cond.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Print RandomQuestCond metadata
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('versions/7.1.0-global/windows-x64/metadata')
          def read(name):
              with (root/name).open('r',encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          fields=read('fields.csv'); methods=read('methods.csv'); types=read('types.csv')
          print('=== RandomQuestCond fields tdi=76090 ===')
          refs=set()
          names=[]
          for r in fields:
              if r.get('type_definition_index')=='76090':
                  print(json.dumps(r,ensure_ascii=False))
                  refs.add(r.get('field_type_index',''))
                  names.append(r.get('field_name') or '')
          print('=== RandomQuestCond methods ===')
          for r in methods:
              if r.get('type_definition_index')=='76090':
                  print(json.dumps(r,ensure_ascii=False))
          print('=== referenced field types ===')
          for r in types:
              vals={r.get('type_index',''),r.get('index',''),r.get('type_definition_index','')}
              if refs & vals:
                  print(json.dumps(r,ensure_ascii=False))
          print('=== wrapper accessors by field name ===')
          needles=set()
          for n in names:
              base=n.lstrip('_')
              if base:
                  needles |= {f'_g_get_{base}',f'_s_set_{base}',f'get_{base}',f'set_{base}'}
          for r in methods:
              if r.get('method_name') in needles:
                  print(json.dumps(r,ensure_ascii=False))
          PY
      - name: Disassemble actual RandomQuestCond one-param decoder
        run: |
          expected_sha=$(python - <<'PY'
          from genshinre.nativeprofile import PROFILE_71
          print(PROFILE_71.exe_sha256)
          PY
          )
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0xB647530 0x5C0 \
            --expected-sha256 "$expected_sha" --label "RandomQuestCond.FromBinaryInner(reader)" --output random-quest-cond.json >/dev/null
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          obj=json.load(open('random-quest-cond.json',encoding='utf-8'))
          ins=obj['instructions']
          print('=== object writes / reader calls / branches ===')
          for i,x in enumerate(ins):
              op=x['op_str'].lower()
              interesting=(x['mnemonic']=='call' or ('[' in op and any(reg in op for reg in ('r14','r13','r12','rbx','rdi','rsi'))) or x['mnemonic']=='ret')
              if interesting:
                  lo=max(0,i-1); hi=min(len(ins),i+2)
                  print('--')
                  for y in ins[lo:hi]: print(f"{y['rva']:>12} {y['mnemonic']:<7} {y['op_str']}")
          print('=== metadata-resolved direct calls ===')
          with Path('versions/7.1.0-global/windows-x64/metadata/methods.csv').open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          by_rva={int(r['rva'],0):r for r in rows if (r.get('rva') or '') not in ('','0','0x0')}
          base=int(obj['image_base'],16)
          seen=set()
          for x in ins:
              if x['mnemonic']!='call': continue
              m=re.fullmatch(r'0x([0-9a-fA-F]+)',x['op_str'])
              if not m: continue
              rv=int(m.group(1),16)-base
              if rv in seen: continue
              seen.add(rv)
              r=by_rva.get(rv)
              if r: print(hex(rv),json.dumps(r,ensure_ascii=False))
          PY
      - name: Trace callers and callees
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            random-quest-cond-edges.json \
            --focus random-quest-cond-inner:0xB647530 \
            --max-body 0x3000
          cat random-quest-cond-edges.json
