name: One-shot original 7.1 Scene Point first-element prefix gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-point-first-element-prefix.yml'
      - 'scripts/probe-7.1-scene-point-first-element-prefix.py'

permissions:
  contents: read

jobs:
  first-element-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install original native binary dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Cross-check original Scene Point first element byte positions
        run: |
          python scripts/probe-7.1-scene-point-first-element-prefix.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --assets versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-source-payload-census.json \
            --factory versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-array-element-factory-native-evidence.json \
            --output work/original71-point-first-element-byte-gate.json
      - uses: actions/upload-artifact@v7
        with:
          name: original71-point-first-element-byte-gate
          path: work/original71-point-first-element-byte-gate.json
          retention-days: 7
          if-no-files-found: error
