name: Temporary exact 7.1 Gadget raw evidence

on:
  push:
    paths:
      - '.github/workflows/research-chest-native-71.yml'
      - 'scripts/collect-7.1-native-chest-assets.py'

permissions:
  contents: read

concurrency:
  group: temporary-gadget-71
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install bounded source tooling
        run: python -m pip install -e . zstandard
      - name: Fetch only two official manifest-pinned blocks
        run: |
          python scripts/fetch-7.1-design-blocks.py --output inputs/gadget-source --report work/sophon-source.json
      - name: Fetch pinned raw exporter
        run: |
          curl --fail --location --retry 3 --output inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz
          echo "12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz" | sha256sum --check
      - name: Validate index, Quest control and original Gadget source fingerprints
        run: |
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks inputs/gadget-source \
            --cli-archive inputs/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --work work/native-gadget \
            --report work/chest-evidence.json
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path("work/native-gadget/export-25539185/MiHoYoBinData/d65ab32f.dat")
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="a35e3f3ed04f950cb6302099d12aa71e23ece21d8fe578950347d9318f769e35"
          assert len(raw)==2854888
          report=json.loads(pathlib.Path("work/chest-evidence.json").read_text())
          print("VERIFIED native candidate statuses:",report["candidateStatusCounts"])
          print("VERIFIED gadget raw SHA-256:",hashlib.sha256(raw).hexdigest())
          PY
      - name: Audit full original Gadget inner rows against committed snapshot
        run: |
          python scripts/audit-7.1-gadget-native-rows.py \
            --raw-export work/native-gadget/export-25539185/MiHoYoBinData/d65ab32f.dat \
            --check
      - name: Retain source-control evidence only (no game asset bytes)
        uses: actions/upload-artifact@v7
        with:
          name: exact-7.1-gadget-audit-report
          path: work/chest-evidence.json
          if-no-files-found: error
          retention-days: 1
