name: Probe ScenePointUnlockNotify handler field accesses across 7.0 and 7.1

on:
  push:
    paths:
      - '.github/workflows/probe-7.0-7.1-scene-point-unlock-handler-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact 7.0 and 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/3XnPviMfoILi/manifest_2efe39d995f47170_29ad2bc6e42fe4af2086ae58c7e81b33' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/3XnPviMfoILi' \
            --output /tmp/gi70 \
            --expected-exe-sha256 'a1a23cb76d941df28c5156ca3152fa49421ec98842221b7d71633d42ee76ca45' \
            --expected-metadata-sha256 'd361ff11f6ca123f4126004db13cdf1956e00d95231f84c1e5437f560e79128b'
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Align handler memory accesses
        run: |
          python - <<'PY' > /tmp/scene-point-unlock-handler-fields.json
          import difflib, json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG, X86_REG_RIP
          from genshinre.pe import PEImage

          OLD = {'start': 0xB6F2870, 'end': 0xB6F3B00, 'name': '7.0 PANBIAIAIDH handler GDKGKIHBOPF'}
          NEW = {'start': 0xF05F0F0, 'end': 0xF060380, 'name': '7.1 DBNMIKBJIPE handler IPADDHFIGMF'}

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def disasm(image, spec):
              out=[]
              blob=image.read_rva(spec['start'], spec['end']-spec['start'])
              for ins in md.disasm(blob, image.image_base+spec['start']):
                  ops=[]; mems=[]
                  for op in ins.operands:
                      if op.type == X86_OP_REG:
                          ops.append('R')
                      elif op.type == X86_OP_IMM:
                          ops.append('T' if ins.mnemonic=='call' or ins.mnemonic.startswith('j') else 'I')
                      elif op.type == X86_OP_MEM:
                          base=ins.reg_name(op.mem.base) if op.mem.base else ''
                          index=ins.reg_name(op.mem.index) if op.mem.index else ''
                          disp=int(op.mem.disp)
                          mems.append({'base':base,'index':index,'scale':int(op.mem.scale),'disp':disp})
                          if op.mem.base == X86_REG_RIP:
                              ops.append('MRIP')
                          else:
                              ops.append('MBIG' if abs(disp)>=0x1000 else 'MSMALL')
                      else:
                          ops.append('O')
                  out.append({'rva':ins.address-image.image_base,'mnemonic':ins.mnemonic,'op_str':ins.op_str,
                              'token':ins.mnemonic+':'+':'.join(ops),'mems':mems})
              return out

          def compact(x):
              return {'rva':f"0x{x['rva']:X}",'mnemonic':x['mnemonic'],'op_str':x['op_str'],'mems':x['mems']}

          with PEImage(Path('/tmp/gi70/GenshinImpact.exe')) as im70, PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as im71:
              a=disasm(im70,OLD); b=disasm(im71,NEW)

          sm=difflib.SequenceMatcher(None,[x['token'] for x in a],[x['token'] for x in b],autojunk=False)
          aligned=[]
          small=[]
          for block in sm.get_matching_blocks():
              for k in range(block.size):
                  o=a[block.a+k]; n=b[block.b+k]
                  row={'old':compact(o),'new':compact(n)}
                  aligned.append(row)
                  om=[m for m in o['mems'] if 0x10 <= abs(m['disp']) < 0x200 and m['base']!='rip']
                  nm=[m for m in n['mems'] if 0x10 <= abs(m['disp']) < 0x200 and m['base']!='rip']
                  if om and nm:
                      small.append(row)

          report={
              'old':OLD,
              'new':NEW,
              'token_similarity':sm.ratio(),
              'old_instruction_count':len(a),
              'new_instruction_count':len(b),
              'old_head':[compact(x) for x in a[:140]],
              'new_head':[compact(x) for x in b[:140]],
              'aligned_small_memory_accesses':small,
              'aligned_instruction_count':len(aligned),
          }
          print(json.dumps(report,indent=2))
          PY

          python - <<'PY'
          import json
          d=json.load(open('/tmp/scene-point-unlock-handler-fields.json'))
          print('similarity',d['token_similarity'],'counts',d['old_instruction_count'],d['new_instruction_count'])
          print('--- 7.0 head ---')
          for x in d['old_head'][:70]: print(x['rva'],x['mnemonic'],x['op_str'])
          print('--- 7.1 head ---')
          for x in d['new_head'][:70]: print(x['rva'],x['mnemonic'],x['op_str'])
          print('--- aligned small memory accesses ---')
          for row in d['aligned_small_memory_accesses'][:240]:
              print(row['old']['rva'],row['old']['op_str'],' || ',row['new']['rva'],row['new']['op_str'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: scene-point-unlock-handler-fields-70-71
          path: /tmp/scene-point-unlock-handler-fields.json
          if-no-files-found: error
