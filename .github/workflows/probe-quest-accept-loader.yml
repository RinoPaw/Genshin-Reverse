name: Probe 7.1 Quest accept-condition loader

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-accept-loader.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Resolve loader metadata and disassemble
        run: |
          expected_sha=$(python - <<'PY'
          from genshinre.nativeprofile import PROFILE_71
          print(PROFILE_71.exe_sha256)
          PY
          )
          python - <<'PY'
          import csv, json
          from pathlib import Path
          path=Path('versions/7.1.0-global/windows-x64/metadata/methods.csv')
          with path.open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          target=0x0B6473F0
          print('=== methods nearest acceptCond loader RVA ===')
          nearest=[]
          for r in rows:
              text=r.get('rva') or ''
              if not text or text in ('0','0x0'): continue
              try: rv=int(text,0)
              except ValueError: continue
              d=abs(rv-target)
              if d < 0x2000:
                  nearest.append((d,rv,r))
          for d,rv,r in sorted(nearest)[:30]:
              print(hex(d),json.dumps(r,ensure_ascii=False))
          print('=== QuestCond FromBinary anchors ===')
          for r in rows:
              if r.get('type_definition_index')=='54128' and 'Binary' in (r.get('method_name') or ''):
                  print(json.dumps(r,ensure_ascii=False))
          PY
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x0B6473F0 0x900 \
            --expected-sha256 "$expected_sha" --label "RandomQuestExcelConfig.acceptCond loader" --output accept-loader.json >/dev/null
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          obj=json.load(open('accept-loader.json',encoding='utf-8'))
          ins=obj['instructions']
          print('=== loader prologue ===')
          for x in ins[:80]:
              print(f"{x['rva']:>12} {x['mnemonic']:<7} {x['op_str']}")
          print('=== loader direct calls ===')
          calls=[]
          for x in ins:
              if x['mnemonic']=='call':
                  print(f"{x['rva']:>12} call {x['op_str']}")
                  m=re.fullmatch(r'0x([0-9a-fA-F]+)',x['op_str'])
                  if m: calls.append(int(m.group(1),16)-int(obj['image_base'],16))
          with Path('versions/7.1.0-global/windows-x64/metadata/methods.csv').open('r',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          by_rva={int(r['rva'],0):r for r in rows if (r.get('rva') or '') not in ('','0','0x0')}
          print('=== metadata-resolved calls ===')
          for rv in calls:
              r=by_rva.get(rv)
              if r:
                  print(hex(rv),json.dumps(r,ensure_ascii=False))
          PY
      - name: Trace loader call edges
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-accept-loader-edges.json \
            --focus accept-loader:0x0B6473F0 \
            --focus quest-cond-from-binary:0x11582570 \
            --focus quest-cond-inner:0x115825D0 \
            --max-body 0x3000
          cat quest-accept-loader-edges.json
