name: One-shot original Global 7.1 Scene Point factory metadata usage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-point-factory-metadata-usage.yml'
      - 'scripts/probe-7.1-point-factory-metadata-usage-binding.py'

permissions:
  contents: read

jobs:
  original-usage-class-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install original metadata decode dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 executable and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect original factory static class pointers and metadata usage
        run: |
          python scripts/probe-7.1-point-factory-metadata-usage-binding.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --metadata inputs/7.1.0-global/global-metadata.dat \
            --factory versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-array-element-factory-native-evidence.json \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-factory-1-14-native-class-slot-xrefs.json \
            --output work/original71-factory-metadata-usage.json
      - uses: actions/upload-artifact@v7
        with:
          name: original71-factory-metadata-usage
          path: work/original71-factory-metadata-usage.json
          retention-days: 7
          if-no-files-found: error
