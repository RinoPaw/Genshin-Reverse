name: Inspect published 7.0 reference dump

on:
  push:
    paths:
      - '.github/workflows/inspect-7.0-reference-dump.yml'
      - 'tools/inspect_dumpcs_protocol_consumers.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and inspect published 7.0 dump archive
        run: |
          curl --fail --location \
            'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' \
            -o /tmp/data.7z
          curl --fail --location \
            'https://raw.githubusercontent.com/kuma-dayo/protos/main/7.0.0/packetIds.json' \
            -o /tmp/packetIds-7.0.json
          sha256sum /tmp/data.7z | tee /tmp/data-sha256.txt
          7z l -slt /tmp/data.7z | tee /tmp/data-list.txt
          mkdir -p /tmp/data
          7z x -y /tmp/data.7z -o/tmp/data >/tmp/data-extract.log
          find /tmp/data -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | tee /tmp/data-files.txt

      - name: Resolve historical trans point consumer owners
        run: |
          python tools/inspect_dumpcs_protocol_consumers.py \
            /tmp/data/data/dump.cs \
            /tmp/trans-point-consumers-7.0.json \
            --packet-ids /tmp/packetIds-7.0.json \
            --target CPKAHGFBBIH \
            --target CFBLHIJCOEN \
            --target CEDKGNBPJBL \
            --neighbors 24 \
            | tee /tmp/trans-point-consumers-7.0.txt

      - name: Locate historical trans point types
        run: |
          python - <<'PY' | tee /tmp/trans-point-reference-hits.txt
          from pathlib import Path
          roots=list(Path('/tmp/data').rglob('*'))
          needles=['CPKAHGFBBIH','CFBLHIJCOEN','CEDKGNBPJBL']
          for needle in needles:
              print('===', needle, '===')
              total=0
              for path in roots:
                  if not path.is_file():
                      continue
                  try:
                      text=path.read_text(encoding='utf-8',errors='ignore')
                  except Exception:
                      continue
                  if needle not in text:
                      continue
                  total+=1
                  print('FILE', path, 'size', path.stat().st_size)
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if needle in line:
                          lo=max(0,i-8); hi=min(len(lines),i+30)
                          print('--- lines',lo+1,'..',hi,'---')
                          for n in range(lo,hi):
                              print(f'{n+1}: {lines[n]}')
                  print()
              print('files_with_hits',total)
          PY

      - name: Inspect historical unlock sender method neighborhood
        run: |
          python - <<'PY' > /tmp/scene-owner-sender-band-7.0.json
          import json
          from pathlib import Path
          owner=None
          with Path('/tmp/data/data/dump.json').open(encoding='utf-8',errors='replace') as f:
              for line in f:
                  if '"name":"KGCKOFPFBLA"' not in line:
                      continue
                  obj,_=json.JSONDecoder().raw_decode(line.strip())
                  if obj.get('name')=='KGCKOFPFBLA':
                      owner=obj
                      break
          if owner is None:
              raise RuntimeError('KGCKOFPFBLA not found')
          rows=[]
          for pos,m in enumerate(owner.get('methods',[])):
              idx=m.get('idx')
              if 70 <= pos <= 86 or idx in (449753,449757,449834):
                  rows.append({
                      'owner_position':pos,
                      'method_index':idx,
                      'method_name':m.get('name'),
                      'rva':f"0x{int(m.get('rva') or 0):X}",
                      'return_type':m.get('ret'),
                      'parameters':m.get('params') or [],
                  })
          print(json.dumps({'owner':'KGCKOFPFBLA','rows':rows},indent=2))
          PY
          cat /tmp/scene-owner-sender-band-7.0.json

      - name: Upload compact reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi70-reference-dump-inspection
          path: |
            /tmp/data-sha256.txt
            /tmp/data-list.txt
            /tmp/data-files.txt
            /tmp/trans-point-consumers-7.0.json
            /tmp/trans-point-consumers-7.0.txt
            /tmp/trans-point-reference-hits.txt
            /tmp/scene-owner-sender-band-7.0.json
          if-no-files-found: warn
