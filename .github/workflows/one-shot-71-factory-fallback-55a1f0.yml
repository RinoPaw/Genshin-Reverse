name: One-shot original Global 7.1 factory fallback CFG

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-71-factory-fallback-55a1f0.yml'
      - 'scripts/probe-7.1-point-factory-fallback-55a1f0-cfg.py'

permissions:
  contents: read

jobs:
  original-fallback-cfg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native research dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch original Global 7.1 SHA-256-pinned source binary
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Traverse bounded source original native CFG
        run: |
          python scripts/probe-7.1-point-factory-fallback-55a1f0-cfg.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-point-factory-55a0b0-native-freelist.json \
            --output work/7.1-original-native-fallback-55a1f0-cfg.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-factory-fallback-native-cfg
          path: work/7.1-original-native-fallback-55a1f0-cfg.json
          retention-days: 7
          if-no-files-found: error
