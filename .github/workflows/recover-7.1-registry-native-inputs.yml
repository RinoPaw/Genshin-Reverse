name: Recover 7.1 registry native inputs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-7.1-registry-native-inputs.yml'
      - 'scripts/fetch-7.1-samples.sh'
      - 'genshinre/nativeprofile.py'
      - 'genshinre/registryslots.py'
      - 'genshinre/registryarrays.py'
      - 'versions/7.1.0-global/windows-x64/proto/known-opcodes.csv'

concurrency:
  group: recover-7.1-registry-native-inputs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Recover exact indexed registry type slots
        run: |
          OUT=versions/7.1.0-global/windows-x64/registry
          python -m genshinre.registryslots \
            /tmp/gi71/GenshinImpact.exe \
            "$OUT/registry-type-slots.csv" \
            --summary "$OUT/registry-type-slots.summary.json"
          cat "$OUT/registry-type-slots.summary.json"

      - name: Recover exact native CmdId and direction arrays
        run: |
          ROOT=versions/7.1.0-global/windows-x64
          OUT="$ROOT/registry"
          python -m genshinre.registryarrays \
            /tmp/gi71/GenshinImpact.exe \
            "$OUT/registry-type-slots.csv" \
            "$ROOT/proto/known-opcodes.csv" \
            "$OUT/registry-native-arrays.csv" \
            --summary "$OUT/registry-native-arrays.summary.json"
          cat "$OUT/registry-native-arrays.summary.json"

      - name: Commit recovered native registry inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/registry-type-slots.csv \
                  versions/7.1.0-global/windows-x64/registry/registry-type-slots.summary.json \
                  versions/7.1.0-global/windows-x64/registry/registry-native-arrays.csv \
                  versions/7.1.0-global/windows-x64/registry/registry-native-arrays.summary.json
          if git diff --cached --quiet; then
            echo 'No native registry input changes.'
            exit 0
          fi
          git commit -m 'data: refresh native 7.1 registry inputs'
          git pull --rebase origin main
          git push origin HEAD:main
