name: Probe exact 7.1 CmdId 27685 protocol type

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-scene-entity-protocol.yml']

permissions:
  contents: read

concurrency:
  group: research-71-scene-entity-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard capstone
      - name: Fetch pinned original Global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Decode registry owner methods and first original instructions
        run: |
          python scripts/probe-7.1-scene-entity-protocol-owner.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --registry versions/7.1.0-global/windows-x64/registry/registry.csv \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/7.1-cmd27685-native-owner.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-cmd27685-native-owner
          path: work/7.1-cmd27685-native-owner.json
          if-no-files-found: error
          retention-days: 7
