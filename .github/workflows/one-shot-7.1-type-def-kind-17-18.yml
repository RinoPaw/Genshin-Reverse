name: One-shot original 7.1 numeric type records 17 and 18

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-type-def-kind-17-18.yml'
      - 'scripts/probe-7.1-original-type-def-kind-17-18-native.py'

permissions:
  contents: read

jobs:
  native-type-def:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native source tools
        run: python -m pip install -e . capstone zstandard
      - name: Fetch original Global 7.1 client and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify original raw type record dword/native resolver path
        run: |
          python scripts/probe-7.1-original-type-def-kind-17-18-native.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --types versions/7.1.0-global/windows-x64/metadata/types.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-metadata-kind1-type-resolver-30-case-native.json \
            --output work/original-71-native-type-def-17-18.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-native-type-def-17-18
          path: work/original-71-native-type-def-17-18.json
          retention-days: 7
          if-no-files-found: error
