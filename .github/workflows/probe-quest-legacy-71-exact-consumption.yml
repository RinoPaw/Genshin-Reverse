name: Identify 7.1 QuestExcel reader by exact row consumption

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-71-exact-consumption.yml"

concurrency:
  group: probe-quest-legacy-71-exact-consumption-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -e . capstone pefile zstandard

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Download exact 7.1 QuestExcel object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/q71
          gh run download 37440823447 \
            --repo RinoPaw/Genshin-Reverse \
            --name quest-excel-asset-chain-probe \
            --dir evidence/q71
          test -s evidence/q71/quest-output/MiHoYoBinData/3b87ae83.dat

      - name: Fetch AstaPS PR9 resource for semantic controls only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/AstaPS-Resource
          git clone --filter=blob:none --no-checkout \
            https://github.com/MeChen618/AstaPS-Resource.git /tmp/AstaPS-Resource
          git -C /tmp/AstaPS-Resource sparse-checkout init --no-cone
          git -C /tmp/AstaPS-Resource sparse-checkout set \
            'ExcelBinOutput/QuestExcelConfigData.json'
          git -C /tmp/AstaPS-Resource checkout \
            7465e29b2d58058ab9973187c112abf2717ada03
          test -s /tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json

      - name: Checkout pinned binconfig analyzer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/genshin-7.0-local-re-devkit
          git clone --filter=blob:none \
            https://github.com/owomocha/genshin-7.0-local-re-devkit.git \
            /tmp/genshin-7.0-local-re-devkit
          git -C /tmp/genshin-7.0-local-re-devkit checkout --detach \
            fb91dfad1f6047e30dea2f98727e5af45d9bd6e0

      - name: Rank readers against complete native row framing
        shell: bash
        env:
          PYTHONPATH: /tmp/genshin-7.0-local-re-devkit/src:/tmp/genshin-7.0-local-re-devkit/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-71-exact-consumption.txt
          import csv
          import json
          import struct
          from pathlib import Path

          from genshin_re import binconfig as BC
          import gamedata_binconfig_ext as EXT

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          RAW=Path("evidence/q71/quest-output/MiHoYoBinData/3b87ae83.dat")
          RESOURCE=Path("/tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json")
          READER="FNIAHJGHFAK"
          SUBID_KEY=0xB1571A55
          MASKS={
              0x087EFDD5,0x087EDDD5,0x087FFDD5,0x087EF9D5,
              0x083EFDD5,0x087FDDD5,0x287EFDD5,0x087ED9D5,
              0x083EDDD5,0x007FFDD5,0x087FF9D5,0x083EF9D5,
              0x083FFDD5,
          }

          def read_csv(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))

          methods=read_csv("methods.csv")
          types=read_csv("types.csv")
          fields=read_csv("fields.csv")
          type_by_tdi={int(x["type_definition_index"]):x for x in types}
          fields_by_tdi={}
          for row in fields:
              try:
                  fields_by_tdi.setdefault(int(row["type_definition_index"]),[]).append(row)
              except Exception:
                  pass

          deser={}
          one_by_class={}
          candidates=[]
          for m in methods:
              try:
                  rva=int(m.get("rva") or "0",0)
                  tdi=int(m["type_definition_index"])
              except Exception:
                  continue
              if not rva:
                  continue
              try:
                  params=json.loads(m.get("parameter_types") or "[]")
              except Exception:
                  continue
              if not params or params[0] != READER:
                  continue

              cls=m.get("type_name") or "?"
              deser[rva]=(cls,m.get("method_name") or "?",str(params))
              if len(params)!=1:
                  continue

              ret=(m.get("return_type") or m.get("return_type_name") or "").lower()
              priority=0 if m.get("method_name")=="FromBinaryInner" else (1 if ret=="void" else 2)
              prev=one_by_class.get(cls)
              if prev is None or priority < prev[0]:
                  one_by_class[cls]=(priority,rva)

              t=type_by_tdi.get(tdi,{})
              try:
                  fc=int(t.get("field_count") or "0")
              except ValueError:
                  fc=0
              if 4 <= fc <= 80:
                  candidates.append((rva,m,t,fc,tdi))

          row_deser={cls:rva for cls,(_priority,rva) in one_by_class.items()}
          exe=BC.Exe(str(EXE))
          EXT.install(exe,deser,row_deser,clsfields={},deser1=row_deser)
          EXT.install2()

          raw=RAW.read_bytes()
          n=struct.unpack_from("<I",raw,0)[0]
          payload=raw[4:4+n]
          if n != len(raw)-4:
              raise SystemExit("MiHoYoBinData wrapper mismatch")

          # Complete native framing recovered independently of public row order:
          #
          #   payload[0:4]       table header
          #   row := u64 mask ... encoded_subId:u32
          #   next row begins at the next known low-mask word
          starts=[]
          for pos in range(4,len(payload)-7):
              if struct.unpack_from("<I",payload,pos)[0] in MASKS:
                  starts.append(pos)

          if len(starts)!=33214:
              raise SystemExit(f"unexpected native row count {len(starts)}")
          if starts[0]!=4:
              raise SystemExit(f"unexpected first row start {starts[0]}")

          resource=json.loads(RESOURCE.read_text(encoding="utf-8"))
          by_sid={
              row["subId"]:row
              for row in resource
              if isinstance(row.get("subId"),int)
          }

          spans=[]
          seen=set()
          for ordinal,start in enumerate(starts):
              end=starts[ordinal+1] if ordinal+1<len(starts) else len(payload)
              if not 50 <= end-start <= 267:
                  raise SystemExit(f"bad native row size {end-start} at {start:#x}")
              raw_sid=struct.unpack_from("<I",payload,end-4)[0]
              sid=raw_sid^SUBID_KEY
              if sid in seen:
                  raise SystemExit(f"duplicate native subId {sid}")
              seen.add(sid)
              spans.append({
                  "ordinal":ordinal,
                  "subId":sid,
                  "start":start,
                  "end":end,
                  "body_end":end-4,
                  "size":end-start,
                  "mask64":f"0x{struct.unpack_from('<Q',payload,start)[0]:016X}",
              })

          if spans[-1]["end"]!=len(payload):
              raise SystemExit("native rows do not fully consume payload")
          if len(seen)!=33214:
              raise SystemExit("native subId population mismatch")

          resource_matches=sum(1 for x in spans if x["subId"] in by_sid)
          if resource_matches!=33214:
              raise SystemExit(f"resource semantic controls incomplete: {resource_matches}")

          def quantile_sample(items,n):
              if len(items)<=n:
                  return list(items)
              idxs=sorted({
                  round(i*(len(items)-1)/(n-1))
                  for i in range(n)
              })
              return [items[i] for i in idxs]

          stage1=quantile_sample(spans,96)
          stage2=quantile_sample(spans,4000)

          built=[]
          for rva,m,t,fc,tdi in candidates:
              try:
                  schema=BC.build(exe,rva,deser,cache={})
              except Exception:
                  continue
              built.append((rva,m,t,fc,tdi,schema))

          print("native_rows",len(spans))
          print("resource_matches",resource_matches)
          print("full_payload_consumption",spans[-1]["end"]==len(payload))
          print("candidate_methods",len(candidates))
          print("built_schemas",len(built))
          print("stage1_rows",len(stage1))
          print("stage2_rows",len(stage2))

          def contains_value(x,target):
              if isinstance(x,bool):
                  return False
              if isinstance(x,int):
                  return x==target
              if isinstance(x,str):
                  return x==str(target)
              if isinstance(x,list):
                  return any(contains_value(v,target) for v in x)
              if isinstance(x,dict):
                  return any(contains_value(v,target) for v in x.values())
              return False

          def consume(schema,span,mode):
              reader=BC.Reader(payload)
              reader.p=span["start"]
              try:
                  value=reader.record(schema)
              except Exception as exc:
                  return False,reader.p,None,type(exc).__name__
              target=span["end"] if mode=="full" else span["body_end"]
              return reader.p==target,reader.p,value,None

          def evaluate(schema,sample,mode,keep_misses=0):
              exact=0
              errors=0
              sid_hits=0
              main_hits=0
              order_hits=0
              misses=[]
              for span in sample:
                  ok,end,value,err=consume(schema,span,mode)
                  if err:
                      errors+=1
                      if len(misses)<keep_misses:
                          misses.append({**span,"kind":"error","error":err,"end":end})
                      continue
                  if ok:
                      exact+=1
                      row=by_sid[span["subId"]]
                      if contains_value(value,span["subId"]):
                          sid_hits+=1
                      if contains_value(value,row.get("mainId")):
                          main_hits+=1
                      if contains_value(value,row.get("order")):
                          order_hits+=1
                  elif len(misses)<keep_misses:
                      target=span["end"] if mode=="full" else span["body_end"]
                      misses.append({
                          **span,
                          "kind":"under" if end<target else "over",
                          "end":end,
                          "delta":end-target,
                      })
              return {
                  "mode":mode,
                  "exact":exact,
                  "total":len(sample),
                  "ratio":exact/len(sample),
                  "errors":errors,
                  "subId_hits":sid_hits,
                  "mainId_hits":main_hits,
                  "order_hits":order_hits,
                  "misses":misses,
              }

          leaders=[]
          for rva,m,t,fc,tdi,schema in built:
              modes=[
                  evaluate(schema,stage1,"full"),
                  evaluate(schema,stage1,"without_subId"),
              ]
              best=max(
                  modes,
                  key=lambda x:(x["exact"],x["subId_hits"],x["mainId_hits"],x["order_hits"],-x["errors"]),
              )
              if best["exact"]==0:
                  continue
              leaders.append({
                  "rva":f"0x{rva:X}",
                  "_rva_int":rva,
                  "method":m,
                  "type":t,
                  "field_count_metadata":fc,
                  "type_fields":fields_by_tdi.get(tdi,[]),
                  "schema":schema,
                  "stage1_modes":modes,
                  "stage1_best":best,
              })

          leaders.sort(key=lambda x:(
              -x["stage1_best"]["exact"],
              -x["stage1_best"]["subId_hits"],
              -x["stage1_best"]["mainId_hits"],
              -x["stage1_best"]["order_hits"],
              x["rva"],
          ))

          print("\n=== stage1 leaders ===")
          for x in leaders[:50]:
              print(json.dumps({
                  "rva":x["rva"],
                  "type_name":x["method"].get("type_name"),
                  "method_name":x["method"].get("method_name"),
                  "metadata_fields":x["field_count_metadata"],
                  "schema_fields":sum(1 for st in x["schema"].get("steps",[]) if st.get("kind")!="base"),
                  "modes":x["stage1_modes"],
              },ensure_ascii=False))

          finalists=[]
          for x in leaders[:30]:
              mode=x["stage1_best"]["mode"]
              result=evaluate(x["schema"],stage2,mode,keep_misses=8)
              finalists.append({
                  **{k:v for k,v in x.items() if k not in {"schema","_rva_int","type_fields"}},
                  "stage2":result,
                  "schema":x["schema"],
              })

          finalists.sort(key=lambda x:(
              -x["stage2"]["exact"],
              -x["stage2"]["subId_hits"],
              -x["stage2"]["mainId_hits"],
              -x["stage2"]["order_hits"],
              x["rva"],
          ))

          print("\n=== stage2 finalists ===")
          for x in finalists:
              print(json.dumps({
                  "rva":x["rva"],
                  "type_name":x["method"].get("type_name"),
                  "method_name":x["method"].get("method_name"),
                  "metadata_fields":x["field_count_metadata"],
                  "stage1":x["stage1_best"],
                  "stage2":x["stage2"],
              },ensure_ascii=False))

          full_validation=[]
          for x in finalists:
              if x["stage2"]["ratio"]<0.95:
                  continue
              result=evaluate(x["schema"],spans,x["stage2"]["mode"],keep_misses=12)
              full_validation.append({
                  "rva":x["rva"],
                  "type_name":x["method"].get("type_name"),
                  "method_name":x["method"].get("method_name"),
                  "metadata_fields":x["field_count_metadata"],
                  "result":result,
              })

          print("\n=== full-table validation ===")
          for x in full_validation:
              print(json.dumps(x,ensure_ascii=False))

          report={
              "native":{
                  "raw_size":len(raw),
                  "payload_size":len(payload),
                  "row_count":len(spans),
                  "unique_subIds":len(seen),
                  "first_row_start":spans[0]["start"],
                  "last_row_end":spans[-1]["end"],
                  "full_consumption":spans[-1]["end"]==len(payload),
              },
              "framing":{
                  "table_header_bytes":4,
                  "row_start":"u64 presence-mask word",
                  "row_suffix":"encoded subId u32",
                  "subId_key":f"0x{SUBID_KEY:08X}",
                  "tested_reader_spans":[
                      "row start .. row end",
                      "row start .. row end-4",
                  ],
              },
              "resource":{
                  "commit":"7465e29b2d58058ab9973187c112abf2717ada03",
                  "rows":len(resource),
                  "native_matches":resource_matches,
              },
              "candidate_methods":len(candidates),
              "built_schemas":len(built),
              "stage1_sample_count":len(stage1),
              "stage2_sample_count":len(stage2),
              "leaders":[
                  {k:v for k,v in x.items() if k not in {"schema","_rva_int","type_fields"}}
                  for x in leaders[:100]
              ],
              "finalists":finalists,
              "full_validation":full_validation,
          }
          Path("quest-legacy-71-exact-consumption.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )

          if finalists:
              best=finalists[0]
              print(
                  "\nBEST",
                  best["rva"],
                  best["method"].get("type_name"),
                  best["method"].get("method_name"),
                  best["stage2"]["mode"],
                  f"{best['stage2']['exact']}/{best['stage2']['total']}",
              )
          else:
              print("\nNo candidate reader exactly consumed even one complete native row.")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-71-exact-consumption
          path: |
            quest-legacy-71-exact-consumption.txt
            quest-legacy-71-exact-consumption.json
          if-no-files-found: error
