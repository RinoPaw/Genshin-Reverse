name: Probe 3.0 legacy QuestExcel binary reader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30.yml"

concurrency:
  group: probe-quest-legacy-30-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Install focused dependencies
        run: python -m pip install capstone pefile

      - name: Download exact 3.0.0 UserAssembly and metadata from official ScatteredFiles
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          code_url="$base/GenshinImpact_Data/Native/UserAssembly.dll"
          meta_url="$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$code_url" -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$meta_url" -o "$out/global-metadata.dat"

          python - <<'PY' | tee quest-legacy-30-sample.txt
          from pathlib import Path
          import hashlib

          root=Path("inputs/3.0.0-global")
          for name in ("UserAssembly.dll","global-metadata.dat"):
              p=root/name
              raw=p.read_bytes()
              print(name,"size=",len(raw),"sha256=",hashlib.sha256(raw).hexdigest())
              if len(raw)<1_000_000:
                  raise SystemExit(f"{name}: unexpectedly small")
          PY

      - name: Resolve exact 3.0 QuestExcel symbols with pinned Il2CppDumper
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/il2cppdumper
          out="$GITHUB_WORKSPACE/quest-legacy-30-il2cpp"
          mkdir -p "$root" "$out"
          url='https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "$root/dumper.zip"
          unzip -q "$root/dumper.zip" -d "$root/app"
          (
            cd "$root/app"
            dotnet Il2CppDumper.dll               "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll"               "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat"               "$out"
          ) 2>&1 | tee quest-legacy-30-il2cppdumper.txt

          python - <<'PY' | tee quest-legacy-30-exact-symbols.txt
          import json,re
          from pathlib import Path

          out=Path("quest-legacy-30-il2cpp")
          report={"dump_exists":False,"script_exists":False,"class_snippet":None,"script_matches":[]}

          dump=out/"dump.cs"
          if dump.is_file():
              report["dump_exists"]=True
              s=dump.read_text(encoding="utf-8",errors="replace")
              m=re.search(r"public class QuestExcelConfig\b",s)
              if m:
                  start=max(0,s.rfind("// Namespace:",0,m.start()))
                  next_ns=s.find("// Namespace:",m.end())
                  end=next_ns if next_ns>=0 else min(len(s),m.start()+30000)
                  block=s[start:end]
                  report["class_snippet"]=block
                  print("=== QuestExcelConfig dump.cs ===")
                  print(block)

          script=out/"script.json"
          if script.is_file():
              report["script_exists"]=True
              data=json.loads(script.read_text(encoding="utf-8"))
              def walk(x):
                  if isinstance(x,dict):
                      name=str(x.get("Name",""))
                      if "QuestExcelConfig" in name and ("FromBinary" in name or "FILE_LOCATION" in name):
                          report["script_matches"].append(x)
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(data)
              print("=== script matches ===")
              for x in report["script_matches"]:
                  print(json.dumps(x,ensure_ascii=False,sort_keys=True))

          Path("quest-legacy-30-exact-symbols.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Disassemble exact 3.0 QuestExcel symbols discovered by metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-exact-reader.txt
          import json
          from pathlib import Path
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64

          symbols=Path("quest-legacy-30-exact-symbols.json")
          if not symbols.is_file():
              print("exact symbol report missing")
              raise SystemExit(0)
          d=json.loads(symbols.read_text(encoding="utf-8"))
          matches=d.get("script_matches",[])
          rows=[]
          for x in matches:
              name=str(x.get("Name",""))
              if "FromBinary" not in name:
                  continue
              try:
                  addr=int(x.get("Address"))
              except Exception:
                  continue
              rows.append((name,addr))
          if not rows:
              print("no exact FromBinary script matches")
              raise SystemExit(0)

          exe=Path("inputs/3.0.0-global/UserAssembly.dll")
          pe=pefile.PE(str(exe),fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64)

          report=[]
          for name,rva in rows[:8]:
              blob=pe.get_data(rva,0x3000)
              ins=[]
              for i in md.disasm(blob,base+rva):
                  irva=i.address-base
                  ins.append({"rva":f"0x{irva:X}","mnemonic":i.mnemonic,"op_str":i.op_str})
                  if i.mnemonic=="ret" and irva>rva+0x80:
                      break
              report.append({"name":name,"rva":f"0x{rva:X}","instructions":ins})
              print("\n###",name,f"RVA 0x{rva:X}")
              for x in ins:
                  print(x["rva"],x["mnemonic"],x["op_str"])

          Path("quest-legacy-30-exact-reader.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Native-scan official 3.0 QuestExcel field-layout fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-layout-scan.txt
          import json
          from collections import Counter
          from pathlib import Path

          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM

          exe=Path("inputs/3.0.0-global/UserAssembly.dll")
          pe=pefile.PE(str(exe),fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase

          targets={
              0x10:"subId",0x14:"mainId",0x18:"order",0x1C:"subIdSet",
              0x20:"isMpBlock",0x24:"descTextMapHash",
              0x28:"stepDescTextMapHash",0x2C:"guideTipsTextMapHash",
              0x30:"showType",0x34:"banType",
              0x38:"acceptCondComb",0x40:"acceptCond",
              0x48:"finishCondComb",0x50:"finishCond",
              0x58:"failCondComb",0x60:"failCond",
              0x68:"guide",0x70:"showGuide",
              0x74:"finishParent",0x75:"failParent",
              0x78:"failParentShow",0x7C:"isRewind",
              0x80:"finishExec",0x88:"failExec",0x90:"beginExec",
              0x98:"exclusiveNpcList",0xA0:"sharedNpcList",
              0xA8:"exclusiveNpcPriority",0xB0:"trialAvatarList",
              0xB8:"exclusivePlaceList",
          }
          critical={0x10,0x14,0x38,0x40,0x90}
          allowed={"rbx","rsi","rdi","r12","r13","r14","r15"}

          def canon(ins,reg):
              n=(ins.reg_name(reg) or "").lower()
              aliases={
                  "ebx":"rbx","bx":"rbx","bl":"rbx",
                  "esi":"rsi","si":"rsi","sil":"rsi",
                  "edi":"rdi","di":"rdi","dil":"rdi",
                  "r12d":"r12","r12w":"r12","r12b":"r12",
                  "r13d":"r13","r13w":"r13","r13b":"r13",
                  "r14d":"r14","r14w":"r14","r14b":"r14",
                  "r15d":"r15","r15w":"r15","r15b":"r15",
              }
              return aliases.get(n,n)

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          md.detail=True
          md.skipdata=True
          events={r:[] for r in allowed}

          for sec in pe.sections:
              if not (sec.Characteristics & 0x20000000):
                  continue
              blob=sec.get_data()
              va=base+sec.VirtualAddress
              for ins in md.disasm(blob,va):
                  seen=set()
                  for op in ins.operands:
                      if op.type!=X86_OP_MEM:
                          continue
                      m=op.mem
                      if m.index!=0 or m.base==0 or m.disp not in targets:
                          continue
                      reg=canon(ins,m.base)
                      if reg not in allowed:
                          continue
                      key=(reg,m.disp)
                      if key in seen:
                          continue
                      seen.add(key)
                      events[reg].append({
                          "rva":ins.address-base,
                          "disp":m.disp,
                          "field":targets[m.disp],
                          "size":op.size,
                          "mnemonic":ins.mnemonic,
                          "op_str":ins.op_str,
                      })

          WINDOW=0x2400
          candidates=[]
          for reg,arr in events.items():
              arr.sort(key=lambda x:x["rva"])
              cnt=Counter()
              j=0
              for i,e in enumerate(arr):
                  if j<i:
                      j=i
                  while j<len(arr) and arr[j]["rva"] < e["rva"]+WINDOW:
                      cnt[arr[j]["disp"]]+=1
                      j+=1
                  ds=set(cnt)
                  if len(ds)>=14:
                      score=len(ds)*10 + len(ds & critical)*35
                      candidates.append({
                          "score":score,
                          "base_reg":reg,
                          "start_rva":e["rva"],
                          "end_rva":arr[j-1]["rva"] if j>i else e["rva"],
                          "fields":[targets[x] for x in sorted(ds)],
                          "offsets":[f"0x{x:X}" for x in sorted(ds)],
                          "critical_complete":critical <= ds,
                      })
                  cnt[e["disp"]]-=1
                  if cnt[e["disp"]]<=0:
                      del cnt[e["disp"]]

          # Deduplicate overlapping windows for the same base register.
          candidates.sort(key=lambda x:(-x["score"],x["start_rva"]))
          kept=[]
          for x in candidates:
              if any(
                  y["base_reg"]==x["base_reg"]
                  and abs(y["start_rva"]-x["start_rva"])<0x800
                  for y in kept
              ):
                  continue
              kept.append(x)
              if len(kept)>=30:
                  break

          # Re-disassemble compact neighborhoods around top candidates.
          for x in kept[:12]:
              start=max(0,x["start_rva"]-0x180)
              end=x["end_rva"]+0x180
              code=pe.get_data(start,end-start)
              rows=[]
              for ins in md.disasm(code,base+start):
                  rva=ins.address-base
                  if rva<start or rva>=end:
                      continue
                  rows.append({
                      "rva":f"0x{rva:X}",
                      "bytes":ins.bytes.hex(),
                      "mnemonic":ins.mnemonic,
                      "op_str":ins.op_str,
                  })
              x["instructions"]=rows

          report={
              "sample_sha256":"b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b",
              "target_field_count":len(targets),
              "critical_offsets":[f"0x{x:X}" for x in sorted(critical)],
              "event_counts":{k:len(v) for k,v in events.items()},
              "candidates":kept,
          }
          print("CANDIDATES",len(kept))
          for n,x in enumerate(kept[:20]):
              print(
                  n,
                  "score=",x["score"],
                  "base=",x["base_reg"],
                  "range=",f"0x{x['start_rva']:X}-0x{x['end_rva']:X}",
                  "critical=",x["critical_complete"],
                  "offsets=",",".join(x["offsets"]),
              )
          Path("quest-legacy-30-layout-scan.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30
          path: |
            quest-legacy-30-sample.txt
            quest-legacy-30-il2cppdumper.txt
            quest-legacy-30-il2cppdumper.txt
            quest-legacy-30-exact-symbols.txt
            quest-legacy-30-exact-symbols.json
            quest-legacy-30-exact-reader.txt
            quest-legacy-30-exact-reader.json
            quest-legacy-30-layout-scan.txt
            quest-legacy-30-layout-scan.json
            quest-legacy-30-il2cpp/dump.cs
            quest-legacy-30-il2cpp/script.json
          if-no-files-found: warn
