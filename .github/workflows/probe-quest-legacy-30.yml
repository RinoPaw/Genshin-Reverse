name: Probe 3.0 legacy QuestExcel binary reader

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30.yml"

concurrency:
  group: probe-quest-legacy-30-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Install focused dependencies
        run: python -m pip install capstone pefile

      - name: Download exact 3.0.0 UserAssembly and metadata from official ScatteredFiles
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          code_url="$base/GenshinImpact_Data/Native/UserAssembly.dll"
          meta_url="$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$code_url" -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$meta_url" -o "$out/global-metadata.dat"

          python - <<'PY' | tee quest-legacy-30-sample.txt
          from pathlib import Path
          import hashlib

          root=Path("inputs/3.0.0-global")
          for name in ("UserAssembly.dll","global-metadata.dat"):
              p=root/name
              raw=p.read_bytes()
              print(name,"size=",len(raw),"sha256=",hashlib.sha256(raw).hexdigest())
              if len(raw)<1_000_000:
                  raise SystemExit(f"{name}: unexpectedly small")
          PY

      - name: Resolve exact 3.0 QuestExcel symbols with pinned Il2CppDumper
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/il2cppdumper
          out="$GITHUB_WORKSPACE/quest-legacy-30-il2cpp"
          mkdir -p "$root" "$out"
          url='https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "$root/dumper.zip"
          unzip -q "$root/dumper.zip" -d "$root/app"
          (
            cd "$root/app"
            dotnet Il2CppDumper.dll               "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll"               "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat"               "$out"
          ) 2>&1 | tee quest-legacy-30-il2cppdumper.txt

          python - <<'PY' | tee quest-legacy-30-exact-symbols.txt
          import json,re
          from pathlib import Path

          out=Path("quest-legacy-30-il2cpp")
          report={"dump_exists":False,"script_exists":False,"class_snippet":None,"script_matches":[]}

          dump=out/"dump.cs"
          if dump.is_file():
              report["dump_exists"]=True
              s=dump.read_text(encoding="utf-8",errors="replace")
              m=re.search(r"public class QuestExcelConfig\b",s)
              if m:
                  start=max(0,s.rfind("// Namespace:",0,m.start()))
                  next_ns=s.find("// Namespace:",m.end())
                  end=next_ns if next_ns>=0 else min(len(s),m.start()+30000)
                  block=s[start:end]
                  report["class_snippet"]=block
                  print("=== QuestExcelConfig dump.cs ===")
                  print(block)

          script=out/"script.json"
          if script.is_file():
              report["script_exists"]=True
              data=json.loads(script.read_text(encoding="utf-8"))
              def walk(x):
                  if isinstance(x,dict):
                      name=str(x.get("Name",""))
                      if "QuestExcelConfig" in name and ("FromBinary" in name or "FILE_LOCATION" in name):
                          report["script_matches"].append(x)
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(data)
              print("=== script matches ===")
              for x in report["script_matches"]:
                  print(json.dumps(x,ensure_ascii=False,sort_keys=True))

          Path("quest-legacy-30-exact-symbols.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Disassemble exact 3.0 QuestExcel symbols discovered by metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-exact-reader.txt
          import json
          from pathlib import Path
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64

          symbols=Path("quest-legacy-30-exact-symbols.json")
          if not symbols.is_file():
              print("exact symbol report missing")
              raise SystemExit(0)
          d=json.loads(symbols.read_text(encoding="utf-8"))
          matches=d.get("script_matches",[])
          rows=[]
          for x in matches:
              name=str(x.get("Name",""))
              if "FromBinary" not in name:
                  continue
              try:
                  addr=int(x.get("Address"))
              except Exception:
                  continue
              rows.append((name,addr))
          if not rows:
              print("no exact FromBinary script matches")
              raise SystemExit(0)

          exe=Path("inputs/3.0.0-global/UserAssembly.dll")
          pe=pefile.PE(str(exe),fast_load=True)
          base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64)

          report=[]
          for name,rva in rows[:8]:
              blob=pe.get_data(rva,0x3000)
              ins=[]
              for i in md.disasm(blob,base+rva):
                  irva=i.address-base
                  ins.append({"rva":f"0x{irva:X}","mnemonic":i.mnemonic,"op_str":i.op_str})
                  if i.mnemonic=="ret" and irva>rva+0x80:
                      break
              report.append({"name":name,"rva":f"0x{rva:X}","instructions":ins})
              print("\n###",name,f"RVA 0x{rva:X}")
              for x in ins:
                  print(x["rva"],x["mnemonic"],x["op_str"])

          Path("quest-legacy-30-exact-reader.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve exact 3.0 QuestExcel symbols with pinned Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/il2cppdumper
          mkdir -p "$root"
          curl --fail --location --retry 5             'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'             -o /tmp/il2cppdumper.zip
          unzip -q /tmp/il2cppdumper.zip -d "$root"
          mkdir -p quest-legacy-30-dump
          dll="$(find "$root" -type f -name 'Il2CppDumper.dll' | head -n1)"
          if [[ -z "$dll" ]]; then
            echo 'Il2CppDumper.dll missing' >&2
            exit 2
          fi
          dotnet "$dll"             inputs/3.0.0-global/UserAssembly.dll             inputs/3.0.0-global/global-metadata.dat             quest-legacy-30-dump             | tee quest-legacy-30-il2cppdumper.txt

          python - <<'PY' | tee quest-legacy-30-symbols.txt
          import json,re
          from pathlib import Path

          dump=Path("quest-legacy-30-dump/dump.cs").read_text(
              encoding="utf-8",errors="replace"
          )

          def class_block(name):
              pat=re.compile(
                  rf"(?m)^public (?:static )?class {re.escape(name)}\b"
              )
              m=pat.search(dump)
              if not m:
                  raise SystemExit(f"class not found: {name}")
              start=m.start()
              nxt=dump.find("\n// Namespace:",m.end())
              return dump[start:] if nxt<0 else dump[start:nxt]

          def method_rva(block, signature_re):
              lines=block.splitlines()
              rx=re.compile(signature_re)
              for i,line in enumerate(lines):
                  if not rx.search(line):
                      continue
                  for j in range(i-1,max(-1,i-8),-1):
                      m=re.search(r"RVA:\s*0x([0-9A-Fa-f]+)",lines[j])
                      if m:
                          return int(m.group(1),16), line.strip()
              raise SystemExit(f"method not found: {signature_re}")

          row=class_block("QuestExcelConfig")
          loader=class_block("QuestExcelConfigLoader")

          row_rva,row_sig=method_rva(
              row,
              r"\bFromBinary\(ByteArray byteArray, int threadFlag = 0, bool useObjectPool = false\)"
          )
          loader_rva,loader_sig=method_rva(
              loader,
              r"\bFromBinary\(ByteArray byteArray, int threadFlag = 0, bool useObjectPool = false\)"
          )

          # Method size: next RVA in the same class block.
          def next_rva(block,rva):
              vals=sorted({
                  int(x,16)
                  for x in re.findall(r"RVA:\s*0x([0-9A-Fa-f]+)",block)
              })
              return next((x for x in vals if x>rva),rva+0x2000)

          fields={}
          wanted={
              "subId","mainId","order","subIdSet",
              "acceptCondComb","acceptCond",
              "finishCondComb","finishCond",
              "failCondComb","failCond",
              "finishExec","failExec","beginExec",
          }
          for line in row.splitlines():
              m=re.search(
                  r"\b(?:protected|private|public)\s+[^;]+?\s+_?([A-Za-z0-9_]+);"
                  r"\s*//\s*0x([0-9A-Fa-f]+)",
                  line,
              )
              if m and m.group(1) in wanted:
                  fields[m.group(1)]=int(m.group(2),16)

          expected={
              "subId":0x10,"mainId":0x14,"order":0x18,"subIdSet":0x1C,
              "acceptCondComb":0x38,"acceptCond":0x40,
              "finishCondComb":0x48,"finishCond":0x50,
              "failCondComb":0x58,"failCond":0x60,
              "finishExec":0x80,"failExec":0x88,"beginExec":0x90,
          }
          print("ROW_RVA",hex(row_rva),row_sig)
          print("ROW_END",hex(next_rva(row,row_rva)))
          print("LOADER_RVA",hex(loader_rva),loader_sig)
          print("LOADER_END",hex(next_rva(loader,loader_rva)))
          print("FIELDS",json.dumps(fields,sort_keys=True))
          print("EXPECTED",json.dumps(expected,sort_keys=True))
          if fields != expected:
              raise SystemExit(f"official 3.0 field layout mismatch: {fields}")

          out={
              "row_rva":row_rva,
              "row_end_rva":next_rva(row,row_rva),
              "loader_rva":loader_rva,
              "loader_end_rva":next_rva(loader,loader_rva),
              "fields":fields,
              "row_signature":row_sig,
              "loader_signature":loader_sig,
          }
          Path("quest-legacy-30-symbols.json").write_text(
              json.dumps(out,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Disassemble legacy QuestExcel loader and row reader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-reader.txt
          import json
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM

          exe = Path("inputs/3.0.0-global/UserAssembly.dll")
          pe = pefile.PE(str(exe), fast_load=True)
          base = pe.OPTIONAL_HEADER.ImageBase
          print("image_base", hex(base))
          if base != 0x180000000:
              raise SystemExit(f"unexpected image base {base:#x}")

          def rva_bytes(rva, size):
              return pe.get_data(rva, size)

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          symbols=json.loads(Path("quest-legacy-30-symbols.json").read_text(encoding="utf-8"))
          funcs = {
              "QuestExcelConfigLoader.FromBinary(ByteArray)": (
                  symbols["loader_rva"],
                  symbols["loader_end_rva"]-symbols["loader_rva"],
              ),
              "QuestExcelConfig.FromBinary(ByteArray)": (
                  symbols["row_rva"],
                  symbols["row_end_rva"]-symbols["row_rva"],
              ),
          }

          report = {}
          for label, (rva, size) in funcs.items():
              insns = list(md.disasm(rva_bytes(rva, size), base + rva))
              rows = []
              for ins in insns:
                  row = {
                      "rva": f"0x{ins.address-base:X}",
                      "bytes": ins.bytes.hex(),
                      "mnemonic": ins.mnemonic,
                      "op_str": ins.op_str,
                  }
                  if ins.mnemonic == "call" and ins.operands and ins.operands[0].type == X86_OP_IMM:
                      row["call_target_rva"] = f"0x{ins.operands[0].imm-base:X}"
                  rows.append(row)
              report[label] = {"rva": f"0x{rva:X}", "size": size, "instructions": rows}
              print("\n###", label, f"RVA 0x{rva:X}")
              for x in rows:
                  print(x["rva"], x["mnemonic"], x["op_str"])

          Path("quest-legacy-30-reader.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Locate named legacy QuestExcel field accesses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-fields.txt
          import json
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM

          exe = Path("inputs/3.0.0-global/UserAssembly.dll")
          pe = pefile.PE(str(exe), fast_load=True)
          base = pe.OPTIONAL_HEADER.ImageBase
          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          symbols=json.loads(Path("quest-legacy-30-symbols.json").read_text(encoding="utf-8"))
          row_rva = symbols["row_rva"]
          row_size = symbols["row_end_rva"] - row_rva
          insns = list(md.disasm(pe.get_data(row_rva, row_size), base + row_rva))

          fields = {
              0x10: "subId",
              0x14: "mainId",
              0x18: "order",
              0x1C: "subIdSet",
              0x20: "isMpBlock",
              0x24: "descTextMapHash",
              0x28: "stepDescTextMapHash",
              0x2C: "guideTipsTextMapHash",
              0x30: "showType",
              0x34: "banType",
              0x38: "acceptCondComb",
              0x40: "acceptCond",
              0x48: "finishCondComb",
              0x50: "finishCond",
              0x58: "failCondComb",
              0x60: "failCond",
              0x68: "guide",
              0x70: "showGuide",
              0x74: "finishParent",
              0x75: "failParent",
              0x78: "failParentShow",
              0x7C: "isRewind",
              0x80: "finishExec",
              0x88: "failExec",
              0x90: "beginExec",
              0x98: "exclusiveNpcList",
              0xA0: "sharedNpcList",
              0xA8: "exclusiveNpcPriority",
              0xB0: "trialAvatarList",
              0xB8: "exclusivePlaceList",
          }

          hits = {name: [] for name in fields.values()}
          for i, ins in enumerate(insns):
              found = set()
              for op in ins.operands:
                  if op.type == X86_OP_MEM and op.mem.disp in fields:
                      found.add(op.mem.disp)
              for off in sorted(found):
                  lo = max(0, i - 10)
                  hi = min(len(insns), i + 11)
                  hit = {
                      "instruction_rva": f"0x{ins.address-base:X}",
                      "instruction": f"{ins.mnemonic} {ins.op_str}",
                      "window": [
                          {
                              "rva": f"0x{x.address-base:X}",
                              "mnemonic": x.mnemonic,
                              "op_str": x.op_str,
                          }
                          for x in insns[lo:hi]
                      ],
                  }
                  hits[fields[off]].append(hit)

          for name in fields.values():
              print("\n===", name, "hits", len(hits[name]), "===")
              for h in hits[name]:
                  print("HIT", h["instruction_rva"], h["instruction"])
                  for x in h["window"]:
                      print(" ", x["rva"], x["mnemonic"], x["op_str"])

          Path("quest-legacy-30-fields.json").write_text(
              json.dumps({"fields": hits}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30
          path: |
            quest-legacy-30-sample.txt
            quest-legacy-30-il2cppdumper.txt
            quest-legacy-30-symbols.txt
            quest-legacy-30-symbols.json
            quest-legacy-30-il2cppdumper.txt
            quest-legacy-30-exact-symbols.txt
            quest-legacy-30-exact-symbols.json
            quest-legacy-30-exact-reader.txt
            quest-legacy-30-exact-reader.json
            quest-legacy-30-il2cpp/dump.cs
            quest-legacy-30-il2cpp/script.json
            quest-legacy-30-reader.txt
            quest-legacy-30-reader.json
            quest-legacy-30-fields.txt
            quest-legacy-30-fields.json
          if-no-files-found: warn
