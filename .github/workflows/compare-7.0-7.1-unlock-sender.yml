name: Compare 7.0 and 7.1 unlock sender fingerprints

on:
  push:
    paths:
      - '.github/workflows/compare-7.0-7.1-unlock-sender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.0 and 7.1 samples
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/3XnPviMfoILi/manifest_2efe39d995f47170_29ad2bc6e42fe4af2086ae58c7e81b33' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/3XnPviMfoILi' \
            --output /tmp/gi70 \
            --expected-exe-sha256 'a1a23cb76d941df28c5156ca3152fa49421ec98842221b7d71633d42ee76ca45' \
            --expected-metadata-sha256 'd361ff11f6ca123f4126004db13cdf1956e00d95231f84c1e5437f560e79128b'
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Fetch published 7.0 metadata dump
        run: |
          curl --fail --location \
            'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' \
            -o /tmp/data.7z
          mkdir -p /tmp/data
          7z x -y /tmp/data.7z -o/tmp/data >/dev/null
          test -f /tmp/data/data/dump.json

      - name: Score every 7.0 scene-controller method against current unlock sender
        run: |
          python - <<'PY' > /tmp/unlock-sender-fingerprint.json
          import bisect
          import difflib
          import json
          import re
          from pathlib import Path

          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG, X86_REG_RIP
          from genshinre.pe import PEImage

          dump = Path('/tmp/data/data/dump.json')
          owner = None
          all_rvas = set()
          rva_re = re.compile(r'"rva":(\d+)')
          with dump.open('r', encoding='utf-8', errors='replace') as f:
              for line in f:
                  if '"rva":' in line:
                      for value in rva_re.findall(line):
                          rva = int(value)
                          if rva > 0:
                              all_rvas.add(rva)
                  if owner is None and '"name":"KGCKOFPFBLA"' in line:
                      text = line.strip()
                      obj, _ = json.JSONDecoder().raw_decode(text)
                      if obj.get('name') == 'KGCKOFPFBLA':
                          owner = obj
          if owner is None:
              raise RuntimeError('historical KGCKOFPFBLA controller not found')
          all_rvas = sorted(all_rvas)

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          branch_prefixes = ('j',)
          def token(insn):
              parts = [insn.mnemonic]
              for op in insn.operands:
                  if op.type == X86_OP_REG:
                      parts.append('R')
                  elif op.type == X86_OP_IMM:
                      value = int(op.imm)
                      if insn.mnemonic == 'call' or insn.mnemonic.startswith(branch_prefixes):
                          parts.append('T')
                      elif -0x400 <= value <= 0x400:
                          parts.append(f'I{value:+#x}')
                      else:
                          parts.append('I')
                  elif op.type == X86_OP_MEM:
                      mem = op.mem
                      if mem.base == X86_REG_RIP:
                          parts.append('MRIP')
                      elif -0x800 <= int(mem.disp) <= 0x800:
                          parts.append(f'M{int(mem.disp):+#x}')
                      else:
                          parts.append('M')
                  else:
                      parts.append('O')
              return ':'.join(parts)

          def disasm_tokens(image, start, end):
              blob = image.read_rva(start, end - start)
              rows = []
              for insn in md.disasm(blob, image.image_base + start):
                  rows.append({
                      'rva': f'0x{insn.address-image.image_base:X}',
                      'mnemonic': insn.mnemonic,
                      'op_str': insn.op_str,
                      'token': token(insn),
                  })
              return rows

          current_start = 0xF0452B0
          current_end = 0xF045640
          with PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as image71:
              current_rows = disasm_tokens(image71, current_start, current_end)
          current_tokens = [r['token'] for r in current_rows]
          current_mnemonics = [r['mnemonic'] for r in current_rows]

          scores = []
          with PEImage(Path('/tmp/gi70/GenshinImpact.exe')) as image70:
              for source_pos, method in enumerate(owner.get('methods', [])):
                  start = int(method.get('rva') or 0)
                  if start <= 0:
                      continue
                  i = bisect.bisect_right(all_rvas, start)
                  if i >= len(all_rvas):
                      continue
                  end = all_rvas[i]
                  size = end - start
                  if size <= 0 or size > 0x3000:
                      continue
                  rows = disasm_tokens(image70, start, end)
                  if not rows:
                      continue
                  toks = [r['token'] for r in rows]
                  mnes = [r['mnemonic'] for r in rows]
                  token_ratio = difflib.SequenceMatcher(None, current_tokens, toks, autojunk=False).ratio()
                  mnemonic_ratio = difflib.SequenceMatcher(None, current_mnemonics, mnes, autojunk=False).ratio()
                  size_ratio = min(size, current_end-current_start) / max(size, current_end-current_start)
                  param_count = len(method.get('params') or [])
                  ret = method.get('ret', '')
                  score = token_ratio * 0.58 + mnemonic_ratio * 0.27 + size_ratio * 0.10
                  if param_count == 1:
                      score += 0.03
                  if ret == 'System.Void':
                      score += 0.02
                  scores.append({
                      'score': score,
                      'token_ratio': token_ratio,
                      'mnemonic_ratio': mnemonic_ratio,
                      'size_ratio': size_ratio,
                      'source_position': source_pos,
                      'method_index': method.get('idx'),
                      'method_name': method.get('name'),
                      'rva': f'0x{start:X}',
                      'end_rva': f'0x{end:X}',
                      'size': size,
                      'return_type': ret,
                      'parameters': method.get('params') or [],
                      'instruction_count': len(rows),
                  })
          scores.sort(key=lambda x: x['score'], reverse=True)
          top = scores[:40]
          candidate = next((x for x in scores if x['rva'] == '0xB6EA6B0'), None)
          result = {
              'current': {
                  'owner': 'KLLNGCPBLMM',
                  'method': 'OIFANGMCKNJ',
                  'rva': f'0x{current_start:X}',
                  'end_rva': f'0x{current_end:X}',
                  'size': current_end-current_start,
                  'instruction_count': len(current_rows),
              },
              'historical_owner': 'KGCKOFPFBLA',
              'historical_method_count': len(owner.get('methods', [])),
              'scored_method_count': len(scores),
              'top_matches': top,
              'exact_size_one_param_candidate': candidate,
              'notes': [
                  'Instruction tokens erase absolute call/jump/global addresses while retaining small object/stack displacements.',
                  'Mnemonic similarity and exact native body size provide independent structural signals.',
                  'A one-parameter System.Void signature adds only a small tie-breaker bonus; it cannot dominate machine-code similarity.',
              ],
          }
          print(json.dumps(result, indent=2))
          PY

      - name: Compare sender static-field displacements
        run: |
          python - <<'PY' > /tmp/unlock-sender-static-displacements.json
          import json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP
          from genshinre.pe import PEImage

          targets = {
              '7.0_sender': (Path('/tmp/gi70/GenshinImpact.exe'), 0xB6EA6B0, 0xB6EAA40),
              '7.1_sender': (Path('/tmp/gi71/GenshinImpact.exe'), 0xF0452B0, 0xF045640),
              '7.0_unlock_rsp': (Path('/tmp/gi70/GenshinImpact.exe'), 0xB6F18D0, 0xB6F1940),
              '7.1_rsp_36641': (Path('/tmp/gi71/GenshinImpact.exe'), 0xF045790, 0xF045800),
              '7.1_rsp_20290': (Path('/tmp/gi71/GenshinImpact.exe'), 0xF0462A0, 0xF046310),
          }
          md = Cs(CS_ARCH_X86, CS_MODE_64); md.detail = True
          out = {}
          for label,(exe,start,end) in targets.items():
              rows=[]
              with PEImage(exe) as image:
                  blob=image.read_rva(start,end-start)
                  for insn in md.disasm(blob,image.image_base+start):
                      for op in insn.operands:
                          if op.type != X86_OP_MEM:
                              continue
                          disp=int(op.mem.disp)
                          # Large positive object/static-field offsets are the scene controller's generated delegate slots.
                          if 0x10000 <= disp <= 0x800000:
                              rows.append({
                                  'rva': f'0x{insn.address-image.image_base:X}',
                                  'mnemonic': insn.mnemonic,
                                  'op_str': insn.op_str,
                                  'disp': f'0x{disp:X}',
                                  'base_reg': int(op.mem.base),
                                  'rip_relative': op.mem.base == X86_REG_RIP,
                              })
              out[label]={'start':f'0x{start:X}','end':f'0x{end:X}','large_memory_displacements':rows}
          print(json.dumps(out,indent=2))
          PY
          cat /tmp/unlock-sender-static-displacements.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/unlock-sender-fingerprint.json'))
          print('current', d['current'])
          print('top 20:')
          for row in d['top_matches'][:20]:
              print(f"{row['score']:.4f} token={row['token_ratio']:.4f} mnem={row['mnemonic_ratio']:.4f} size={row['size']:#x} pos={row['source_position']} idx={row['method_index']} {row['rva']} {row['method_name']} params={row['parameters']} ret={row['return_type']}")
          print('B6EA6B0 candidate:', d['exact_size_one_param_candidate'])
          PY

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: unlock-sender-fingerprint-70-71
          path: |
            /tmp/unlock-sender-fingerprint.json
            /tmp/unlock-sender-static-displacements.json
