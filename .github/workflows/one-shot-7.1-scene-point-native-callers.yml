name: One-shot original 7.1 Scene Point native array reader callers

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-point-native-callers.yml'

permissions:
  contents: read

jobs:
  caller-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native caller-inspection dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify original array reader calls and method pointer xrefs
        run: |
          python scripts/probe-7.1-scene-point-native-caller-chain.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-native-xor-reader-evidence.json \
            --output work/original-71-scene-point-reader-callers.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-point-reader-callers
          path: work/original-71-scene-point-reader-callers.json
          retention-days: 7
          if-no-files-found: error
