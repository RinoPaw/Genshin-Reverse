name: Audit pinned AstaPS chest level source ownership

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-7.1-chest-level-source.yml']

permissions:
  contents: read

concurrency:
  group: chest-level-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify upstream and experimental source snapshots
        run: |
          python scripts/audit-7.1-chest-level-source-ownership.py --fetch --output work/7.1-chest-level-source-ownership.json
      - uses: actions/upload-artifact@v7
        with:
          name: chest-level-source-ownership
          path: work/7.1-chest-level-source-ownership.json
          retention-days: 7
          if-no-files-found: error
