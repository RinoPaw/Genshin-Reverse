name: Publish 7.1 registry

on:
  push:
    paths:
      - '.github/workflows/publish-7.1-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Join verified registry slots to metadata types and GetCmdId graph
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64')
          registry_dir = root / 'registry'
          metadata_dir = root / 'metadata'

          def read_csv(path):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          def norm_hex(value):
              value = (value or '').strip()
              if not value:
                  return None
              return int(value, 0)

          types = read_csv(metadata_dir / 'types.csv')
          slots = read_csv(registry_dir / 'registry-type-slots.csv')
          graph = read_csv(registry_dir / 'registry-candidate-graph.csv')
          known = read_csv(root / 'proto' / 'known-opcodes.csv')

          types_by_cache = {}
          duplicate_type_cache = {}
          for row in types:
              rva = norm_hex(row.get('type_cache_rva'))
              if rva is None:
                  continue
              if rva in types_by_cache:
                  duplicate_type_cache.setdefault(f'0x{rva:X}', [types_by_cache[rva]['type_definition_index']]).append(row['type_definition_index'])
              else:
                  types_by_cache[rva] = row

          graph_by_type_index = {}
          duplicate_graph_types = {}
          for row in graph:
              key = row['type_definition_index']
              if key in graph_by_type_index:
                  duplicate_graph_types.setdefault(key, [graph_by_type_index[key]['cmd_id']]).append(row['cmd_id'])
              else:
                  graph_by_type_index[key] = row

          known_direction = {row['cmd_id']: row.get('direction', '') for row in known if row.get('cmd_id')}
          known_name = {row['cmd_id']: row.get('semantic_name', '') for row in known if row.get('cmd_id')}

          output = []
          missing_types = []
          missing_cmdids = []
          type_name_mismatches = []
          for slot in slots:
              slot_rva = norm_hex(slot['type_slot_rva'])
              type_row = types_by_cache.get(slot_rva)
              if type_row is None:
                  missing_types.append({'index': slot['index'], 'type_slot_rva': slot['type_slot_rva']})
                  continue

              type_index = type_row['type_definition_index']
              graph_row = graph_by_type_index.get(type_index)
              if graph_row is None:
                  missing_cmdids.append({
                      'index': slot['index'],
                      'type_slot_rva': slot['type_slot_rva'],
                      'type_definition_index': type_index,
                      'type_name': type_row['type_name'],
                  })
                  continue
              if graph_row['type_name'] != type_row['type_name']:
                  type_name_mismatches.append({
                      'type_definition_index': type_index,
                      'metadata_type_name': type_row['type_name'],
                      'graph_type_name': graph_row['type_name'],
                  })

              cmd_id = graph_row['cmd_id']
              direction = known_direction.get(cmd_id, '')
              output.append({
                  'index': slot['index'],
                  'cmd_id': cmd_id,
                  'type_name': type_row['type_name'],
                  'type_definition_index': type_index,
                  'direction': direction,
                  'direction_status': 'runtime-confirmed' if direction else 'unresolved',
                  'semantic_name': known_name.get(cmd_id, ''),
                  'type_slot_rva': slot['type_slot_rva'],
                  'get_cmd_id_rva': graph_row['get_cmd_id_rva'],
                  'get_cmd_id_method': graph_row['method_name'],
                  'load_rva': slot['load_rva'],
                  'store_rva': slot['store_rva'],
                  'status': 'static-verified',
                  'evidence': 'registry constructor slot -> metadata type_cache_rva -> verified GetCmdId method identity',
              })

          output.sort(key=lambda row: int(row['index']))
          out_path = registry_dir / 'registry.csv'
          columns = [
              'index','cmd_id','type_name','type_definition_index','direction','direction_status','semantic_name',
              'type_slot_rva','get_cmd_id_rva','get_cmd_id_method','load_rva','store_rva','status','evidence'
          ]
          with out_path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=columns)
              w.writeheader()
              w.writerows(output)

          cmd_counts = {}
          for row in output:
              cmd_counts[row['cmd_id']] = cmd_counts.get(row['cmd_id'], 0) + 1
          duplicate_cmdids = {k:v for k,v in cmd_counts.items() if v > 1}

          summary = {
              'slot_rows': len(slots),
              'metadata_types': len(types),
              'candidate_graph_rows': len(graph),
              'registry_rows': len(output),
              'missing_type_slot_to_metadata': missing_types,
              'missing_registry_type_to_getcmdid': missing_cmdids,
              'type_name_mismatches': type_name_mismatches,
              'duplicate_type_cache_rvas': duplicate_type_cache,
              'duplicate_graph_types': duplicate_graph_types,
              'duplicate_cmd_ids_in_registry': duplicate_cmdids,
              'known_direction_rows': sum(1 for r in output if r['direction']),
              'complete_4896_identity_registry': len(output) == 4896 and not missing_types and not missing_cmdids and not type_name_mismatches,
              'status': 'static-verified' if len(output) == 4896 and not missing_types and not missing_cmdids and not type_name_mismatches else 'partial',
          }
          (registry_dir / 'registry.summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, ensure_ascii=False))

          for cmd in ('9369','22899','26105','4385','3064','9582'):
              hits = [r for r in output if r['cmd_id'] == cmd]
              print(cmd, hits)

          if len(output) != 4896 or missing_types or missing_cmdids or type_name_mismatches:
              raise SystemExit('registry identity join did not close at exactly 4896 rows')
          PY

      - name: Commit registry artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/registry.csv \
                  versions/7.1.0-global/windows-x64/registry/registry.summary.json
          if git diff --cached --quiet; then
            echo 'No registry changes.'
            exit 0
          fi
          git commit -m 'data: publish complete 7.1 protocol registry identities'
          git pull --rebase origin main
          git push origin HEAD:main
