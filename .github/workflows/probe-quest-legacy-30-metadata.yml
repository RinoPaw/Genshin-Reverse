name: Probe 3.0 QuestExcel metadata recovery

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30-metadata.yml"

concurrency:
  group: probe-quest-legacy-30-metadata-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and verify exact 3.0.0 inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$base/GenshinImpact_Data/Native/UserAssembly.dll" \
            -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat" \
            -o "$out/global-metadata.dat"

          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "UserAssembly.dll": (
                  177601560,
                  "b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b",
              ),
              "global-metadata.dat": (
                  49356392,
                  "efd5a35bed23de3f1444d40ebf4eaa1dfb338c84d7a168a0264678f94cca5a2a",
              ),
          }
          root = Path("inputs/3.0.0-global")
          for name, (size, sha) in expected.items():
              raw = (root / name).read_bytes()
              got = hashlib.sha256(raw).hexdigest()
              print(name, "size=", len(raw), "sha256=", got)
              if len(raw) != size or got != sha:
                  raise SystemExit(f"{name}: exact sample mismatch")
          PY

      - name: Build pinned Genshin-aware Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-tools/Il2CppDumper-Genshin
          mkdir -p .probe-tools
          git clone --filter=blob:none \
            https://github.com/R0xdeadc0de/Il2CppDumper-Genshin.git \
            .probe-tools/Il2CppDumper-Genshin
          git -C .probe-tools/Il2CppDumper-Genshin checkout --detach \
            731c4022a15b126da993e54a9f7d7e2c8a06c1af

          python - <<'PY'
          from pathlib import Path
          p = Path(".probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj")
          s = p.read_text(encoding="utf-8-sig")
          s = s.replace(
              "<TargetFrameworks>net472;net5.0</TargetFrameworks>",
              "<TargetFramework>net6.0</TargetFramework>",
          )
          # The upstream project enables unsafe code only for its original TFMs.
          s = s.replace(
              "<TargetFramework>net6.0</TargetFramework>",
              "<TargetFramework>net6.0</TargetFramework>\n    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY

          dotnet build \
            .probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj \
            -c Release --nologo

          app=.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0
          python - "$app/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          cfg = json.loads(p.read_text(encoding="utf-8-sig"))
          cfg["RequireAnyKey"] = False
          cfg["GenerateDummyDll"] = False
          cfg["GenerateStruct"] = False
          cfg["GenerateScript"] = True
          cfg["DumpMethod"] = True
          cfg["DumpField"] = True
          cfg["DumpFieldOffset"] = True
          cfg["DumpMethodOffset"] = True
          p.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Dump exact protected 3.0 UserAssembly and native metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0"
          out="$GITHUB_WORKSPACE/genshin-dump"
          mkdir -p "$out"

          set +e
          (
            cd "$app"
            dotnet Il2CppDumper.dll \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll" \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat" \
              "$out"
          ) </dev/null >"$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log" 2>&1
          rc=$?
          set -e

          cat "$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log"
          echo "dumper rc=$rc"
          test -s "$out/dump.cs"

      - name: Locate exact 3.0 Quest row by semantic field types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-semantic-map.txt
          import json,re
          from pathlib import Path

          lines=Path("genshin-dump/dump.cs").read_text(
              encoding="utf-8",errors="replace"
          ).splitlines()

          field_rx=re.compile(
              r"^\s*(?:public|private|protected|internal)\s+"
              r"(?:(?:static|readonly|const|volatile)\s+)*"
              r"(.+?)\s+([A-Za-z_][A-Za-z0-9_]*)\s*;\s*//\s*0x([0-9A-Fa-f]+)"
          )
          type_rx=re.compile(
              r"^\s*(?:public|private|protected|internal)?\s*"
              r"(?:sealed\s+|abstract\s+|static\s+)*"
              r"(?:class|struct)\s+([^\s:{]+)"
          )
          rva_rx=re.compile(r"RVA:\s*0x([0-9A-Fa-f]+)")

          starts=[i for i,x in enumerate(lines) if x.startswith("// Namespace:")]
          starts.append(len(lines))
          rows=[]

          semantic_weights={
              "QuestShowType":250,
              "BanGroupType":180,
              "LogicType":220,
              "ShowQuestGuideType":220,
          }

          for a,b in zip(starts,starts[1:]):
              block=lines[a:b]
              decl=None
              fields=[]
              by_off={}
              semantic=0

              for rel,line in enumerate(block):
                  if decl is None:
                      tm=type_rx.search(line)
                      if tm:
                          decl={
                              "line":a+rel+1,
                              "name":tm.group(1),
                              "text":line.strip(),
                          }
                  fm=field_rx.search(line)
                  if fm:
                      t=fm.group(1).strip()
                      off=int(fm.group(3),16)
                      x={
                          "line":a+rel+1,
                          "type":t,
                          "name":fm.group(2),
                          "offset":off,
                          "text":line.strip(),
                      }
                      fields.append(x)
                      by_off.setdefault(off,[]).append(x)
                      semantic += semantic_weights.get(t,0)

              if not decl:
                  continue

              def typ(off):
                  xs=by_off.get(off,[])
                  return xs[0]["type"] if len(xs)==1 else None

              score=semantic
              reasons=[]

              # Stable primitive prefix from the deobfuscated historical schema.
              prefix={
                  0x10:"uint",0x14:"uint",0x1C:"uint",0x20:"bool",
                  0x24:"uint",0x28:"uint",0x2C:"uint",
              }
              prefix_hits=sum(typ(o)==t for o,t in prefix.items())
              score += prefix_hits*35
              if prefix_hits:
                  reasons.append(f"primitive_prefix={prefix_hits}/7")

              if typ(0x18) in {"int","uint"}:
                  score += 40
                  reasons.append("order@0x18")

              # Quest-specific enum pattern.
              if typ(0x30)=="QuestShowType":
                  score += 350
                  reasons.append("QuestShowType@0x30")
              if typ(0x34)=="BanGroupType":
                  score += 300
                  reasons.append("BanGroupType@0x34")
              if typ(0x38)=="LogicType" and typ(0x48)=="LogicType" and typ(0x58)=="LogicType":
                  score += 700
                  reasons.append("LogicType@38/48/58")
              if typ(0x70)=="ShowQuestGuideType":
                  score += 350
                  reasons.append("ShowQuestGuideType@0x70")
              if typ(0x78)=="QuestShowType":
                  score += 300
                  reasons.append("QuestShowType@0x78")

              # Packed bools include the unusual +0x75 field.
              if typ(0x74)=="bool" and typ(0x75)=="bool" and typ(0x7C)=="bool":
                  score += 650
                  reasons.append("bool@74/75/7C")

              # Three execution arrays share one element type.
              execs=[typ(x) for x in (0x80,0x88,0x90)]
              if None not in execs and len(set(execs))==1 and execs[0].endswith("[]"):
                  score += 650
                  reasons.append("same_exec_arrays@80/88/90")

              # Finish/fail condition arrays share a type, accept is a distinct array type.
              conds=[typ(x) for x in (0x40,0x50,0x60)]
              if (
                  None not in conds
                  and all(x.endswith("[]") for x in conds)
                  and conds[1]==conds[2]
              ):
                  score += 450
                  reasons.append("condition_arrays@40/50/60")
                  if conds[0]!=conds[1]:
                      score += 150
                      reasons.append("accept_distinct")

              tail=[typ(x) for x in (0x98,0xA0,0xB0,0xB8)]
              if tail==["uint[]"]*4 and typ(0xA8)=="uint":
                  score += 750
                  reasons.append("uint_tail@98/A0/A8/B0/B8")

              methods=[]
              for rel,line in enumerate(block):
                  rm=rva_rx.search(line)
                  if not rm:
                      continue
                  rva=int(rm.group(1),16)
                  sig=None
                  sig_line=None
                  for k in range(rel+1,min(len(block),rel+8)):
                      s=block[k].strip()
                      if s and not s.startswith("//") and "(" in s and ")" in s:
                          sig=s
                          sig_line=a+k+1
                          break
                  if sig:
                      methods.append({"rva":rva,"line":sig_line,"signature":sig})
                      if "OLCLOPLLAGP" in sig and sig.startswith("public bool "):
                          score += 500
                          reasons.append("ByteArray-like bool reader")

              if score>=500:
                  rows.append({
                      "score":score,
                      "reasons":reasons,
                      "namespace_line":a+1,
                      "namespace":lines[a],
                      "declaration":decl,
                      "fields":fields,
                      "methods":methods,
                  })

          rows.sort(key=lambda x:(-x["score"],x["namespace_line"]))
          print("candidates",len(rows))
          for rank,x in enumerate(rows[:50],1):
              print(
                  f"\n=== RANK {rank:02d} score={x['score']} "
                  f"type={x['declaration']['name']} "
                  f"TypeLine={x['declaration']['line']} ==="
              )
              print("REASONS",", ".join(x["reasons"]))
              print("DECL",x["declaration"]["text"])
              for fld in x["fields"]:
                  if fld["offset"]<=0xC0:
                      print(
                          f"FIELD +0x{fld['offset']:X} {fld['type']} {fld['name']}"
                      )
              print("READERS")
              for m in x["methods"]:
                  if "OLCLOPLLAGP" in m["signature"]:
                      print(
                          f"  RVA=0x{m['rva']:X} L{m['line']} "
                          f"{m['signature']}"
                      )

          Path("quest-legacy-30-semantic-map.json").write_text(
              json.dumps({
                  "dump_line_count":len(lines),
                  "candidates":rows[:100],
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          if not rows:
              raise SystemExit("no semantic Quest candidates")
          PY

      - name: Compare raw PE with loaded-memory QuestExcel code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pefile capstone

          python - <<'PY' | tee quest-legacy-30-pe-imports.txt
          import pefile
          pe=pefile.PE("inputs/3.0.0-global/UserAssembly.dll")
          print("image_base",hex(pe.OPTIONAL_HEADER.ImageBase))
          print("entrypoint",hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint))
          for entry in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
              print(entry.dll.decode(errors="replace"))
          PY

          cat > quest-legacy-30-memory-dump.py <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64

          dll=Path("inputs/3.0.0-global/UserAssembly.dll").resolve()
          pe=pefile.PE(str(dll),fast_load=True)
          preferred=pe.OPTIONAL_HEADER.ImageBase

          targets={
              0x10FD580:0x350,
              0x3AF9E10:0x15E0,
          }

          print("loading",dll)
          try:
              mod=ctypes.WinDLL(str(dll))
          except Exception as e:
              print("LOAD_ERROR",repr(e))
              raise SystemExit(2)

          base=int(mod._handle)
          print("loaded_base",hex(base),"preferred_base",hex(preferred))

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          report={}
          outdir=Path("quest-legacy-30-memory")
          outdir.mkdir(exist_ok=True)

          for rva,size in targets.items():
              raw=pe.get_data(rva,size)
              mem=ctypes.string_at(base+rva,size)
              diff=sum(a!=b for a,b in zip(raw,mem))
              print(
                  f"\n=== RVA 0x{rva:X} size=0x{size:X} ===",
                  "raw_sha256",hashlib.sha256(raw).hexdigest(),
                  "mem_sha256",hashlib.sha256(mem).hexdigest(),
                  "different_bytes",diff,
              )
              (outdir/f"{rva:X}-raw.bin").write_bytes(raw)
              (outdir/f"{rva:X}-memory.bin").write_bytes(mem)

              rows=[]
              print("MEMORY DISASM")
              for n,ins in enumerate(md.disasm(mem,base+rva)):
                  rr=ins.address-base
                  rows.append({
                      "rva":rr,
                      "bytes":ins.bytes.hex(),
                      "mnemonic":ins.mnemonic,
                      "op_str":ins.op_str,
                  })
                  if n<800:
                      print(f"0x{rr:X} {ins.mnemonic:<8} {ins.op_str}")
              report[hex(rva)]={
                  "size":size,
                  "raw_sha256":hashlib.sha256(raw).hexdigest(),
                  "memory_sha256":hashlib.sha256(mem).hexdigest(),
                  "different_bytes":diff,
                  "instructions":rows,
              }

          Path("quest-legacy-30-memory.json").write_text(
              json.dumps(report,indent=2)+"\n",encoding="utf-8"
          )
          PY

          set +e
          python quest-legacy-30-memory-dump.py 2>&1 | tee quest-legacy-30-memory.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "memory probe rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "Loaded-memory probe unavailable; keeping exact metadata/RVA evidence."
          fi

      - name: Upload focused metadata evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30-metadata
          path: |
            quest-legacy-30-genshin-dumper.log
            quest-legacy-30-metadata.txt
            quest-legacy-30-metadata.json
            quest-legacy-30-known-rvas.txt
            quest-legacy-30-known-rvas.json
            quest-legacy-30-typedef.txt
            quest-legacy-30-typedef.json
            quest-legacy-30-pe-imports.txt
            quest-legacy-30-memory.txt
            quest-legacy-30-memory.json
            quest-legacy-30-memory/*.bin
            quest-legacy-30-exact-functions.txt
            quest-legacy-30-exact-functions.json
          if-no-files-found: warn
