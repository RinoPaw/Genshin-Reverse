name: Probe 3.0 QuestExcel metadata recovery

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30-metadata.yml"

concurrency:
  group: probe-quest-legacy-30-metadata-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and verify exact 3.0.0 inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$base/GenshinImpact_Data/Native/UserAssembly.dll" \
            -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat" \
            -o "$out/global-metadata.dat"

          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "UserAssembly.dll": (
                  177601560,
                  "b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b",
              ),
              "global-metadata.dat": (
                  49356392,
                  "efd5a35bed23de3f1444d40ebf4eaa1dfb338c84d7a168a0264678f94cca5a2a",
              ),
          }
          root = Path("inputs/3.0.0-global")
          for name, (size, sha) in expected.items():
              raw = (root / name).read_bytes()
              got = hashlib.sha256(raw).hexdigest()
              print(name, "size=", len(raw), "sha256=", got)
              if len(raw) != size or got != sha:
                  raise SystemExit(f"{name}: exact sample mismatch")
          PY

      - name: Build pinned Genshin-aware Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-tools/Il2CppDumper-Genshin
          mkdir -p .probe-tools
          git clone --filter=blob:none \
            https://github.com/R0xdeadc0de/Il2CppDumper-Genshin.git \
            .probe-tools/Il2CppDumper-Genshin
          git -C .probe-tools/Il2CppDumper-Genshin checkout --detach \
            731c4022a15b126da993e54a9f7d7e2c8a06c1af

          python - <<'PY'
          from pathlib import Path
          p = Path(".probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj")
          s = p.read_text(encoding="utf-8-sig")
          s = s.replace(
              "<TargetFrameworks>net472;net5.0</TargetFrameworks>",
              "<TargetFramework>net6.0</TargetFramework>",
          )
          # The upstream project enables unsafe code only for its original TFMs.
          s = s.replace(
              "<TargetFramework>net6.0</TargetFramework>",
              "<TargetFramework>net6.0</TargetFramework>\n    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY

          dotnet build \
            .probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj \
            -c Release --nologo

          app=.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0
          python - "$app/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          cfg = json.loads(p.read_text(encoding="utf-8-sig"))
          cfg["RequireAnyKey"] = False
          cfg["GenerateDummyDll"] = False
          cfg["GenerateStruct"] = False
          cfg["GenerateScript"] = True
          cfg["DumpMethod"] = True
          cfg["DumpField"] = True
          cfg["DumpFieldOffset"] = True
          cfg["DumpMethodOffset"] = True
          p.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Dump exact protected 3.0 UserAssembly and native metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0"
          out="$GITHUB_WORKSPACE/genshin-dump"
          mkdir -p "$out"

          set +e
          (
            cd "$app"
            dotnet Il2CppDumper.dll \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll" \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat" \
              "$out"
          ) </dev/null >"$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log" 2>&1
          rc=$?
          set -e

          cat "$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log"
          echo "dumper rc=$rc"
          test -s "$out/dump.cs"

      - name: Locate 3.0 Quest-like type by field names and layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-metadata.txt
          import json
          import re
          from pathlib import Path

          dump_path = Path("genshin-dump/dump.cs")
          lines = dump_path.read_text(encoding="utf-8", errors="replace").splitlines()
          print("dump.cs lines", len(lines))

          name_needles = (
              "QuestExcel", "acceptCond", "acceptCondComb", "beginExec",
              "finishCondComb", "failCondComb", "exclusiveNpcList",
              "exclusivePlaceList", "trialAvatarList",
          )
          print("\n=== literal name hits ===")
          name_hits = []
          for i, line in enumerate(lines):
              if any(n in line for n in name_needles):
                  name_hits.append(i)
                  if len(name_hits) <= 300:
                      print(f"{i+1}: {line}")
          print("literal hit count", len(name_hits))

          # Split dump.cs into type blocks using the Namespace marker that precedes
          # each top-level type. Score blocks by the known 3.0 Quest row field-offset
          # signature, without assuming the type name survived.
          starts = [i for i,l in enumerate(lines) if l.startswith("// Namespace:")]
          starts.append(len(lines))
          target_offsets = {
              0x10:"subId", 0x14:"mainId", 0x18:"order",
              0x38:"acceptCondComb", 0x40:"acceptCond",
              0x48:"finishCondComb", 0x50:"finishCond",
              0x58:"failCondComb", 0x60:"failCond",
              0x68:"guide", 0x70:"showGuide", 0x74:"finishParent",
              0x75:"failParent", 0x78:"failParentShow", 0x7C:"isRewind",
              0x80:"finishExec", 0x88:"failExec", 0x90:"beginExec",
              0x98:"exclusiveNpcList", 0xA0:"sharedNpcList",
              0xA8:"exclusiveNpcPriority", 0xB0:"trialAvatarList",
              0xB8:"exclusivePlaceList",
          }
          target_set=set(target_offsets)
          candidates=[]

          field_rx=re.compile(
              r"^\s*(?:public|private|protected|internal).*?\s+"
              r"([A-Za-z_][A-Za-z0-9_]*)\s*;\s*//\s*0x([0-9A-Fa-f]+)"
          )
          rva_rx=re.compile(r"RVA:\s*0x([0-9A-Fa-f]+)")
          type_rx=re.compile(r"^\s*(?:public|private|protected|internal)?\s*(?:sealed\s+|abstract\s+|static\s+)*"
                             r"(?:class|struct)\s+([^\s:{]+)")

          for a,b in zip(starts,starts[1:]):
              # Cap pathological blocks, but ordinary metadata types are much smaller.
              block=lines[a:b]
              fields=[]
              offsets=set()
              names=set()
              decl=None
              for rel,line in enumerate(block):
                  if decl is None:
                      m=type_rx.search(line)
                      if m:
                          decl=(a+rel+1,line.strip(),m.group(1))
                  fm=field_rx.search(line)
                  if fm:
                      off=int(fm.group(2),16)
                      fields.append({
                          "line":a+rel+1,
                          "name":fm.group(1),
                          "offset":off,
                          "text":line.strip(),
                      })
                      offsets.add(off)
                      names.add(fm.group(1))

              overlap=sorted(target_set & offsets)
              named=sum(1 for n in (
                  "subId","mainId","order","acceptCondComb","acceptCond",
                  "finishCondComb","finishCond","failCondComb","failCond",
                  "beginExec","finishExec","failExec","exclusiveNpcList",
                  "sharedNpcList","exclusiveNpcPriority","trialAvatarList",
                  "exclusivePlaceList"
              ) if n in names)
              if len(overlap) >= 12 or named >= 4:
                  methods=[]
                  for rel,line in enumerate(block):
                      if "(" not in line or ")" not in line:
                          continue
                      rvas=[]
                      for k in range(max(0,rel-5),rel+1):
                          m=rva_rx.search(block[k])
                          if m:
                              rvas.append(int(m.group(1),16))
                      if rvas:
                          methods.append({
                              "line":a+rel+1,
                              "text":line.strip(),
                              "rvas":rvas,
                          })
                  score=len(overlap)*10 + named*25
                  candidates.append({
                      "score":score,
                      "namespace_line":a+1,
                      "namespace":lines[a],
                      "declaration":decl,
                      "overlap":overlap,
                      "named_count":named,
                      "fields":fields,
                      "methods":methods,
                  })

          candidates.sort(key=lambda x:(-x["score"], x["namespace_line"]))
          print("\n=== top Quest-layout candidates ===")
          for rank,x in enumerate(candidates[:40],1):
              print(
                  f"\n--- rank {rank} score={x['score']} "
                  f"named={x['named_count']} overlap={len(x['overlap'])} "
                  f"line={x['namespace_line']} ---"
              )
              print(x["namespace"])
              print("DECL", x["declaration"])
              print("OFFSETS", [hex(v) for v in x["overlap"]])
              for fld in x["fields"]:
                  if fld["offset"] in target_set or fld["name"] in {
                      "subId","mainId","order","acceptCondComb","acceptCond",
                      "beginExec","finishExec","failExec"
                  }:
                      print(
                          f"FIELD L{fld['line']} +0x{fld['offset']:X} "
                          f"{fld['name']} :: {fld['text']}"
                      )
              print("METHODS")
              for m in x["methods"]:
                  if "Binary" in m["text"] or "binary" in m["text"].lower() or len(x["methods"]) <= 30:
                      print(
                          f"  L{m['line']} RVAS={[hex(r) for r in m['rvas']]} "
                          f"{m['text']}"
                      )

          Path("quest-legacy-30-metadata.json").write_text(
              json.dumps({
                  "literal_hits":[
                      {"line":i+1,"text":lines[i]} for i in name_hits[:1000]
                  ],
                  "candidates":candidates[:100],
              }, indent=2) + "\n",
              encoding="utf-8",
          )

          if not candidates:
              raise SystemExit("no Quest-layout candidate recovered")
          PY

      - name: Recover exact PE function bounds and field-base accesses
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pefile capstone
          python - <<'PY' | tee quest-legacy-30-exact-functions.txt
          import json
          from pathlib import Path

          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM

          symbols = json.loads(
              Path("quest-legacy-30-metadata.json").read_text(encoding="utf-8")
          )
          anchors = []
          for cls, entries in symbols.items():
              for entry in entries:
                  for method in entry["from_binary"]:
                      for x in method["preceding_rvas"]:
                          anchors.append((cls, method["signature"], x["rva"]))

          pe = pefile.PE("inputs/3.0.0-global/UserAssembly.dll", fast_load=False)
          base = pe.OPTIONAL_HEADER.ImageBase
          pe.parse_data_directories(
              directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXCEPTION"]]
          )
          runtime = sorted(
              (int(x.struct.BeginAddress), int(x.struct.EndAddress))
              for x in pe.DIRECTORY_ENTRY_EXCEPTION
              if int(x.struct.EndAddress) > int(x.struct.BeginAddress)
          )

          def containing(rva):
              for a, b in runtime:
                  if a <= rva < b:
                      return a, b
              return None

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          out = []

          for cls, signature, rva in anchors:
              bounds = containing(rva)
              print(
                  f"\n=== {cls} {signature} "
                  f"metadata_rva=0x{rva:X} bounds={bounds} ==="
              )
              if not bounds:
                  continue
              a, b = bounds
              insns = []
              for ins in md.disasm(pe.get_data(a, b - a), base + a):
                  row = {
                      "rva": ins.address - base,
                      "bytes": ins.bytes.hex(),
                      "mnemonic": ins.mnemonic,
                      "op_str": ins.op_str,
                  }
                  if (
                      ins.mnemonic == "call"
                      and ins.operands
                      and ins.operands[0].type == X86_OP_IMM
                  ):
                      row["call_target_rva"] = ins.operands[0].imm - base
                  mem = []
                  for op in ins.operands:
                      if op.type == X86_OP_MEM:
                          mem.append({
                              "base": ins.reg_name(op.mem.base) if op.mem.base else None,
                              "index": ins.reg_name(op.mem.index) if op.mem.index else None,
                              "scale": op.mem.scale,
                              "disp": op.mem.disp,
                          })
                  if mem:
                      row["mem"] = mem
                  insns.append(row)
                  print(
                      f"0x{row['rva']:X} {row['mnemonic']:<7} {row['op_str']}"
                  )

              out.append({
                  "class": cls,
                  "signature": signature,
                  "metadata_rva": rva,
                  "begin_rva": a,
                  "end_rva": b,
                  "instructions": insns,
              })

          Path("quest-legacy-30-exact-functions.json").write_text(
              json.dumps(out, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload focused metadata evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30-metadata
          path: |
            quest-legacy-30-genshin-dumper.log
            quest-legacy-30-metadata.txt
            quest-legacy-30-metadata.json
            quest-legacy-30-exact-functions.txt
            quest-legacy-30-exact-functions.json
          if-no-files-found: warn
