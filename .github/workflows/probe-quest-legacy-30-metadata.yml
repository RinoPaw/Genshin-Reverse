name: Probe 3.0 QuestExcel metadata recovery

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30-metadata.yml"

concurrency:
  group: probe-quest-legacy-30-metadata-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and verify exact 3.0.0 inputs
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$base/GenshinImpact_Data/Native/UserAssembly.dll" \
            -o "$out/UserAssembly.dll"
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$base/GenshinImpact_Data/Managed/Metadata/global-metadata.dat" \
            -o "$out/global-metadata.dat"

          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "UserAssembly.dll": (
                  177601560,
                  "b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b",
              ),
              "global-metadata.dat": (
                  49356392,
                  "efd5a35bed23de3f1444d40ebf4eaa1dfb338c84d7a168a0264678f94cca5a2a",
              ),
          }
          root = Path("inputs/3.0.0-global")
          for name, (size, sha) in expected.items():
              raw = (root / name).read_bytes()
              got = hashlib.sha256(raw).hexdigest()
              print(name, "size=", len(raw), "sha256=", got)
              if len(raw) != size or got != sha:
                  raise SystemExit(f"{name}: exact sample mismatch")
          PY

      - name: Build pinned Genshin-aware Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .probe-tools/Il2CppDumper-Genshin
          mkdir -p .probe-tools
          git clone --filter=blob:none \
            https://github.com/R0xdeadc0de/Il2CppDumper-Genshin.git \
            .probe-tools/Il2CppDumper-Genshin
          git -C .probe-tools/Il2CppDumper-Genshin checkout --detach \
            731c4022a15b126da993e54a9f7d7e2c8a06c1af

          python - <<'PY'
          from pathlib import Path
          p = Path(".probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj")
          s = p.read_text(encoding="utf-8-sig")
          s = s.replace(
              "<TargetFrameworks>net472;net5.0</TargetFrameworks>",
              "<TargetFramework>net6.0</TargetFramework>",
          )
          # The upstream project enables unsafe code only for its original TFMs.
          s = s.replace(
              "<TargetFramework>net6.0</TargetFramework>",
              "<TargetFramework>net6.0</TargetFramework>\n    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>",
              1,
          )
          p.write_text(s, encoding="utf-8")
          PY

          dotnet build \
            .probe-tools/Il2CppDumper-Genshin/Il2CppDumper/Il2CppDumper.csproj \
            -c Release --nologo

          app=.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0
          python - "$app/config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          cfg = json.loads(p.read_text(encoding="utf-8-sig"))
          cfg["RequireAnyKey"] = False
          cfg["GenerateDummyDll"] = False
          cfg["GenerateStruct"] = False
          cfg["GenerateScript"] = True
          cfg["DumpMethod"] = True
          cfg["DumpField"] = True
          cfg["DumpFieldOffset"] = True
          cfg["DumpMethodOffset"] = True
          p.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Dump exact protected 3.0 UserAssembly and native metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.probe-tools/Il2CppDumper-Genshin/Il2CppDumper/bin/Release/net6.0"
          out="$GITHUB_WORKSPACE/genshin-dump"
          mkdir -p "$out"

          set +e
          (
            cd "$app"
            dotnet Il2CppDumper.dll \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/UserAssembly.dll" \
              "$GITHUB_WORKSPACE/inputs/3.0.0-global/global-metadata.dat" \
              "$out"
          ) </dev/null >"$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log" 2>&1
          rc=$?
          set -e

          cat "$GITHUB_WORKSPACE/quest-legacy-30-genshin-dumper.log"
          echo "dumper rc=$rc"
          test -s "$out/dump.cs"

      - name: Locate exact legacy Quest row by repeated field-type signature
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-metadata.txt
          import json
          import re
          from pathlib import Path

          lines = Path("genshin-dump/dump.cs").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          print("dump.cs lines", len(lines))

          type_rx = re.compile(
              r"^\s*(?:public|private|protected|internal)?\s*"
              r"(?:sealed\s+|abstract\s+|static\s+)*"
              r"(?:class|struct)\s+([^\s:{]+)"
          )
          field_rx = re.compile(
              r"^\s*(?:public|private|protected|internal)\s+"
              r"(?:(?:static|readonly|const|volatile)\s+)*"
              r"(.+?)\s+([A-Za-z_][A-Za-z0-9_]*)\s*;\s*//\s*0x([0-9A-Fa-f]+)"
          )
          rva_rx = re.compile(r"RVA:\s*0x([0-9A-Fa-f]+)")
          reader_sig_rx = re.compile(
              r"^public\s+bool\s+([A-Za-z_][A-Za-z0-9_]*)\s*"
              r"\(OLCLOPLLAGP\s+[A-Za-z_][A-Za-z0-9_]*,\s*"
              r"int\s+[A-Za-z_][A-Za-z0-9_]*\s*=\s*0\)"
          )

          starts=[i for i,l in enumerate(lines) if l.startswith("// Namespace:")]
          starts.append(len(lines))
          matches=[]

          def one_type(by_off, off):
              vals=by_off.get(off,[])
              return vals[0]["type"] if len(vals)==1 else None

          for a,b in zip(starts,starts[1:]):
              block=lines[a:b]
              decl=None
              fields=[]
              by_off={}
              methods=[]
              for rel,line in enumerate(block):
                  if decl is None:
                      tm=type_rx.search(line)
                      if tm:
                          decl={
                              "line":a+rel+1,
                              "name":tm.group(1),
                              "text":line.strip(),
                          }
                  fm=field_rx.search(line)
                  if fm:
                      item={
                          "line":a+rel+1,
                          "type":fm.group(1).strip(),
                          "name":fm.group(2),
                          "offset":int(fm.group(3),16),
                          "text":line.strip(),
                      }
                      fields.append(item)
                      by_off.setdefault(item["offset"],[]).append(item)

                  rm=rva_rx.search(line)
                  if rm:
                      rva=int(rm.group(1),16)
                      sig=None
                      sig_line=None
                      for k in range(rel+1,min(len(block),rel+8)):
                          s=block[k].strip()
                          if s and not s.startswith("//") and "(" in s and ")" in s:
                              sig=s
                              sig_line=a+k+1
                              break
                      methods.append({
                          "rva":rva,
                          "comment_line":a+rel+1,
                          "signature_line":sig_line,
                          "signature":sig,
                      })

              required=(0x10,0x14,0x18,0x38,0x40,0x48,0x50,0x58,0x60,
                        0x74,0x75,0x7C,0x80,0x88,0x90)
              if not all(off in by_off for off in required):
                  continue

              comb=[one_type(by_off,x) for x in (0x38,0x48,0x58)]
              cond=[one_type(by_off,x) for x in (0x40,0x50,0x60)]
              exe=[one_type(by_off,x) for x in (0x80,0x88,0x90)]
              bools=[one_type(by_off,x) for x in (0x74,0x75,0x7C)]
              ids=[one_type(by_off,x) for x in (0x10,0x14,0x18)]

              same_comb=None not in comb and len(set(comb))==1
              same_cond=None not in cond and len(set(cond))==1 and cond[0].endswith("[]")
              same_exec=None not in exe and len(set(exe))==1 and exe[0].endswith("[]")
              bool_triplet=bools==["bool","bool","bool"]
              id_triplet=all(x in {"uint","int"} for x in ids)
              distinct_arrays=same_cond and same_exec and cond[0] != exe[0]

              if not (same_comb and same_cond and same_exec and bool_triplet
                      and id_triplet and distinct_arrays):
                  continue

              readers=[]
              for m in methods:
                  sig=m["signature"] or ""
                  if reader_sig_rx.search(sig):
                      readers.append(m)

              extras=sum(off in by_off for off in
                         (0x98,0xA0,0xA8,0xB0,0xB8))
              score=1000 + extras*20 + len(readers)*100
              matches.append({
                  "score":score,
                  "namespace_line":a+1,
                  "namespace":lines[a],
                  "declaration":decl,
                  "id_types":ids,
                  "comb_type":comb[0],
                  "condition_array_type":cond[0],
                  "exec_array_type":exe[0],
                  "reader_methods":readers,
                  "fields":fields,
                  "methods":methods,
              })

          matches.sort(key=lambda x:(-x["score"],x["namespace_line"]))
          print("\n=== structural legacy Quest row matches ===")
          print("count",len(matches))
          for rank,x in enumerate(matches[:30],1):
              print(f"\n--- rank {rank} score={x['score']} ---")
              print("NAMESPACE",x["namespace"])
              print("DECL",x["declaration"])
              print("ID_TYPES",x["id_types"])
              print("COMB",x["comb_type"])
              print("COND[]",x["condition_array_type"])
              print("EXEC[]",x["exec_array_type"])
              print("READERS")
              for m in x["reader_methods"]:
                  print(
                      f"  RVA=0x{m['rva']:X} L{m['signature_line']} "
                      f"{m['signature']}"
                  )
              print("FIELDS")
              for fld in x["fields"]:
                  if fld["offset"] <= 0xC0:
                      print(
                          f"  +0x{fld['offset']:X} {fld['type']} "
                          f"{fld['name']}"
                      )

          Path("quest-legacy-30-metadata.json").write_text(
              json.dumps({
                  "dump_line_count":len(lines),
                  "structural_matches":matches,
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )

          if not matches:
              raise SystemExit("no repeated condition/exec-array Quest row type found")
          if not matches[0]["reader_methods"]:
              raise SystemExit("top Quest row type has no OLCLOPLLAGP reader method")
          PY

      - name: Recover exact PE function bounds and reader fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pefile capstone
          python - <<'PY' | tee quest-legacy-30-exact-functions.txt
          import json
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM

          meta=json.loads(Path("quest-legacy-30-metadata.json").read_text())
          best=meta["structural_matches"][0]
          readers=best["reader_methods"]
          print("TYPE",best["declaration"])
          print("COND",best["condition_array_type"])
          print("EXEC",best["exec_array_type"])

          pe=pefile.PE("inputs/3.0.0-global/UserAssembly.dll",fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase
          pe.parse_data_directories(
              directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXCEPTION"]]
          )
          runtime=sorted(
              (int(x.struct.BeginAddress),int(x.struct.EndAddress))
              for x in pe.DIRECTORY_ENTRY_EXCEPTION
              if int(x.struct.EndAddress)>int(x.struct.BeginAddress)
          )
          def containing(rva):
              for a,b in runtime:
                  if a<=rva<b:
                      return a,b
              return None

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          md.detail=True
          out=[]
          interesting={0x10,0x14,0x18,0x38,0x40,0x48,0x50,0x58,0x60,
                       0x74,0x75,0x7C,0x80,0x88,0x90,0x98,0xA0,0xA8,0xB0,0xB8}
          for reader in readers:
              rva=reader["rva"]
              bounds=containing(rva)
              print(f"\n=== reader metadata RVA=0x{rva:X} bounds={bounds} ===")
              if not bounds:
                  continue
              a,b=bounds
              insns=[]
              calls=[]
              refs=[]
              for ins in md.disasm(pe.get_data(a,b-a),base+a):
                  row={
                      "rva":ins.address-base,
                      "bytes":ins.bytes.hex(),
                      "mnemonic":ins.mnemonic,
                      "op_str":ins.op_str,
                  }
                  if ins.mnemonic=="call" and ins.operands and ins.operands[0].type==X86_OP_IMM:
                      row["call_target_rva"]=ins.operands[0].imm-base
                      calls.append((row["rva"],row["call_target_rva"]))
                  mem=[]
                  for op in ins.operands:
                      if op.type==X86_OP_MEM:
                          mm={
                              "base":ins.reg_name(op.mem.base) if op.mem.base else None,
                              "index":ins.reg_name(op.mem.index) if op.mem.index else None,
                              "scale":op.mem.scale,
                              "disp":op.mem.disp,
                          }
                          mem.append(mm)
                          if op.mem.disp in interesting:
                              refs.append({
                                  "rva":row["rva"],
                                  "mnemonic":ins.mnemonic,
                                  "op_str":ins.op_str,
                                  **mm,
                              })
                  if mem:
                      row["mem"]=mem
                  insns.append(row)

              print("size",b-a,"instructions",len(insns),"calls",len(calls))
              print("INTERESTING FIELD-LIKE REFS")
              for x in refs:
                  print(
                      f"  0x{x['rva']:X} disp=0x{x['disp']:X} "
                      f"base={x['base']} index={x['index']} "
                      f"{x['mnemonic']} {x['op_str']}"
                  )
              print("CALLS")
              for src,dst in calls:
                  print(f"  0x{src:X} -> 0x{dst:X}")

              out.append({
                  "metadata_rva":rva,
                  "signature":reader["signature"],
                  "begin_rva":a,
                  "end_rva":b,
                  "field_refs":refs,
                  "calls":[{"rva":s,"target_rva":d} for s,d in calls],
                  "instructions":insns,
              })

          Path("quest-legacy-30-exact-functions.json").write_text(
              json.dumps({
                  "type":best,
                  "readers":out,
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          if not out:
              raise SystemExit("no exact reader PE function recovered")
          PY

      - name: Upload focused metadata evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30-metadata
          path: |
            quest-legacy-30-genshin-dumper.log
            quest-legacy-30-metadata.txt
            quest-legacy-30-metadata.json
            quest-legacy-30-exact-functions.txt
            quest-legacy-30-exact-functions.json
          if-no-files-found: warn
