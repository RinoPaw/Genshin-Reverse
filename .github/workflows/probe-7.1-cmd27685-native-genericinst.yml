name: Probe original 7.1 Cmd27685 native genericinst

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-7.1-cmd27685-native-genericinst.yml'

permissions:
  contents: read

concurrency:
  group: original-71-cmd27685-genericinst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard
      - name: Fetch exact official native client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect original metadata and native genericinst Il2CppType bytes
        run: |
          python scripts/probe-7.1-cmd27685-native-genericinst.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/cmd27685-native-collector-genericinst.json
      - uses: actions/upload-artifact@v7
        with:
          name: exact-71-cmd27685-native-genericinst
          path: work/cmd27685-native-collector-genericinst.json
          retention-days: 7
          if-no-files-found: error
