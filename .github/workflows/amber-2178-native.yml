name: Amber 7.1 CmdId 2178 native probe

on:
  push:
    branches:
      - research/amber-2178-quest-notify-20261010
    paths:
      - '.github/workflows/amber-2178-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact 7.1 Global sample (SHA-256 verified)
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect 2178 protobuf writer and native references
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.sampleidentity import require_sha256
          from genshinre.xrefs import scan_rip_xrefs
          from genshinre.callxref import scan_direct_call_xrefs
          from tools.disassemble_rva import disassemble_rva

          root = Path("versions/7.1.0-global/windows-x64")
          exe = Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(exe, PROFILE_71.exe_sha256, label="7.1 Global executable")
          methods = root / "metadata/methods.csv"
          out = Path("amber-2178-native")
          out.mkdir(exist_ok=True)
          writer = disassemble_rva(
              exe, 0xE4BA010, 0x120,
              expected_sha256=PROFILE_71.exe_sha256,
              label="LIGFLGNNAHP.IENGFLPCLNM protobuf writer"
          )
          (out / "writer.json").write_text(json.dumps(writer, indent=2) + "\n")
          print("=== 2178 native protobuf writer ===")
          for insn in writer["instructions"]:
              print(insn["rva"], insn["mnemonic"], insn["op_str"])
          slots = scan_rip_xrefs(exe, [0x57F4150], window=24, methods_csv=methods)
          (out / "type-slot-xrefs.json").write_text(json.dumps(slots, indent=2) + "\n")
          print("=== 2178 native slot xrefs ===")
          matches = slots["matches"]["0x57F4150"]
          print("count", len(matches))
          for match in matches[:30]:
              print(match["instruction_rva"], match.get("caller_methods", [])[:2])
          calls = scan_direct_call_xrefs(
              exe, [0xE4BA010, 0xE4BA1F0], methods_csv=methods, window=24
          )
          (out / "call-xrefs.json").write_text(json.dumps(calls, indent=2) + "\n")
          print("=== 2178 generated method direct callers ===")
          for target, matches in calls["matches"].items():
              print(target, "count", len(matches))
              for match in matches[:20]:
                  print(match["instruction_rva"], match.get("caller_methods", [])[:2])
          sender = disassemble_rva(
              exe, 0x72610D0, 0x90,
              expected_sha256=PROFILE_71.exe_sha256,
              label="EDKMMIPJHJA.OELFMAPHGKK(uint32) sender of CmdId 2178"
          )
          (out / "sender.json").write_text(json.dumps(sender, indent=2) + "\n")
          print("=== 2178 native sender ===")
          for insn in sender["instructions"]:
              print(insn["rva"], insn["mnemonic"], insn["op_str"])
          sender_calls = scan_direct_call_xrefs(
              exe, [0x72610D0], methods_csv=methods, window=32
          )
          (out / "sender-callers.json").write_text(json.dumps(sender_calls, indent=2) + "\n")
          print("=== 2178 sender direct callers ===")
          matches = sender_calls["matches"]["0x72610D0"]
          print("count", len(matches))
          for match in matches[:60]:
              print(match["instruction_rva"], match.get("caller_methods", [])[:2])
          PY
      - name: Preserve exact-sample native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amber-2178-native
          path: amber-2178-native/*.json
          if-no-files-found: warn
          retention-days: 7
