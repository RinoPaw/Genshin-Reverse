name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: genshinre validate versions/7.1.0-global/windows-x64 --allow-partial
      - run: genshinre wire 7202d027
      - run: python -m genshinre wire 7202d027
      - name: Smoke-test protocol evidence query
        if: matrix.python-version == '3.12'
        run: |
          genshinre protocol-query versions/7.1.0-global/windows-x64 --cmd-id 186 > /tmp/protocol-186.json
          python - <<'PY'
          import csv
          import json
          data=json.load(open('/tmp/protocol-186.json', encoding='utf-8'))
          assert data['result_count'] == 1
          item=data['results'][0]
          row=item['registry']
          assert row['cmd_id'] == '186'
          assert row['type_name'] == 'NLOMEGMJDGJ'
          assert row['type_definition_index'] == '61556'
          targets={
              0xAABBD80: 'field-codec-factory',
              0x182C3AA0: 'repeated-size-helper',
              0x182C3E20: 'repeated-parse-helper',
              0x182C4710: 'repeated-copy-helper',
              0x529A10: 'allocation-helper',
              0x1184DFE0: 'method-cluster-helper',
              0x510BE0: 'method-cluster-helper-2',
          }
          hits=[]
          with open('versions/7.1.0-global/windows-x64/metadata/methods.csv', encoding='utf-8-sig', newline='') as f:
              for method in csv.DictReader(f):
                  text=(method.get('rva') or '').strip()
                  if not text:
                      continue
                  try:
                      rva=int(text, 0)
                  except ValueError:
                      continue
                  if rva in targets:
                      hits.append({'target_role': targets[rva], **method})
          print(json.dumps({
              'cmdid_186': {
                  'fields': item['metadata']['fields'],
                  'methods': item['metadata']['methods'],
                  'scene_handler_dispatch': item['scene_handler_dispatch'],
              },
              'helper_rva_matches': hits,
          }, indent=2, ensure_ascii=False))
          PY
      - name: Syntax-check shell scripts
        if: matrix.python-version == '3.12'
        run: bash -n scripts/*.sh
      - name: Syntax-check PowerShell scripts
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
