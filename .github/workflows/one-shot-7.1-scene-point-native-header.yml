name: One-shot original 7.1 Scene Point native header transform

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-point-native-header.yml'
      - 'scripts/probe-7.1-scene-point-native-header-transform.py'

permissions:
  contents: read

jobs:
  native-header:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install original native dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify native possible Scene Point header transforms
        run: |
          python scripts/probe-7.1-scene-point-native-header-transform.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-source-payload-census.json \
            --output work/original-71-scene-point-header-native.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-point-header-native
          path: work/original-71-scene-point-header-native.json
          retention-days: 7
          if-no-files-found: error
