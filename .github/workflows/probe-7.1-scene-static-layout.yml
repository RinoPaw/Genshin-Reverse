name: Probe 7.1 scene static layout

on:
  push:
    paths:
      - '.github/workflows/probe-7.1-scene-static-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Probe scene static slot domain and generic field types
        run: |
          python - <<'PY' > /tmp/scene-static-layout-71.json
          import bisect
          import csv
          import json
          import struct
          from collections import Counter, defaultdict
          from pathlib import Path

          from capstone import CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP
          from genshinre.pe import PEImage
          from genshinre.mhy71 import TYPE_ARRAY_POINTER_RVA

          OWNER='KLLNGCPBLMM'
          SLOT_MIN=0x4B0000
          SLOT_MAX=0x4B8000
          CONTROL_SLOTS={
              0x4B2A70:'unlock_sender',
              0x4B2A90:'rsp_36641',
              0x4B2AB0:'rsp_20290',
              0x4B2AC0:'GetSceneAreaRsp',
              0x4B2D90:'EnterWorldAreaRsp',
              0x4B3028:'ScenePointUnlockNotify',
              0x4B3098:'SceneTransToPointRsp',
              0x4B3568:'SceneAreaUnlockNotify',
          }

          # Current registry type -> CmdId map.
          type_to_cmd={}
          with open('versions/7.1.0-global/windows-x64/registry/registry.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  name=row.get('type_name') or row.get('message_type') or ''
                  raw=row.get('cmd_id') or row.get('cmd') or ''
                  if name and raw:
                      try:type_to_cmd[name]=int(raw,0)
                      except ValueError:pass

          all_rvas=[]
          owner_methods=[]
          with open('versions/7.1.0-global/windows-x64/metadata/methods.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  raw=row.get('rva') or ''
                  if not raw: continue
                  rva=int(raw,0)
                  if rva<=0: continue
                  all_rvas.append(rva)
                  if row.get('type_name')==OWNER:
                      try:params=json.loads(row.get('parameter_types') or '[]')
                      except Exception:params=[]
                      owner_methods.append({
                          'rva':rva,
                          'method_index':int(row['method_index']),
                          'method_name':row.get('method_name',''),
                          'parameter_types':params,
                          'parameter_cmd_ids':[type_to_cmd.get(x) for x in params],
                      })
          all_rvas=sorted(set(all_rvas))
          for m in owner_methods:
              i=bisect.bisect_right(all_rvas,m['rva'])
              m['end']=all_rvas[i] if i<len(all_rvas) else m['rva']+0x1000

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          slot_uses=[]
          with PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as image:
              for m in owner_methods:
                  size=m['end']-m['rva']
                  if size<=0 or size>0x20000: continue
                  try: blob=image.read_rva(m['rva'],size)
                  except Exception: continue
                  for insn in md.disasm(blob,image.image_base+m['rva']):
                      for oi,op in enumerate(insn.operands):
                          if op.type!=X86_OP_MEM or op.mem.base==X86_REG_RIP: continue
                          disp=int(op.mem.disp)
                          if SLOT_MIN<=disp<SLOT_MAX:
                              slot_uses.append({
                                  'slot':disp,
                                  'slot_hex':f'0x{disp:X}',
                                  'control':CONTROL_SLOTS.get(disp,''),
                                  'instruction_rva':f'0x{insn.address-image.image_base:X}',
                                  'mnemonic':insn.mnemonic,
                                  'op_str':insn.op_str,
                                  'operand_index':oi,
                                  'method_index':m['method_index'],
                                  'method_rva':f"0x{m['rva']:X}",
                                  'method_name':m['method_name'],
                                  'parameter_types':m['parameter_types'],
                                  'parameter_cmd_ids':m['parameter_cmd_ids'],
                              })

              # Probe every field owned by KLLNGCPBLMM. For genericinst runtime types,
              # retain the Il2CppType entry and the pointed generic-class bytes/pointers.
              fields=[]
              with open('versions/7.1.0-global/windows-x64/metadata/fields.csv',encoding='utf-8',newline='') as f:
                  for row in csv.DictReader(f):
                      if row.get('type_name')==OWNER:
                          fields.append(dict(row))

              type_array_va=struct.unpack('<Q',image.read_rva(TYPE_ARRAY_POINTER_RVA,8))[0]
              type_array_rva=type_array_va-image.image_base

              def valid_rva(rva,size=1):
                  if rva<0:return False
                  try:
                      image.read_rva(rva,size)
                      return True
                  except Exception:
                      return False

              generic_probe={}
              for row in fields:
                  try:idx=int(row.get('field_type_index') or -1)
                  except ValueError:continue
                  if idx<0:continue
                  entry=image.read_rva(type_array_rva+idx*16,16)
                  kind=entry[0x0A]
                  if kind!=0x15:continue
                  data=struct.unpack_from('<Q',entry,0)[0]
                  item={
                      'field_type_index':idx,
                      'type_entry_hex':entry.hex(),
                      'kind':kind,
                      'data_qword':f'0x{data:X}',
                  }
                  target_rva=data-image.image_base
                  if valid_rva(target_rva,64):
                      raw=image.read_rva(target_rva,96)
                      item['generic_class_rva']=f'0x{target_rva:X}'
                      item['generic_class_hex']=raw.hex()
                      ptrs=[]
                      for off in range(0,64,8):
                          q=struct.unpack_from('<Q',raw,off)[0]
                          q_rva=q-image.image_base
                          p={'offset':off,'value':f'0x{q:X}'}
                          if valid_rva(q_rva,32):
                              p['rva']=f'0x{q_rva:X}'
                              p['target_hex']=image.read_rva(q_rva,32).hex()
                          ptrs.append(p)
                      item['qwords']=ptrs
                  generic_probe[str(idx)]=item

          grouped=defaultdict(list)
          for row in slot_uses: grouped[row['slot']].append(row)
          unique=[]
          for slot in sorted(grouped):
              rows=grouped[slot]
              unique.append({
                  'slot':f'0x{slot:X}',
                  'control':CONTROL_SLOTS.get(slot,''),
                  'use_count':len(rows),
                  'method_indices':sorted(set(r['method_index'] for r in rows)),
                  'cmd_ids':sorted(set(c for r in rows for c in r['parameter_cmd_ids'] if c is not None)),
                  'uses':rows,
              })

          field_type_counts=Counter(r.get('field_type','') for r in fields)
          print(json.dumps({
              'owner':OWNER,
              'slot_domain':[f'0x{SLOT_MIN:X}',f'0x{SLOT_MAX:X}'],
              'control_slots':{f'0x{k:X}':v for k,v in CONTROL_SLOTS.items()},
              'slot_count':len(unique),
              'slots':unique,
              'owner_field_count':len(fields),
              'owner_fields':fields,
              'owner_field_type_counts':dict(field_type_counts),
              'type_array_rva':f'0x{type_array_rva:X}',
              'generic_probe':generic_probe,
              'notes':[
                  'The slot list contains every non-RIP memory displacement in 0x4B0000..0x4B7fff referenced by a KLLNGCPBLMM native method.',
                  'generic_probe intentionally preserves raw Il2CppType/generic-class bytes; interpretation must be validated against known control message/delegate fields before candidate binding.',
                  'Metadata declaration order and native slot order are not assumed equivalent until controls demonstrate it.',
              ],
          },indent=2))
          PY

          python - <<'PY'
          import json
          d=json.load(open('/tmp/scene-static-layout-71.json'))
          print('slots',d['slot_count'],'fields',d['owner_field_count'],'generic types',len(d['generic_probe']))
          for s in d['slots']:
              if s['control'] or 0x4B2A00<=int(s['slot'],0)<=0x4B3600:
                  print(s['slot'],s['control'],'uses',s['use_count'],'cmds',s['cmd_ids'],'methods',s['method_indices'])
          print('generic indices:',sorted(map(int,d['generic_probe'].keys())))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-static-layout-71
          path: /tmp/scene-static-layout-71.json
          if-no-files-found: error
