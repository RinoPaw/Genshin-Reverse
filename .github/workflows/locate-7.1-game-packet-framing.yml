name: Locate 7.1 game packet framing

on:
  push:
    paths:
      - 'tools/locate_game_packet_framing_71.py'
      - '.github/workflows/locate-7.1-game-packet-framing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Locate framing magic consumers
        run: |
          python tools/locate_game_packet_framing_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/game-packet-framing-71.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-packet-framing-71
          path: /tmp/game-packet-framing-71.json
          if-no-files-found: warn
