name: Probe CmdId 186 direct callers

on:
  push:
    paths:
      - .github/workflows/probe-cmd186-callers.yml
  workflow_dispatch:

concurrency:
  group: probe-cmd186-callers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard
      - name: Fetch pinned exact 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Scan direct calls into CmdId 186 generated methods
        run: |
          set -euo pipefail
          genshinre call-xrefs \
            inputs/7.1.0-global/GenshinImpact.exe \
            0x9ED1E80 0x9ED1EF0 0x9ED1F40 0x9ED1F90 0x9ED1FC0 0x9ED2010 0x9ED2100 0x9ED2160 \
            --methods-csv versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --max-method-body 0x10000 \
            --window 32 \
            --output cmdid-186-callers.json \
            > /tmp/cmdid-186-callers.stdout.json
          python - <<'PY'
          import json
          data=json.load(open('cmdid-186-callers.json', encoding='utf-8'))
          summary={target: {
              'call_count': len(rows),
              'callers': [
                  {
                      'instruction_rva': row['instruction_rva'],
                      'caller_methods': row['caller_methods'],
                  }
                  for row in rows
              ],
          } for target, rows in data['matches'].items()}
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cmdid-186-direct-call-xrefs
          path: cmdid-186-callers.json
          if-no-files-found: error
          retention-days: 7
