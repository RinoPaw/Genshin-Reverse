name: Resolve 7.1 UnlockTransPointRsp candidates

on:
  push:
    paths:
      - '.github/workflows/resolve-7.1-unlock-trans-point-rsp.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Recover exact native CmdId and direction arrays
        run: |
          python -m genshinre.registryarrays \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/registry/registry-type-slots.csv \
            versions/7.1.0-global/windows-x64/proto/known-opcodes.csv \
            /tmp/registry-native-arrays.csv \
            --summary /tmp/registry-native-arrays.summary.json
          cat /tmp/registry-native-arrays.summary.json

      - name: Correlate direction, external semantics and method references
        run: |
          curl -fsSL \
            'https://raw.githubusercontent.com/capyb2222/LunaGC_7.1.0/7.1/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java' \
            -o /tmp/LunaGC-PacketOpcodes.java
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64')
          def load(path):
              with Path(path).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          candidates = load(root / 'analyses/unlock-trans-point/retcode6-single-field-candidates.csv')
          raw = {int(r['cmd_id']): r for r in load('/tmp/registry-native-arrays.csv')}
          registry = {int(r['cmd_id']): r for r in load(root / 'registry/registry.csv')}
          methods = load(root / 'metadata/methods.csv')

          luna = Path('/tmp/LunaGC-PacketOpcodes.java').read_text(encoding='utf-8')
          luna_by_id = {}
          for name, value in re.findall(r'public static final int\s+(\w+)\s*=\s*(-?\d+)\s*;', luna):
              value = int(value)
              if value > 0:
                  luna_by_id.setdefault(value, []).append(name)

          candidate_ids = {int(r['cmd_id']) for r in candidates}
          controls = {9369, 22899, 26105, 4385, 25567}
          focus_types = {
              registry[cid]['type_name'] for cid in candidate_ids | controls
              if cid in registry and registry[cid].get('type_name')
          }
          refs = {t: [] for t in focus_types}
          for m in methods:
              params = m.get('parameter_types', '') or ''
              ret = m.get('return_type', '') or ''
              for t in focus_types:
                  if t in params or t == ret:
                      refs[t].append({
                          'declaring_type': m.get('type_name', ''),
                          'method_name': m.get('method_name', ''),
                          'rva': m.get('rva', ''),
                          'return_type': ret,
                          'parameter_types': params,
                          'match': 'return' if t == ret else 'parameter',
                      })

          result = []
          for c in candidates:
              cid = int(c['cmd_id'])
              rr = raw[cid]
              reg = registry.get(cid, {})
              flag = int(rr['registry_flag'])
              direction = rr['direction']
              names = luna_by_id.get(cid, [])
              conflict = any(name != 'UnlockTransPointRsp' for name in names)
              t = c['type_name']
              result.append({
                  'cmd_id': cid,
                  'type_name': t,
                  'registry_flag': flag,
                  'direction': direction,
                  'direction_rejected': direction == 'C2S',
                  'luna_names': names,
                  'external_semantic_conflict': conflict,
                  'type_definition_index': reg.get('type_definition_index', ''),
                  'type_slot_rva': reg.get('type_slot_rva', ''),
                  'get_cmd_id_rva': reg.get('get_cmd_id_rva', ''),
                  'xref_count': reg.get('xref_count', ''),
                  'xref_method_count': reg.get('xref_method_count', ''),
                  'method_reference_count': len(refs.get(t, [])),
                  'method_references': refs.get(t, []),
              })

          control_rows = {}
          for cid in sorted(controls):
              reg = registry.get(cid, {})
              t = reg.get('type_name', '')
              rr = raw.get(cid, {})
              control_rows[str(cid)] = {
                  'semantic_name': reg.get('semantic_name', ''),
                  'type_name': t,
                  'registry_flag': int(rr['registry_flag']) if rr else None,
                  'direction': rr.get('direction', '') if rr else '',
                  'method_reference_count': len(refs.get(t, [])),
                  'method_references': refs.get(t, []),
              }

          report = {
              'sample': '7.1.0-global/windows-x64',
              'exe_sha256': '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d',
              'direction_mapping': {'0': 'S2C', '1': 'C2S'},
              'candidate_count': len(result),
              's2c_count': sum(r['direction'] == 'S2C' for r in result),
              'c2s_count': sum(r['direction'] == 'C2S' for r in result),
              'external_semantic_conflict_count': sum(r['external_semantic_conflict'] for r in result),
              'survivor_count_after_direction_and_external_conflicts': sum(
                  r['direction'] == 'S2C' and not r['external_semantic_conflict'] for r in result),
              'controls': control_rows,
              'candidates': result,
              'notes': [
                  'direction comes from the exact native byte[4896] flag array, independently checked against known Req/Rsp controls',
                  'LunaGC names are secondary exclusion evidence only',
                  'method parameter/return references are semantic-consumer leads only',
              ],
          }
          Path('/tmp/unlock-trans-point-rsp-resolution.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          cols = ['cmd_id','type_name','registry_flag','direction','direction_rejected',
                  'luna_names','external_semantic_conflict','type_definition_index','type_slot_rva',
                  'get_cmd_id_rva','xref_count','xref_method_count','method_reference_count']
          with Path('/tmp/unlock-trans-point-rsp-resolution.csv').open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=cols); w.writeheader()
              for r in result:
                  flat = {k:r.get(k,'') for k in cols}; flat['luna_names']='|'.join(r['luna_names']); w.writerow(flat)

          print(json.dumps({k: report[k] for k in (
              'candidate_count','s2c_count','c2s_count','external_semantic_conflict_count',
              'survivor_count_after_direction_and_external_conflicts','controls')}, indent=2))
          print('\n--- candidates ---')
          for r in result:
              print(r['cmd_id'], r['type_name'], r['direction'], r['luna_names'], 'refs=', r['method_reference_count'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unlock-trans-point-rsp-resolution
          path: |
            /tmp/registry-native-arrays.summary.json
            /tmp/unlock-trans-point-rsp-resolution.json
            /tmp/unlock-trans-point-rsp-resolution.csv
