name: Resolve 7.1 UnlockTransPointRsp candidates

on:
  push:
    paths:
      - '.github/workflows/resolve-7.1-unlock-trans-point-rsp.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Recover direction flags from published registry indices
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          row_count = 4896
          root = Path('versions/7.1.0-global/windows-x64')

          def load(path):
              with Path(path).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          registry = load(root / 'registry/registry.csv')
          if len(registry) != row_count:
              raise SystemExit(f'expected {row_count} registry rows, got {len(registry)}')
          by_cmd = {int(r['cmd_id']): r for r in registry}

          controls = []
          for row in load(root / 'proto/known-opcodes.csv'):
              direction = row.get('direction', '').upper()
              if direction not in {'C2S', 'S2C'}:
                  continue
              cmd = int(row['cmd_id'])
              reg = by_cmd.get(cmd)
              if reg is None:
                  continue
              controls.append({
                  'cmd_id': cmd,
                  'semantic_name': row['semantic_name'],
                  'index': int(reg['index']),
                  'expected_flag': 1 if direction == 'C2S' else 0,
                  'direction': direction,
              })

          if len(controls) < 4 or not any(c['expected_flag'] == 1 for c in controls):
              raise SystemExit(f'insufficient direction controls: {controls}')

          data = Path('/tmp/gi71/GenshinImpact.exe').read_bytes()
          binary_runs = list(re.finditer(b'[\x00\x01]{4896,}', data))
          one_control = next(c for c in controls if c['expected_flag'] == 1)
          anchor_index = one_control['index']
          candidate_bases = set()
          candidate_meta = []

          for match in binary_runs:
              start, end = match.span()
              run = data[start:end]
              pos = run.find(b'\x01')
              while pos >= 0:
                  base = start + pos - anchor_index
                  if base >= start and base + row_count <= end:
                      if all(data[base + c['index']] == c['expected_flag'] for c in controls):
                          window = data[base:base + row_count]
                          if all(v in (0, 1) for v in window):
                              candidate_bases.add(base)
                  pos = run.find(b'\x01', pos + 1)

          for base in sorted(candidate_bases):
              flags = data[base:base + row_count]
              candidate_meta.append({
                  'file_offset': f'0x{base:X}',
                  'zeros': flags.count(0),
                  'ones': flags.count(1),
                  'controls': [
                      {**c, 'observed_flag': flags[c['index']]} for c in controls
                  ],
              })

          probe = {
              'exe_sha256': '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d',
              'row_count': row_count,
              'binary_run_count': len(binary_runs),
              'controls': controls,
              'candidate_count': len(candidate_bases),
              'candidates': candidate_meta,
              'status': 'unique' if len(candidate_bases) == 1 else 'unresolved',
              'method': 'scan byte[4896] binary windows using published registry indices and six independent known-opcode direction controls',
          }
          Path('/tmp/registry-direction-flag-probe.json').write_text(
              json.dumps(probe, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(probe, indent=2, ensure_ascii=False))

          if len(candidate_bases) != 1:
              raise SystemExit(f'expected exactly one direction flag array, got {len(candidate_bases)}')

          base = next(iter(candidate_bases))
          flags = data[base:base + row_count]
          out = Path('/tmp/registry-direction-flags.csv')
          with out.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['index','cmd_id','type_name','registry_flag','direction'])
              w.writeheader()
              for reg in registry:
                  index = int(reg['index'])
                  flag = flags[index]
                  w.writerow({
                      'index': index,
                      'cmd_id': reg['cmd_id'],
                      'type_name': reg['type_name'],
                      'registry_flag': flag,
                      'direction': 'C2S' if flag == 1 else 'S2C',
                  })
          PY

      - name: Correlate response candidates
        run: |
          curl -fsSL \
            'https://raw.githubusercontent.com/capyb2222/LunaGC_7.1.0/7.1/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java' \
            -o /tmp/LunaGC-PacketOpcodes.java
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          root = Path('versions/7.1.0-global/windows-x64')
          def load(path):
              with Path(path).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          candidates = load(root / 'analyses/unlock-trans-point/retcode6-single-field-candidates.csv')
          directions = {int(r['cmd_id']): r for r in load('/tmp/registry-direction-flags.csv')}
          registry = {int(r['cmd_id']): r for r in load(root / 'registry/registry.csv')}

          luna_text = Path('/tmp/LunaGC-PacketOpcodes.java').read_text(encoding='utf-8')
          luna_by_id = {}
          for name, value in re.findall(r'public static final int\s+(\w+)\s*=\s*(-?\d+)\s*;', luna_text):
              value = int(value)
              if value > 0:
                  luna_by_id.setdefault(value, []).append(name)

          result = []
          for c in candidates:
              cid = int(c['cmd_id'])
              d = directions[cid]
              reg = registry[cid]
              names = luna_by_id.get(cid, [])
              conflicts = [name for name in names if name != 'UnlockTransPointRsp']
              result.append({
                  'cmd_id': cid,
                  'type_name': c['type_name'],
                  'registry_flag': int(d['registry_flag']),
                  'direction': d['direction'],
                  'luna_names': names,
                  'external_semantic_conflict': bool(conflicts),
                  'type_definition_index': reg.get('type_definition_index', ''),
                  'type_slot_rva': reg.get('type_slot_rva', ''),
                  'get_cmd_id_rva': reg.get('get_cmd_id_rva', ''),
                  'xref_count': reg.get('xref_count', ''),
                  'xref_method_count': reg.get('xref_method_count', ''),
              })

          survivors = [r for r in result if r['direction'] == 'S2C' and not r['external_semantic_conflict']]
          report = {
              'candidate_count': len(result),
              's2c_count': sum(r['direction'] == 'S2C' for r in result),
              'c2s_count': sum(r['direction'] == 'C2S' for r in result),
              'external_semantic_conflict_count': sum(r['external_semantic_conflict'] for r in result),
              'survivor_count': len(survivors),
              'survivors': survivors,
              'candidates': result,
              'evidence_policy': {
                  'direction': 'current 7.1 official client static evidence',
                  'luna_names': 'secondary exclusion evidence only',
              },
          }
          Path('/tmp/unlock-trans-point-rsp-resolution.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({k: report[k] for k in ('candidate_count','s2c_count','c2s_count','external_semantic_conflict_count','survivor_count')}, indent=2))
          print('--- survivors ---')
          for r in survivors:
              print(r['cmd_id'], r['type_name'], r['luna_names'], 'xrefs=', r['xref_count'], r['xref_method_count'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlock-trans-point-rsp-resolution
          path: |
            /tmp/registry-direction-flag-probe.json
            /tmp/registry-direction-flags.csv
            /tmp/unlock-trans-point-rsp-resolution.json
          if-no-files-found: warn
