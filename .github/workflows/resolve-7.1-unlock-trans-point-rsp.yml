name: Resolve 7.1 UnlockTransPointRsp candidates

on:
  push:
    paths:
      - '.github/workflows/resolve-7.1-unlock-trans-point-rsp.yml'
      - 'tools/probe_registry_direction_flags_71.py'
      - 'tools/analyze_protocol_consumers_71.py'
      - 'tools/scan_protocol_method_callers_71.py'
      - 'genshinre/paramprobe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Compare protocol consumer patterns
        run: |
          python tools/analyze_protocol_consumers_71.py \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            versions/7.1.0-global/windows-x64/analyses/unlock-trans-point/retcode6-single-field-candidates.csv \
            /tmp/unlock-trans-point-rsp-consumers.json \
            --control-cmd 22899 \
            --control-cmd 4385 \
            --control-cmd 3064 \
            --control-cmd 9582 \
            --control-cmd 25567 \
            --control-cmd 9369 \
            --control-cmd 26105

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Probe confirmed handler parameter records
        run: |
          python -m genshinre.paramprobe \
            /tmp/gi71/GenshinImpact.exe \
            /tmp/gi71/global-metadata.dat \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            versions/7.1.0-global/windows-x64/metadata/runtime-types.csv \
            /tmp/parameter-probe-71.json

      - name: Scan direct callers of protocol methods
        run: |
          python tools/scan_protocol_method_callers_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            versions/7.1.0-global/windows-x64/analyses/unlock-trans-point/retcode6-single-field-candidates.csv \
            /tmp/unlock-trans-point-rsp-method-callers.json \
            --control-cmd 22899 \
            --control-cmd 3064 \
            --control-cmd 20824 \
            --control-cmd 4385 \
            --control-cmd 25567 \
            --control-cmd 9369 \
            --control-cmd 26105

      - name: Probe native direction flags
        continue-on-error: true
        run: |
          python tools/probe_registry_direction_flags_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            versions/7.1.0-global/windows-x64/proto/known-opcodes.csv \
            versions/7.1.0-global/windows-x64/analyses/unlock-trans-point/retcode6-single-field-candidates.csv \
            /tmp/registry-direction-flag-probe.json \
            --flags-csv /tmp/registry-direction-flags.csv

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlock-trans-point-rsp-research
          path: |
            /tmp/unlock-trans-point-rsp-consumers.json
            /tmp/parameter-probe-71.json
            /tmp/unlock-trans-point-rsp-method-callers.json
            /tmp/registry-direction-flag-probe.json
            /tmp/registry-direction-flags.csv
          if-no-files-found: warn
