name: Probe QuestExcel 7.1 semantic correlations

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-questexcel71-semantic-correlation.yml"

concurrency:
  group: probe-questexcel71-semantic-correlation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact QuestExcel asset evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf evidence/q71
          mkdir -p evidence/q71
          gh run download 37440823447 \
            --repo RinoPaw/Genshin-Reverse \
            --name quest-excel-asset-chain-probe \
            --dir evidence/q71
          ASSET="$(find evidence/q71 -type f -name 3b87ae83.dat -print -quit)"
          test -n "$ASSET"
          test -s "$ASSET"
          cp "$ASSET" questexcel71.dat
          sha256sum questexcel71.dat

      - name: Fetch pinned same-version BinOutput controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/asta-pr9
          git clone --filter=blob:none --no-checkout \
            https://github.com/MeChen618/AstaPS-Resource.git /tmp/asta-pr9
          git -C /tmp/asta-pr9 sparse-checkout init --no-cone
          git -C /tmp/asta-pr9 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/asta-pr9 checkout 7465e29b2d58058ab9973187c112abf2717ada03

          rm -rf /tmp/agd-71
          git clone --filter=blob:none --no-checkout \
            https://github.com/DimbreathBot/AnimeGameData.git /tmp/agd-71
          git -C /tmp/agd-71 sparse-checkout init --no-cone
          git -C /tmp/agd-71 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/agd-71 checkout 792978e5503ecfba73dcb3562ed44a0d35a2abe2

      - name: Fetch pinned 7.1 Dimbreath native-name controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dimbreath-71
          git clone --filter=blob:none --no-checkout \
            https://github.com/DimbreathBot/AnimeGameData.git /tmp/dimbreath-71
          git -C /tmp/dimbreath-71 sparse-checkout init --no-cone
          git -C /tmp/dimbreath-71 sparse-checkout set 'BinOutput/Quest/*.json'
          git -C /tmp/dimbreath-71 checkout 792978e5503ecfba73dcb3562ed44a0d35a2abe2

      - name: Correlate unresolved native slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee questexcel71-semantic-correlation.txt
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from genshinre.questexcel71 import parse_questexcel71_raw_export

          table = parse_questexcel71_raw_export(Path("questexcel71.dat").read_bytes())
          native = {row.sub_id: row for row in table.rows}

          controls = {}
          for path in sorted(Path("/tmp/asta-pr9/BinOutput/Quest").glob("*.json")):
              try:
                  root = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(root, dict):
                  continue
              for row in root.get("subQuests", []):
                  if isinstance(row, dict) and isinstance(row.get("subId"), int):
                      controls[row["subId"]] = row

          dim_controls = {}
          for path in sorted(Path("/tmp/dimbreath-71/BinOutput/Quest").glob("*.json")):
              try:
                  root = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(root, dict):
                  continue
              subquests = root.get("subQuests")
              if not isinstance(subquests, list):
                  subquests = root.get("JIJKODHIEED", [])
              for row in subquests:
                  if isinstance(row, dict):
                      sid = row.get("subId")
                      if not isinstance(sid, int):
                          sid = row.get("NFGFDHPPBIF")
                      if isinstance(sid, int):
                          dim_controls[sid] = row

          common = sorted(set(native) & set(controls))
          dim_common = sorted(set(native) & set(dim_controls))
          print("native_rows", len(native))
          print("control_rows", len(controls))
          print("intersection", len(common))
          print("dimbreath_control_rows", len(dim_controls))
          print("dimbreath_intersection", len(dim_common))

          def presence_set_native(attr):
              return {sid for sid in common if getattr(native[sid], attr) is not None}

          def key_sets(scope):
              out = defaultdict(set)
              for sid in common:
                  obj = controls[sid]
                  if scope == "guide":
                      obj = obj.get("guide")
                  if not isinstance(obj, dict):
                      continue
                  for key in obj:
                      out[key].add(sid)
              return out

          row_keys = key_sets("row")
          guide_keys = key_sets("guide")

          def rank_presence(label, s, candidates, limit=20):
              scored = []
              for key, ks in candidates.items():
                  inter = len(s & ks)
                  union = len(s | ks)
                  scored.append((
                      1 if s == ks else 0,
                      inter / union if union else 1.0,
                      inter,
                      len(s),
                      len(ks),
                      key,
                      len(s - ks),
                      len(ks - s),
                  ))
              scored.sort(reverse=True)
              print(f"\n=== PRESENCE {label} n={len(s)} ===")
              for exact,jacc,inter,ns,nk,key,miss,extra in scored[:limit]:
                  print(
                      f"{key}\texact={exact}\tjacc={jacc:.6f}\tinter={inter}"
                      f"\tnative={ns}\tcontrol={nk}\tnative_only={miss}\tcontrol_only={extra}"
                  )

          rank_presence("bit34", presence_set_native("unknown_bit34_raw"), row_keys)
          rank_presence("bit40", presence_set_native("unknown_bit40_raw"), row_keys)
          rank_presence(
              "bit29/prefer_area2_guide_scene",
              {sid for sid in common if native[sid].prefer_area2_guide_scene},
              row_keys,
          )
          rank_presence("dabnijghapj", presence_set_native("dabnijghapj"), row_keys)
          rank_presence("guide.unknown_string_10",
                        {sid for sid in common if native[sid].guide.unknown_string_10 is not None},
                        guide_keys)
          rank_presence("guide.unknown_string_20",
                        {sid for sid in common if native[sid].guide.unknown_string_20 is not None},
                        guide_keys)
          for attr in ("unknown_scalar_2c","unknown_scalar_40","unknown_scalar_44","unknown_scalar_5c"):
              rank_presence(
                  "guide."+attr,
                  {sid for sid in common if getattr(native[sid].guide, attr) is not None},
                  guide_keys,
              )

          # Exact value equality against every same-version control key. This is
          # strong for strings/ids and a useful negative control for unknown slots.
          def rank_values(label, getter, scope, limit=30):
              counts = Counter()
              present = 0
              comparable = Counter()
              for sid in common:
                  val = getter(native[sid])
                  if val is None:
                      continue
                  present += 1
                  obj = controls[sid]
                  if scope == "guide":
                      obj = obj.get("guide")
                  if not isinstance(obj, dict):
                      continue
                  for key, cval in obj.items():
                      if isinstance(cval, (str, int, bool)):
                          comparable[key] += 1
                          if cval == val and type(cval) is type(val):
                              counts[key] += 1
              print(f"\n=== VALUE {label} present={present} ===")
              keys = set(comparable) | set(counts)
              ranked = sorted(
                  keys,
                  key=lambda k: (
                      counts[k] / comparable[k] if comparable[k] else 0,
                      counts[k],
                      comparable[k],
                      k,
                  ),
                  reverse=True,
              )
              for key in ranked[:limit]:
                  print(
                      f"{key}\tmatch={counts[key]}\tcomparable={comparable[key]}"
                      f"\tratio={(counts[key]/comparable[key] if comparable[key] else 0):.6f}"
                  )

          rank_values("unknown_core_u32", lambda r:r.unknown_core_u32, "row")
          rank_values("dabnijghapj", lambda r:r.dabnijghapj, "row")
          rank_values("guide.unknown_string_10", lambda r:r.guide.unknown_string_10, "guide")
          rank_values("guide.unknown_string_20", lambda r:r.guide.unknown_string_20, "guide")
          for attr in ("unknown_scalar_2c","unknown_scalar_40","unknown_scalar_44","unknown_scalar_5c"):
              rank_values("guide."+attr, lambda r,a=attr:getattr(r.guide,a), "guide")

          # Use Dimbreath's pinned CNRELWin7.1.0 dump as a native-name control.
          # Unlike the Asta projection, it preserves many obfuscated runtime fields.
          dim_row_keys = defaultdict(set)
          for sid in dim_common:
              for key in dim_controls[sid]:
                  dim_row_keys[key].add(sid)

          print("\n=== DIMBREATH PRESENCE BIT40 ===")
          bit40_set_all = {sid for sid in dim_common if native[sid].unknown_bit40_raw is not None}
          dim_presence_rank = []
          for key,ks in dim_row_keys.items():
              inter=len(bit40_set_all & ks)
              union=len(bit40_set_all | ks)
              dim_presence_rank.append((
                  1 if bit40_set_all==ks else 0,
                  inter/union if union else 1.0,
                  inter,len(bit40_set_all),len(ks),key,
                  len(bit40_set_all-ks),len(ks-bit40_set_all),
              ))
          dim_presence_rank.sort(reverse=True)
          for exact,jacc,inter,ns,nk,key,miss,extra in dim_presence_rank[:40]:
              print(
                  f"{key}\texact={exact}\tjacc={jacc:.6f}\tinter={inter}"
                  f"\tnative={ns}\tcontrol={nk}\tnative_only={miss}\tcontrol_only={extra}"
              )

          print("\n=== DIMBREATH UNKNOWN CORE VALUE/TRANSFORM ===")
          # For each scalar Dimbreath key, test direct equality and whether a
          # single XOR or modular add/sub constant maps the native fixed slot.
          dim_scalar_pairs = defaultdict(list)
          for sid in dim_common:
              raw = native[sid].unknown_core_u32
              for key,val in dim_controls[sid].items():
                  if isinstance(val, bool) or not isinstance(val, int):
                      continue
                  dim_scalar_pairs[key].append((raw,val))
          ranked=[]
          for key,pairs in dim_scalar_pairs.items():
              if len(pairs)<10:
                  continue
              eq=sum(a==b for a,b in pairs)
              xors={a^b for a,b in pairs}
              adds={(b-a)&0xffffffff for a,b in pairs}
              subs={(a-b)&0xffffffff for a,b in pairs}
              score=(
                  1 if eq==len(pairs) else 0,
                  1 if len(xors)==1 else 0,
                  1 if len(adds)==1 else 0,
                  eq/len(pairs),
                  len(pairs),
              )
              ranked.append((score,key,pairs,xors,adds,subs,eq))
          ranked.sort(reverse=True,key=lambda x:(x[0],x[1]))
          for score,key,pairs,xors,adds,subs,eq in ranked[:50]:
              print(
                  key,
                  "pairs",len(pairs),
                  "eq",eq,
                  "ratio",f"{eq/len(pairs):.6f}",
                  "xor_constants",len(xors),
                  "xor",hex(next(iter(xors))) if len(xors)==1 else "",
                  "add_constants",len(adds),
                  "add",hex(next(iter(adds))) if len(adds)==1 else "",
                  "sub_constants",len(subs),
                  "sub",hex(next(iter(subs))) if len(subs)==1 else "",
              )

          print("\n=== DIMBREATH BIT40 ROWS ===")
          for sid in sorted(bit40_set_all):
              c=dim_controls[sid]
              scalar={k:v for k,v in c.items() if isinstance(v,(bool,int,str)) and k not in {"subId","NFGFDHPPBIF","mainId","PCOMHEOJPOO","order"}}
              print(json.dumps({"subId":sid,"fields":scalar,"guideHint":c.get("guideHint",c.get("BIHKOLLEDPE"))},ensure_ascii=False))

          # Resolve the remaining fixed-core uint32 against every scalar
          # same-version control field using the simple transforms seen
          # throughout this reader (xor or modular add/sub).
          candidate_row_fields = (
              "PCOMHEOJPOO","NFGFDHPPBIF","IHOOIFBLPJK","KBDPGMJFJGO",
              "FKKAEBOAMCN","IILNPFILEGJ","NBOJMAHCCGM",
              "KGNKIMLCNMC","MIABAAMCOFK","BMBJLJFPAIM",
              "HEMLAEELDFC","HJOFKFKBFCF","FJDKHGMJOPL",
              "PHDIEJAPFJO","MDLABCMFLMH",
          )
          print("\n=== LAIMPNDEFCL CANDIDATE PRESENCE ===")
          bit40_set = presence_set_native("unknown_bit40_raw")
          print("bit40_subids", sorted(bit40_set))
          for key in candidate_row_fields:
              ks = row_keys.get(key, set())
              print(
                  key,
                  "count", len(ks),
                  "bit40_inter", len(bit40_set & ks),
                  "bit40_native_only", len(bit40_set - ks),
                  "bit40_control_only", len(ks - bit40_set),
              )

          print("\n=== UNKNOWN CORE SIMPLE TRANSFORMS ===")
          for key in candidate_row_fields:
              pairs=[]
              for sid in common:
                  cv=controls[sid].get(key)
                  if isinstance(cv, bool) or not isinstance(cv, int):
                      continue
                  pairs.append((native[sid].unknown_core_u32, cv))
              if not pairs:
                  continue
              xors={a ^ b for a,b in pairs}
              adds={(b-a)&0xffffffff for a,b in pairs}
              subs={(a-b)&0xffffffff for a,b in pairs}
              print(
                  key,
                  "pairs",len(pairs),
                  "xor_constants",len(xors),
                  "xor",hex(next(iter(xors))) if len(xors)==1 else "",
                  "add_constants",len(adds),
                  "add",hex(next(iter(adds))) if len(adds)==1 else "",
                  "sub_constants",len(subs),
                  "sub",hex(next(iter(subs))) if len(subs)==1 else "",
              )

          print("\n=== BIT40 ROW CONTROLS ===")
          for sid in sorted(bit40_set):
              c=controls[sid]
              print(json.dumps({
                  "subId":sid,
                  "mainId":c.get("mainId"),
                  "order":c.get("order"),
                  "row_fields":{k:c.get(k) for k in candidate_row_fields if k in c},
                  "guideHint":c.get("guideHint"),
              },ensure_ascii=False))

          # Dimbreath's same-version BinOutput retains many obfuscated runtime
          # fields that the normalized Asta snapshot omits. Use it only as a
          # same-version control for field identity/value correlation.
          raw_controls={}
          for path in sorted(Path("/tmp/agd-71/BinOutput/Quest").glob("*.json")):
              try:
                  root=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(root,dict):
                  continue
              rows=root.get("JIJKODHIEED")
              if not isinstance(rows,list):
                  rows=root.get("subQuests",[])
              for row in rows:
                  if not isinstance(row,dict):
                      continue
                  sid=row.get("NFGFDHPPBIF")
                  if not isinstance(sid,int):
                      sid=row.get("subId")
                  if isinstance(sid,int):
                      raw_controls[sid]=row

          raw_common=sorted(set(native)&set(raw_controls))
          print("\n=== RAW 7.1 CONTROL SUMMARY ===")
          print("raw_control_rows",len(raw_controls),"intersection",len(raw_common))

          raw_key_sets=defaultdict(set)
          for sid in raw_common:
              for key in raw_controls[sid]:
                  raw_key_sets[key].add(sid)

          print("\n=== BIT40 RAW 7.1 PRESENCE ===")
          raw_scores=[]
          for key,ks in raw_key_sets.items():
              inter=len(bit40_set&ks); union=len(bit40_set|ks)
              raw_scores.append((
                  1 if bit40_set==ks else 0,
                  inter/union if union else 1.0,
                  inter,len(ks),key,
                  len(bit40_set-ks),len(ks-bit40_set),
              ))
          raw_scores.sort(reverse=True)
          for exact,jacc,inter,nk,key,miss,extra in raw_scores[:40]:
              print(
                  key,"exact",exact,f"jacc={jacc:.6f}",
                  "inter",inter,"control",nk,
                  "native_only",miss,"control_only",extra
              )

          print("\n=== FIXED CORE VS RAW 7.1 UINT32 ===")
          raw_numeric_keys=sorted({
              key
              for sid in raw_common
              for key,val in raw_controls[sid].items()
              if isinstance(val,int) and not isinstance(val,bool)
          })
          for key in raw_numeric_keys:
              pairs=[
                  (native[sid].unknown_core_u32,raw_controls[sid][key])
                  for sid in raw_common
                  if isinstance(raw_controls[sid].get(key),int)
                  and not isinstance(raw_controls[sid].get(key),bool)
              ]
              if len(pairs)<10:
                  continue
              xors={a^b for a,b in pairs}
              adds={(b-a)&0xffffffff for a,b in pairs}
              subs={(a-b)&0xffffffff for a,b in pairs}
              if len(xors)==1 or len(adds)==1 or len(subs)==1:
                  print(
                      key,"pairs",len(pairs),
                      "xor",hex(next(iter(xors))) if len(xors)==1 else "",
                      "add",hex(next(iter(adds))) if len(adds)==1 else "",
                      "sub",hex(next(iter(subs))) if len(subs)==1 else "",
                  )

          # Also test obvious canonical identities that normalized controls know.
          for key,getter in (
              ("subId",lambda sid: sid),
              ("mainId",lambda sid: controls[sid].get("mainId")),
              ("order",lambda sid: controls[sid].get("order")),
              ("descTextMapHash",lambda sid: controls[sid].get("descTextMapHash")),
          ):
              pairs=[]
              for sid in common:
                  v=getter(sid)
                  if isinstance(v,int) and not isinstance(v,bool):
                      pairs.append((native[sid].unknown_core_u32,v))
              xors={a^b for a,b in pairs}
              adds={(b-a)&0xffffffff for a,b in pairs}
              subs={(a-b)&0xffffffff for a,b in pairs}
              print(
                  "CANON",key,"pairs",len(pairs),
                  "xor_constants",len(xors),
                  "xor",hex(next(iter(xors))) if len(xors)==1 else "",
                  "add_constants",len(adds),
                  "add",hex(next(iter(adds))) if len(adds)==1 else "",
                  "sub_constants",len(subs),
                  "sub",hex(next(iter(subs))) if len(subs)==1 else "",
              )

          print("\n=== BIT40 RAW 7.1 ROWS ===")
          for sid in sorted(bit40_set):
              print(json.dumps({
                  "subId":sid,
                  "raw":raw_controls.get(sid),
              },ensure_ascii=False))

          # Show selected high-information rows.
          selected = [7713702,7713704,7713705,7713706,1001307]
          print("\n=== SELECTED ROWS ===")
          for sid in selected:
              r = native.get(sid)
              c = controls.get(sid)
              if r is None:
                  print(sid, "native-missing")
                  continue
              print(json.dumps({
                  "subId": sid,
                  "mask64": f"0x{r.mask64:016X}",
                  "unknown_core_u32": r.unknown_core_u32,
                  "unknown_bit34_raw": r.unknown_bit34_raw,
                  "unknown_bit40_raw": r.unknown_bit40_raw,
                  "guide": {
                      "mask_raw": f"0x{r.guide.mask_raw:08X}",
                      "unknown_string_10": r.guide.unknown_string_10,
                      "unknown_string_20": r.guide.unknown_string_20,
                      "unknown_scalar_2c": r.guide.unknown_scalar_2c,
                      "unknown_scalar_40": r.guide.unknown_scalar_40,
                      "unknown_scalar_44": r.guide.unknown_scalar_44,
                      "unknown_scalar_5c": r.guide.unknown_scalar_5c,
                      "params": r.guide.params,
                      "guide_scene": r.guide.guide_scene,
                      "poi_point_id": r.guide.poi_point_id,
                      "poi_region_id": r.guide.poi_region_id,
                  },
                  "control_row_unknowns": {
                      k:v for k,v in (c or {}).items()
                      if k not in {
                          "subId","mainId","order","descTextMapHash","stepDescTextMapHash",
                          "guide","finishCond","failCond","finishExec","failExec","npcId",
                          "exclusivePlaceList","isMpBlock","isRewind","finishParent","showType",
                      }
                  },
                  "control_guide": (c or {}).get("guide"),
              }, ensure_ascii=False, default=list))

          report = {
              "native_rows": len(native),
              "control_rows": len(controls),
              "intersection": len(common),
          }
          Path("questexcel71-semantic-correlation.json").write_text(
              json.dumps(report, indent=2)+"\n", encoding="utf-8"
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: questexcel71-semantic-correlation
          path: |
            questexcel71-semantic-correlation.txt
            questexcel71-semantic-correlation.json
          if-no-files-found: error