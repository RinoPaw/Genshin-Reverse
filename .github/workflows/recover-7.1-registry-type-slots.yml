name: Recover 7.1 registry type slots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-7.1-registry-type-slots.yml'
      - 'scripts/fetch-7.1-samples.sh'
      - 'genshinre/nativeprofile.py'
      - 'genshinre/registryslots.py'

concurrency:
  group: recover-7.1-registry-type-slots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Recover exact indexed registry type slots
        run: |
          OUT=versions/7.1.0-global/windows-x64/registry
          python -m genshinre.registryslots \
            /tmp/gi71/GenshinImpact.exe \
            "$OUT/registry-type-slots.csv" \
            --summary "$OUT/registry-type-slots.summary.json"
          cat "$OUT/registry-type-slots.summary.json"

      - name: Commit recovered registry type slots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/registry-type-slots.csv \
                  versions/7.1.0-global/windows-x64/registry/registry-type-slots.summary.json
          if git diff --cached --quiet; then
            echo 'No registry type-slot changes.'
            exit 0
          fi
          git commit -m 'data: refresh 7.1 registry type slots'
          git pull --rebase origin main
          git push origin HEAD:main
