name: Trace scene delegate slot xrefs

on:
  push:
    paths:
      - '.github/workflows/trace-scene-delegate-slot-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact 7.0 and 7.1 samples plus 7.0 dump
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/3XnPviMfoILi/manifest_2efe39d995f47170_29ad2bc6e42fe4af2086ae58c7e81b33' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/3XnPviMfoILi' \
            --output /tmp/gi70 \
            --expected-exe-sha256 'a1a23cb76d941df28c5156ca3152fa49421ec98842221b7d71633d42ee76ca45' \
            --expected-metadata-sha256 'd361ff11f6ca123f4126004db13cdf1956e00d95231f84c1e5437f560e79128b'
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'
          curl --fail --location \
            'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' \
            -o /tmp/data.7z
          mkdir -p /tmp/data
          7z x -y /tmp/data.7z -o/tmp/data >/dev/null
          test -f /tmp/data/data/dump.json

      - name: Trace exact delegate-slot reads and writes
        run: |
          python - <<'PY' > /tmp/scene-delegate-slot-xrefs.json
          import bisect
          import csv
          import json
          import re
          import sqlite3
          import struct
          from collections import Counter
          from pathlib import Path

          from capstone import CS_AC_READ, CS_AC_WRITE, CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP
          from genshinre.pe import PEImage

          OLD_OWNER = 'KGCKOFPFBLA'
          NEW_OWNER = 'KLLNGCPBLMM'
          OLD_SLOTS = {
              0x36E6E8: 'unlock_sender',
              0x36E970: 'unlock_rsp',
              0x36EC58: 'get_scene_area_rsp_control',
          }
          NEW_SLOTS = {
              0x4B2A70: 'unlock_sender',
              0x4B2A90: 'rsp_36641',
              0x4B2AB0: 'rsp_20290',
              0x4B2AC0: 'get_scene_area_rsp_control',
          }

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def access_name(op, insn, operand_index):
              flags = []
              if op.access & CS_AC_READ:
                  flags.append('read')
              if op.access & CS_AC_WRITE:
                  flags.append('write')
              if flags:
                  return '+'.join(flags)
              if insn.mnemonic == 'lea':
                  return 'address'
              if operand_index == 0 and insn.mnemonic in {'mov','movq','movdqu','movups','xchg','cmpxchg','inc','dec','add','sub','and','or','xor'}:
                  return 'write-or-rmw'
              return 'unknown'

          def matching_operands(insn, slot):
              rows = []
              for operand_index, op in enumerate(insn.operands):
                  if op.type != X86_OP_MEM or op.mem.base == X86_REG_RIP:
                      continue
                  if int(op.mem.disp) == slot:
                      rows.append((operand_index, access_name(op, insn, operand_index)))
              return rows

          def raw_occurrences(image, slots):
              out = []
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob = image.read_rva(sec.virtual_address, sec.raw_size)
                  for slot, label in slots.items():
                      needle = struct.pack('<I', slot)
                      pos = blob.find(needle)
                      while pos >= 0:
                          out.append({
                              'slot': slot,
                              'slot_label': label,
                              'byte_rva': sec.virtual_address + pos,
                              'section': sec.name,
                          })
                          pos = blob.find(needle, pos + 1)
              out.sort(key=lambda row: (row['byte_rva'], row['slot']))
              return out

          # Parse only the historical scene owner. Its known sender/response/control methods
          # provide method-boundary controls; global 7.0 references can still be locally decoded.
          rva_re = re.compile(r'"rva":(\d+)')
          old_owner = None
          old_all_rvas = set()
          with Path('/tmp/data/data/dump.json').open(encoding='utf-8', errors='replace') as f:
              for line in f:
                  if '"rva":' in line:
                      old_all_rvas.update(int(x) for x in rva_re.findall(line) if int(x) > 0)
                  if old_owner is None and f'"name":"{OLD_OWNER}"' in line:
                      obj, _ = json.JSONDecoder().raw_decode(line.strip())
                      if obj.get('name') == OLD_OWNER:
                          old_owner = obj
          if old_owner is None:
              raise RuntimeError('historical scene owner missing')
          old_all_rvas = sorted(old_all_rvas)
          old_methods = []
          for position, method in enumerate(old_owner.get('methods', [])):
              start = int(method.get('rva') or 0)
              if start <= 0:
                  continue
              i = bisect.bisect_right(old_all_rvas, start)
              if i >= len(old_all_rvas):
                  continue
              old_methods.append({
                  'start': start,
                  'end': old_all_rvas[i],
                  'type_name': OLD_OWNER,
                  'method_name': method.get('name'),
                  'method_index': method.get('idx'),
                  'owner_position': position,
                  'parameter_types': [p.get('type') for p in (method.get('params') or [])],
              })
          old_methods.sort(key=lambda row: row['start'])
          old_starts = [row['start'] for row in old_methods]

          def old_method_for(rva):
              i = bisect.bisect_right(old_starts, rva) - 1
              if i < 0:
                  return None
              row = old_methods[i]
              return row if rva < row['end'] else None

          # Disk-backed RVA index avoids holding 733k decoded 7.1 method rows in memory.
          db = sqlite3.connect('/tmp/methods.sqlite')
          db.execute('CREATE TABLE methods (rva INTEGER, type_name TEXT, method_name TEXT, method_index INTEGER, type_definition_index INTEGER, parameter_types TEXT)')
          batch = []
          with open('versions/7.1.0-global/windows-x64/metadata/methods.csv', encoding='utf-8', newline='') as f:
              for row in csv.DictReader(f):
                  rva = int(row['rva'], 0) if row.get('rva') else 0
                  if rva <= 0:
                      continue
                  batch.append((rva, row.get('type_name',''), row.get('method_name',''), int(row['method_index']), int(row['type_definition_index']), row.get('parameter_types','[]')))
                  if len(batch) >= 10000:
                      db.executemany('INSERT INTO methods VALUES (?,?,?,?,?,?)', batch)
                      batch.clear()
          if batch:
              db.executemany('INSERT INTO methods VALUES (?,?,?,?,?,?)', batch)
          db.execute('CREATE INDEX methods_rva ON methods(rva)')
          db.commit()

          def new_method_for(rva):
              lower = db.execute('SELECT rva FROM methods WHERE rva<=? ORDER BY rva DESC LIMIT 1', (rva,)).fetchone()
              if lower is None:
                  return None
              start = int(lower[0])
              upper = db.execute('SELECT rva FROM methods WHERE rva>? ORDER BY rva ASC LIMIT 1', (start,)).fetchone()
              end = int(upper[0]) if upper else start + 0x1000
              if not (start <= rva < end):
                  return None
              aliases = []
              for row in db.execute('SELECT type_name,method_name,method_index,type_definition_index,parameter_types FROM methods WHERE rva=?', (start,)):
                  try:
                      params = json.loads(row[4] or '[]')
                  except Exception:
                      params = []
                  aliases.append({
                      'type_name': row[0],
                      'method_name': row[1],
                      'method_index': row[2],
                      'type_definition_index': row[3],
                      'parameter_types': params,
                  })
              return {'start': start, 'end': end, 'aliases': aliases}

          def insn_json(image, insn):
              return {
                  'rva': f'0x{insn.address-image.image_base:X}',
                  'mnemonic': insn.mnemonic,
                  'op_str': insn.op_str,
                  'bytes': insn.bytes.hex(),
              }

          def decode_from_method(image, occurrence, method):
              start, end = method['start'], method['end']
              size = end - start
              if size <= 0 or size > 0x20000:
                  return []
              blob = image.read_rva(start, size)
              rows = list(md.disasm(blob, image.image_base + start))
              target = occurrence['byte_rva']
              hits = []
              for i, insn in enumerate(rows):
                  irva = insn.address - image.image_base
                  if not (irva <= target and target + 4 <= irva + insn.size):
                      continue
                  for operand_index, access in matching_operands(insn, occurrence['slot']):
                      hits.append({
                          'instruction': insn_json(image, insn),
                          'operand_index': operand_index,
                          'access': access,
                          'context': [insn_json(image, x) for x in rows[max(0,i-6):i+7]],
                      })
              return hits

          def decode_local(image, occurrence):
              target = occurrence['byte_rva']
              out = []
              seen = set()
              for start in range(max(0, target-14), target+1):
                  blob = image.read_rva(start, 24)
                  rows = list(md.disasm(blob, image.image_base + start, count=1))
                  if not rows:
                      continue
                  insn = rows[0]
                  irva = insn.address - image.image_base
                  if not (irva <= target and target + 4 <= irva + insn.size):
                      continue
                  for operand_index, access in matching_operands(insn, occurrence['slot']):
                      key = (irva, insn.bytes, operand_index)
                      if key in seen:
                          continue
                      seen.add(key)
                      out.append({
                          'instruction': insn_json(image, insn),
                          'operand_index': operand_index,
                          'access': access,
                      })
              return out

          def resolve(exe_path, slots, version):
              resolved = []
              with PEImage(Path(exe_path)) as image:
                  occurrences = raw_occurrences(image, slots)
                  for occ in occurrences:
                      method = old_method_for(occ['byte_rva']) if version == '7.0' else new_method_for(occ['byte_rva'])
                      decoded = decode_from_method(image, occ, method) if method else []
                      confidence = 'method-boundary' if decoded else 'local-byte-window'
                      if not decoded:
                          decoded = decode_local(image, occ)
                      if not decoded:
                          continue
                      for hit in decoded:
                          resolved.append({
                              'slot': f"0x{occ['slot']:X}",
                              'slot_label': occ['slot_label'],
                              'byte_rva': f"0x{occ['byte_rva']:X}",
                              'section': occ['section'],
                              'confidence': confidence,
                              'method': method,
                              **hit,
                          })
              dedup = {}
              for row in resolved:
                  key = (row['slot'], row['instruction']['rva'], row['operand_index'])
                  old = dedup.get(key)
                  if old is None or (old['confidence'] != 'method-boundary' and row['confidence'] == 'method-boundary'):
                      dedup[key] = row
              return sorted(dedup.values(), key=lambda row: (int(row['instruction']['rva'],0), int(row['slot'],0)))

          old_hits = resolve('/tmp/gi70/GenshinImpact.exe', OLD_SLOTS, '7.0')
          new_hits = resolve('/tmp/gi71/GenshinImpact.exe', NEW_SLOTS, '7.1')

          def summarize(hits):
              out = {}
              for row in hits:
                  item = out.setdefault(row['slot_label'], {'total':0,'access':Counter(),'confidence':Counter(),'methods':Counter()})
                  item['total'] += 1
                  item['access'][row['access']] += 1
                  item['confidence'][row['confidence']] += 1
                  method = row.get('method')
                  if not method:
                      key = '<unmapped>'
                  elif 'aliases' in method:
                      key = ' | '.join(f"{a['type_name']}.{a['method_name']}" for a in method['aliases'][:6]) + f"@0x{method['start']:X}"
                  else:
                      key = f"{method['type_name']}.{method['method_name']}@0x{method['start']:X}"
                  item['methods'][key] += 1
              for item in out.values():
                  for key in ('access','confidence','methods'):
                      item[key] = dict(item[key])
              return out

          current_fields = []
          with open('versions/7.1.0-global/windows-x64/metadata/fields.csv', encoding='utf-8', newline='') as f:
              for row in csv.DictReader(f):
                  if row.get('type_name') == NEW_OWNER:
                      current_fields.append(row)

          print(json.dumps({
              'old_owner': OLD_OWNER,
              'new_owner': NEW_OWNER,
              'old_slots': {f'0x{k:X}':v for k,v in OLD_SLOTS.items()},
              'new_slots': {f'0x{k:X}':v for k,v in NEW_SLOTS.items()},
              'old_summary': summarize(old_hits),
              'new_summary': summarize(new_hits),
              'old_hits': old_hits,
              'new_hits': new_hits,
              'new_owner_fields': current_fields,
              'notes': [
                  'Executable sections are searched for exact little-endian disp32 bytes, then only validated x86 instructions with a matching non-RIP memory displacement are retained.',
                  'Method-boundary decoding is authoritative when metadata ownership is known; local-byte-window hits are retained separately and must not alone establish identity.',
                  '7.1 method lookup is disk-backed so the full 733k-row method index does not need to reside in memory.',
                  'Sender and GetSceneAreaRsp slots are controls. Address proximity alone is not identity evidence.',
              ],
          }, indent=2))
          PY

          python - <<'PY'
          import json
          d=json.load(open('/tmp/scene-delegate-slot-xrefs.json'))
          print('OLD',json.dumps(d['old_summary'],indent=2))
          print('NEW',json.dumps(d['new_summary'],indent=2))
          for key in ('old_hits','new_hits'):
              for h in d[key]:
                  if h['access'] in ('write','read+write','write-or-rmw','address'):
                      print(key,h['slot_label'],h['access'],h['instruction']['rva'],h['instruction']['op_str'],h.get('method'))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-delegate-slot-xrefs
          path: /tmp/scene-delegate-slot-xrefs.json
          if-no-files-found: error
