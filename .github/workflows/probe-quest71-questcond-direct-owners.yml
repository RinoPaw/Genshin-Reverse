name: Probe Quest 7.1 direct QuestCond owners

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-questcond-direct-owners.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan direct QuestCond and condition-record fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-questcond-direct-owners.txt
          import csv,json
          from pathlib import Path
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv"); fields=rows("fields.csv")
          tb={int(t["type_definition_index"]):t for t in types}

          cond_names=set()
          for f in fields:
              if (f.get("field_type") or "")=="QuestCondType":
                  name=(tb.get(int(f["type_definition_index"])) or {}).get("type_name") or ""
                  if name and name!="QuestCondType":
                      cond_names.add(name)

          direct=[]
          for f in fields:
              ft=f.get("field_type") or ""
              if ft not in cond_names:
                  continue
              direct.append({
                  "owner":tb.get(int(f["type_definition_index"]),{}),
                  "field":f,
              })
          print("COND_RECORD_NAMES",sorted(cond_names))
          print("DIRECT_COND_FIELDS",len(direct))
          print(json.dumps(direct,ensure_ascii=False,indent=2))

          quest_direct=[
              x for x in direct
              if x["owner"].get("type_name") in {"LAIMPNDEFCL","AFIOOHMJHDM","RandomQuestExcelConfig"}
          ]
          print("QUEST_OWNER_DIRECT_COND_FIELDS",len(quest_direct))
          print(json.dumps(quest_direct,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-questcond-direct-owners
          path: quest71-questcond-direct-owners.txt
          if-no-files-found: error
