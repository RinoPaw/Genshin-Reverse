name: Probe original 7.1 GadgetInteract first row native branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-gadget-interact-first-row.yml']

permissions:
  contents: read

concurrency:
  group: research-71-gadget-interact-row-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e . zstandard capstone
      - name: Acquire original official Sophon asset
        run: |
          python scripts/fetch-7.1-design-blocks.py --output work/blocks
          curl --fail --location --retry 3 \
            https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz \
            --output work/animestudio.tar.gz
          python scripts/collect-7.1-native-chest-assets.py \
            --blocks work/blocks --cli-archive work/animestudio.tar.gz \
            --work work/export --report work/source-verification.json
      - name: Test exact-source GadgetInteract first byte and native branch
        run: |
          python scripts/probe-7.1-gadget-interact-first-row.py \
            --raw work/export/export-25539185/MiHoYoBinData/c71a7ea9.dat \
            --output work/gadget-interact-71-first-native-branch.json
      - name: Inspect candidate direct nested reader disassembly
        run: |
          python scripts/fetch-7.1-samples.sh --help >/dev/null 2>&1 || true
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
          EXPECTED_SHA=$(python -c "from genshinre.nativeprofile import PROFILE_71;print(PROFILE_71.exe_sha256)")
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe \
            0xFF7AE70 0x300 --expected-sha256 "$EXPECTED_SHA" \
            --output work/gadget-interact-nested-candidate.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("work/gadget-interact-nested-candidate.json").read_text())
          print("NESTED_METHOD_ORIGINAL_RVA",d["start_rva"])
          for x in d["instructions"][:85]:
              print(x["rva"],x["mnemonic"],x["op_str"])
              if x["mnemonic"]=="ret":break
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-gadget-interact-native-first-row
          path: |
            work/gadget-interact-71-first-native-branch.json
            work/gadget-interact-nested-candidate.json
          retention-days: 7
          if-no-files-found: error
