name: Research Quest 351 native edges

on:
  push:
    branches:
      - research/quest351-return
    paths:
      - '.github/workflows/research-quest351-native.yml'
      - 'tools/trace_native_call_edges.py'
      - 'tools/resolve_7_1_field_offsets.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused research dependencies
        run: python -m pip install -e . capstone zstandard

      - name: Fetch pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Resolve local-state and return-button field offsets
        run: |
          python tools/resolve_7_1_field_offsets.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/types.csv \
            versions/7.1.0-global/windows-x64/metadata/fields.csv \
            quest351-field-offsets.json \
            --field UserLocalDataItem.trackingMainQuestIDList \
            --field MonoInLevelMainPage.OCGBIKAEGJI

      - name: Trace current local-state/UI native edges
        run: |
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest351-native-edges.json \
            --focus refresh_ui_setting:0x121DC4A0 \
            --focus userlocal_consumer:0x7C32E00 \
            --focus userlocal_wrapper:0xD7FD100

      - name: Preserve focused reports
        uses: actions/upload-artifact@v7
        with:
          name: quest351-native-edges
          path: |
            quest351-field-offsets.json
            quest351-native-edges.json
          if-no-files-found: error
          retention-days: 7
