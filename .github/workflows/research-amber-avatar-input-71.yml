name: Research 7.1 Amber Avatar Input Gates
on:
  push:
    branches:
      - research/amber-2178-quest-notify-20261010
    paths:
      - '.github/workflows/research-amber-avatar-input-71.yml'
  workflow_dispatch:

concurrency:
  group: amber-avatar-input-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  avatar-input-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Fetch exact Global 7.1 sample and validate identity
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Disassemble avatar-input and guide entry paths
        run: |
          mkdir -p research-output
          python - <<'PY'
          import json
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from genshinre.pe import PEImage
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.sampleidentity import require_profile_exe
          exe=Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_profile_exe(exe, PROFILE_71)
          targets={
              "global_stop_local_avatar": (0xFE296E0, 0x260),
              "base_actor_enable_player_input": (0x13AF5060, 0x280),
              "actor_utils_enable_player_input": (0x13A9BAE0, 0x280),
              "actor_utils_enable_by_quest": (0x13A9B510, 0x280),
              "actor_utils_set_ui_lock_state": (0x13AA0120, 0x200),
              "actor_utils_set_quest_dialog_enable": (0x13ABEED0, 0x200),
              "global_start_guide": (0xFE284A0, 0x90),
          }
          out={"sample_sha256":PROFILE_71.exe_sha256,"methods":{}}
          md=Cs(CS_ARCH_X86, CS_MODE_64)
          with PEImage(exe) as image:
              for name,(rva,size) in targets.items():
                  data=image.read_rva(rva,size)
                  rows=[]
                  for insn in md.disasm(data,image.image_base+rva):
                      o=insn.address-image.image_base
                      rows.append({"rva":f"0x{o:X}","mnemonic":insn.mnemonic,"operands":insn.op_str})
                      # Avoid printing beyond return where possible, but capture all
                      # bytes for independent review.
                  out["methods"][name]={"rva":f"0x{rva:X}","instructions":rows}
                  print("==",name,f"0x{rva:X}","==")
                  for x in rows[:90]:
                      print(x["rva"],x["mnemonic"],x["operands"])
          Path("research-output/amber-avatar-input-disasm.json").write_text(json.dumps(out,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Preserve exact-client disassembly
        uses: actions/upload-artifact@v7
        with:
          name: amber-avatar-input-native-71
          path: research-output/amber-avatar-input-disasm.json
          if-no-files-found: error
          retention-days: 7
