name: Trace 7.1 protocol dispatch root

on:
  push:
    paths:
      - '.github/workflows/trace-7.1-protocol-dispatch-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Check canonical type-cache anchors
        run: |
          python - <<'PY' > /tmp/dispatch-root-type-cache.json
          import csv, json
          target=0x57831E8
          rows=[]
          with open('versions/7.1.0-global/windows-x64/metadata/types.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  raw=(row.get('type_cache_rva') or '').strip()
                  if not raw: continue
                  try:rva=int(raw,0)
                  except ValueError:continue
                  if abs(rva-target)<=0x200:
                      rows.append({**row,'distance':rva-target})
          print(json.dumps({'target':f'0x{target:X}','nearby_type_cache_rows':rows},indent=2))
          PY
          cat /tmp/dispatch-root-type-cache.json

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Trace table and slot-domain displacement candidates
        run: |
          python - <<'PY' > /tmp/protocol-dispatch-root-71.json
          import json, struct
          from collections import Counter
          from pathlib import Path
          from capstone import CS_AC_READ, CS_AC_WRITE, CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP
          from genshinre.pe import PEImage

          ROOT_RVA=0x57831E8
          TABLE_DISP=0x24F40
          SLOT_MIN=0x4B0000
          SLOT_MAX=0x4B8000
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True

          def access_name(op,insn,operand_index):
              out=[]
              if op.access & CS_AC_READ: out.append('read')
              if op.access & CS_AC_WRITE: out.append('write')
              if out:return '+'.join(out)
              if insn.mnemonic=='lea':return 'address'
              if operand_index==0 and insn.mnemonic in {'mov','xchg','cmpxchg','inc','dec','add','sub','and','or','xor'}:
                  return 'write-or-rmw'
              return 'unknown'

          def decode_occurrence(image,byte_rva,expected_disp):
              out=[]; seen=set()
              for start in range(max(0,byte_rva-14),byte_rva+1):
                  blob=image.read_rva(start,24)
                  rows=list(md.disasm(blob,image.image_base+start,count=1))
                  if not rows:continue
                  insn=rows[0]
                  irva=insn.address-image.image_base
                  if not (irva<=byte_rva and byte_rva+4<=irva+insn.size):continue
                  for oi,op in enumerate(insn.operands):
                      if op.type!=X86_OP_MEM or op.mem.base==X86_REG_RIP:continue
                      if int(op.mem.disp)!=expected_disp:continue
                      key=(irva,bytes(insn.bytes),oi)
                      if key in seen:continue
                      seen.add(key)
                      out.append({
                          'rva':f'0x{irva:X}',
                          'byte_rva':f'0x{byte_rva:X}',
                          'disp':f'0x{expected_disp:X}',
                          'mnemonic':insn.mnemonic,
                          'op_str':insn.op_str,
                          'bytes':bytes(insn.bytes).hex(),
                          'operand_index':oi,
                          'access':access_name(op,insn,oi),
                          'base_reg':insn.reg_name(op.mem.base),
                          'index_reg':insn.reg_name(op.mem.index),
                          'scale':op.mem.scale,
                      })
              return out

          table_hits=[]; slot_hits=[]
          with PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as image:
              root_bytes=image.read_rva(ROOT_RVA,0x40).hex()
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)

                  needle=struct.pack('<I',TABLE_DISP)
                  pos=blob.find(needle)
                  while pos>=0:
                      table_hits.extend(decode_occurrence(image,sec.virtual_address+pos,TABLE_DISP))
                      pos=blob.find(needle,pos+1)

                  pos=blob.find(b'\x4b\x00',2)
                  while pos>=0:
                      start=pos-2
                      low=blob[start] | (blob[start+1]<<8)
                      if low<0x8000:
                          disp=0x4B0000+low
                          for hit in decode_occurrence(image,sec.virtual_address+start,disp):
                              if hit['access'] in {'write','read+write','write-or-rmw','address'}:
                                  slot_hits.append(hit)
                      pos=blob.find(b'\x4b\x00',pos+1)

          def dedup(rows):
              d={}
              for x in rows:d[(x['rva'],x['disp'],x['operand_index'])]=x
              return sorted(d.values(),key=lambda x:(int(x['rva'],0),int(x['disp'],0)))
          table_hits=dedup(table_hits); slot_hits=dedup(slot_hits)

          print(json.dumps({
              'root_rva':f'0x{ROOT_RVA:X}',
              'root_file_bytes':root_bytes,
              'table_disp':f'0x{TABLE_DISP:X}',
              'slot_domain':[f'0x{SLOT_MIN:X}',f'0x{SLOT_MAX:X}'],
              'table_summary':{'count':len(table_hits),'access':dict(Counter(x['access'] for x in table_hits))},
              'slot_write_summary':{'count':len(slot_hits),'access':dict(Counter(x['access'] for x in slot_hits))},
              'table_refs':table_hits,
              'slot_writes':slot_hits,
              'notes':[
                  'Raw executable bytes first locate exact disp32 candidates; local x86 decoding then validates the containing instruction and operand.',
                  'This avoids full-section linear disassembly and remains valid across interleaved data/alignment bytes.',
                  'slot_writes includes write/RMW/address-taking operands in 0x4B0000..0x4B7fff; read-only handler dispatches are intentionally excluded.',
              ],
          },indent=2))
          PY
          python - <<'PY'
          import json
          d=json.load(open('/tmp/protocol-dispatch-root-71.json'))
          print('table',json.dumps(d['table_summary'],indent=2))
          print('slot writes',json.dumps(d['slot_write_summary'],indent=2))
          for key in ('table_refs','slot_writes'):
              print('\n'+key)
              for x in d[key][:160]:
                  print(x['rva'],x['access'],x['disp'],x['mnemonic'],x['op_str'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-dispatch-root-71
          path: |
            /tmp/dispatch-root-type-cache.json
            /tmp/protocol-dispatch-root-71.json
          if-no-files-found: error
