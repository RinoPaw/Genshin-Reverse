name: Trace 7.1 protocol dispatch root

on:
  push:
    paths:
      - '.github/workflows/trace-7.1-protocol-dispatch-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Check canonical type-cache anchors
        run: |
          python - <<'PY' > /tmp/dispatch-root-type-cache.json
          import csv, json
          target=0x57831E8
          rows=[]
          with open('versions/7.1.0-global/windows-x64/metadata/types.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  raw=(row.get('type_cache_rva') or '').strip()
                  if not raw:
                      continue
                  try:rva=int(raw,0)
                  except ValueError:continue
                  if abs(rva-target)<=0x200:
                      rows.append({**row,'distance':rva-target})
          print(json.dumps({'target':f'0x{target:X}','nearby_type_cache_rows':rows},indent=2))
          PY
          cat /tmp/dispatch-root-type-cache.json

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Trace root, table, and slot-domain references
        run: |
          python - <<'PY' > /tmp/protocol-dispatch-root-71.json
          import csv, json, sqlite3
          from collections import Counter
          from pathlib import Path
          from capstone import CS_AC_READ, CS_AC_WRITE, CS_ARCH_X86, CS_MODE_64, Cs
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP
          from genshinre.pe import PEImage

          ROOT_RVA=0x57831E8
          TABLE_DISP=0x24F40
          SLOT_MIN=0x4B0000
          SLOT_MAX=0x4B8000

          db=sqlite3.connect('/tmp/methods.sqlite')
          db.execute('CREATE TABLE methods (rva INTEGER, type_name TEXT, method_name TEXT, method_index INTEGER, type_definition_index INTEGER, parameter_types TEXT)')
          batch=[]
          with open('versions/7.1.0-global/windows-x64/metadata/methods.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  raw=row.get('rva') or ''
                  if not raw: continue
                  rva=int(raw,0)
                  if rva<=0: continue
                  batch.append((rva,row.get('type_name',''),row.get('method_name',''),int(row['method_index']),int(row['type_definition_index']),row.get('parameter_types','[]')))
                  if len(batch)>=10000:
                      db.executemany('INSERT INTO methods VALUES (?,?,?,?,?,?)',batch); batch.clear()
          if batch: db.executemany('INSERT INTO methods VALUES (?,?,?,?,?,?)',batch)
          db.execute('CREATE INDEX methods_rva ON methods(rva)'); db.commit()

          def method_for(rva):
              lo=db.execute('SELECT rva FROM methods WHERE rva<=? ORDER BY rva DESC LIMIT 1',(rva,)).fetchone()
              if lo is None:return None
              start=int(lo[0])
              hi=db.execute('SELECT rva FROM methods WHERE rva>? ORDER BY rva ASC LIMIT 1',(start,)).fetchone()
              end=int(hi[0]) if hi else start+0x1000
              if not start<=rva<end:return None
              aliases=[]
              for row in db.execute('SELECT type_name,method_name,method_index,type_definition_index,parameter_types FROM methods WHERE rva=?',(start,)):
                  try:params=json.loads(row[4] or '[]')
                  except Exception:params=[]
                  aliases.append({'type_name':row[0],'method_name':row[1],'method_index':row[2],'type_definition_index':row[3],'parameter_types':params})
              return {'start':f'0x{start:X}','end':f'0x{end:X}','aliases':aliases}

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True; md.skipdata=True
          root_refs=[]; table_refs=[]; slot_writes=[]

          def acc(op):
              out=[]
              if op.access & CS_AC_READ:out.append('read')
              if op.access & CS_AC_WRITE:out.append('write')
              return '+'.join(out) if out else 'unknown'

          with PEImage(Path('/tmp/gi71/GenshinImpact.exe')) as image:
              root_bytes=image.read_rva(ROOT_RVA,0x40).hex()
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  for insn in md.disasm(blob,image.image_base+sec.virtual_address):
                      if insn.id==0: continue
                      rva=insn.address-image.image_base
                      for oi,op in enumerate(insn.operands):
                          if op.type!=X86_OP_MEM: continue
                          access=acc(op)
                          if op.mem.base==X86_REG_RIP:
                              target=insn.address+insn.size+int(op.mem.disp)-image.image_base
                              if target==ROOT_RVA:
                                  root_refs.append({'rva':f'0x{rva:X}','mnemonic':insn.mnemonic,'op_str':insn.op_str,'operand_index':oi,'access':access})
                          else:
                              disp=int(op.mem.disp)
                              if disp==TABLE_DISP:
                                  table_refs.append({'rva':f'0x{rva:X}','mnemonic':insn.mnemonic,'op_str':insn.op_str,'operand_index':oi,'access':access,'base_reg':insn.reg_name(op.mem.base),'index_reg':insn.reg_name(op.mem.index),'scale':op.mem.scale})
                              if SLOT_MIN<=disp<SLOT_MAX and ('write' in access or insn.mnemonic=='lea'):
                                  slot_writes.append({'rva':f'0x{rva:X}','disp':f'0x{disp:X}','mnemonic':insn.mnemonic,'op_str':insn.op_str,'operand_index':oi,'access':access,'base_reg':insn.reg_name(op.mem.base),'index_reg':insn.reg_name(op.mem.index),'scale':op.mem.scale})

              def context(hit_rva):
                  rva=int(hit_rva,0); method=method_for(rva)
                  if not method:return {'method':None,'instructions':[]}
                  start=int(method['start'],0); end=int(method['end'],0)
                  if end-start>0x20000:return {'method':method,'instructions':[]}
                  rows=list(Cs(CS_ARCH_X86,CS_MODE_64).disasm(image.read_rva(start,end-start),image.image_base+start))
                  pos=None
                  for i,x in enumerate(rows):
                      if x.address-image.image_base==rva:pos=i;break
                  if pos is None:return {'method':method,'instructions':[]}
                  return {'method':method,'instructions':[{'rva':f'0x{x.address-image.image_base:X}','mnemonic':x.mnemonic,'op_str':x.op_str,'bytes':x.bytes.hex()} for x in rows[max(0,pos-8):pos+9]]}

              for rows in (root_refs,table_refs,slot_writes):
                  for h in rows:
                      h.update(context(h['rva']))

          def summarize(rows):
              return {
                  'count':len(rows),
                  'access':dict(Counter(r['access'] for r in rows)),
                  'methods':dict(Counter(' | '.join(f"{a['type_name']}.{a['method_name']}" for a in ((r.get('method') or {}).get('aliases') or [])[:4]) or '<unmapped>' for r in rows)),
              }

          print(json.dumps({
              'root_rva':f'0x{ROOT_RVA:X}',
              'table_disp':f'0x{TABLE_DISP:X}',
              'slot_domain':[f'0x{SLOT_MIN:X}',f'0x{SLOT_MAX:X}'],
              'root_file_bytes':root_bytes,
              'root_summary':summarize(root_refs),
              'table_summary':summarize(table_refs),
              'slot_write_summary':summarize(slot_writes),
              'root_refs':root_refs,
              'table_refs':table_refs,
              'slot_writes':slot_writes,
              'notes':[
                  'root_refs are exact RIP-relative references whose effective RVA is 0x57831E8.',
                  'table_refs are exact non-RIP memory operands using displacement 0x24F40.',
                  'slot_writes retain write/lea references anywhere in the observed 0x4B0000..0x4B7fff dispatch-slot domain; indexed addressing is preserved.',
              ],
          },indent=2))
          PY

          python - <<'PY'
          import json
          d=json.load(open('/tmp/protocol-dispatch-root-71.json'))
          print('root',json.dumps(d['root_summary'],indent=2))
          print('table',json.dumps(d['table_summary'],indent=2))
          print('slot writes',json.dumps(d['slot_write_summary'],indent=2))
          for key in ('root_refs','table_refs','slot_writes'):
              print('\n'+key)
              for x in d[key][:80]:
                  print(x['rva'],x.get('access'),x.get('disp',''),x['mnemonic'],x['op_str'],(x.get('method') or {}).get('aliases',[])[:2])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-dispatch-root-71
          path: |
            /tmp/dispatch-root-type-cache.json
            /tmp/protocol-dispatch-root-71.json
          if-no-files-found: error
