name: One-shot original 7.1 Scene Point factory owner methods

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-point-factory-slot-owner.yml'
      - 'scripts/probe-7.1-point-factory-slot-owner-native-methods.py'

permissions:
  contents: read

jobs:
  original-owner-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native inspection libraries
        run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Inspect source-verified factory slot xref owners
        run: |
          python scripts/probe-7.1-point-factory-slot-owner-native-methods.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-factory-1-14-native-class-slot-xrefs.json \
            --output work/original71-factory-1-14-method-context.json
      - uses: actions/upload-artifact@v7
        with:
          name: original71-factory-1-14-method-context
          path: work/original71-factory-1-14-method-context.json
          retention-days: 7
          if-no-files-found: error
