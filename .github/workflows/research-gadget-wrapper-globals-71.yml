name: Temporary Gadget wrapper global xrefs

on:
  push:
    paths:
      - '.github/workflows/research-gadget-wrapper-globals-71.yml'

permissions:
  contents: read

concurrency:
  group: temporary-gadget-wrapper-globals-71
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bounded reverse dependency
        run: python -m pip install -e . zstandard
      - name: Fetch official exact 7.1 executable
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Trace native wrapper global xrefs
        run: |
          python scripts/probe-7.1-gadget-wrapper-globals.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --output work/gadget-wrapper-globals.json
      - name: Preserve compact evidence, no executable
        uses: actions/upload-artifact@v7
        with:
          name: pinned-7.1-gadget-wrapper-global-xrefs
          path: work/gadget-wrapper-globals.json
          if-no-files-found: error
          retention-days: 2
