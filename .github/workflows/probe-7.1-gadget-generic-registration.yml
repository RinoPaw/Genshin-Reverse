name: Probe original 7.1 generic class registration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-gadget-generic-registration.yml']

permissions:
  contents: read

concurrency:
  group: research-71-generic-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard
      - name: Fetch original exact Global 7.1 client
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Test original metadata-registration generic index chains
        run: |
          python scripts/probe-7.1-gadget-generic-class-registration.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --output work/original-71-generic-class-registration.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-generic-class-registration
          path: work/original-71-generic-class-registration.json
          retention-days: 7
          if-no-files-found: error
