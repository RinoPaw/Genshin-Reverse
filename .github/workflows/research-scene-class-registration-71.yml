name: Temporary original SceneTag class registration 7.1

on:
  push:
    paths:
      - '.github/workflows/research-scene-class-registration-71.yml'

permissions:
  contents: read

concurrency:
  group: research-scene-class-registration-71
  cancel-in-progress: true

jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing reverse toolkit
        run: python -m pip install -e . zstandard
      - name: Fetch SHA-256 pinned original Global 7.1 EXE
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Scan native row class pointer and possible registration holders
        run: |
          python scripts/probe-7.1-scene-class-pointer-registration.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --output work/scene-row-class-pointer-registration.json
      - name: Retain compact source-pinned report only
        uses: actions/upload-artifact@v7
        with:
          name: global-71-scene-class-registration
          path: work/scene-row-class-pointer-registration.json
          if-no-files-found: error
          retention-days: 2
