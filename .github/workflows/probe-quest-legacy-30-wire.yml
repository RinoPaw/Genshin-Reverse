name: Probe 3.0 legacy QuestExcel wire fingerprint

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-30-wire.yml"

concurrency:
  group: probe-quest-legacy-30-wire-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install capstone pefile

      - name: Download and verify exact 3.0.0 UserAssembly
        shell: bash
        run: |
          set -euo pipefail
          base='https://autopatchhk.yuanshen.com/client_app/download/pc_zip/20220815143807_dyIghvy1b5fjfzHU/ScatteredFiles'
          out='inputs/3.0.0-global'
          mkdir -p "$out"

          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 900 \
            "$base/GenshinImpact_Data/Native/UserAssembly.dll" \
            -o "$out/UserAssembly.dll"

          python - <<'PY' | tee quest-legacy-30-wire-sample.txt
          from pathlib import Path
          import hashlib

          p = Path("inputs/3.0.0-global/UserAssembly.dll")
          raw = p.read_bytes()
          got = hashlib.sha256(raw).hexdigest()
          print("UserAssembly.dll", "size=", len(raw), "sha256=", got)
          if len(raw) != 177601560:
              raise SystemExit("unexpected UserAssembly.dll size")
          if got != "b368b8959442f351143d16eb67d514520064897d1eeb37e0d3f544688bd4510b":
              raise SystemExit("unexpected UserAssembly.dll sha256")
          PY

      - name: Recover PE runtime-function bounds around historical QuestExcel anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-wire-functions.txt
          import json
          from pathlib import Path

          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM

          exe = Path("inputs/3.0.0-global/UserAssembly.dll")
          pe = pefile.PE(str(exe), fast_load=False)
          base = pe.OPTIONAL_HEADER.ImageBase
          pe.parse_data_directories(
              directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXCEPTION"]]
          )

          runtime = sorted(
              (int(x.struct.BeginAddress), int(x.struct.EndAddress))
              for x in pe.DIRECTORY_ENTRY_EXCEPTION
              if int(x.struct.EndAddress) > int(x.struct.BeginAddress)
          )

          # These are historical metadata/disassembly anchors from the successful
          # exact-3.0 probe. They are intentionally NOT treated as function entries.
          anchors = {
              "QuestExcelConfigLoader.FromBinary": 0x10FD580,
              "QuestExcelConfig.FromBinary": 0x3AF9E10,
          }

          def containing(rva):
              for a, b in runtime:
                  if a <= rva < b:
                      return a, b
              return None

          def index_of(bounds):
              return runtime.index(bounds)

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True

          def disasm(a, b):
              out = []
              for ins in md.disasm(pe.get_data(a, b - a), base + a):
                  item = {
                      "rva": ins.address - base,
                      "bytes": ins.bytes.hex(),
                      "mnemonic": ins.mnemonic,
                      "op_str": ins.op_str,
                  }
                  if (
                      ins.mnemonic in ("call", "jmp")
                      and ins.operands
                      and ins.operands[0].type == X86_OP_IMM
                  ):
                      item["target_rva"] = ins.operands[0].imm - base
                  mem = []
                  for op in ins.operands:
                      if op.type == X86_OP_MEM:
                          mem.append({
                              "base": ins.reg_name(op.mem.base) if op.mem.base else None,
                              "index": ins.reg_name(op.mem.index) if op.mem.index else None,
                              "scale": op.mem.scale,
                              "disp": op.mem.disp,
                          })
                  if mem:
                      item["mem"] = mem
                  out.append(item)
              return out

          report = {
              "image_base": base,
              "anchors": anchors,
              "runtime_function_count": len(runtime),
              "functions": [],
          }

          for label, anchor in anchors.items():
              hit = containing(anchor)
              if not hit:
                  raise SystemExit(f"{label}: anchor 0x{anchor:X} not covered by .pdata")
              idx = index_of(hit)
              neighborhood = runtime[max(0, idx-2):min(len(runtime), idx+3)]
              print(f"\n=== {label} anchor=0x{anchor:X} ===")
              print("containing", f"0x{hit[0]:X}-0x{hit[1]:X}", "size", hit[1]-hit[0])
              print("neighborhood", " ".join(f"0x{a:X}-0x{b:X}" for a,b in neighborhood))

              for relation, bounds in (
                  ("previous", runtime[idx-1] if idx else None),
                  ("containing", hit),
                  ("next", runtime[idx+1] if idx+1 < len(runtime) else None),
              ):
                  if not bounds:
                      continue
                  a, b = bounds
                  insns = disasm(a, b)
                  report["functions"].append({
                      "label": label,
                      "anchor_rva": anchor,
                      "relation": relation,
                      "begin_rva": a,
                      "end_rva": b,
                      "instructions": insns,
                  })
                  print(f"\n--- {relation} 0x{a:X}-0x{b:X} ({b-a} bytes) ---")
                  for x in insns:
                      target = (
                          f" -> 0x{x['target_rva']:X}" if "target_rva" in x else ""
                      )
                      print(
                          f"0x{x['rva']:X} {x['bytes']:<24} "
                          f"{x['mnemonic']} {x['op_str']}{target}"
                      )

          Path("quest-legacy-30-wire-functions.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Build focused field and call-site fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-wire-fingerprint.txt
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(
              Path("quest-legacy-30-wire-functions.json").read_text(encoding="utf-8")
          )

          interesting_disps = {
              0x10: "subId-layout-offset",
              0x14: "mainId-layout-offset",
              0x18: "order-layout-offset",
              0x38: "acceptCondComb-layout-offset",
              0x40: "acceptCond-layout-offset",
              0x80: "finishExec-layout-offset",
              0x88: "failExec-layout-offset",
              0x90: "beginExec-layout-offset",
          }

          output = []
          for fn in report["functions"]:
              if fn["relation"] != "containing":
                  continue
              insns = fn["instructions"]
              calls = []
              mem_hits = []
              base_regs = Counter()

              for i, ins in enumerate(insns):
                  if ins["mnemonic"] == "call" and "target_rva" in ins:
                      calls.append({
                          "rva": ins["rva"],
                          "target_rva": ins["target_rva"],
                          "context": insns[max(0,i-6):min(len(insns),i+7)],
                      })
                  for mem in ins.get("mem", []):
                      if mem["base"]:
                          base_regs[mem["base"]] += 1
                      if mem["disp"] in interesting_disps:
                          mem_hits.append({
                              "layout_name": interesting_disps[mem["disp"]],
                              "disp": mem["disp"],
                              "base": mem["base"],
                              "index": mem["index"],
                              "rva": ins["rva"],
                              "instruction": ins,
                              "context": insns[max(0,i-8):min(len(insns),i+9)],
                          })

              item = {
                  "label": fn["label"],
                  "begin_rva": fn["begin_rva"],
                  "end_rva": fn["end_rva"],
                  "base_register_frequency": base_regs.most_common(),
                  "calls": calls,
                  "memory_hits": mem_hits,
              }
              output.append(item)

              print(
                  f"\n=== {fn['label']} exact .pdata function "
                  f"0x{fn['begin_rva']:X}-0x{fn['end_rva']:X} ==="
              )
              print("base regs", base_regs.most_common(12))
              print("call targets")
              for c in calls:
                  print(f"  0x{c['rva']:X} -> 0x{c['target_rva']:X}")
              print("interesting displacement refs")
              for h in mem_hits:
                  print(
                      f"  0x{h['rva']:X} {h['layout_name']} "
                      f"base={h['base']} index={h['index']}: "
                      f"{h['instruction']['mnemonic']} {h['instruction']['op_str']}"
                  )

          Path("quest-legacy-30-wire-fingerprint.json").write_text(
              json.dumps(output, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Disassemble direct callees from the exact containing functions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-30-wire-helpers.txt
          import json
          from collections import Counter
          from pathlib import Path

          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64

          pe = pefile.PE("inputs/3.0.0-global/UserAssembly.dll", fast_load=False)
          base = pe.OPTIONAL_HEADER.ImageBase
          pe.parse_data_directories(
              directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXCEPTION"]]
          )
          runtime = sorted(
              (int(x.struct.BeginAddress), int(x.struct.EndAddress))
              for x in pe.DIRECTORY_ENTRY_EXCEPTION
              if int(x.struct.EndAddress) > int(x.struct.BeginAddress)
          )

          def containing(rva):
              for a, b in runtime:
                  if a <= rva < b:
                      return a, b
              return None

          functions = json.loads(
              Path("quest-legacy-30-wire-functions.json").read_text(encoding="utf-8")
          )["functions"]

          freq = Counter()
          sources = {}
          for fn in functions:
              if fn["relation"] != "containing":
                  continue
              for ins in fn["instructions"]:
                  if ins["mnemonic"] != "call" or "target_rva" not in ins:
                      continue
                  t = ins["target_rva"]
                  freq[t] += 1
                  sources.setdefault(t, set()).add(fn["label"])

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          out = []
          for target, count in freq.most_common(100):
              bounds = containing(target)
              if not bounds:
                  continue
              a, b = bounds
              # Keep helper output bounded; primitive readers are normally small.
              cap_end = min(b, a + 0x300)
              insns = [
                  {
                      "rva": ins.address-base,
                      "bytes": ins.bytes.hex(),
                      "mnemonic": ins.mnemonic,
                      "op_str": ins.op_str,
                  }
                  for ins in md.disasm(pe.get_data(a, cap_end-a), base+a)
              ]
              item = {
                  "target_rva": target,
                  "frequency": count,
                  "sources": sorted(sources[target]),
                  "begin_rva": a,
                  "end_rva": b,
                  "instructions": insns,
              }
              out.append(item)
              print(
                  f"\n=== target=0x{target:X} freq={count} "
                  f"function=0x{a:X}-0x{b:X} "
                  f"sources={','.join(sorted(sources[target]))} ==="
              )
              for x in insns:
                  print(
                      f"0x{x['rva']:X} {x['bytes']:<24} "
                      f"{x['mnemonic']} {x['op_str']}"
                  )

          Path("quest-legacy-30-wire-helpers.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload focused wire evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-30-wire
          path: |
            quest-legacy-30-wire-sample.txt
            quest-legacy-30-wire-functions.txt
            quest-legacy-30-wire-functions.json
            quest-legacy-30-wire-fingerprint.txt
            quest-legacy-30-wire-fingerprint.json
            quest-legacy-30-wire-helpers.txt
            quest-legacy-30-wire-helpers.json
          if-no-files-found: warn
