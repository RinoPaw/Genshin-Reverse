name: Recover 7.1 metadata usage types

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-7.1-metadata-usage-types.yml'
      - 'scripts/fetch-7.1-samples.sh'
      - 'genshinre/usagexref.py'
      - 'versions/7.1.0-global/windows-x64/registry/type-cache-xrefs.csv'
      - 'versions/7.1.0-global/windows-x64/metadata/methods.csv'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch pinned global 7.1 samples
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Recover usage ids from type-cache xref corridors
        run: |
          ROOT=versions/7.1.0-global/windows-x64
          python -m genshinre.usagexref \
            /tmp/gi71/GenshinImpact.exe \
            "$ROOT/metadata/methods.csv" \
            "$ROOT/registry/type-cache-xrefs.csv" \
            "$ROOT/registry/metadata-usage-types.csv" \
            --summary "$ROOT/registry/metadata-usage-types.summary.json"
          cat "$ROOT/registry/metadata-usage-types.summary.json"

      - name: Commit usage/type artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/metadata-usage-types.csv \
                  versions/7.1.0-global/windows-x64/registry/metadata-usage-types.summary.json
          if git diff --cached --quiet; then
            echo 'No usage/type changes.'
            exit 0
          fi
          git commit -m 'data: recover 7.1 metadata usage type identities from code xrefs'
          git pull --rebase origin main
          git push origin HEAD:main
