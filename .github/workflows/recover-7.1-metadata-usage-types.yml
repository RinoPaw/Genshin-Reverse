name: Recover 7.1 metadata usage types

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-7.1-metadata-usage-types.yml'
      - 'genshinre/usagexref.py'
      - 'versions/7.1.0-global/windows-x64/registry/type-cache-xrefs.csv'
      - 'versions/7.1.0-global/windows-x64/metadata/methods.csv'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 executable
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Recover usage ids from type-cache xref corridors
        run: |
          ROOT=versions/7.1.0-global/windows-x64
          python -m genshinre.usagexref \
            /tmp/gi71/GenshinImpact.exe \
            "$ROOT/metadata/methods.csv" \
            "$ROOT/registry/type-cache-xrefs.csv" \
            "$ROOT/registry/metadata-usage-types.csv" \
            --summary "$ROOT/registry/metadata-usage-types.summary.json"
          cat "$ROOT/registry/metadata-usage-types.summary.json"

      - name: Commit usage/type artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/7.1.0-global/windows-x64/registry/metadata-usage-types.csv \
                  versions/7.1.0-global/windows-x64/registry/metadata-usage-types.summary.json
          if git diff --cached --quiet; then
            echo 'No usage/type changes.'
            exit 0
          fi
          git commit -m 'data: recover 7.1 metadata usage type identities from code xrefs'
          git pull --rebase origin main
          git push origin HEAD:main
