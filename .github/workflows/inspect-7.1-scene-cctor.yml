name: Inspect 7.1 scene static constructor

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-scene-cctor.yml'
  workflow_dispatch:

concurrency:
  group: inspect-7.1-scene-cctor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: python -m pip install -e . zstandard capstone
      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'
      - name: Inspect KLLNGCPBLMM static constructor
        run: |
          python tools/inspect_method_context_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/kllngcpblmm-cctor.json \
            --focus scene_cctor:0xF074540 \
            --neighbor-count 2 \
            --max-body 0x8000
      - name: Extract dispatch-related constants and calls
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/kllngcpblmm-cctor.json'))['focus']['scene_cctor']
          print('owner',d['owner'])
          interesting=('0x57831e8','0x24f40','0x4b2a','0x4b30','0x4b35')
          for insn in d['disasm']:
              text=(insn['op_str'] or '').lower()
              target=(insn.get('direct_call_target_rva') or '').lower()
              if insn['mnemonic']=='call' or any(x in text for x in interesting):
                  print(insn['rva'],insn['mnemonic'],insn['op_str'],'target',target,'owner',insn.get('direct_call_target_owner'))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kllngcpblmm-cctor
          path: /tmp/kllngcpblmm-cctor.json
          if-no-files-found: error
