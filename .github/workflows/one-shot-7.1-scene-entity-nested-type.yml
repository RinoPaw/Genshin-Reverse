name: One-shot original 7.1 scene entity nested type audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-7.1-scene-entity-nested-type.yml'

permissions:
  contents: read

jobs:
  native-nested-types:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install original-client native reader dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact Global 7.1 client binary
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Scan original native element nested classes
        run: |
          python scripts/probe-7.1-cmd27685-nested-native-types.py \
            --types versions/7.1.0-global/windows-x64/metadata/types.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --prior versions/7.1.0-global/analyses/progression/economy/7.1-original-cmd27685-element-metadata-reader-census.json \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --output work/original-71-scene-entity-nested-type-census.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-entity-nested-type-census
          path: work/original-71-scene-entity-nested-type-census.json
          retention-days: 7
          if-no-files-found: error
