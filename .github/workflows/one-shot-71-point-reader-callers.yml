name: One-shot exact original 7.1 point native reader caller census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-71-point-reader-callers.yml'
      - 'scripts/probe-7.1-point-reader-reverse-native-callers.py'

permissions:
  contents: read

jobs:
  original-reader-callers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . capstone zstandard
      - name: Fetch SHA-pinned original Global 7.1 EXE and metadata
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Verify parent and polymorphic reader native call xrefs
        run: |
          python scripts/probe-7.1-point-reader-reverse-native-callers.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --parent versions/7.1.0-global/analyses/progression/world/7.1-original-scene-point-parent-mask-native-callchain.json \
            --chain versions/7.1.0-global/analyses/progression/world/7.1-original-point-factory-14-1-nldep-direct-reader-chain.json \
            --output work/7.1-original-point-reader-reverse-callers.json
      - name: Emit complete source report
        run: |
          echo ORIGINAL_71_READER_REVERSE_CALLS_FULL_BEGIN
          cat work/7.1-original-point-reader-reverse-callers.json
          echo ORIGINAL_71_READER_REVERSE_CALLS_FULL_END
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-point-reader-reverse-native-callers
          path: work/7.1-original-point-reader-reverse-callers.json
          retention-days: 7
          if-no-files-found: error
