name: Trace 7.1 game packet framing call edges

on:
  push:
    paths:
      - 'tools/trace_native_call_edges_71.py'
      - '.github/workflows/trace-7.1-game-packet-framing-edges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 executable
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Trace parser and encoder call edges
        run: |
          python tools/trace_native_call_edges_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/game-packet-framing-edges-71.json \
            --focus parser:0xA018360 \
            --focus encoder:0xA019BB0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-packet-framing-edges-71
          path: /tmp/game-packet-framing-edges-71.json
          if-no-files-found: warn
