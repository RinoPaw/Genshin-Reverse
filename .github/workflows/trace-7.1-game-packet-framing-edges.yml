name: Trace 7.1 game packet framing call edges

on:
  push:
    paths:
      - 'tools/trace_native_call_edges.py'
      - '.github/workflows/trace-7.1-game-packet-framing-edges.yml'
      - 'scripts/fetch-7.1-samples.sh'
      - 'genshinre/nativeprofile.py'
      - 'genshinre/samplefetch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output /tmp/gi71 --python python

      - name: Trace parser and encoder call edges
        run: |
          python tools/trace_native_call_edges.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/game-packet-framing-edges-71.json \
            --focus parser:0xA018360 \
            --focus encoder:0xA019BB0

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: game-packet-framing-edges-71
          path: /tmp/game-packet-framing-edges-71.json
          if-no-files-found: error
          retention-days: 7
