name: Locate 7.1 ScenePointUnlockNotify handler

on:
  push:
    paths:
      - '.github/workflows/locate-7.1-scene-point-unlock-handler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Locate decoded method signatures
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          src = Path('versions/7.1.0-global/windows-x64/metadata/methods.csv')
          rows = []
          with src.open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  params = row.get('parameter_types') or ''
                  if 'DBNMIKBJIPE' in params:
                      rows.append(row)
          out = Path('/tmp/scene-point-unlock-methods-71.json')
          out.write_text(json.dumps(rows, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('matches:', len(rows))
          for r in rows:
              print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scene-point-unlock-methods-71
          path: /tmp/scene-point-unlock-methods-71.json
          if-no-files-found: error
