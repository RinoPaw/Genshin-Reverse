name: Original 7.1 client scene asset container inventory

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-7.1-client-scene-asset-container.yml']

permissions:
  contents: read
concurrency:
  group: original-71-scene-asset-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install -e . zstandard
      - name: Fetch two source-verified official design blocks
        run: python scripts/fetch-7.1-design-blocks.py --output work/blocks --report work/blocks-report.json
      - name: Retrieve SHA-pinned Raw exporter
        shell: bash
        run: |
          curl -fLsS --retry 3 https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz -o work/AnimeStudio.tar.gz
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  work/AnimeStudio.tar.gz' | sha256sum --check
          mkdir -p work/cli
          tar -xzf work/AnimeStudio.tar.gz -C work/cli
      - name: Export original design index (only MiHoYoBinData)
        shell: bash
        run: |
          dotnet work/cli/AnimeStudio.CLI.dll work/blocks/31049741.blk work/export --game GI --types MiHoYoBinData --export_type Raw --logger_flags Error
          echo 'fe1e1ce970e3aa72e764b0894d94a684b7a49edc9f3ae6a32c4d7f38d8a64712  work/export/MiHoYoBinData/0000006f.dat' | sha256sum --check
      - name: Probe original manifest paths plus asset index native type table
        run: |
          python scripts/probe-7.1-client-scene-asset-container.py \
            --index-raw work/export/MiHoYoBinData/0000006f.dat \
            --output work/original-71-client-scene-asset-inventory.json
      - uses: actions/upload-artifact@v7
        with:
          name: original-71-scene-asset-container-inventory
          path: work/original-71-client-scene-asset-inventory.json
          retention-days: 7
          if-no-files-found: error
