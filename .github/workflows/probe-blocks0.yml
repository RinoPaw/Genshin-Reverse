name: Probe 7.1 AssetBundles blocks0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-blocks0.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . zstandard
      - name: Reconstruct and inspect blocks0
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import download,decompress_zstd,parse_manifest,choose_file,reconstruct
          rows=parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          row=choose_file(rows,'blocks0.blk')
          print('ROW',row)
          out=Path('blocks0.blk')
          reconstruct(PROFILE_71.sophon_chunk_prefix,row,out,4)
          print('SIZE',out.stat().st_size)
          print('SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          data=out.read_bytes()
          print('HEAD',data[:256].hex())
          print('TAIL',data[-256:].hex())
          # printable strings, especially table/index clues
          found=[]
          cur=bytearray()
          start=0
          for i,b in enumerate(data):
              if 32<=b<127:
                  if not cur: start=i
                  cur.append(b)
              else:
                  if len(cur)>=6:
                      s=cur.decode('ascii','ignore')
                      if any(k in s.lower() for k in ('quest','excel','asset','block','bin','catalog','index','31049740')):
                          found.append((start,s[:300]))
                  cur.clear()
          print('INTERESTING_STRINGS',len(found))
          for off,s in found[:500]: print(hex(off),repr(s))
          PY
          file blocks0.blk || true
