name: Inspect 7.1 platform route anchor

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-platform-route-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Inspect parser wire tags
        run: |
          python tools/inspect_protocol_type_shape_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/platform-route-anchor-71.json \
            --cmd 4699 \
            --cmd 36641 \
            --cmd 20290

          python - <<'PY'
          import json
          data = json.load(open('/tmp/platform-route-anchor-71.json', encoding='utf-8'))
          for row in data['rows']:
              print('CMD', row['cmd_id'], row['type_name'])
              for method in row['methods']:
                  comps = method.get('comparisons') or []
                  if not comps:
                      continue
                  tags = sorted({
                      int(v)
                      for comp in comps
                      for v in comp.get('immediates', [])
                      if int(v) > 0 and (int(v) & 7) in {0, 1, 2, 5}
                  })
                  if tags:
                      print(' ', method['rva'], method['method_name'], 'tags=', tags,
                            'fields=', [(v >> 3, v & 7) for v in tags])
          PY

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-route-anchor-71
          path: /tmp/platform-route-anchor-71.json
          if-no-files-found: error
