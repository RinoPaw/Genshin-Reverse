name: Probe 3.2 and 3.4 native QuestExcel assets

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-32-34-assets.yml"

concurrency:
  group: probe-quest-legacy-32-34-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.2"
            stamp: "20221024103618_h2e3o3zijYKEqHnQ"
          - version: "3.4"
            stamp: "20230109135018_10QhExKHwAoa4ecr"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused Python dependencies
        run: python -m pip install -e .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Build pinned 2022 GenshinStudio MiHoYoBinData extractor
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/GenshinStudio
          git clone --filter=blob:none https://github.com/game-maker-ly/GenshinStudio.git "$root"
          git -C "$root" checkout --detach 46c5aca5c6c7d5124e54a5693264bb61165846c3

          mkdir -p "$root/ProbeExtract"
          cat > "$root/ProbeExtract/ProbeExtract.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net6.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../AssetStudio/AssetStudio.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$root/ProbeExtract/Program.cs" <<'EOF'
          using AssetStudio;
          using System.Buffers.Binary;

          if (args.Length != 2)
          {
              Console.Error.WriteLine("usage: ProbeExtract <blk> <output-dir>");
              return 2;
          }

          var input = Path.GetFullPath(args[0]);
          var output = Path.GetFullPath(args[1]);
          Directory.CreateDirectory(output);

          var manager = new AssetsManager();
          manager.LoadFiles(input);

          int files = 0;
          int bins = 0;
          foreach (var assetsFile in manager.assetsFileList)
          {
              files++;
              IndexObject? index = null;
              if (assetsFile.ObjectsDic.TryGetValue(2, out var obj) && obj is IndexObject io)
                  index = io;

              foreach (var asset in assetsFile.Objects)
              {
                  if (asset is not MiHoYoBinData bin)
                      continue;

                  string name = $"pathid-{bin.m_PathID}";
                  if (index != null && index.Names.TryGetValue(bin.m_PathID, out var recovered))
                      name = recovered;

                  name = Path.GetFileNameWithoutExtension(name);
                  var raw = new byte[4 + bin.RawData.Length];
                  BinaryPrimitives.WriteInt32LittleEndian(raw.AsSpan(0, 4), bin.RawData.Length);
                  bin.RawData.CopyTo(raw, 4);
                  File.WriteAllBytes(Path.Combine(output, name + ".dat"), raw);
                  bins++;
              }
          }

          Console.WriteLine($"assets_files={files}");
          Console.WriteLine($"mihoyo_bin_data={bins}");
          return bins > 0 ? 0 : 3;
          EOF

          dotnet build "$root/ProbeExtract/ProbeExtract.csproj" -c Release --nologo
          printf '%s\n' "$root/ProbeExtract/bin/Release/net6.0/ProbeExtract.dll" > /tmp/genshinstudio-extractor

      - name: Fetch exact old-package index and fixed design/quest blocks
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          STAMP: ${{ matrix.stamp }}
        run: |
          set -euo pipefail
          official="https://autopatchhk.yuanshen.com/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mirror="https://autopatchrr.yyheggegg.com/anime-os/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mkdir -p inputs

          fetch() {
            local rel="$1" out="$2"
            if curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 \
                "$official/$rel" -o "$out"; then
              echo "source=official rel=$rel"
              return
            fi
            rm -f "$out"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 360 \
              "$mirror/$rel" -o "$out"
            echo "source=mirror rel=$rel"
          }

          fetch pkg_version inputs/pkg_version

          python - <<'PY' | tee package-index-summary.txt
          import json,os
          from pathlib import Path

          rows=[
              json.loads(line)
              for line in Path("inputs/pkg_version").read_text(
                  encoding="utf-8-sig",errors="strict"
              ).splitlines()
              if line.strip()
          ]
          wanted={
              "design":"31049740.blk",
              "quest":"25539185.blk",
          }
          selected={}
          for label,base in wanted.items():
              hits=[
                  x for x in rows
                  if str(x.get("remoteName","")).replace("\\","/").endswith(
                      "/StreamingAssets/AssetBundles/blocks/00/"+base
                  )
              ]
              print(label,"hits",len(hits))
              for x in hits: print(json.dumps(x,sort_keys=True))
              if len(hits)!=1:
                  raise SystemExit(f"{label}: block entry missing/ambiguous")
              selected[label]=hits[0]
          Path("/tmp/old-blocks.json").write_text(json.dumps(selected))
          print("version",os.environ["VERSION"],"package_rows",len(rows))
          PY

          for label in design quest; do
            rel=$(python - "$label" <<'PY'
          import json,sys
          print(json.load(open("/tmp/old-blocks.json"))[sys.argv[1]]["remoteName"])
          PY
            )
            fetch "$rel" "inputs/$label.blk"
          done

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          selected=json.load(open("/tmp/old-blocks.json"))
          for label in ("design","quest"):
              p=Path("inputs")/(label+".blk")
              row=selected[label]
              md5=hashlib.md5(p.read_bytes()).hexdigest()
              print(label,"size",p.stat().st_size,"md5",md5)
              if p.stat().st_size != int(row["fileSize"]):
                  raise SystemExit(f"{label} size mismatch")
              if md5.lower()!=row["md5"].lower():
                  raise SystemExit(f"{label} md5 mismatch")
          PY

      - name: Extract old AssetIndex and QuestExcel MiHoYoBinData
        shell: bash
        run: |
          set -euo pipefail
          extractor=$(cat /tmp/genshinstudio-extractor)
          rm -rf design-output quest-output
          mkdir -p design-output quest-output

          dotnet "$extractor" inputs/design.blk design-output 2>&1 | tee old-design-extract.txt
          dotnet "$extractor" inputs/quest.blk quest-output 2>&1 | tee old-quest-extract.txt

          echo "DESIGN OUTPUT"
          find design-output -maxdepth 1 -type f -printf '%f %s\n' | sort | sed -n '1,200p'
          echo "QUEST OUTPUT"
          find quest-output -maxdepth 1 -type f -printf '%f %s\n' | sort | sed -n '1,200p'

          test -s design-output/0000006f.dat
          test -s quest-output/3b87ae83.dat

      - name: Verify historical AssetIndex routing and fingerprint QuestExcel
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-native-fingerprint.txt
          import hashlib,json,os,struct
          from pathlib import Path
          from genshinre.assetindex import (
              mihoyo_name_hash,parse_asset_index,unwrap_mihoyo_bin_data
          )

          path="Data/_ExcelBinOutput/QuestExcelConfigData"
          h=mihoyo_name_hash(path)
          idx_raw=Path("design-output/0000006f.dat").read_bytes()
          idx=parse_asset_index(idx_raw)
          name=idx.name_for_hash(h)
          ref=idx.block_ref_for_asset(name.sub_asset_id)
          group=idx.block_groups[ref.block_id]

          raw=Path("quest-output/3b87ae83.dat").read_bytes()
          payload=unwrap_mihoyo_bin_data(raw)

          def uvar(data,pos=0):
              value=0; shift=0; start=pos
              while True:
                  if pos>=len(data): raise EOFError(start)
                  b=data[pos];pos+=1
                  value|=(b&0x7f)<<shift
                  if not b&0x80:return value,pos-start
                  shift+=7
                  if shift>=64: raise ValueError("wide uvar")
          uv,n=uvar(payload)
          zz=(-(uv&1) ^ (uv>>1))

          out={
              "version":os.environ["VERSION"],
              "path":path,
              "hash":f"0x{h:010X}",
              "exported_name":name.exported_name,
              "sub_asset_id":name.sub_asset_id,
              "block_id":ref.block_id,
              "group_id":group,
              "unknown0":ref.unknown0,
              "unknown1":ref.unknown1,
              "raw_size":len(raw),
              "raw_sha256":hashlib.sha256(raw).hexdigest(),
              "payload_size":len(payload),
              "payload_sha256":hashlib.sha256(payload).hexdigest(),
              "head64":payload[:64].hex(),
              "leading_uvar":uv,
              "leading_uvar_bytes":n,
              "zigzag_i32_interpretation":zz,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("quest-native-fingerprint.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )

          if name.exported_name.lower()!="3b87ae83":
              raise SystemExit(f"unexpected exported name {name.exported_name}")
          if ref.block_id != 25539185 or group != 0:
              raise SystemExit(
                  f"unexpected historical QuestExcel route block={ref.block_id} group={group}"
              )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-native-${{ matrix.version }}
          path: |
            package-index-summary.txt
            old-design-extract.txt
            old-quest-extract.txt
            quest-native-fingerprint.txt
            quest-native-fingerprint.json
            design-output/0000006f.dat
            quest-output/3b87ae83.dat
          if-no-files-found: warn
