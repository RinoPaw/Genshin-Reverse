name: Probe 3.2 and 3.4 native QuestExcel assets

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-32-34-assets.yml"

concurrency:
  group: probe-quest-legacy-32-34-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.2"
            stamp: "20221024103618_h2e3o3zijYKEqHnQ"
          - version: "3.4"
            stamp: "20230109135018_10QhExKHwAoa4ecr"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned AnimeStudio CLI
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if (("${#apphosts[@]}")); then
            chmod +x "${apphosts[0]}"
            printf '%s\n' "${apphosts[0]}" >/tmp/animestudio-entry
          elif (("${#dlls[@]}")); then
            printf 'dotnet\n%s\n' "${dlls[0]}" >/tmp/animestudio-entry
          else
            exit 2
          fi

      - name: Fetch exact package index and design index block
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          STAMP: ${{ matrix.stamp }}
        run: |
          set -euo pipefail
          official="https://autopatchhk.yuanshen.com/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mirror="https://autopatchrr.yyheggegg.com/anime-os/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mkdir -p inputs

          fetch() {
            local rel="$1" out="$2"
            if curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
                "$official/$rel" -o "$out"; then
              echo "source=official rel=$rel"
              return
            fi
            rm -f "$out"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              "$mirror/$rel" -o "$out"
            echo "source=mirror rel=$rel"
          }

          fetch pkg_version inputs/pkg_version

          python - <<'PY' | tee package-index-summary.txt
          import json,os
          from pathlib import Path
          rows=[]
          for line in Path("inputs/pkg_version").read_text(encoding="utf-8-sig",errors="strict").splitlines():
              line=line.strip()
              if line: rows.append(json.loads(line))
          suffix="/StreamingAssets/AssetBundles/blocks/00/31049740.blk"
          hits=[x for x in rows if str(x.get("remoteName","")).replace("\\","/").endswith(suffix)]
          print("version",os.environ["VERSION"],"rows",len(rows),"design_hits",len(hits))
          for x in hits: print(json.dumps(x,sort_keys=True))
          if len(hits)!=1: raise SystemExit("design index entry missing/ambiguous")
          Path("/tmp/design-entry.json").write_text(json.dumps(hits[0]))
          PY

          rel=$(python -c 'import json; print(json.load(open("/tmp/design-entry.json"))["remoteName"])')
          fetch "$rel" inputs/31049740.blk

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          x=json.load(open("/tmp/design-entry.json"))
          p=Path("inputs/31049740.blk")
          got=hashlib.md5(p.read_bytes()).hexdigest()
          print("design_size",p.stat().st_size,"md5",got)
          if p.stat().st_size != int(x["fileSize"]): raise SystemExit("design size mismatch")
          if got.lower()!=x["md5"].lower(): raise SystemExit("design md5 mismatch")
          PY

      - name: Resolve exact historical QuestExcel block
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry </tmp/animestudio-entry
          if (("${#entry[@]}"==1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi
          rm -rf design-output
          mkdir -p design-output
          "${cli[@]}" inputs/31049740.blk design-output --game GI --export_type Raw --logger_flags Error

          python - <<'PY' | tee quest-asset-location.txt
          import json
          from pathlib import Path
          from genshinre.assetindex import mihoyo_name_hash,parse_asset_index
          path="Data/_ExcelBinOutput/QuestExcelConfigData"
          h=mihoyo_name_hash(path)
          candidates=list(Path("design-output").rglob("*.dat"))
          exact=[x for x in candidates if x.name=="0000006f.dat"]
          if len(exact)!=1:
              raise SystemExit(f"asset index export missing candidates={candidates[:30]}")
          idx=parse_asset_index(exact[0].read_bytes())
          name=idx.name_for_hash(h)
          ref=idx.block_ref_for_asset(name.sub_asset_id)
          group=idx.block_groups[ref.block_id]
          out={
            "path":path,"hash":f"0x{h:010X}","exported_name":name.exported_name,
            "sub_asset_id":name.sub_asset_id,"block_id":ref.block_id,"group_id":group,
            "unknown0":ref.unknown0,"unknown1":ref.unknown1,
          }
          print(json.dumps(out,indent=2))
          Path("quest-asset-location.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Fetch target block from exact package
        shell: bash
        env:
          STAMP: ${{ matrix.stamp }}
        run: |
          set -euo pipefail
          official="https://autopatchhk.yuanshen.com/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mirror="https://autopatchrr.yyheggegg.com/anime-os/client_app/download/pc_zip/$STAMP/ScatteredFiles"

          python - <<'PY'
          import json
          from pathlib import Path
          loc=json.load(open("quest-asset-location.json"))
          rows=[json.loads(x) for x in Path("inputs/pkg_version").read_text(encoding="utf-8-sig").splitlines() if x.strip()]
          bid=loc["block_id"]
          suffix=f"/StreamingAssets/AssetBundles/blocks/{loc['group_id']:02d}/{bid}.blk"
          alt=f"/StreamingAssets/AssetBundles/blocks/{loc['group_id']:02x}/{bid}.blk"
          hits=[x for x in rows if str(x.get("remoteName","")).replace("\\","/").endswith(suffix)]
          if len(hits)!=1:
              hits=[x for x in rows if str(x.get("remoteName","")).replace("\\","/").endswith(alt)]
          if len(hits)!=1:
              raise SystemExit(f"target block entry missing/ambiguous suffix={suffix} alt={alt}")
          Path("/tmp/target-entry.json").write_text(json.dumps(hits[0]))
          print(json.dumps(hits[0],sort_keys=True))
          PY

          rel=$(python -c 'import json; print(json.load(open("/tmp/target-entry.json"))["remoteName"])')
          if ! curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 \
              "$official/$rel" -o inputs/quest.blk; then
            rm -f inputs/quest.blk
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              "$mirror/$rel" -o inputs/quest.blk
          fi

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          x=json.load(open("/tmp/target-entry.json"))
          p=Path("inputs/quest.blk")
          got=hashlib.md5(p.read_bytes()).hexdigest()
          print("target_size",p.stat().st_size,"md5",got)
          if p.stat().st_size != int(x["fileSize"]): raise SystemExit("target size mismatch")
          if got.lower()!=x["md5"].lower(): raise SystemExit("target md5 mismatch")
          PY

      - name: Export and fingerprint native QuestExcel object
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mapfile -t entry </tmp/animestudio-entry
          if (("${#entry[@]}"==1)); then cli=("${entry[0]}"); else cli=("${entry[0]}" "${entry[1]}"); fi
          rm -rf quest-output
          mkdir -p quest-output
          "${cli[@]}" inputs/quest.blk quest-output --game GI --export_type Raw --logger_flags Error

          python - <<'PY' | tee quest-native-fingerprint.txt
          import hashlib,json,os,struct
          from pathlib import Path
          from genshinre.assetindex import unwrap_mihoyo_bin_data

          loc=json.load(open("quest-asset-location.json"))
          root=Path("quest-output/MiHoYoBinData")
          p=root/(loc["exported_name"]+".dat")
          if not p.is_file():
              raise SystemExit(f"raw object missing: {p}, candidates={list(root.glob('*.dat'))[:30]}")
          raw=p.read_bytes()
          payload=unwrap_mihoyo_bin_data(raw)

          def uvar(data,pos=0):
              value=0; shift=0; start=pos
              while True:
                  b=data[pos];pos+=1
                  value|=(b&0x7f)<<shift
                  if not b&0x80:return value,pos-start
                  shift+=7
          uv,n=uvar(payload)
          zz=(-(uv&1) ^ (uv>>1))
          out={
            "version":os.environ["VERSION"],
            **loc,
            "raw_size":len(raw),
            "raw_sha256":hashlib.sha256(raw).hexdigest(),
            "payload_size":len(payload),
            "payload_sha256":hashlib.sha256(payload).hexdigest(),
            "head64":payload[:64].hex(),
            "leading_uvar":uv,
            "leading_uvar_bytes":n,
            "zigzag_i32_interpretation":zz,
          }
          print(json.dumps(out,indent=2))
          Path("quest-native-fingerprint.json").write_text(json.dumps(out,indent=2)+"\n")
          Path("quest-native.dat").write_bytes(raw)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-native-${{ matrix.version }}
          path: |
            package-index-summary.txt
            quest-asset-location.txt
            quest-asset-location.json
            quest-native-fingerprint.txt
            quest-native-fingerprint.json
            quest-native.dat
          if-no-files-found: warn
