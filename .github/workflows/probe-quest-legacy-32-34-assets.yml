name: Probe 3.2 and 3.4 native QuestExcel assets

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-32-34-assets.yml"
      - "genshinre/questlegacy.py"

concurrency:
  group: probe-quest-legacy-32-34-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.2"
            stamp: "20221024103618_h2e3o3zijYKEqHnQ"
            xor_key: "0x93"
            row_count: "15818"
            raw_size: "719939"
            raw_sha256: "891d83000eb3eb7382d7781bff12213b55159e7053c22312857a371fa4243c36"
          - version: "3.4"
            stamp: "20230109135018_10QhExKHwAoa4ecr"
            xor_key: "0x95"
            row_count: "16727"
            raw_size: "764222"
            raw_sha256: "c034b6ea8714f04d3c3ea8e31e3a944969ecef4fa804156ff046ffd516beaa64"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused Python package
        run: python -m pip install -e .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Build pinned 2022 GenshinStudio MiHoYoBinData extractor
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/GenshinStudio
          git clone --filter=blob:none https://github.com/game-maker-ly/GenshinStudio.git "$root"
          git -C "$root" checkout --detach 46c5aca5c6c7d5124e54a5693264bb61165846c3

          mkdir -p "$root/ProbeExtract"
          cat > "$root/ProbeExtract/ProbeExtract.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net6.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../AssetStudio/AssetStudio.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$root/ProbeExtract/Program.cs" <<'EOF'
          using AssetStudio;
          using System.Buffers.Binary;

          if (args.Length != 2)
          {
              Console.Error.WriteLine("usage: ProbeExtract <blk> <output-dir>");
              return 2;
          }

          var input = Path.GetFullPath(args[0]);
          var output = Path.GetFullPath(args[1]);
          Directory.CreateDirectory(output);

          var manager = new AssetsManager();
          manager.LoadFiles(input);

          int bins = 0;
          foreach (var assetsFile in manager.assetsFileList)
          {
              IndexObject? index = null;
              if (assetsFile.ObjectsDic.TryGetValue(2, out var obj) && obj is IndexObject io)
                  index = io;

              foreach (var asset in assetsFile.Objects)
              {
                  if (asset is not MiHoYoBinData bin)
                      continue;

                  string name = $"pathid-{bin.m_PathID}";
                  if (index != null && index.Names.TryGetValue(bin.m_PathID, out var recovered))
                      name = recovered;

                  name = Path.GetFileNameWithoutExtension(name);
                  var raw = new byte[4 + bin.RawData.Length];
                  BinaryPrimitives.WriteInt32LittleEndian(raw.AsSpan(0, 4), bin.RawData.Length);
                  bin.RawData.CopyTo(raw, 4);
                  File.WriteAllBytes(Path.Combine(output, name + ".dat"), raw);
                  bins++;
              }
          }

          Console.WriteLine($"mihoyo_bin_data={bins}");
          return bins > 0 ? 0 : 3;
          EOF

          dotnet build "$root/ProbeExtract/ProbeExtract.csproj" -c Release --nologo
          printf '%s\n' "$root/ProbeExtract/bin/Release/net6.0/ProbeExtract.dll" > /tmp/genshinstudio-extractor

      - name: Fetch exact old-package Quest block
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          STAMP: ${{ matrix.stamp }}
        run: |
          set -euo pipefail
          official="https://autopatchhk.yuanshen.com/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mirror="https://autopatchrr.yyheggegg.com/anime-os/client_app/download/pc_zip/$STAMP/ScatteredFiles"
          mkdir -p inputs

          fetch() {
            local rel="$1" out="$2"
            if curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 \
                "$official/$rel" -o "$out"; then
              echo "source=official rel=$rel"
              return
            fi
            rm -f "$out"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 360 \
              "$mirror/$rel" -o "$out"
            echo "source=mirror rel=$rel"
          }

          fetch pkg_version inputs/pkg_version

          python - <<'PY' | tee package-index-summary.txt
          import json,os
          from pathlib import Path

          rows=[
              json.loads(line)
              for line in Path("inputs/pkg_version").read_text(
                  encoding="utf-8-sig",errors="strict"
              ).splitlines()
              if line.strip()
          ]
          suffix="/StreamingAssets/AssetBundles/blocks/00/25539185.blk"
          hits=[
              x for x in rows
              if str(x.get("remoteName","")).replace("\\","/").endswith(suffix)
          ]
          print("version",os.environ["VERSION"],"package_rows",len(rows),"quest_hits",len(hits))
          for x in hits:
              print(json.dumps(x,sort_keys=True))
          if len(hits)!=1:
              raise SystemExit("Quest block entry missing/ambiguous")
          Path("/tmp/quest-block.json").write_text(json.dumps(hits[0]))
          PY

          rel=$(python -c 'import json; print(json.load(open("/tmp/quest-block.json"))["remoteName"])')
          fetch "$rel" inputs/quest.blk

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          row=json.load(open("/tmp/quest-block.json"))
          p=Path("inputs/quest.blk")
          md5=hashlib.md5(p.read_bytes()).hexdigest()
          print("quest_block_size",p.stat().st_size,"md5",md5)
          if p.stat().st_size != int(row["fileSize"]):
              raise SystemExit("Quest block size mismatch")
          if md5.lower()!=row["md5"].lower():
              raise SystemExit("Quest block md5 mismatch")
          PY

      - name: Extract exact QuestExcel Raw MiHoYoBinData
        shell: bash
        run: |
          set -euo pipefail
          extractor=$(cat /tmp/genshinstudio-extractor)
          rm -rf quest-output
          mkdir -p quest-output
          dotnet "$extractor" inputs/quest.blk quest-output 2>&1 | tee old-quest-extract.txt
          test -s quest-output/3b87ae83.dat

      - name: Decode native Quest 351 with legacy wire schema
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
          EXPECTED_XOR_KEY: ${{ matrix.xor_key }}
          EXPECTED_ROW_COUNT: ${{ matrix.row_count }}
          EXPECTED_RAW_SIZE: ${{ matrix.raw_size }}
          EXPECTED_RAW_SHA256: ${{ matrix.raw_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-351-native.txt
          import hashlib,json,os
          from pathlib import Path

          from genshinre.questlegacy import (
              detect_legacy_quest_xor_key,
              find_quest_rows,
              parse_legacy_quest_prefix,
          )

          raw=Path("quest-output/3b87ae83.dat").read_bytes()
          expected_size=int(os.environ["EXPECTED_RAW_SIZE"])
          expected_sha=os.environ["EXPECTED_RAW_SHA256"]
          digest=hashlib.sha256(raw).hexdigest()
          if len(raw)!=expected_size or digest!=expected_sha:
              raise SystemExit(
                  f"raw identity mismatch size={len(raw)} sha256={digest}"
              )

          key,row_count=detect_legacy_quest_xor_key(raw,probe_rows=100)
          expected_key=int(os.environ["EXPECTED_XOR_KEY"],0)
          expected_count=int(os.environ["EXPECTED_ROW_COUNT"])
          if (key,row_count)!=(expected_key,expected_count):
              raise SystemExit(
                  f"wire fingerprint mismatch key=0x{key:02X} count={row_count}"
              )

          prefix=parse_legacy_quest_prefix(raw,xor_key=key,max_rows=100)
          quest351=find_quest_rows(prefix,main_id=351)
          expected_sub_ids={35100,35101,35102,35103,35104,35105,35106,35107}
          got_sub_ids={int(row.fields["sub_id"]) for row in quest351}
          if got_sub_ids!=expected_sub_ids:
              raise SystemExit(
                  f"Quest 351 row set mismatch: {sorted(got_sub_ids)}"
              )

          bad=[
              row.fields["sub_id"]
              for row in quest351
              if "accept_cond" in row.fields or "accept_cond_comb" in row.fields
          ]
          if bad:
              raise SystemExit(f"native Quest 351 unexpectedly has acceptCond: {bad}")

          result={
              "version":os.environ["VERSION"],
              "raw_size":len(raw),
              "raw_sha256":digest,
              "xor_key":f"0x{key:02X}",
              "row_count":row_count,
              "prefix_rows":len(prefix.rows),
              "prefix_consumed":prefix.consumed,
              "quest_351":[
                  {
                      "row_index":row.index,
                      "start":row.start,
                      "end":row.end,
                      **row.fields,
                  }
                  for row in quest351
              ],
              "quest_351_has_accept_cond":False,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          Path("quest-351-native.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-native-${{ matrix.version }}
          path: |
            package-index-summary.txt
            old-quest-extract.txt
            quest-351-native.txt
            quest-351-native.json
            quest-output/3b87ae83.dat
          if-no-files-found: error
