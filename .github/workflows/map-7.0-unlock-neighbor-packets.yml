name: Map 7.0 unlock neighbor packets

on:
  push:
    paths:
      - '.github/workflows/map-7.0-unlock-neighbor-packets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published 7.0 dump
        run: |
          curl --fail --location \
            'https://raw.githubusercontent.com/superhuap/genshin_7.0_dump/main/data.7z' \
            -o /tmp/data.7z
          mkdir -p /tmp/data
          7z x -y /tmp/data.7z -o/tmp/data >/dev/null

      - name: Recover packet identities around historical UnlockTransPointRsp
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          root = Path('/tmp/data')
          dump_path = next(root.rglob('dump.json'))
          packet_candidates = [
              p for p in root.rglob('*.json')
              if 'packet' in p.name.lower() and 'id' in p.name.lower()
          ]
          if not packet_candidates:
              raise RuntimeError('no packet-id JSON found; files=' + ', '.join(str(p) for p in root.rglob('*') if p.is_file()))
          packet_path = packet_candidates[0]
          packet_map = json.loads(packet_path.read_text(encoding='utf-8'))

          owner_name = 'KGCKOFPFBLA'
          owner = None
          with dump_path.open('r', encoding='utf-8', errors='replace') as f:
              for line in f:
                  if f'\"name\":\"{owner_name}\"' not in line:
                      continue
                  obj, _ = json.JSONDecoder().raw_decode(line.strip())
                  if obj.get('name') == owner_name:
                      owner = obj
                      break
          if owner is None:
              raise RuntimeError(f'owner {owner_name} not found')

          # Independent semantic CmdId -> name control from a known 7.0 LunaGC snapshot.
          opcodes_url = 'https://raw.githubusercontent.com/girluh/LunaGC/d3391deafc1e1f6be13ba7fea8ebfe5d7b89f0e0/src/main/java/emu/grasscutter/net/packet/PacketOpcodes.java'
          with urllib.request.urlopen(opcodes_url, timeout=30) as r:
              opcodes_text = r.read().decode('utf-8', errors='replace')
          cmd_to_names = {}
          for name, cmd in re.findall(r'public static final int\s+(\w+)\s*=\s*(-?\d+)\s*;', opcodes_text):
              cmd_to_names.setdefault(int(cmd), []).append(name)

          rows = []
          for pos, method in enumerate(owner.get('methods', [])):
              if not (120 <= pos <= 190):
                  continue
              params = method.get('params') or []
              mapped = []
              for param in params:
                  typ = param.get('type') or ''
                  if typ not in packet_map:
                      continue
                  cmd = int(packet_map[typ])
                  mapped.append({
                      'parameter_name': param.get('name'),
                      'type': typ,
                      'cmd_id': cmd,
                      'semantic_names': cmd_to_names.get(cmd, []),
                  })
              if mapped:
                  rows.append({
                      'owner_position': pos,
                      'method_index': method.get('idx'),
                      'method_name': method.get('name'),
                      'rva': f"0x{int(method.get('rva') or 0):X}",
                      'packet_parameters': mapped,
                  })

          target = next((r for r in rows if any(p['type'] == 'CPKAHGFBBIH' for p in r['packet_parameters'])), None)
          result = {
              'dump': str(dump_path),
              'packet_map': str(packet_path),
              'owner': owner_name,
              'window': [120, 190],
              'historical_unlock_rsp_type': 'CPKAHGFBBIH',
              'historical_unlock_rsp_cmd_id': 1776,
              'target_row': target,
              'packet_handler_rows': rows,
              'notes': [
                  'Only parameters present in the published 7.0 packet-id map are included.',
                  'semantic_names come from the pinned girluh/LunaGC 7.0-era opcode snapshot and are cross-check evidence, not a source for current 7.1 IDs.',
              ],
          }
          out = Path('/tmp/unlock-neighbor-packets-70.json')
          out.write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print('packet map:', packet_path)
          for row in rows:
              print(row['owner_position'], row['rva'], row['method_name'])
              for p in row['packet_parameters']:
                  print(' ', p['type'], p['cmd_id'], p['semantic_names'])
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: unlock-neighbor-packets-70
          path: /tmp/unlock-neighbor-packets-70.json
          if-no-files-found: error
