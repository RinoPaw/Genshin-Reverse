name: Probe 7.1 Quest MemZip native bridge

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-memzip-native.yml"

concurrency:
  group: probe-quest-memzip-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Disassemble exact MemZip native bridge
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          for spec in             "zip_ctor:0x1112930:0x500"             "zip_source_query:0x1111C50:0x300"             "zip_state_a:0x145AAA0:0x180"             "zip_state_b:0x145ABB0:0x180"             "memzip_wrappers:0x19C40630:0x240"
          do
            IFS=: read -r label rva size <<<"$spec"
            python tools/disassemble_rva.py               inputs/7.1.0-global/GenshinImpact.exe "$rva" "$size"               --expected-sha256 "$sha"               --label "$label"               --output "quest-${label}.json"               > "quest-${label}.txt"
          done

      - name: Annotate native calls and cross-links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-memzip-native-summary.txt
          import csv,json,re
          from pathlib import Path

          root=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(n):
              with (root/n).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          methods=rows("methods.csv")
          types=rows("types.csv")
          by_rva={}
          for m in methods:
              s=(m.get("rva") or "").strip()
              if not s: continue
              try: by_rva.setdefault(int(s,0),[]).append(m)
              except ValueError: pass
          type_by_tdi={int(t["type_definition_index"]):t for t in types}

          labels=("zip_ctor","zip_source_query","zip_state_a","zip_state_b","memzip_wrappers")
          report={}
          for label in labels:
              d=json.loads(Path(f"quest-{label}.json").read_text(encoding="utf-8"))
              base=int(d["image_base"],16)
              calls=[]
              for x in d["instructions"]:
                  if x.get("mnemonic") not in {"call","jmp"}: continue
                  mm=re.fullmatch(r"0x([0-9a-fA-F]+)",x.get("op_str",""))
                  if not mm: continue
                  va=int(mm.group(1),16)
                  rva=va-base if va>=base else va
                  meta=by_rva.get(rva,[])
                  row={
                    "site_rva":x["rva"],
                    "target_rva":f"0x{rva:X}",
                    "metadata":meta,
                    "owners":[type_by_tdi.get(int(m["type_definition_index"]),{}) for m in meta],
                  }
                  calls.append(row)
                  print(label,json.dumps(row,ensure_ascii=False,sort_keys=True))
              report[label]={
                "start_rva":d["start_rva"],
                "calls":calls,
                "instructions":d["instructions"],
              }

          # Explicitly report cross-links among the five focused regions.
          starts={int(report[k]["start_rva"],16):k for k in report}
          print("\nCROSS_LINKS")
          for label,item in report.items():
              for c in item["calls"]:
                  r=int(c["target_rva"],16)
                  if r in starts:
                      print(label,"->",starts[r],c["site_rva"])

          Path("quest-memzip-native-summary.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-memzip-native
          path: |
            quest-zip_ctor.txt
            quest-zip_ctor.json
            quest-zip_source_query.txt
            quest-zip_source_query.json
            quest-zip_state_a.txt
            quest-zip_state_a.json
            quest-zip_state_b.txt
            quest-zip_state_b.json
            quest-memzip_wrappers.txt
            quest-memzip_wrappers.json
            quest-memzip-native-summary.txt
            quest-memzip-native-summary.json
          if-no-files-found: error
