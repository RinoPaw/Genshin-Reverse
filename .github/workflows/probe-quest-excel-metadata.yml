name: Probe 7.1 QuestExcel metadata anchors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-quest-excel-metadata.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            versions/7.1.0-global/windows-x64/metadata/types.csv
            versions/7.1.0-global/windows-x64/metadata/fields.csv
            versions/7.1.0-global/windows-x64/metadata/methods.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Identify Quest row and condition deserializers
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path("versions/7.1.0-global/windows-x64/metadata")

          def rows(name):
              with (root / name).open("r", encoding="utf-8-sig", newline="") as f:
                  yield from csv.DictReader(f)

          target_fields = {
              "subid", "mainid", "order", "acceptcond", "acceptcondcomb",
              "finishcond", "finishcondcomb", "failcond", "failexec", "finishexec",
              "beginexec", "guide", "desctextmaphash", "showtype", "isrewind",
          }
          by_type = defaultdict(list)
          for row in rows("fields.csv"):
              name = (row.get("field_name") or "").lstrip("_").lower()
              if name in target_fields:
                  by_type[(row["type_definition_index"], row["type_name"])].append(row)

          print("=== field-signature candidates ===")
          candidates = []
          for key, found in by_type.items():
              names = {r["field_name"].lstrip("_").lower() for r in found}
              score = len(names & target_fields)
              if score >= 5 or {"subid", "mainid", "order", "acceptcond"} <= names:
                  candidates.append((score, key, found))
          for score, (tdi, tname), found in sorted(candidates, reverse=True):
              print(f"CANDIDATE score={score} type_definition_index={tdi} type={tname}")
              for r in found:
                  print(" FIELD", json.dumps(r, ensure_ascii=False))

          wanted_tdis = {int(tdi) for _, (tdi, _), _ in candidates}
          wanted_tdis.add(54128)  # MoleMole.Config.QuestCond
          print("=== methods for candidates + QuestCond ===")
          for row in rows("methods.csv"):
              if int(row["type_definition_index"]) in wanted_tdis:
                  print(" METHOD", json.dumps(row, ensure_ascii=False))

          print("=== QuestCond fields ===")
          for row in rows("fields.csv"):
              if int(row["type_definition_index"]) == 54128:
                  print(" QUESTCOND_FIELD", json.dumps(row, ensure_ascii=False))

          print("=== exact accessor-method owners ===")
          accessor_needles = {
              "_g_get_acceptCond", "_s_set_acceptCond",
              "_g_get_acceptCondComb", "_s_set_acceptCondComb",
              "_g_get_subId", "_s_set_subId",
              "_g_get_mainId", "_s_set_mainId",
          }
          access_by_type = defaultdict(list)
          for row in rows("methods.csv"):
              if row.get("method_name") in accessor_needles:
                  access_by_type[(row["type_definition_index"], row["type_name"])].append(row)
          for (tdi, tname), found in sorted(access_by_type.items(), key=lambda kv: (-len(kv[1]), kv[0][1])):
              print(f"ACCESSOR_OWNER count={len(found)} type_definition_index={tdi} type={tname}")
              for r in found:
                  print(" ACCESSOR", json.dumps(r, ensure_ascii=False))
          PY
