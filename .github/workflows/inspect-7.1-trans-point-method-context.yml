name: Inspect 7.1 trans point scene method context

on:
  push:
    paths:
      - '.github/workflows/inspect-7.1-trans-point-method-context.yml'
      - 'tools/inspect_method_context_71.py'
      - 'tools/inspect_protocol_type_shape_71.py'
      - 'tools/decode_method_parameters_71.py'
      - 'tools/trace_protocol_delegate_slots_71.py'
      - 'tools/scan_owner_rpc_submit_layout_71.py'
      - 'genshinre/param71.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -e . zstandard capstone

      - name: Fetch exact official global 7.1 sample
        run: |
          python tools/fetch_sophon_targets.py \
            --manifest-url 'https://autopatchhk.yuanshen.com/client_app/sophon/manifests/cxhpq4g4rgg0/sMXGW2ll3Fuu/manifest_671e1a92a6cf53ff_8d4dfb34d2ee2cf64aae45a9b1ecf58d' \
            --chunk-prefix 'https://autopatchhk.yuanshen.com/client_app/sophon/chunks/cxhpq4g4rgg0/sMXGW2ll3Fuu' \
            --output /tmp/gi71 \
            --expected-exe-sha256 '08a3086d5f3fe695f01dab61efa42e442006b18e5e475b2520df356f6a073b7d' \
            --expected-metadata-sha256 '05ae04d7a91b91cc880217a56b0b01f3e67f845b06e894216654ec5d160e0da0'

      - name: Decode exact method parameter types
        run: |
          python tools/decode_method_parameters_71.py \
            /tmp/gi71/GenshinImpact.exe \
            /tmp/gi71/global-metadata.dat \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            versions/7.1.0-global/windows-x64/metadata/runtime-types.csv \
            /tmp/methods-decoded.csv \
            --summary /tmp/methods-decoded.summary.json
          python - <<'PY'
          import csv, json
          src = '/tmp/methods-decoded.csv'
          out = '/tmp/scene-method-band.json'
          rows = []
          with open(src, encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  try:
                      rva = int(row.get('rva') or '0', 0)
                  except ValueError:
                      continue
                  if row.get('type_name') == 'KLLNGCPBLMM' and 0x0F044000 <= rva <= 0x0F052000:
                      rows.append({
                          'rva': row.get('rva', ''),
                          'method_index': row.get('method_index', ''),
                          'method_name': row.get('method_name', ''),
                          'return_type': row.get('return_type', ''),
                          'parameter_types': json.loads(row.get('parameter_types') or '[]'),
                          'parameter_start': row.get('parameter_start', ''),
                          'parameter_count': row.get('parameter_count', ''),
                      })
          with open(out, 'w', encoding='utf-8') as f:
              json.dump(rows, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('scene method band rows:', len(rows))
          for row in rows:
              if 0x0F045000 <= int(row['rva'], 0) <= 0x0F046C00 or row['rva'] == '0xF050780':
                  print(row)
          PY

      - name: Inspect adjacent protocol wire shapes
        run: |
          python tools/inspect_protocol_type_shape_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/adjacent-protocol-shapes.json \
            --cmd 9369 \
            --cmd 26552 \
            --cmd 36641 \
            --cmd 20290 \
            --cmd 23366 \
            --cmd 25567

      - name: Trace candidate delegate slots
        run: |
          python tools/trace_protocol_delegate_slots_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/trans-point-delegate-slots.json \
            --slot 0x4b2a88 \
            --slot 0x4b2a90 \
            --slot 0x4b2ab0

      - name: Compare scene RPC sender-handler layout
        run: |
          python tools/scan_owner_rpc_submit_layout_71.py \
            /tmp/gi71/GenshinImpact.exe \
            /tmp/methods-decoded.csv \
            versions/7.1.0-global/windows-x64/registry/registry.csv \
            KLLNGCPBLMM \
            0x7246860 \
            /tmp/scene-rpc-submit-layout.json \
            --focus unlock_rsp_36641:0xF045790 \
            --focus unlock_rsp_20290:0xF0462A0 \
            --focus get_scene_area_rsp_23366:0xF046780 \
            --focus rsp_2666:0xF050780 \
            --focus enter_world_area_rsp_6774:0xF054180 \
            --focus get_scene_point_rsp_26:0xF058EF0 \
            --focus scene_trans_to_point_rsp_23515:0xF063210

      - name: Inspect scene method band
        run: |
          python tools/inspect_method_context_71.py \
            /tmp/gi71/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            /tmp/trans-point-method-context.json \
            --focus unlock_sender:0xF0452B0 \
            --focus unlock_sender_helper:0xF045640 \
            --focus unlock_tiny_helper:0xF045710 \
            --focus adjacent_26552:0xF045720 \
            --focus rsp_36641:0xF045790 \
            --focus post_36641:0xF045800 \
            --focus pre_rsp_20290:0xF0460C0 \
            --focus rsp_20290:0xF0462A0 \
            --focus post_rsp_20290:0xF046310 \
            --focus get_scene_area_rsp_23366:0xF046780 \
            --focus rsp_2666:0xF050780 \
            --focus enter_world_area_rsp_6774:0xF054180 \
            --focus get_scene_point_rsp_26:0xF058EF0 \
            --focus scene_point_unlock_notify_25567:0xF05F0F0 \
            --focus scene_trans_to_point_rsp_23515:0xF063210 \
            --focus scene_area_unlock_notify_27420:0xF0633D0 \
            --neighbor-count 16 \
            --max-body 0x2000

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: trans-point-method-context
          path: |
            /tmp/trans-point-method-context.json
            /tmp/trans-point-delegate-slots.json
            /tmp/scene-rpc-submit-layout.json
            /tmp/scene-method-band.json
            /tmp/adjacent-protocol-shapes.json
            /tmp/methods-decoded.summary.json
