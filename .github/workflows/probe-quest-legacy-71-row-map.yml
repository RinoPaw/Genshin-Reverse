name: Map 7.1 legacy QuestExcel rows to initial resource

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-71-row-map.yml"

concurrency:
  group: probe-quest-legacy-71-row-map-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact 7.1 QuestExcel object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-artifact
          gh run download 37440823447 \
            --repo RinoPaw/Genshin-Reverse \
            --name quest-excel-asset-chain-probe \
            --dir previous-artifact
          test -s previous-artifact/quest-output/MiHoYoBinData/3b87ae83.dat

      - name: Fetch initial AstaPS QuestExcel resource
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/AstaPS-Resource
          git clone --filter=blob:none --no-checkout \
            https://github.com/MeChen618/AstaPS-Resource.git /tmp/AstaPS-Resource
          git -C /tmp/AstaPS-Resource sparse-checkout init --no-cone
          git -C /tmp/AstaPS-Resource sparse-checkout set \
            'ExcelBinOutput/QuestExcelConfigData.json'
          git -C /tmp/AstaPS-Resource checkout \
            8c85a82f37341a422002a0352c89a142c4017e53
          test -s /tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json

      - name: Map resource subIds to native anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-71-row-map.txt
          import collections
          import hashlib
          import json
          import struct
          from pathlib import Path

          RAW=Path("previous-artifact/quest-output/MiHoYoBinData/3b87ae83.dat")
          RES=Path("/tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json")
          KEY=0xB1571A55

          raw=RAW.read_bytes()
          n=struct.unpack_from("<I",raw,0)[0]
          payload=raw[4:4+n]
          if n != len(raw)-4:
              raise SystemExit("wrapper mismatch")
          rows=json.loads(RES.read_text(encoding="utf-8"))
          if len(rows) != 25261:
              raise SystemExit(f"unexpected initial resource rows {len(rows)}")

          wanted={}
          valid_rows=[]
          for ordinal,row in enumerate(rows):
              sid=row.get("subId")
              if not isinstance(sid,int):
                  continue
              enc=(sid ^ KEY) & 0xffffffff
              wanted.setdefault(enc,[]).append((ordinal,sid))
              valid_rows.append((ordinal,sid,enc))

          # One pass over all byte-aligned u32 windows.
          hits={enc:[] for enc in wanted}
          for pos in range(0,len(payload)-3):
              u=struct.unpack_from("<I",payload,pos)[0]
              if u in hits:
                  hits[u].append(pos)

          mapped=[]
          unique=[]
          for ordinal,sid,enc in valid_rows:
              ps=hits[enc]
              item={
                  "ordinal":ordinal,
                  "subId":sid,
                  "encoded":f"0x{enc:08X}",
                  "hit_count":len(ps),
                  "positions":ps[:12],
              }
              mapped.append(item)
              if len(ps)==1:
                  unique.append((ordinal,sid,ps[0]))

          unique.sort()
          monotonic_pairs=0
          adjacent_pairs=0
          gap_values=[]
          for a,b in zip(unique,unique[1:]):
              if b[2] > a[2]:
                  monotonic_pairs += 1
              if b[0] == a[0]+1 and b[2] > a[2]:
                  adjacent_pairs += 1
                  gap_values.append(b[2]-a[2])

          # Longest run of consecutive JSON ordinals whose unique native anchors
          # are strictly increasing.
          runs=[]
          cur=[]
          for item in unique:
              if (
                  cur
                  and item[0] == cur[-1][0]+1
                  and item[2] > cur[-1][2]
              ):
                  cur.append(item)
              else:
                  if cur:runs.append(cur)
                  cur=[item]
          if cur:runs.append(cur)
          runs.sort(key=len,reverse=True)

          q351=[x for x in unique if 35100 <= x[1] <= 35107]
          out={
              "asset":{
                  "raw_size":len(raw),
                  "raw_sha256":hashlib.sha256(raw).hexdigest(),
                  "payload_size":len(payload),
                  "payload_sha256":hashlib.sha256(payload).hexdigest(),
              },
              "resource":{
                  "row_count":len(rows),
                  "sha256":hashlib.sha256(RES.read_bytes()).hexdigest(),
              },
              "subId_xor_key":f"0x{KEY:08X}",
              "rows_with_integer_subId":len(valid_rows),
              "encoded_value_count":len(wanted),
              "unique_anchor_rows":len(unique),
              "zero_hit_rows":sum(1 for x in mapped if x["hit_count"]==0),
              "multi_hit_rows":sum(1 for x in mapped if x["hit_count"]>1),
              "monotonic_unique_pairs":monotonic_pairs,
              "adjacent_monotonic_pairs":adjacent_pairs,
              "gap_stats":{
                  "count":len(gap_values),
                  "min":min(gap_values) if gap_values else None,
                  "max":max(gap_values) if gap_values else None,
                  "mean":sum(gap_values)/len(gap_values) if gap_values else None,
              },
              "longest_runs":[
                  {
                      "length":len(run),
                      "first_ordinal":run[0][0],
                      "last_ordinal":run[-1][0],
                      "first_subId":run[0][1],
                      "last_subId":run[-1][1],
                      "first_pos":run[0][2],
                      "last_pos":run[-1][2],
                  }
                  for run in runs[:20]
              ],
              "quest351":[
                  {"ordinal":o,"subId":sid,"position":pos}
                  for o,sid,pos in q351
              ],
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("quest-legacy-71-row-map.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          # Preserve only ambiguous/missing rows, not 25k verbose hits.
          exceptions=[x for x in mapped if x["hit_count"]!=1]
          Path("quest-legacy-71-row-map-exceptions.json").write_text(
              json.dumps(exceptions,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          # Unique anchors are needed by the field inference step.
          Path("quest-legacy-71-row-anchors.json").write_text(
              json.dumps(
                  [{"ordinal":o,"subId":sid,"position":pos} for o,sid,pos in unique],
                  ensure_ascii=False,indent=2
              )+"\n",encoding="utf-8"
          )

          if len(q351)!=8:
              raise SystemExit(f"Quest 351 unique anchors incomplete: {q351}")
          PY

      - name: Infer fields from native-order row spans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-71-field-inference.txt
          import collections
          import copy
          import json
          import struct
          from pathlib import Path

          raw=Path("previous-artifact/quest-output/MiHoYoBinData/3b87ae83.dat").read_bytes()
          size=struct.unpack_from("<I",raw,0)[0]
          payload=raw[4:4+size]
          rows=json.loads(
              Path("/tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json")
              .read_text(encoding="utf-8")
          )
          anchors=json.loads(Path("quest-legacy-71-row-anchors.json").read_text())
          by_ord={x["ordinal"]:x for x in anchors}

          # Native row order is defined by the binary anchors, not by JSON
          # ordinal order.  Use the next native anchor as the row end.
          native=sorted(anchors,key=lambda x:x["position"])
          spans=[]
          span_by_ord={}
          for a,b in zip(native,native[1:]):
              gap=b["position"]-a["position"]
              if not (8 <= gap <= 4096):
                  continue
              ordinal=a["ordinal"]
              row=rows[ordinal]
              item=(ordinal,row,a["position"],b["position"],gap)
              spans.append(item)
              span_by_ord[ordinal]=item

          def top_transform(field,width=4,limit=20):
              mask=(1<<(width*8))-1
              counters={k:collections.Counter() for k in ("xor","sub","add")}
              support=0
              for ordinal,row,a,b,gap in spans:
                  v=row.get(field)
                  if not isinstance(v,int):
                      continue
                  support+=1
                  v &= mask
                  data=payload[a+4:b]  # exclude the proven subId anchor itself
                  sets={k:set() for k in counters}
                  for off in range(0,max(0,len(data)-width+1)):
                      u=int.from_bytes(data[off:off+width],"little")
                      sets["xor"].add(u^v)
                      sets["sub"].add((u-v)&mask)
                      sets["add"].add((u+v)&mask)
                  for k in counters:counters[k].update(sets[k])
              return {
                  "field":field,
                  "width":width,
                  "eligible_rows":support,
                  **{
                      k:[
                          {"key":f"0x{x:0{width*2}X}","row_support":n}
                          for x,n in c.most_common(limit)
                      ]
                      for k,c in counters.items()
                  },
              }

          scalars=[]
          for field in (
              "mainId","order","subIdSet","descTextMapHash",
              "stepDescTextMapHash","guideTipsTextMapHash",
              "exclusiveNpcPriority",
          ):
              for width in (4,2,1):
                  scalars.append(top_transform(field,width))

          cond_rows=[]
          for ordinal,row,a,b,gap in spans:
              cond=row.get("acceptCond")
              if not isinstance(cond,list) or len(cond)!=1:
                  continue
              first=cond[0]
              if not isinstance(first,dict) or first.get("type")!="QUEST_COND_STATE_EQUAL":
                  continue
              param=first.get("param")
              if not isinstance(param,list) or not param or not isinstance(param[0],int):
                  continue
              cond_rows.append((ordinal,row,a,b,gap,param[0]))

          def rank_cond(width,limit=80):
              mask=(1<<(width*8))-1
              counters={k:collections.Counter() for k in ("xor","sub","add")}
              for ordinal,row,a,b,gap,v in cond_rows:
                  vv=v&mask
                  data=payload[a+4:b]
                  sets={k:set() for k in counters}
                  for off in range(0,max(0,len(data)-width+1)):
                      u=int.from_bytes(data[off:off+width],"little")
                      sets["xor"].add(u^vv)
                      sets["sub"].add((u-vv)&mask)
                      sets["add"].add((u+vv)&mask)
                  for k in counters:counters[k].update(sets[k])
              return {
                  "width":width,
                  "eligible_rows":len(cond_rows),
                  **{
                      k:[
                          {"key":f"0x{x:0{width*2}X}","row_support":n}
                          for x,n in c.most_common(limit)
                      ]
                      for k,c in counters.items()
                  },
              }

          # Differential groups: rows whose JSON semantics are identical after
          # removing identity/order and the first STATE_EQUAL target.  If a
          # group has equal native lengths, byte differences isolate the target
          # encoding much more cleanly than a whole-row frequency scan.
          def normalized(row):
              x=copy.deepcopy(row)
              for k in ("json_file","subId","subIdSet","order"):
                  x.pop(k,None)
              cond=x.get("acceptCond")
              if (
                  isinstance(cond,list) and len(cond)==1
                  and isinstance(cond[0],dict)
                  and cond[0].get("type")=="QUEST_COND_STATE_EQUAL"
                  and isinstance(cond[0].get("param"),list)
                  and cond[0]["param"]
                  and isinstance(cond[0]["param"][0],int)
              ):
                  cond[0]["param"][0]="<TARGET>"
                  return json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(",",":"))
              return None

          groups=collections.defaultdict(list)
          for ordinal,row,a,b,gap,v in cond_rows:
              key=normalized(row)
              if key is not None:
                  groups[key].append((ordinal,row,a,b,gap,v))

          diff_groups=[]
          diff_transform=collections.Counter()
          for members in groups.values():
              if len(members)<2:
                  continue
              lengths={m[4] for m in members}
              if len(lengths)!=1:
                  continue
              length=next(iter(lengths))
              blobs=[payload[m[2]:m[3]] for m in members]
              varying=[
                  off for off in range(length)
                  if len({blob[off] for blob in blobs})>1
              ]
              candidates=[]
              for width in (4,2,1):
                  mask=(1<<(width*8))-1
                  for off in range(4,length-width+1):
                      vals=[]
                      for m,blob in zip(members,blobs):
                          rawv=int.from_bytes(blob[off:off+width],"little")
                          target=m[5]&mask
                          vals.append((rawv,target))
                      for kind in ("xor","sub","add"):
                          if kind=="xor": keys={u^v for u,v in vals}
                          elif kind=="sub": keys={(u-v)&mask for u,v in vals}
                          else: keys={(u+v)&mask for u,v in vals}
                          if len(keys)==1:
                              keyv=next(iter(keys))
                              candidate={
                                  "width":width,"offset":off,"kind":kind,
                                  "key":f"0x{keyv:0{width*2}X}",
                              }
                              candidates.append(candidate)
                              diff_transform[(width,off,kind,keyv)] += 1
              diff_groups.append({
                  "member_count":len(members),
                  "length":length,
                  "members":[
                      {
                          "ordinal":m[0],
                          "subId":m[1].get("subId"),
                          "target":m[5],
                          "position":m[2],
                      }
                      for m in members[:30]
                  ],
                  "varying_offsets":varying,
                  "transform_candidates":candidates[:200],
              })

          diff_groups.sort(key=lambda x:(-x["member_count"],x["length"]))
          diff_rank=[
              {
                  "width":k[0],"offset":k[1],"kind":k[2],
                  "key":f"0x{k[3]:0{k[0]*2}X}","group_support":n,
              }
              for k,n in diff_transform.most_common(200)
          ]

          # Quest 351 targeted evidence with exact native row boundaries.
          quest351=[]
          for ordinal,row,a,b,gap in spans:
              sid=row.get("subId")
              if not isinstance(sid,int) or not (35100<=sid<=35107):
                  continue
              cond=row.get("acceptCond")
              target=None
              if isinstance(cond,list) and cond and isinstance(cond[0],dict):
                  param=cond[0].get("param")
                  if isinstance(param,list) and param and isinstance(param[0],int):
                      target=param[0]
              quest351.append({
                  "ordinal":ordinal,"subId":sid,"order":row.get("order"),
                  "accept_target":target,"position":a,"row_size":gap,
                  "row_hex":payload[a:b].hex(),
              })
          quest351.sort(key=lambda x:x["position"])

          out={
              "native_anchor_rows":len(native),
              "native_spans_le_4096":len(spans),
              "native_gap_stats":{
                  "min":min((x[4] for x in spans),default=None),
                  "max":max((x[4] for x in spans),default=None),
                  "mean":(
                      sum(x[4] for x in spans)/len(spans) if spans else None
                  ),
              },
              "scalar_transforms":scalars,
              "acceptCond_target":{
                  "eligible_single_state_equal_rows":len(cond_rows),
                  "fixed_width":[rank_cond(4),rank_cond(2),rank_cond(1)],
                  "differential_group_count":len(diff_groups),
                  "differential_groups":diff_groups[:120],
                  "differential_transform_rank":diff_rank,
              },
              "quest351":quest351,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("quest-legacy-71-field-inference.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-71-row-map
          path: |
            quest-legacy-71-row-map.txt
            quest-legacy-71-row-map.json
            quest-legacy-71-row-map-exceptions.json
            quest-legacy-71-row-anchors.json
            quest-legacy-71-field-inference.txt
            quest-legacy-71-field-inference.json
          if-no-files-found: warn
