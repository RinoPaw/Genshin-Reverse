name: Probe Quest 351 full native decode

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest351-full-native.yml"

concurrency:
  group: probe-quest351-full-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone pefile zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Download exact Quest 351 payload evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf evidence/q71
          mkdir -p evidence/q71
          gh run download 37440823447 \
            --repo RinoPaw/Genshin-Reverse \
            --name quest-excel-asset-chain-probe \
            --dir evidence/q71
          test -s evidence/q71/quest351-payload.bin
          sha256sum evidence/q71/quest351-payload.bin
      - name: Checkout pinned binconfig analyzer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/genshin-7.0-local-re-devkit
          git clone --filter=blob:none https://github.com/owomocha/genshin-7.0-local-re-devkit.git /tmp/genshin-7.0-local-re-devkit
          git -C /tmp/genshin-7.0-local-re-devkit checkout --detach fb91dfad1f6047e30dea2f98727e5af45d9bd6e0
      - name: Decode exact Quest 351 full payload
        shell: bash
        env:
          PYTHONPATH: /tmp/genshin-7.0-local-re-devkit/src:/tmp/genshin-7.0-local-re-devkit/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest351-full-native.txt
          import csv,json
          from pathlib import Path
          from genshin_re import binconfig as BC
          import gamedata_binconfig_ext as EXT

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          PAYLOAD=Path("evidence/q71/quest351-payload.bin")
          TARGETS={
              "full_root_AFIOOHMJHDM":0x10409D40,
              "ordinary_array_LAIMPNDEFCL":0x9C15C80,
              "ordinary_row_LAIMPNDEFCL":0x9C15DF0,
              "quest_exec_scalar":0x1386F2A0,
              "quest_content_scalar":0xB407BB0,
          }
          FOCUS_TYPES={
              "AFIOOHMJHDM","LAIMPNDEFCL","KIMCPAKMJMH","JPGNLOPMNHN",
              "OOPFBIEAILL","KPHLFFOELCG",
          }

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))
          methods=rows("methods.csv")
          types=rows("types.csv")
          fields=rows("fields.csv")

          deser={}
          one_by_class={}
          for m in methods:
              try:rva=int(m.get("rva") or "0",0)
              except Exception:continue
              if not rva:continue
              try:params=json.loads(m.get("parameter_types") or "[]")
              except Exception:continue
              if not params or params[0]!="FNIAHJGHFAK":continue
              cls=m.get("type_name") or "?"
              deser[rva]=(cls,m.get("method_name") or "?",str(params))
              if len(params)==1:
                  ret=(m.get("return_type") or "").lower()
                  pr=0 if m.get("method_name") in {"FromBinaryInner","GMENPOPMKAA"} else (1 if ret=="void" else 2)
                  prev=one_by_class.get(cls)
                  if prev is None or pr<prev[0]:one_by_class[cls]=(pr,rva)

          row_deser={cls:rva for cls,(_pr,rva) in one_by_class.items()}
          exe=BC.Exe(str(EXE))
          EXT.install(exe,deser,row_deser,clsfields={},deser1=row_deser)
          EXT.install2()

          # Register the exact 7.1 BinConfig UTF-8 helper. The pinned analyzer
          # otherwise treats these calls as empty nested deserializers and
          # under-consumes the stream.
          STRING_HELPER_RVA=0xFD53090
          BC.H_STRINGS=tuple(dict.fromkeys((*BC.H_STRINGS, exe.base+STRING_HELPER_RVA)))
          # Managed array allocation helper also moved in 7.1. Register it so
          # string[] / scalar[] fields are not collapsed into a single string.
          ARRAY_NEW_RVA=0x50B230
          BC.H_ARRAY_NEW=exe.base+ARRAY_NEW_RVA

          schemas={}
          for name,rva in TARGETS.items():
              try:
                  sch=BC.build(exe,rva,deser,cache={})
                  schemas[name]=sch
                  print("\n=== SCHEMA",name,hex(rva),"===")
                  print(json.dumps(sch,ensure_ascii=False,indent=2))
              except Exception as exc:
                  schemas[name]={"error":type(exc).__name__+":"+str(exc)}
                  print("SCHEMA_ERROR",name,repr(exc))

          print("\n=== FOCUS TYPE METADATA ===")
          focus_tdis={int(t["type_definition_index"]) for t in types if t.get("type_name") in FOCUS_TYPES}
          focus={
              "types":[t for t in types if int(t["type_definition_index"]) in focus_tdis],
              "fields":[f for f in fields if int(f.get("type_definition_index") or -1) in focus_tdis],
              "methods":[m for m in methods if int(m.get("type_definition_index") or -1) in focus_tdis],
          }
          print(json.dumps(focus,ensure_ascii=False,indent=2))

          payload=PAYLOAD.read_bytes()
          root=schemas.get("full_root_AFIOOHMJHDM",{})
          decode={}
          if "error" not in root:
              rd=BC.Reader(payload);rd.p=0
              try:
                  value=rd.record(root)
                  decode={
                      "ok":True,
                      "consumed":rd.p,
                      "payload_size":len(payload),
                      "full_consume":rd.p==len(payload),
                      "value":value,
                  }
              except Exception as exc:
                  decode={
                      "ok":False,
                      "consumed":rd.p,
                      "payload_size":len(payload),
                      "error":type(exc).__name__+":"+str(exc),
                  }
          print("\n=== QUEST351 ROOT DECODE ===")
          print(json.dumps(decode,ensure_ascii=False,indent=2))

          # Exact payload byte 59 starts the ordinary sub-quest array:
          # raw count 0xA74F0AC3 XOR 0xA74F0ACB == 8.
          array_decode={}
          array_schema=schemas.get("ordinary_array_LAIMPNDEFCL",{})
          if "error" not in array_schema:
              rd=BC.Reader(payload);rd.p=59
              try:
                  value=rd.record(array_schema)
                  array_decode={
                      "ok":True,
                      "start":59,
                      "end":rd.p,
                      "consumed":rd.p-59,
                      "value":value,
                  }
              except Exception as exc:
                  array_decode={
                      "ok":False,
                      "start":59,
                      "end":rd.p,
                      "consumed":rd.p-59,
                      "error":type(exc).__name__+":"+str(exc),
                  }
          print("\n=== QUEST351 ORDINARY ARRAY DECODE ===")
          print(json.dumps(array_decode,ensure_ascii=False,indent=2))

          report={
              "payload_size":len(payload),
              "targets":{k:f"0x{v:X}" for k,v in TARGETS.items()},
              "schemas":schemas,
              "focus_metadata":focus,
              "decode":decode,
              "ordinary_array_decode":array_decode,
          }
          Path("quest351-full-native.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Census native accept-condition candidate owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-acceptcond-census.txt
          import csv,json
          from collections import defaultdict
          from pathlib import Path

          META=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv")
          fields=rows("fields.csv")
          methods=rows("methods.csv")
          tb={int(t["type_definition_index"]):t for t in types}
          fb=defaultdict(list); mb=defaultdict(list)
          for f in fields: fb[int(f["type_definition_index"])].append(f)
          for m in methods: mb[int(m["type_definition_index"])].append(m)

          # First find record-like types that own a semantic QuestCondType field.
          cond_records=[]
          for tdi,ff in fb.items():
              hits=[f for f in ff if "QuestCondType" in (f.get("field_type") or "")]
              if hits:
                  cond_records.append((tdi,tb.get(tdi,{}),hits))

          print("QUEST_COND_RECORD_TYPES",len(cond_records))
          cond_names=set()
          for tdi,t,hits in cond_records:
              name=t.get("type_name") or ""
              if name: cond_names.add(name)
              print("\n=== COND RECORD",name,tdi,"===")
              print(json.dumps({
                  "type":t,
                  "cond_type_fields":hits,
                  "all_fields":fb.get(tdi,[]),
                  "binary_readers":[m for m in mb.get(tdi,[]) if "FNIAHJGHFAK" in (m.get("parameter_types") or "")],
              },ensure_ascii=False,indent=2))

          # Then find every type that contains one of those records, including
          # arrays/lists. Those are the only plausible native acceptCond owners.
          owners=[]
          for tdi,ff in fb.items():
              hits=[]
              for f in ff:
                  ft=f.get("field_type") or ""
                  if any(name and name in ft for name in cond_names):
                      hits.append(f)
              if hits:
                  owners.append((tdi,tb.get(tdi,{}),hits))

          print("\nQUEST_COND_CONTAINER_OWNERS",len(owners))
          for tdi,t,hits in owners:
              print("\n=== COND OWNER",t.get("type_name"),tdi,"===")
              print(json.dumps({
                  "type":t,
                  "candidate_fields":hits,
                  "all_fields":fb.get(tdi,[]),
                  "binary_readers":[m for m in mb.get(tdi,[]) if "FNIAHJGHFAK" in (m.get("parameter_types") or "")],
              },ensure_ascii=False,indent=2))

          # Broad sanity scan for any Quest-state/condition semantic field types
          # that might use a different record class name.
          semantic=[]
          for f in fields:
              ft=f.get("field_type") or ""
              if any(x in ft for x in ("QuestCond","QuestState","QuestContent","QuestExec")):
                  semantic.append({
                      "owner":tb.get(int(f["type_definition_index"]),{}),
                      "field":f,
                  })
          print("\nSEMANTIC_QUEST_FIELD_TYPES",len(semantic))
          print(json.dumps(semantic,ensure_ascii=False,indent=2))
          PY

      - name: Trace native QuestCond reader callers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-questcond-callers.txt
          import bisect,csv,json
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM
          from genshinre.pe import PEImage

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS={
              "QuestCond.FromBinary(reader)":0x11582570,
              "QuestCond.FromBinaryInner(reader)":0x115825D0,
              "QuestCond.FromBinary(reader,kind)":0x115828F0,
              "QuestCond.FromBinaryInner(reader,kind)":0x11582950,
          }

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          methods=rows("methods.csv"); fields=rows("fields.csv"); types=rows("types.csv")
          tb={int(t["type_definition_index"]):t for t in types}
          fb={}
          for f in fields: fb.setdefault(int(f["type_definition_index"]),[]).append(f)
          starts=[]; by={}
          for m in methods:
              try:r=int(m.get("rva") or "0",0)
              except Exception:continue
              if r:
                  starts.append(r); by.setdefault(r,[]).append(m)
          starts=sorted(set(starts))
          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i]; e=starts[i+1] if i+1<len(starts) else s+0x1000
              if not(s<=rva<e):return None
              meta=by.get(s,[])
              tdis=sorted({int(m["type_definition_index"]) for m in meta if m.get("type_definition_index")})
              return {
                  "start":f"0x{s:X}","end":f"0x{e:X}",
                  "methods":meta,
                  "types":[tb.get(t,{}) for t in tdis],
                  "fields":[f for t in tdis for f in fb.get(t,[])],
              }

          report={"targets":{},"callers":{}}
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          with PEImage(EXE) as image:
              base=image.image_base
              # Disassemble all four QuestCond readers.
              for name,target in TARGETS.items():
                  ow=owner(target)
                  start=int(ow["start"],16) if ow else target
                  end=min(int(ow["end"],16),start+0x900) if ow else target+0x900
                  body=image.read_rva(start,end-start)
                  insns=[]
                  for ins in md.disasm(body,base+start):
                      rec={"rva":f"0x{ins.address-base:X}","bytes":ins.bytes.hex(),
                           "mnemonic":ins.mnemonic,"op_str":ins.op_str}
                      if ins.mnemonic=="call" and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          tr=int(ins.operands[0].imm-base)
                          rec["call_target"]=f"0x{tr:X}"
                          rec["call_owner"]=owner(tr)
                      insns.append(rec)
                  report["targets"][name]={"target":f"0x{target:X}","owner":ow,"instructions":insns}
                  print("\n=== TARGET",name,f"0x{target:X}","===")
                  print(json.dumps({"owner":ow},ensure_ascii=False,indent=2))
                  for x in insns:
                      print(x["rva"],x["bytes"],x["mnemonic"],x["op_str"],
                            "-> "+x.get("call_target","") if "call_target" in x else "")

              # Direct rel32 callers across executable code.
              target_by_va={base+rva:name for name,rva in TARGETS.items()}
              callers={name:[] for name in TARGETS}
              for sec in image.sections:
                  if not(sec.characteristics&0x20000000):continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  off=0
                  while True:
                      off=blob.find(b"\\xE8",off)
                      if off<0 or off+5>len(blob):break
                      rel=int.from_bytes(blob[off+1:off+5],"little",signed=True)
                      crva=sec.virtual_address+off
                      name=target_by_va.get(base+crva+5+rel)
                      if name is not None:
                          callers[name].append({"call_rva":f"0x{crva:X}","owner":owner(crva)})
                      off+=1
              report["callers"]=callers
              for name,items in callers.items():
                  print("\n=== CALLERS",name,len(items),"===")
                  print(json.dumps(items,ensure_ascii=False,indent=2))

          Path("quest71-questcond-callers.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest351-full-native
          path: |
            quest351-full-native.txt
            quest351-full-native.json
            quest71-acceptcond-census.txt
            quest71-questcond-callers.txt
            quest71-questcond-callers.json
          if-no-files-found: error