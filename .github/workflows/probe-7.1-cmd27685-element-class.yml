name: Probe exact 7.1 packet collection element class slots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-7.1-cmd27685-element-class.yml'
      - 'scripts/probe-7.1-cmd27685-element-class-xrefs.py'
      - 'tests/test_cmd27685_element_class_xrefs_71.py'

permissions:
  contents: read

concurrency:
  group: original-71-cmd27685-element-class-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . zstandard
      - name: Fetch exact original Global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Validate exact source-slot constraints
        run: python -m unittest discover -s tests -p 'test_cmd27685_element_class_xrefs_71.py' -v
      - name: Trace exact native packet collection class slots and metadata
        run: |
          python scripts/probe-7.1-cmd27685-element-class-xrefs.py \
            --exe inputs/7.1.0-global/GenshinImpact.exe \
            --methods versions/7.1.0-global/windows-x64/metadata/methods.csv \
            --fields versions/7.1.0-global/windows-x64/metadata/fields.csv \
            --output work/cmd27685-native-element-class.json
      - uses: actions/upload-artifact@v7
        with:
          name: exact-71-cmd27685-element-class-xrefs
          path: work/cmd27685-native-element-class.json
          retention-days: 7
          if-no-files-found: error
