name: Probe exact 7.1 Gadget metadata tokens

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-7.1-chest-gadget-schema.py'
      - '.github/workflows/probe-7.1-chest-gadget-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify pinned native metadata and locate opaque Gadget fields
        run: |
          mkdir -p work
          python scripts/probe-7.1-chest-gadget-schema.py --output work/chest-71-gadget-metadata.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/chest-71-gadget-metadata.json").read_text())
          print("CHEST_GADGET_NATIVE_SCHEMA_BEGIN")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("CHEST_GADGET_NATIVE_SCHEMA_END")
          print("Status:", report["status"])
          print("Matched owner count:", report["matchedOwnerCount"])
          for token, rows in report["tokenHits"].items():
              print("Token", token, "field occurrences:", len(rows))
              for row in rows:
                  print(" ", row)
          for index, data in report["owners"].items():
              print("Owner", index, "fields:", data["fieldCount"],
                    "candidate binary-reader methods:",
                    [m["methodIndex"] for m in data["methods"] if m["binaryReaderSignatureCandidate"]])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: chest-71-gadget-native-metadata-tokens
          path: work/chest-71-gadget-metadata.json
          retention-days: 7
          if-no-files-found: error
