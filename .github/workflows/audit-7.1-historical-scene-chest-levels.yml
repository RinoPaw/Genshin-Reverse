name: Audit historical AstaPS chest scene levels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-7.1-historical-scene-chest-levels.yml']

permissions:
  contents: read

concurrency:
  group: research-71-historical-scene-level-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch exact pinned historical resource commit with sparse checkout
        shell: bash
        run: |
          git init work/resources
          git -C work/resources remote add origin https://github.com/MeChen618/AstaPS-Resource.git
          git -C work/resources sparse-checkout init --no-cone
          printf '/Scripts/Scene/**\n/ExcelBinOutput/GadgetExcelConfigData.json\n' > work/resources/.git/info/sparse-checkout
          git -C work/resources fetch --depth 1 --filter=blob:none origin 85b81a691fcf3d9e8e7db50a8febc8f9043bc084
          git -C work/resources checkout --detach FETCH_HEAD
          test "$(git -C work/resources rev-parse HEAD)" = 85b81a691fcf3d9e8e7db50a8febc8f9043bc084
      - name: Download pinned existing AstaPS source classifier
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/RinoPaw/AstaPS/e2541630f5ae4d4c95b81f7440293d3419a776d1/tools/audit_chest_scene_exceptions.py \
            --output work/pinned-chest-scanner.py
      - name: Count direct level values on historical chest instances
        run: |
          python scripts/audit-7.1-historical-scene-chest-levels.py \
            --resources work/resources \
            --scanner work/pinned-chest-scanner.py \
            --resource-commit 85b81a691fcf3d9e8e7db50a8febc8f9043bc084 \
            --output work/historical-chest-scene-levels.json
      - uses: actions/upload-artifact@v7
        with:
          name: historical-chest-scene-level-coverage
          path: work/historical-chest-scene-levels.json
          retention-days: 7
          if-no-files-found: error
