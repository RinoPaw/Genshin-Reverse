name: Probe Quest 7.1 acceptCond runtime owners

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - ".github/workflows/probe-quest71-acceptcond-runtime-owners.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . pefile zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Resolve all QuestCond record arrays
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-acceptcond-runtime-owners.txt
          import csv,json
          from collections import defaultdict
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv"); fields=rows("fields.csv")
          tb={int(t["type_definition_index"]):t for t in types}

          cond_record_names=set()
          for f in fields:
              if "QuestCondType" not in (f.get("field_type") or ""):
                  continue
              owner=tb.get(int(f["type_definition_index"]),{})
              name=owner.get("type_name") or ""
              if name and name!="QuestCondType":
                  cond_record_names.add(name)
          print("COND_RECORD_NAMES",json.dumps(sorted(cond_record_names),ensure_ascii=False))

          with PEImage(EXE) as image:
              base=image.image_base
              type_array_va=int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva,8),"little"
              )
              type_array_rva=type_array_va-base
              n=PROFILE_71.runtime_type_count

              def entry(index):
                  if not (0<=index<n): return None
                  raw=image.read_rva(type_array_rva+index*16,16)
                  if len(raw)!=16:return None
                  return {
                      "index":index,
                      "data_u64":int.from_bytes(raw[:8],"little"),
                      "data_u32":int.from_bytes(raw[:4],"little"),
                      "kind":raw[0x0A],
                      "raw":raw.hex(),
                  }

              def class_name_from_entry(e):
                  if not e or e["kind"] not in (0x11,0x12):
                      return None
                  tdi=e["data_u32"]
                  t=tb.get(tdi)
                  if not t:return None
                  return tdi,t.get("type_name") or ""

              def resolve_szarray(index):
                  e=entry(index)
                  if not e or e["kind"]!=0x1D:return None
                  candidates=[]
                  ptr=e["data_u64"]
                  if base <= ptr:
                      rva=ptr-base
                      delta=rva-type_array_rva
                      if delta>=0 and delta%16==0:
                          candidates.append(delta//16)
                  candidates.append(e["data_u32"])
                  seen=set()
                  for ix in candidates:
                      if ix in seen:continue
                      seen.add(ix)
                      ee=entry(ix)
                      got=class_name_from_entry(ee)
                      if not got:continue
                      tdi,name=got
                      return {
                          "array_type_index":index,
                          "element_type_index":ix,
                          "element_type_definition_index":tdi,
                          "element_type_name":name,
                      }
                  return None

              arrays=[]
              for f in fields:
                  if (f.get("field_type") or "")!="kind_0x1D":continue
                  try:ix=int(f.get("field_type_index") or "-1")
                  except ValueError:continue
                  res=resolve_szarray(ix)
                  if not res:continue
                  arrays.append({
                      "owner":tb.get(int(f["type_definition_index"]),{}),
                      "field":f,
                      "resolved":res,
                  })

              cond_arrays=[
                  x for x in arrays
                  if x["resolved"]["element_type_name"] in cond_record_names
              ]
              print("COND_RECORD_ARRAY_FIELDS",len(cond_arrays))
              print(json.dumps(cond_arrays,ensure_ascii=False,indent=2))

              qcond=[
                  x for x in arrays
                  if x["resolved"]["element_type_name"]=="QuestCond"
              ]
              print("QUESTCOND_ARRAY_FIELDS",len(qcond))
              print(json.dumps(qcond,ensure_ascii=False,indent=2))

              quest_owner_names={"LAIMPNDEFCL","AFIOOHMJHDM","RandomQuestExcelConfig"}
              quest_arrays=[
                  x for x in arrays
                  if x["owner"].get("type_name") in quest_owner_names
              ]
              print("QUEST_OWNER_ALL_ARRAY_FIELDS",len(quest_arrays))
              print(json.dumps(quest_arrays,ensure_ascii=False,indent=2))

              Path("quest71-acceptcond-runtime-owners.json").write_text(
                  json.dumps({
                      "condition_record_names":sorted(cond_record_names),
                      "condition_record_array_fields":cond_arrays,
                      "questcond_array_fields":qcond,
                      "quest_owner_array_fields":quest_arrays,
                  },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Resolve Quest root generic containers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-acceptcond-generic-owners.txt
          import csv,json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv"); fields=rows("fields.csv")
          tb={int(t["type_definition_index"]):t for t in types}

          with PEImage(EXE) as image:
              base=image.image_base
              type_array_va=int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva,8),"little"
              )
              type_array_rva=type_array_va-base
              n=PROFILE_71.runtime_type_count

              def read_va(va,size):
                  if not (base <= va): return b""
                  try:return image.read_rva(va-base,size)
                  except Exception:return b""

              def entry(index):
                  if not (0<=index<n): return None
                  raw=image.read_rva(type_array_rva+index*16,16)
                  if len(raw)!=16:return None
                  return {
                      "index":index,
                      "data_u64":int.from_bytes(raw[:8],"little"),
                      "data_u32":int.from_bytes(raw[:4],"little"),
                      "kind":raw[0x0A],
                      "raw":raw.hex(),
                  }

              def type_from_ptr(ptr):
                  if not (base <= ptr): return None
                  rva=ptr-base
                  delta=rva-type_array_rva
                  if delta>=0 and delta%16==0:
                      e=entry(delta//16)
                  else:
                      raw=read_va(ptr,16)
                      if len(raw)!=16:return None
                      e={
                          "index":None,
                          "data_u64":int.from_bytes(raw[:8],"little"),
                          "data_u32":int.from_bytes(raw[:4],"little"),
                          "kind":raw[0x0A],
                          "raw":raw.hex(),
                      }
                  if not e:return None
                  out={"runtime_type":e}
                  if e["kind"] in (0x11,0x12):
                      tdi=e["data_u32"]
                      t=tb.get(tdi)
                      if t:
                          out["type_definition_index"]=tdi
                          out["type_name"]=t.get("type_name") or ""
                  return out

              def resolve_generic(index):
                  e=entry(index)
                  if not e or e["kind"]!=0x15:return None
                  gptr=e["data_u64"]
                  raw=read_va(gptr,32)
                  out={
                      "runtime_type_index":index,
                      "runtime_type":e,
                      "generic_class_ptr":hex(gptr),
                      "generic_class_raw":raw.hex(),
                  }
                  if len(raw)<24:return out
                  ptrs=[int.from_bytes(raw[i:i+8],"little") for i in range(0,len(raw),8)]
                  out["generic_class_ptrs"]=[hex(x) for x in ptrs]
                  out["generic_type"]=type_from_ptr(ptrs[0]) if ptrs else None
                  for label,p in (
                      ("class_inst",ptrs[1] if len(ptrs)>1 else 0),
                      ("method_inst",ptrs[2] if len(ptrs)>2 else 0),
                  ):
                      iraw=read_va(p,16)
                      inst={"ptr":hex(p),"raw":iraw.hex()}
                      if len(iraw)>=16:
                          argc=int.from_bytes(iraw[:4],"little")
                          argv=int.from_bytes(iraw[8:16],"little")
                          inst["argc"]=argc
                          inst["argv"]=hex(argv)
                          inst["args"]=[]
                          if argc<=16:
                              avraw=read_va(argv,argc*8)
                              if len(avraw)==argc*8:
                                  for i in range(argc):
                                      tptr=int.from_bytes(avraw[i*8:(i+1)*8],"little")
                                      inst["args"].append({
                                          "ptr":hex(tptr),
                                          "type":type_from_ptr(tptr),
                                      })
                      out[label]=inst
                  return out

              owners={"AFIOOHMJHDM","LAIMPNDEFCL","RandomQuestExcelConfig"}
              result=[]
              for f in fields:
                  if (f.get("field_type") or "")!="kind_0x15":continue
                  owner=tb.get(int(f["type_definition_index"]),{})
                  if owner.get("type_name") not in owners:continue
                  try:ix=int(f.get("field_type_index") or "-1")
                  except ValueError:continue
                  result.append({
                      "owner":owner,
                      "field":f,
                      "resolved":resolve_generic(ix),
                  })

              print("QUEST_OWNER_GENERIC_FIELDS",len(result))
              print(json.dumps(result,ensure_ascii=False,indent=2))
              Path("quest71-acceptcond-generic-owners.json").write_text(
                  json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Resolve genericinst via metadata registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-acceptcond-generic-registration.txt
          import csv,json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGET_TYPE_INDEXES=(629808,577923)

          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv")
          tb={int(t["type_definition_index"]):t for t in types}

          with PEImage(EXE) as image:
              base=image.image_base
              type_array_va=int.from_bytes(
                  image.read_rva(PROFILE_71.type_array_pointer_rva,8),"little"
              )
              type_array_rva=type_array_va-base

              def read_va(va,n):
                  if va<base:return b""
                  try:return image.read_rva(va-base,n)
                  except Exception:return b""

              def runtime_entry(ix):
                  raw=image.read_rva(type_array_rva+ix*16,16)
                  return {
                      "index":ix,
                      "data_u64":int.from_bytes(raw[:8],"little"),
                      "data_u32":int.from_bytes(raw[:4],"little"),
                      "kind":raw[10],
                      "raw":raw.hex(),
                  }

              # Locate the Il2CppMetadataRegistration by the verified
              # (typesCount, types*) pair. In current IL2CPP this is the fourth
              # count/pointer pair after genericClasses, genericInsts and
              # genericMethodTable.
              ptr_pat=type_array_va.to_bytes(8,"little")
              candidates=[]
              for sec in image.sections:
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  off=0
                  while True:
                      off=blob.find(ptr_pat,off)
                      if off<0:break
                      rva=sec.virtual_address+off
                      for count_off in (rva-8,rva-4):
                          raw=image.read_rva(count_off,8)
                          if len(raw)>=4 and int.from_bytes(raw[:4],"little")==PROFILE_71.runtime_type_count:
                              candidates.append({
                                  "pointer_rva":rva,
                                  "count_rva":count_off,
                                  "section":sec.name,
                              })
                      off+=1
              print("TYPE_PAIR_CANDIDATES",json.dumps(candidates,indent=2))

              reports=[]
              for cand in candidates:
                  # Preferred aligned layout: uint64 count, pointer; types pair at +0x30.
                  reg_rva=cand["pointer_rva"]-0x38
                  raw=image.read_rva(reg_rva,0x80)
                  if len(raw)<0x40:continue
                  q=[int.from_bytes(raw[i:i+8],"little") for i in range(0,len(raw),8)]
                  rep={
                      "registration_rva":hex(reg_rva),
                      "qwords":[hex(x) for x in q],
                  }
                  if len(q)>=8:
                      rep["generic_classes_count"]=q[0]
                      rep["generic_classes_ptr"]=hex(q[1])
                      rep["generic_insts_count"]=q[2]
                      rep["generic_insts_ptr"]=hex(q[3])
                      rep["generic_method_table_count"]=q[4]
                      rep["generic_method_table_ptr"]=hex(q[5])
                      rep["types_count"]=q[6]
                      rep["types_ptr"]=hex(q[7])
                  reports.append(rep)
              print("REGISTRATION_REPORTS",json.dumps(reports,indent=2))

              resolved=[]
              for rep in reports:
                  if rep.get("types_count")!=PROFILE_71.runtime_type_count:
                      continue
                  if int(rep.get("types_ptr","0"),16)!=type_array_va:
                      continue
                  gcc=int(rep["generic_classes_count"])
                  gcp=int(rep["generic_classes_ptr"],16)
                  if not (0<gcc<2_000_000 and gcp>=base):
                      continue

                  for tix in TARGET_TYPE_INDEXES:
                      te=runtime_entry(tix)
                      gidx=te["data_u32"]
                      item={"runtime_type":te,"generic_class_index":gidx}
                      if gidx>=gcc:
                          item["error"]="generic class index out of range"
                          resolved.append(item);continue
                      pblob=read_va(gcp+gidx*8,8)
                      if len(pblob)!=8:
                          item["error"]="generic class pointer unreadable"
                          resolved.append(item);continue
                      gcptr=int.from_bytes(pblob,"little")
                      item["generic_class_ptr"]=hex(gcptr)
                      gcraw=read_va(gcptr,32)
                      item["generic_class_raw"]=gcraw.hex()
                      if len(gcraw)<24:
                          item["error"]="generic class unreadable"
                          resolved.append(item);continue

                      # Modern Il2CppGenericClass: typeDefinitionIndex + padding,
                      # context.class_inst, context.method_inst, cached_class.
                      tdi=int.from_bytes(gcraw[:4],"little")
                      item["generic_type_definition_index"]=tdi
                      item["generic_type"]=tb.get(tdi,{})
                      class_inst=int.from_bytes(gcraw[8:16],"little")
                      method_inst=int.from_bytes(gcraw[16:24],"little")
                      item["class_inst_ptr"]=hex(class_inst)
                      item["method_inst_ptr"]=hex(method_inst)

                      def decode_inst(ptr):
                          iraw=read_va(ptr,16)
                          out={"ptr":hex(ptr),"raw":iraw.hex()}
                          if len(iraw)<16:return out
                          argc=int.from_bytes(iraw[:4],"little")
                          argv=int.from_bytes(iraw[8:16],"little")
                          out.update({"argc":argc,"argv":hex(argv),"args":[]})
                          if argc>16:return out
                          av=read_va(argv,argc*8)
                          if len(av)!=argc*8:return out
                          for i in range(argc):
                              tp=int.from_bytes(av[i*8:(i+1)*8],"little")
                              traw=read_va(tp,16)
                              a={"ptr":hex(tp),"raw":traw.hex()}
                              if len(traw)==16:
                                  kind=traw[10]
                                  data=int.from_bytes(traw[:4],"little")
                                  a["kind"]=kind
                                  a["data_u32"]=data
                                  if kind in (0x11,0x12):
                                      a["type_definition_index"]=data
                                      a["type"]=tb.get(data,{})
                              out["args"].append(a)
                          return out

                      item["class_inst"]=decode_inst(class_inst)
                      item["method_inst"]=decode_inst(method_inst) if method_inst else None
                      resolved.append(item)

              print("RESOLVED_GENERICINST",json.dumps(resolved,ensure_ascii=False,indent=2))
              Path("quest71-acceptcond-generic-registration.json").write_text(
                  json.dumps(resolved,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Inspect Quest root generic reader types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest71-root-generic-readers.txt
          import csv,json
          from collections import defaultdict
          from pathlib import Path

          META=Path("versions/7.1.0-global/windows-x64/metadata")
          TARGETS={"LDABEPAGBGK","PAMGBICKEOA"}
          def rows(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types=rows("types.csv"); fields=rows("fields.csv"); methods=rows("methods.csv")
          tb={int(t["type_definition_index"]):t for t in types}
          fb=defaultdict(list); mb=defaultdict(list)
          for f in fields: fb[int(f["type_definition_index"])].append(f)
          for m in methods: mb[int(m["type_definition_index"])].append(m)

          report=[]
          for t in types:
              if t.get("type_name") not in TARGETS: continue
              tdi=int(t["type_definition_index"])
              item={
                  "type":t,
                  "fields":fb.get(tdi,[]),
                  "methods":mb.get(tdi,[]),
              }
              report.append(item)
              print("\n=== TYPE",t.get("type_name"),tdi,"===")
              print(json.dumps(item,ensure_ascii=False,indent=2))

          # Also include types referenced directly by their fields.
          refs=set()
          for item in report:
              for f in item["fields"]:
                  ft=f.get("field_type") or ""
                  if ft and not ft.startswith("kind_") and ft not in {
                      "bool","byte","sbyte","short","ushort","int32","uint32",
                      "int64","uint64","float","double","string","object",
                  }:
                      refs.add(ft)
          print("\nDIRECT_FIELD_TYPE_REFS",sorted(refs))
          for t in types:
              if t.get("type_name") not in refs:continue
              tdi=int(t["type_definition_index"])
              print("\n=== REF TYPE",t.get("type_name"),tdi,"===")
              print(json.dumps({
                  "type":t,
                  "fields":fb.get(tdi,[]),
                  "methods":mb.get(tdi,[]),
              },ensure_ascii=False,indent=2))

          Path("quest71-root-generic-readers.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest71-acceptcond-runtime-owners
          path: |
            quest71-acceptcond-runtime-owners.txt
            quest71-acceptcond-runtime-owners.json
            quest71-acceptcond-generic-owners.txt
            quest71-acceptcond-generic-owners.json
            quest71-acceptcond-generic-registration.txt
            quest71-acceptcond-generic-registration.json
            quest71-root-generic-readers.txt
            quest71-root-generic-readers.json
          if-no-files-found: error