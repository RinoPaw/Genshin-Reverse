name: Build Quest 7.1 recovery manifest

on:
  push:
    branches:
      - decoder/questexcel-native-71
    paths:
      - "genshinre/questrecovery71.py"
      - "tests/test_questrecovery71.py"
      - ".github/workflows/build-quest71-recovery-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run focused tests
        run: python -m unittest tests.test_questrecovery71

      - name: Fetch pinned Quest sources
        shell: bash
        run: |
          set -euo pipefail
          fetch_repo() {
            local url="$1" dir="$2" sha="$3"
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "$url" "$dir"
            git -C "$dir" sparse-checkout init --no-cone
            git -C "$dir" sparse-checkout set 'BinOutput/Quest/*.json'
            git -C "$dir" checkout "$sha"
          }

          fetch_repo             https://github.com/DimbreathBot/AnimeGameData.git             /tmp/agd71             792978e5503ecfba73dcb3562ed44a0d35a2abe2

          fetch_repo             https://github.com/capyb2222/LunaGC-Resources.git             /tmp/luna71             395a5ee6442142a803691f60d541ee1706ae9cd7

          fetch_repo             https://github.com/chenlin996/LunaGC-Resources7.0.git             /tmp/luna70             0991d8a9d82b37a7400774764c0b6e04e7c66a9d

      - name: Build recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m genshinre.questrecovery71             --raw-7-1-root /tmp/agd71/BinOutput/Quest             --community-7-1-root /tmp/luna71/BinOutput/Quest             --community-7-0-root /tmp/luna70/BinOutput/Quest             --raw-7-1-source 'DimbreathBot/AnimeGameData@792978e5503ecfba73dcb3562ed44a0d35a2abe2'             --community-7-1-source 'capyb2222/LunaGC-Resources@395a5ee6442142a803691f60d541ee1706ae9cd7'             --community-7-0-source 'chenlin996/LunaGC-Resources7.0@0991d8a9d82b37a7400774764c0b6e04e7c66a9d'             --output quest71-recovery-manifest.json             --unresolved-output quest71-unresolved.json

          python - <<'PY'
          import json
          for name in ("quest71-recovery-manifest.json","quest71-unresolved.json"):
              obj=json.load(open(name,encoding="utf-8"))
              print(name)
              print(json.dumps(obj.get("summary",{}),ensure_ascii=False,indent=2))
          PY

      - name: Upload manifest
        uses: actions/upload-artifact@v6
        with:
          name: quest71-recovery-manifest
          path: |
            quest71-recovery-manifest.json
            quest71-unresolved.json
          if-no-files-found: error
