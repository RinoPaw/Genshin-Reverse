name: Match 7.1 legacy QuestExcel row schema

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-legacy-71-devkit-schema.yml"

concurrency:
  group: probe-quest-legacy-71-devkit-schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -e . capstone pefile zstandard zstandard zstandard

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Download exact 7.1 QuestExcel object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/q71
          gh run download 37440823447 \
            --repo RinoPaw/Genshin-Reverse \
            --name quest-excel-asset-chain-probe \
            --dir evidence/q71
          test -s evidence/q71/quest-output/MiHoYoBinData/3b87ae83.dat

      - name: Fetch initial resource for subId ordering only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/AstaPS-Resource
          git clone --filter=blob:none --no-checkout \
            https://github.com/MeChen618/AstaPS-Resource.git /tmp/AstaPS-Resource
          git -C /tmp/AstaPS-Resource sparse-checkout init --no-cone
          git -C /tmp/AstaPS-Resource sparse-checkout set \
            'ExcelBinOutput/QuestExcelConfigData.json'
          git -C /tmp/AstaPS-Resource checkout \
            8c85a82f37341a422002a0352c89a142c4017e53
          test -s /tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json

      - name: Checkout pinned 7.0 binconfig analyzer
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/owomocha/genshin-7.0-local-re-devkit.git \
            /tmp/genshin-7.0-local-re-devkit
          git -C /tmp/genshin-7.0-local-re-devkit checkout --detach \
            fb91dfad1f6047e30dea2f98727e5af45d9bd6e0

      - name: Analyze candidate 7.1 row readers against exact Quest 351 chain
        shell: bash
        env:
          PYTHONPATH: /tmp/genshin-7.0-local-re-devkit/src:/tmp/genshin-7.0-local-re-devkit/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-legacy-71-devkit-schema.txt
          import csv
          import json
          import struct
          from pathlib import Path

          from genshin_re import binconfig as BC
          import gamedata_binconfig_ext as EXT

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          META=Path("versions/7.1.0-global/windows-x64/metadata")
          RAW=Path("evidence/q71/quest-output/MiHoYoBinData/3b87ae83.dat")
          RES=Path("/tmp/AstaPS-Resource/ExcelBinOutput/QuestExcelConfigData.json")
          READER="FNIAHJGHFAK"
          SUBID_KEY=0xB1571A55
          TARGETS=[35104,35100,35107,35101,35106,35105,35103,35102]

          def read_csv(name):
              with (META/name).open("r",encoding="utf-8-sig",newline="") as fh:
                  return list(csv.DictReader(fh))

          methods=read_csv("methods.csv")
          types=read_csv("types.csv")
          fields=read_csv("fields.csv")
          type_by_tdi={int(x["type_definition_index"]):x for x in types}
          fields_by_tdi={}
          for row in fields:
              try:fields_by_tdi.setdefault(int(row["type_definition_index"]),[]).append(row)
              except Exception:pass

          deser={}
          one_by_class={}
          candidates=[]
          for m in methods:
              try:
                  rva=int(m.get("rva") or "0",0)
                  tdi=int(m["type_definition_index"])
              except Exception:
                  continue
              if not rva:
                  continue
              try:
                  params=json.loads(m.get("parameter_types") or "[]")
              except Exception:
                  continue
              if not params or params[0] != READER:
                  continue

              cls=m.get("type_name") or "?"
              sig=str(params)
              deser[rva]=(cls,m.get("method_name") or "?",sig)

              if len(params)==1:
                  # Prefer void / FromBinaryInner-like readers when a class has
                  # multiple wrappers.
                  ret=(m.get("return_type") or m.get("return_type_name") or "").lower()
                  pr=0 if m.get("method_name")=="FromBinaryInner" else (1 if ret=="void" else 2)
                  prev=one_by_class.get(cls)
                  if prev is None or pr < prev[0]:
                      one_by_class[cls]=(pr,rva)

                  t=type_by_tdi.get(tdi,{})
                  try:fc=int(t.get("field_count") or "0")
                  except ValueError:fc=0
                  named=cls in {
                      "RandomQuestExcelConfig","GPCFGOEJFJK",
                      "LAIMPNDEFCL","AFIOOHMJHDM"
                  }
                  if 8 <= fc <= 48 or named:
                      candidates.append((rva,m,t,fc,tdi))

          row_deser={cls:rva for cls,(_pr,rva) in one_by_class.items()}
          exe=BC.Exe(str(EXE))
          EXT.install(exe,deser,row_deser,clsfields={},deser1=row_deser)
          EXT.install2()

          raw=RAW.read_bytes()
          n=struct.unpack_from("<I",raw,0)[0]
          payload=raw[4:4+n]
          if n != len(raw)-4:
              raise SystemExit("MiHoYoBinData wrapper mismatch")

          resource=json.loads(RES.read_text(encoding="utf-8"))
          ord_by_sid={}
          for i,row in enumerate(resource):
              sid=row.get("subId")
              if isinstance(sid,int):
                  ord_by_sid.setdefault(sid,[]).append(i)
          target_ord=[ord_by_sid[s][0] for s in TARGETS]
          if target_ord != list(range(target_ord[0],target_ord[0]+len(TARGETS))):
              raise SystemExit(f"Quest 351 resource order is not consecutive: {target_ord}")
          first_ord=target_ord[0]
          prev_sid=resource[first_ord-1].get("subId")
          next_sid=resource[first_ord+len(TARGETS)].get("subId")
          if not isinstance(prev_sid,int) or not isinstance(next_sid,int):
              raise SystemExit("neighbor subIds missing")

          def unique_anchor(sid):
              needle=struct.pack("<I",(sid ^ SUBID_KEY)&0xffffffff)
              hits=[]
              at=0
              while True:
                  x=payload.find(needle,at)
                  if x<0:break
                  hits.append(x);at=x+1
              if len(hits)!=1:
                  raise ValueError(f"subId {sid}: anchors={hits}")
              return hits[0]

          anchors={sid:unique_anchor(sid) for sid in [prev_sid,*TARGETS,next_sid]}
          target_pos=[anchors[s] for s in TARGETS]
          if target_pos != sorted(target_pos):
              raise SystemExit(f"Quest 351 anchors out of order: {anchors}")

          search_lo=anchors[prev_sid]+4
          search_hi=anchors[TARGETS[0]]
          final_limit=anchors[next_sid]
          print("reader_methods",len(deser))
          print("candidate_methods",len(candidates))
          print("neighbor_sids",prev_sid,next_sid)
          print("anchors",anchors)
          print("start_search",search_lo,search_hi,"width",search_hi-search_lo)

          def find_scalar_columns(decoded_rows, expected):
              if not decoded_rows:
                  return []
              widths=[len(x) if isinstance(x,list) else 0 for x in decoded_rows]
              if len(set(widths))!=1 or not widths[0]:
                  return []
              out=[]
              for col in range(widths[0]):
                  vals=[row[col] for row in decoded_rows]
                  if vals==expected:
                      out.append(col)
              return out

          def contains_value(x,target):
              if isinstance(x,bool):
                  return False
              if isinstance(x,int):
                  return x==target
              if isinstance(x,str):
                  return x==str(target)
              if isinstance(x,list):
                  return any(contains_value(v,target) for v in x)
              if isinstance(x,dict):
                  return any(contains_value(v,target) for v in x.values())
              return False

          results=[]
          for idx,(rva,m,t,fc,tdi) in enumerate(candidates,1):
              try:
                  schema=BC.build(exe,rva,deser,cache={})
              except Exception:
                  continue

              fields_schema=[
                  st for st in schema.get("steps",[])
                  if st.get("kind")!="base"
              ]
              kinds={}
              for st in fields_schema:
                  kinds[st.get("kind","?")]=kinds.get(st.get("kind","?"),0)+1

              best=None
              # The true row start is after the previous row's subId anchor and
              # at/before this row's subId anchor. Search byte-by-byte.
              for start in range(search_lo,search_hi+1):
                  reader=BC.Reader(payload)
                  reader.p=start
                  decoded=[]
                  spans=[]
                  ok=True
                  for i,sid in enumerate(TARGETS):
                      rs=reader.p
                      try:
                          vals=reader.record(schema)
                      except Exception:
                          ok=False
                          break
                      re=reader.p
                      anchor=anchors[sid]
                      upper=anchors[TARGETS[i+1]] if i+1<len(TARGETS) else final_limit
                      # Each known subId word must be inside its own decoded row,
                      # and the row must end before the next row's subId word.
                      if not (rs <= anchor < re <= upper):
                          ok=False
                          break
                      spans.append((sid,rs,re,anchor))
                      decoded.append(vals)
                  if not ok:
                      continue

                  sub_cols=find_scalar_columns(decoded,TARGETS)
                  main_cols=find_scalar_columns(decoded,[351]*len(TARGETS))

                  # AstaPS predecessor IDs are used only as a diagnostic after
                  # native decoding, never to select the schema.
                  predecessor={
                      35104:None,
                      35100:35104,
                      35107:35100,
                      35101:35107,
                      35106:35101,
                      35105:35106,
                      35103:35105,
                      35102:35103,
                  }
                  pred_hits={
                      str(sid):(
                          False if predecessor[sid] is None
                          else contains_value(decoded[i],predecessor[sid])
                      )
                      for i,sid in enumerate(TARGETS)
                  }

                  score=8000
                  score += 2000*bool(sub_cols)
                  score += 1000*bool(main_cols)
                  score += 700 if 10 <= len(fields_schema) <= 16 else 0
                  score += 300 if len(fields_schema)==30 else 0
                  score += min(100,len(fields_schema))
                  item={
                      "score":score,
                      "start":start,
                      "rva":f"0x{rva:X}",
                      "method":m,
                      "type":t,
                      "type_fields":fields_by_tdi.get(tdi,[]),
                      "field_count_metadata":fc,
                      "schema":schema,
                      "schema_field_count":len(fields_schema),
                      "schema_kinds":kinds,
                      "spans":[
                          {"subId":sid,"start":rs,"end":re,"anchor":anchor}
                          for sid,rs,re,anchor in spans
                      ],
                      "subId_columns":sub_cols,
                      "mainId_columns":main_cols,
                      "predecessor_value_hits":pred_hits,
                      "decoded":decoded,
                  }
                  if best is None or item["score"]>best["score"]:
                      best=item

              if best is not None:
                  results.append(best)

          results.sort(key=lambda x:(-x["score"],x["start"],x["rva"]))
          print("\n=== CHAIN MATCHES ===")
          for x in results[:80]:
              print(json.dumps({
                  "score":x["score"],
                  "start":x["start"],
                  "rva":x["rva"],
                  "type":x["method"].get("type_name"),
                  "method":x["method"].get("method_name"),
                  "metadata_fields":x["field_count_metadata"],
                  "schema_fields":x["schema_field_count"],
                  "kinds":x["schema_kinds"],
                  "subId_columns":x["subId_columns"],
                  "mainId_columns":x["mainId_columns"],
                  "spans":x["spans"],
                  "predecessor_value_hits":x["predecessor_value_hits"],
              },ensure_ascii=False))

          report={
              "analyzer_repo":"owomocha/genshin-7.0-local-re-devkit",
              "analyzer_commit":"fb91dfad1f6047e30dea2f98727e5af45d9bd6e0",
              "reader_methods":len(deser),
              "candidate_methods":len(candidates),
              "neighbor_sids":{"previous":prev_sid,"next":next_sid},
              "anchors":{str(k):v for k,v in anchors.items()},
              "start_search":{"lo":search_lo,"hi":search_hi},
              "results":results[:250],
          }
          Path("quest-legacy-71-devkit-schema.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )

          if not results:
              print("\nNo candidate reader produced an 8-row anchor-consistent chain.")
          else:
              top=results[0]
              print("\nBEST_CHAIN",top["rva"],top["method"],"start",top["start"])
              print("SUBID_COLUMNS",top["subId_columns"])
              print("MAINID_COLUMNS",top["mainId_columns"])
              print("PREDECESSOR_HITS",top["predecessor_value_hits"])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-legacy-71-devkit-schema
          path: |
            quest-legacy-71-devkit-schema.txt
            quest-legacy-71-devkit-schema.json
          if-no-files-found: error
