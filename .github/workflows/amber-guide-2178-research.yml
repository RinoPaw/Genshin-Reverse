name: Temporary Amber guide and 2178 native research
on:
  push:
    branches: [research/amber-2178-quest-notify-20261010]
    paths: [.github/workflows/amber-guide-2178-research.yml]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned Global 7.1 client
        run: |
          python -m pip install capstone zstandard
          bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python
      - name: Map guide, quest and open-state protocol evidence
        run: |
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          root=Path('versions/7.1.0-global/windows-x64')
          def rows(path):
              with (root/path).open(encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          reg={int(x['cmd_id']):x for x in rows('registry/registry.csv')}
          methods=rows('metadata/methods.csv')
          fields=rows('metadata/fields.csv')
          for cmd in [2178,27447,20218,7670,7645,28142,3514,3610,28822]:
              x=reg.get(cmd)
              print('COMMAND '+str(cmd)+' '+json.dumps(x))
              if not x: continue
              ty=x['type_name']
              print('FIELDS '+str(cmd)+' '+json.dumps([f for f in fields if f['type_name']==ty],separators=(',',':'))[:10000])
              callers=[m for m in methods if ty in m['parameter_types'] and m['type_name'] != ty]
              print('CONSUMERS '+str(cmd)+' '+json.dumps(callers[:50],separators=(',',':'))[:25000])
          types=sorted({m['type_name'] for m in methods if re.search(r'(tutorial|newbie|guide|openstate|questguide|process|taskguide)',m['type_name'],re.I)})
          print('NAMED_GUIDE_CLASSES '+json.dumps(types[:500]))
          out={}
          for klass in types[:110]:
              matches=[m for m in methods if m['type_name']==klass and re.search(r'(quest|guide|openstate|tutorial|newbie|process|trigger|skip|pause|show|finish|start)',m['method_name'],re.I)]
              if matches: out[klass]=matches[:75]
          print('NAMED_GUIDE_METHODS '+json.dumps(out,separators=(',',':'))[:40000])
          PY
