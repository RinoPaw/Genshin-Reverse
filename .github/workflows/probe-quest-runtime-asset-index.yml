name: Probe 7.1 runtime AssetIndex for Quest handle

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-runtime-asset-index.yml"

concurrency:
  group: probe-quest-runtime-asset-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard lz4

      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Confirm current 7.1 runtime AssetIndex literal
        shell: bash
        run: |
          set -euo pipefail
          peer_sha=1008fd7db28dcbc55729d5bb6b3a585dab86cf8b
          mkdir -p third-party/gi-stringliteral
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/recover_string_literals.py"             -o third-party/gi-stringliteral/recover_string_literals.py
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/kuma-dayo/gi-stringliteral/$peer_sha/extract_constants.py"             -o third-party/gi-stringliteral/extract_constants.py
          (
            cd third-party/gi-stringliteral
            python recover_string_literals.py               ../../inputs/7.1.0-global/global-metadata.dat               ../../inputs/7.1.0-global/GenshinImpact.exe               -o ../../asset-index-literals-all.json               2> ../../asset-index-literal-recovery.txt
          )
          python - <<'PY' | tee asset-index-literals.txt
          import json
          from pathlib import Path
          rows=json.loads(Path("asset-index-literals-all.json").read_text(encoding="utf-8"))
          needles=("31049740","asset_index","release_asset_index","medium_asset_index")
          hits=[r for r in rows if any(n in str(r.get("value","")).lower() for n in needles)]
          for r in hits:
              print(json.dumps(r,ensure_ascii=False))
          Path("asset-index-literals.json").write_text(
              json.dumps(hits,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if not any("31049740" in str(r.get("value","")) for r in hits):
              print("NOTE exact 31049740 literal not recovered; manifest/native deserializer evidence remains usable")
          PY

      - name: Reconstruct exact 7.1 runtime AssetIndex block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee runtime-asset-index-block.txt
          import hashlib
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import decompress_zstd, download, normalized_name, parse_manifest, reconstruct

          rows=parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          suffix="/assetbundles/blocks/00/31049740.blk"
          matches=[r for r in rows if normalized_name(r).endswith(suffix)]
          if len(matches)!=1:
              raise SystemExit(f"{suffix}: expected one manifest row, got {len(matches)}")
          row=matches[0]
          out=Path("runtime-asset-index/31049740.blk")
          out.parent.mkdir(parents=True,exist_ok=True)
          reconstruct(PROFILE_71.sophon_chunk_prefix,row,out,workers=8)
          raw=out.read_bytes()
          print("path=",out)
          print("size=",len(raw))
          print("sha256=",hashlib.sha256(raw).hexdigest())
          print("md5_manifest=",row.get("md5"))
          print("head64=",raw[:64].hex())
          print("head_ascii=",repr(raw[:32]))
          PY

      - name: Dump exact 7.1 AssetIndex reader schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee runtime-asset-index-schema.txt
          import csv,json
          from pathlib import Path
          root=Path("versions/7.1.0-global/windows-x64/metadata")
          def rows(n):
              with (root/n).open("r",encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          types,fields,methods=rows("types.csv"),rows("fields.csv"),rows("methods.csv")
          tb={int(t["type_definition_index"]):t for t in types}
          wanted={"AssetIndexDeserializer","AssetIndexBinaryReader","BundleContent","ResourceIndex"}
          out={}
          for t in types:
              if t.get("type_name") not in wanted:
                  continue
              tdi=int(t["type_definition_index"])
              out[str(tdi)]={
                  "type":t,
                  "fields":[x for x in fields if int(x["type_definition_index"])==tdi],
                  "methods":[x for x in methods if int(x["type_definition_index"])==tdi],
              }
              print("\nTYPE",tdi,t.get("namespace"),t.get("type_name"))
              print(json.dumps(out[str(tdi)],ensure_ascii=False,indent=2))
          Path("runtime-asset-index-schema.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Disassemble exact runtime AssetIndex decoders
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6DD3E70 0x570             --expected-sha256 "$sha"             --label "AssetIndexDeserializer.DeserializeBinary"             --output runtime-asset-index-deserialize.json             > runtime-asset-index-deserialize.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6DD43E0 0x360             --expected-sha256 "$sha"             --label "AssetIndexDeserializer.ReadAssetInfoMap_B"             --output runtime-asset-index-asset-map.json             > runtime-asset-index-asset-map.txt

      - name: Annotate AssetIndex direct calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee runtime-asset-index-calls.txt
          import csv,json,re
          from pathlib import Path
          root=Path("versions/7.1.0-global/windows-x64/metadata")
          with (root/"methods.csv").open("r",encoding="utf-8-sig",newline="") as f:
              methods=list(csv.DictReader(f))
          with (root/"types.csv").open("r",encoding="utf-8-sig",newline="") as f:
              types=list(csv.DictReader(f))
          by_rva={}
          for m in methods:
              s=(m.get("rva") or "").strip()
              if s:
                  try: by_rva.setdefault(int(s,0),[]).append(m)
                  except ValueError: pass
          tb={int(t["type_definition_index"]):t for t in types}
          out={}
          for fn in ("runtime-asset-index-deserialize.json","runtime-asset-index-asset-map.json"):
              d=json.loads(Path(fn).read_text(encoding="utf-8"))
              base=int(d["image_base"],16)
              rr=[]
              for ins in d["instructions"]:
                  if ins.get("mnemonic") not in {"call","jmp"}: continue
                  mm=re.fullmatch(r"0x([0-9a-fA-F]+)",ins.get("op_str",""))
                  if not mm: continue
                  v=int(mm.group(1),16); rva=v-base if v>=base else v
                  meta=by_rva.get(rva,[])
                  item={
                      "site_rva":ins["rva"],"target_rva":f"0x{rva:X}",
                      "metadata":meta,
                      "owners":[tb.get(int(m["type_definition_index"]),{}) for m in meta],
                  }
                  rr.append(item)
                  if meta:
                      print(fn,json.dumps(item,ensure_ascii=False,sort_keys=True))
              out[fn]=rr
          Path("runtime-asset-index-calls.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Install pinned AnimeStudio CLI
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/EIHRTeam/AnimeStudio/releases/download/v1.0.0-CI/AnimeStudio.CLI-1.0.0-CI-linux-x64.tar.gz'
          archive=/tmp/animestudio.tar.gz
          root=/tmp/animestudio
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo '12e2dfb2ab35880eda4274fcd393091d47e204d4b6e4b5838421fa3b4d1720a1  /tmp/animestudio.tar.gz' | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          mapfile -t apphosts < <(find "$root" -type f -name 'AnimeStudio.CLI' | sort)
          mapfile -t dlls < <(find "$root" -type f -name 'AnimeStudio.CLI.dll' | sort)
          if ((${#apphosts[@]})); then
            chmod +x "${apphosts[0]}"
            printf '%s\n' "${apphosts[0]}" > /tmp/animestudio-entry
          elif ((${#dlls[@]})); then
            printf 'dotnet\n%s\n' "${dlls[0]}" > /tmp/animestudio-entry
          else
            echo 'AnimeStudio CLI entry point not found' >&2
            exit 2
          fi
      - name: Probe static BLB3 decode with pinned peer implementation
        shell: bash
        run: |
          set -euo pipefail
          peer_sha=4681ecd7ce0cfa94efe6f51b1c0122b237ede904
          mkdir -p third-party/usmdiviner runtime-asset-index-decoded
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/HRB-YuPai/UsmDiviner-GUI/$peer_sha/usmdiviner/blk_versions.py"             -o third-party/usmdiviner/blk_versions.py

          set +e
          python third-party/usmdiviner/blk_versions.py             runtime-asset-index/31049740.blk             --dump-files-dir runtime-asset-index-decoded             -o runtime-asset-index-blb3.json             > runtime-asset-index-blb3.txt 2>&1
          status=$?
          set -e
          echo "peer_exit_status=$status" | tee -a runtime-asset-index-blb3.txt
          find runtime-asset-index-decoded -type f -printf '%p %s\n'             | sort | tee runtime-asset-index-decoded-files.txt || true

          python - <<'PY' | tee runtime-asset-index-blb3-summary.txt
          import json
          import struct
          from pathlib import Path

          blk=Path("runtime-asset-index/31049740.blk").read_bytes()
          if blk[:4] != b"Blb\x03":
              raise SystemExit("unexpected BLB magic")
          out={
              "magic":blk[:4].hex(),
              "size_field":struct.unpack_from("<I",blk,4)[0],
              "version":struct.unpack_from("<I",blk,8)[0],
              "iv":blk[12:28].hex(),
              "peer_repository":"HRB-YuPai/UsmDiviner-GUI",
              "peer_commit":"4681ecd7ce0cfa94efe6f51b1c0122b237ede904",
          }
          p=Path("runtime-asset-index-blb3.json")
          if p.is_file():
              try:
                  parsed=json.loads(p.read_text(encoding="utf-8"))
                  out["peer_meta"]=parsed.get("meta")
                  out["inner_file_count"]=parsed.get("inner_file_count")
                  out["inner_files"]=parsed.get("inner_files")
              except Exception as exc:
                  out["peer_json_error"]=str(exc)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path("runtime-asset-index-blb3-summary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Raw-export decoded runtime AssetIndex CAB
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entry < /tmp/animestudio-entry
          if ((${#entry[@]} == 1)); then
            cli=("${entry[0]}")
          else
            cli=("${entry[0]}" "${entry[1]}")
          fi

          cab="$(find runtime-asset-index-decoded -maxdepth 1 -type f -name 'CAB-*' | head -n 1)"
          if [[ -z "$cab" ]]; then
            echo "decoded CAB missing" >&2
            exit 2
          fi

          rm -rf runtime-asset-index-raw
          mkdir -p runtime-asset-index-raw
          "${cli[@]}" "$cab" runtime-asset-index-raw \
            --game GI \
            --export_type Raw \
            --logger_flags Error \
            2>&1 | tee runtime-asset-index-animestudio.txt

          find runtime-asset-index-raw -type f -printf '%p %s\n' \
            | sort | tee runtime-asset-index-raw-files.txt

          python - <<'PY' | tee runtime-asset-index-351-scan.txt
          import json
          from pathlib import Path

          root=Path("runtime-asset-index-raw")
          handle=1493294957662636073
          needles={
              "handle_u64_le": handle.to_bytes(8,"little"),
              "assetPathHash_u32_le": (0xDA285D08).to_bytes(4,"little"),
              "mainId_351_u32_le": (351).to_bytes(4,"little"),
              "external_asset_index_ascii": b"external_asset_index",
          }

          out={"files":[],"totals":{}}
          for label,needle in needles.items():
              out["totals"][label]=0

          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              raw=p.read_bytes()
              item={"path":str(p),"size":len(raw),"hits":{}}
              any_hit=False
              for label,needle in needles.items():
                  pos=[]
                  start=0
                  while True:
                      i=raw.find(needle,start)
                      if i<0:
                          break
                      pos.append(i)
                      start=i+1
                      if len(pos)>=200:
                          break
                  if pos:
                      item["hits"][label]=pos
                      out["totals"][label]+=len(pos)
                      any_hit=True
              if any_hit:
                  out["files"].append(item)
                  print(json.dumps(item,ensure_ascii=False,sort_keys=True))

          print("TOTALS",json.dumps(out["totals"],sort_keys=True))
          Path("runtime-asset-index-351-scan.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY
      - name: Disassemble runtime AssetIndex reader primitives
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6C64740 0x60 \
            --expected-sha256 "$sha" --label "AssetIndexBinaryReader.ReadByte" \
            --output runtime-asset-index-readbyte.json > runtime-asset-index-readbyte.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6C647A0 0x60 \
            --expected-sha256 "$sha" --label "AssetIndexBinaryReader.ReadInt32" \
            --output runtime-asset-index-readint32.json > runtime-asset-index-readint32.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6C64800 0x60 \
            --expected-sha256 "$sha" --label "AssetIndexBinaryReader.ReadULong" \
            --output runtime-asset-index-readulong.json > runtime-asset-index-readulong.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6DDA360 0x30 \
            --expected-sha256 "$sha" --label "BundleContent.PathHash getters" \
            --output runtime-asset-index-pathhash-getters.json > runtime-asset-index-pathhash-getters.txt
      - name: Locate primary asset_index and trace deserializer callers
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' | tee runtime-asset-index-manifest-hits.txt
          import json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.samplefetch import decompress_zstd, download, normalized_name, parse_manifest

          rows=parse_manifest(decompress_zstd(download(PROFILE_71.sophon_manifest_url)))
          hits=[]
          for row in rows:
              name=normalized_name(row)
              low=name.lower()
              if 'asset_index' in low or 'assetindex' in low:
                  item={
                      'name':name,
                      'size':row.get('size'),
                      'md5':row.get('md5'),
                  }
                  hits.append(item)
                  print(json.dumps(item,ensure_ascii=False,sort_keys=True))
          Path('runtime-asset-index-manifest-hits.json').write_text(
              json.dumps(hits,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8',
          )
          PY

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            runtime-asset-index-deserialize-callers.json \
            --focus deserialize:0x6DD3E70 \
            --focus resource-index-ctor:0x71062F0 \
            --focus reader-ctor-path:0x6C63B70 \
            --focus reader-create-handle:0x6C643F0 \
            --max-body 0x8000 \
            | tee runtime-asset-index-deserialize-callers.txt
      - name: Disassemble underlying runtime AssetIndex numeric readers
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6ECC1F0 0x100 \
            --expected-sha256 "$sha" --label "runtime AssetIndex uint64 primitive" \
            --output runtime-asset-index-u64-primitive.json > runtime-asset-index-u64-primitive.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6EE85B0 0x100 \
            --expected-sha256 "$sha" --label "runtime AssetIndex byte primitive" \
            --output runtime-asset-index-byte-primitive.json > runtime-asset-index-byte-primitive.txt
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x6EA76D0 0x100 \
            --expected-sha256 "$sha" --label "runtime AssetIndex int32 primitive" \
            --output runtime-asset-index-i32-primitive.json > runtime-asset-index-i32-primitive.txt
      - name: Trace AssetIndexBinaryReader source construction
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            runtime-asset-index-reader-source.json \
            --focus ctor-path:0x6C63B70 \
            --focus ctor-handle:0x6C64030 \
            --focus ctor-bytes:0x6C64150 \
            --focus create-bytes:0x6C64380 \
            --focus create-handle:0x6C643F0 \
            --max-body 0x3000 \
            | tee runtime-asset-index-reader-source.txt

          python - <<'PY' | tee runtime-asset-index-underlying-primitives.txt
          import bisect,csv,json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          ROOT=Path("versions/7.1.0-global/windows-x64/metadata")
          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          require_sha256(EXE,PROFILE_71.exe_sha256,label='executable')
          with (ROOT/'methods.csv').open('r',encoding='utf-8-sig',newline='') as f:
              methods=list(csv.DictReader(f))
          with (ROOT/'types.csv').open('r',encoding='utf-8-sig',newline='') as f:
              types=list(csv.DictReader(f))
          tb={int(t['type_definition_index']):t for t in types}
          starts=[]; by={}
          for m in methods:
              s=(m.get('rva') or '').strip()
              if not s: continue
              try: r=int(s,0)
              except ValueError: continue
              starts.append(r); by.setdefault(r,[]).append(m)
          starts=sorted(set(starts))
          targets={
              'readbyte_target':0x6EE85B0,
              'readint32_target':0x6EA76D0,
              'readulong_target':0x6ECC1F0,
          }
          out={}
          for label,rva in targets.items():
              exact=by.get(rva,[])
              i=bisect.bisect_right(starts,rva)-1
              owner_start=starts[i] if i>=0 else None
              owner=by.get(owner_start,[]) if owner_start is not None else []
              item={
                  'target_rva':f'0x{rva:X}',
                  'exact_methods':exact,
                  'nearest_owner_start':None if owner_start is None else f'0x{owner_start:X}',
                  'nearest_owner_methods':owner,
                  'nearest_owner_types':[tb.get(int(x['type_definition_index']),{}) for x in owner],
              }
              out[label]=item
              print(label,json.dumps(item,ensure_ascii=False,indent=2))
          Path('runtime-asset-index-underlying-primitives.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Trace primary asset_index bootstrap and map comparer
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            runtime-asset-index-bootstrap.json \
            --focus provider-load-index:0x7012410 \
            --focus resource-index-ctor:0x71062F0 \
            --focus binary-reader-path-ctor:0x6C63B70 \
            --max-body 0x10000 \
            | tee runtime-asset-index-bootstrap.txt

          python - <<'PY' | tee runtime-asset-index-bootstrap-summary.txt
          import json
          from pathlib import Path
          data=json.loads(Path('runtime-asset-index-bootstrap.json').read_text(encoding='utf-8'))
          out={}
          for label,item in data['focus'].items():
              keep=[]
              for x in item.get('disassembly',[]):
                  m=x.get('mnemonic','')
                  op=x.get('op_str','').lower()
                  if m in {'call','jmp','mov','lea','cmp','test','xor','and','or','shl','shr','sar','add','sub'}:
                      keep.append(x)
              out[label]={
                  'owner':item.get('owner'),
                  'direct_callers':item.get('direct_callers',[]),
                  'direct_edges':item.get('direct_edges',[]),
                  'interesting':keep,
              }
              print('\n###',label)
              print(json.dumps(out[label],ensure_ascii=False,indent=2))
          Path('runtime-asset-index-bootstrap-summary.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Resolve AssetIndex base map construction
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          python tools/disassemble_rva.py inputs/7.1.0-global/GenshinImpact.exe 0x701EA30 0x180 \
            --expected-sha256 "$sha" --label "AssetIndex..ctor" \
            --output runtime-asset-index-base-ctor.json > runtime-asset-index-base-ctor.txt

          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            runtime-asset-index-base-ctor-calls.json \
            --focus asset-index-ctor:0x701EA30 \
            --max-body 0x1000 \
            | tee runtime-asset-index-base-ctor-calls.txt

          python - <<'PY' | tee runtime-asset-index-base-schema.txt
          import csv,json
          from pathlib import Path
          root=Path('versions/7.1.0-global/windows-x64/metadata')
          def rows(n):
              with (root/n).open('r',encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          types,fields,methods=rows('types.csv'),rows('fields.csv'),rows('methods.csv')
          typ=next(x for x in types if x.get('type_name')=='AssetIndex')
          tdi=int(typ['type_definition_index'])
          out={
              'type':typ,
              'fields':[x for x in fields if int(x['type_definition_index'])==tdi],
              'methods':[x for x in methods if int(x['type_definition_index'])==tdi],
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('runtime-asset-index-base-schema.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Locate primary asset_index string slot xrefs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee runtime-asset-index-primary-xrefs.txt
          import bisect,csv,json,struct
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path('inputs/7.1.0-global/GenshinImpact.exe')
          ROOT=Path('versions/7.1.0-global/windows-x64/metadata')
          require_sha256(EXE,PROFILE_71.exe_sha256,label='executable')

          # Protected string literal recovery gives index 15346 for exact
          # literal 'asset_index'. Current 7.1 string-literal usage slots
          # follow slot_rva = 0x59D9260 + index*8 (validated against the
          # adjacent MainQuestIndex/MainQuestBriefIndex slots).
          literal_index=15346
          slot_rva=0x59D9260 + literal_index*8

          with (ROOT/'methods.csv').open('r',encoding='utf-8-sig',newline='') as fh:
              methods=list(csv.DictReader(fh))
          starts=[]; by={}
          for row in methods:
              s=(row.get('rva') or '').strip()
              if not s: continue
              try: r=int(s,0)
              except ValueError: continue
              starts.append(r); by.setdefault(r,[]).append(row)
          starts=sorted(set(starts))

          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0: return None
              s=starts[i]
              e=starts[i+1] if i+1<len(starts) else s+0x10000
              if not (s<=rva<e): return None
              return {'start_rva':f'0x{s:X}','end_rva':f'0x{e:X}','methods':by[s]}

          # Common 7-byte RIP-relative MOV/LEA forms used for static
          # string-literal slots. This avoids a full-image disassembly.
          prefixes=(
              b'\x48\x8b\x05', b'\x48\x8b\x0d', b'\x48\x8b\x15',
              b'\x48\x8b\x1d', b'\x48\x8b\x25', b'\x48\x8b\x2d',
              b'\x48\x8b\x35', b'\x48\x8b\x3d',
              b'\x4c\x8b\x05', b'\x4c\x8b\x0d', b'\x4c\x8b\x15',
              b'\x4c\x8b\x1d', b'\x4c\x8d\x05', b'\x4c\x8d\x0d',
              b'\x48\x8d\x05', b'\x48\x8d\x0d', b'\x48\x8d\x15',
          )
          hits=[]
          with PEImage(EXE) as image:
              base=image.image_base
              target_va=base+slot_rva
              for sec in image.sections:
                  if not (sec.characteristics & 0x20000000):
                      continue
                  blob=image.read_rva(sec.virtual_address,sec.raw_size)
                  seen_offsets=set()
                  for prefix in prefixes:
                      start=0
                      while True:
                          off=blob.find(prefix,start)
                          if off<0:
                              break
                          start=off+1
                          if off in seen_offsets or off+7>len(blob):
                              continue
                          seen_offsets.add(off)
                          disp=struct.unpack_from('<i',blob,off+3)[0]
                          rva=sec.virtual_address+off
                          resolved=base+rva+7+disp
                          if resolved!=target_va:
                              continue
                          hits.append({'rva':rva,'section':sec.name,'bytes':blob[off:off+7].hex(),'owner':owner(rva)})

              md=Cs(CS_ARCH_X86,CS_MODE_64)
              report={'literal':'asset_index','literal_index':literal_index,'slot_rva':f'0x{slot_rva:X}','hits':hits,'owners':[]}
              seen=set()
              for h in hits:
                  ow=h['owner']
                  if not ow: continue
                  s=int(ow['start_rva'],16); e=int(ow['end_rva'],16)
                  if s in seen: continue
                  seen.add(s)
                  size=min(e-s,0x2000)
                  body=image.read_rva(s,size)
                  ins=[{'rva':f'0x{x.address-base:X}','mnemonic':x.mnemonic,'op_str':x.op_str} for x in md.disasm(body,base+s)]
                  report['owners'].append({'owner':ow,'instructions':ins})

          print(json.dumps(report,ensure_ascii=False,indent=2))
          Path('runtime-asset-index-primary-xrefs.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not hits:
              raise SystemExit('no executable xrefs to primary asset_index string slot')
          PY
