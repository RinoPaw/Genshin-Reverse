name: Probe 7.1 orphan QuestExcel row readers

on:
  push:
    branches:
      - probe/quest-blb3-binoutput
    paths:
      - ".github/workflows/probe-quest-excel-row-readers.yml"

concurrency:
  group: probe-quest-excel-row-readers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install -e . capstone zstandard
      - name: Fetch exact pinned global 7.1 sample
        run: bash scripts/fetch-7.1-samples.sh --output inputs/7.1.0-global --python python

      - name: Disassemble Quest-shaped row-reader candidates
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python -c 'from genshinre.nativeprofile import PROFILE_71; print(PROFILE_71.exe_sha256)')"
          mkdir -p qrow-candidates
          python - <<'PY' > /tmp/qrow-candidates
          rows = [
              ("random-quest",      0xCF246E0, 0xA20),
              ("gpc",               0xCAB9080, 0x1C10),
              ("ordinary-runtime",  0x9C15DF0, 0x2060),
              ("npdia",             0xF3850A0, 0x2230),
              ("mpon",              0x1155A450, 0x46C0),
              ("lglh",              0x12CA3BA0, 0x2E00),
              ("geeo",              0x11098B90, 0x23E0),
          ]
          for label,rva,size in rows:
              print(label,hex(rva),hex(size))
          PY
          while read -r label rva size; do
            python tools/disassemble_rva.py               inputs/7.1.0-global/GenshinImpact.exe               "$rva" "$size"               --expected-sha256 "$sha"               --label "$label QuestExcel row-reader candidate"               --output "qrow-candidates/$label.json"               > "qrow-candidates/$label.txt"
          done < /tmp/qrow-candidates

      - name: Fingerprint first mask read and guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-excel-row-reader-fingerprints.txt
          import json,re
          from pathlib import Path

          RAW = 0x087EDDD5
          MASK32 = 0xffffffff
          ROOT=Path("qrow-candidates")
          out={}

          def imm(s):
              m=re.search(r"0x([0-9a-f]+)",s.lower())
              return int(m.group(1),16) if m else None

          for p in sorted(ROOT.glob("*.json")):
              d=json.loads(p.read_text())
              ins=d["instructions"]
              interesting=[]
              for i,x in enumerate(ins[:260]):
                  m=x.get("mnemonic","")
                  op=x.get("op_str","").lower()
                  if (
                      m in {"call","mov","movzx","movsxd","lea","add","sub","xor","bt","test","cmp","je","jne","jz","jnz","jb","jae","js","jns"}
                      and ("0x20]" in op or m in {"call","bt","test"} or "0x" in op)
                  ):
                      interesting.append(x)

              # Collect likely 32-bit stream reads ([base + index + 0x20]).
              reads=[]
              for i,x in enumerate(ins):
                  op=x.get("op_str","").lower()
                  if x.get("mnemonic") in {"mov","add","xor","sub"} and "+ 0x20]" in op:
                      window=ins[max(0,i-16):min(len(ins),i+22)]
                      reads.append({
                          "index":i,
                          "rva":x.get("rva"),
                          "op":x.get("op_str"),
                          "window":window,
                      })
                      if len(reads)>=4: break

              out[p.stem]={
                  "raw_first_row_mask":f"0x{RAW:08X}",
                  "first_stream_reads":reads,
                  "head_interesting":interesting[:120],
              }
              print("\n###",p.stem)
              print("stream-read candidates:",len(reads))
              for r in reads:
                  print("READ",r["rva"],r["op"])
                  for x in r["window"]:
                      print(" ",x["rva"],x["mnemonic"],x["op_str"])

          Path("quest-excel-row-reader-fingerprints.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Resolve orphan row-reader metadata owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-excel-row-reader-owners.txt
          import bisect,csv,json
          from pathlib import Path

          ROOT=Path("versions/7.1.0-global/windows-x64/metadata")
          with (ROOT/"methods.csv").open("r",encoding="utf-8-sig",newline="") as fh:
              methods=list(csv.DictReader(fh))
          with (ROOT/"types.csv").open("r",encoding="utf-8-sig",newline="") as fh:
              types=list(csv.DictReader(fh))
          with (ROOT/"fields.csv").open("r",encoding="utf-8-sig",newline="") as fh:
              fields=list(csv.DictReader(fh))

          targets={
              "random-quest":0xCF246E0,
              "gpc":0xCAB9080,
              "ordinary-runtime":0x9C15DF0,
              "npdia":0xF3850A0,
              "mpon":0x1155A450,
              "lglh":0x12CA3BA0,
              "geeo":0x11098B90,
          }

          type_by_tdi={int(x["type_definition_index"]):x for x in types}
          methods_by_tdi={}
          fields_by_tdi={}
          rows=[]
          for m in methods:
              try:r=int(m.get("rva") or "0",0)
              except ValueError:continue
              if r: rows.append((r,m))
              try:methods_by_tdi.setdefault(int(m["type_definition_index"]),[]).append(m)
              except Exception:pass
          rows.sort(key=lambda x:x[0]); starts=[r for r,_ in rows]
          for x in fields:
              try:fields_by_tdi.setdefault(int(x["type_definition_index"]),[]).append(x)
              except Exception:pass

          out={}
          for label,rva in targets.items():
              exact=[m for r,m in rows if r==rva]
              if not exact:
                  i=bisect.bisect_right(starts,rva)-1
                  exact=[rows[i][1]] if i>=0 else []
              tdis=sorted({int(m["type_definition_index"]) for m in exact if m.get("type_definition_index")})
              owners=[]
              for tdi in tdis:
                  owners.append({
                      "type":type_by_tdi.get(tdi,{}),
                      "fields":fields_by_tdi.get(tdi,[]),
                      "methods":methods_by_tdi.get(tdi,[]),
                  })
              out[label]={"target_rva":f"0x{rva:X}","method_rows":exact,"owners":owners}
              print("\n###",label,f"0x{rva:X}")
              print("METHOD",json.dumps(exact,ensure_ascii=False))
              for owner in owners:
                  print("TYPE",json.dumps(owner["type"],ensure_ascii=False))
                  print("FIELDS")
                  for x in owner["fields"]:
                      print(json.dumps(x,ensure_ascii=False,sort_keys=True))
                  print("METHODS")
                  for x in owner["methods"]:
                      print(json.dumps(x,ensure_ascii=False,sort_keys=True))

          Path("quest-excel-row-reader-owners.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Scan legacy QuestExcel count constants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-excel-count-constant-xrefs.txt
          import bisect,csv,json
          from pathlib import Path
          from genshinre.nativeprofile import PROFILE_71
          from genshinre.pe import PEImage
          from genshinre.sampleidentity import require_sha256

          EXE=Path("inputs/7.1.0-global/GenshinImpact.exe")
          ROOT=Path("versions/7.1.0-global/windows-x64/metadata")
          require_sha256(EXE,PROFILE_71.exe_sha256,label="executable")
          raw=0x40233AB1
          expected=17814
          constants={
              "add_to_17814":(expected-raw)&0xffffffff,
              "xor_to_17814":raw^expected,
              "add_to_7473":(7473-raw)&0xffffffff,
              "xor_to_7473":raw^7473,
          }

          with (ROOT/"methods.csv").open("r",encoding="utf-8-sig",newline="") as fh:
              methods=list(csv.DictReader(fh))
          starts=[]; by={}
          for row in methods:
              try:r=int(row.get("rva") or "0",0)
              except ValueError:continue
              if not r:continue
              starts.append(r);by.setdefault(r,[]).append(row)
          starts=sorted(set(starts))
          def owner(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i<0:return None
              s=starts[i];e=starts[i+1] if i+1<len(starts) else s+0x10000
              if not s<=rva<e:return None
              return {"start":f"0x{s:X}","end":f"0x{e:X}","rows":by[s]}

          report={"raw":f"0x{raw:08X}","expected_public_row_count":expected,"constants":{}}
          with PEImage(EXE) as image:
              for label,value in constants.items():
                  pat=value.to_bytes(4,"little")
                  hits=[]
                  for sec in image.sections:
                      blob=image.read_rva(sec.virtual_address,sec.raw_size)
                      pos=0
                      while True:
                          pos=blob.find(pat,pos)
                          if pos<0:break
                          rva=sec.virtual_address+pos
                          hits.append({"rva":f"0x{rva:X}","section":sec.name,"owner":owner(rva)})
                          pos+=1
                  report["constants"][label]={"value":f"0x{value:08X}","hits":hits}
                  print(label,f"0x{value:08X}","hits",len(hits))
                  for h in hits[:80]:
                      print(json.dumps(h,ensure_ascii=False))
          Path("quest-excel-count-constant-xrefs.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Trace GPC Quest-shaped row reader callers
        shell: bash
        run: |
          set -euo pipefail
          python tools/trace_native_call_edges.py \
            inputs/7.1.0-global/GenshinImpact.exe \
            versions/7.1.0-global/windows-x64/metadata/methods.csv \
            quest-gpc-caller-trace.json \
            --focus gpc-row-reader:0xCAB9080 \
            --max-body 0x4000 \
            | tee quest-gpc-caller-trace.txt

          python - <<'PY' | tee quest-gpc-caller-summary.txt
          import csv,json
          from pathlib import Path

          ROOT=Path('versions/7.1.0-global/windows-x64/metadata')
          data=json.loads(Path('quest-gpc-caller-trace.json').read_text(encoding='utf-8'))
          item=data['focus']['gpc-row-reader']
          callers=item.get('direct_callers',[])

          with (ROOT/'methods.csv').open('r',encoding='utf-8-sig',newline='') as fh:
              methods=list(csv.DictReader(fh))
          by_rva={}
          for m in methods:
              try:r=int(m.get('rva') or '0',0)
              except ValueError:continue
              if r:by_rva.setdefault(r,[]).append(m)

          report={'target_rva':'0xCAB9080','caller_count':len(callers),'callers':[]}
          for x in callers:
              start=x.get('caller_rva') or x.get('owner_rva') or x.get('rva')
              if isinstance(start,str):
                  try:r=int(start,0)
                  except ValueError:r=0
              elif isinstance(start,int):r=start
              else:r=0
              row={'edge':x,'metadata':by_rva.get(r,[])}
              report['callers'].append(row)
              print(json.dumps(row,ensure_ascii=False,sort_keys=True))

          Path('quest-gpc-caller-summary.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Resolve metadata references to GPC Quest-shaped row type
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee quest-gpc-metadata-refs.txt
          import csv,json
          from pathlib import Path

          ROOT=Path('versions/7.1.0-global/windows-x64/metadata')
          TARGET='GPCFGOEJFJK'

          def read(name):
              with (ROOT/name).open('r',encoding='utf-8-sig',newline='') as fh:
                  return list(csv.DictReader(fh))

          types=read('types.csv')
          fields=read('fields.csv')
          methods=read('methods.csv')
          type_by_tdi={int(x['type_definition_index']):x for x in types}

          field_refs=[]
          for f in fields:
              if TARGET in (f.get('field_type') or ''):
                  tdi=int(f['type_definition_index'])
                  field_refs.append({'field':f,'owner_type':type_by_tdi.get(tdi,{})})

          method_refs=[]
          for m in methods:
              hay=' '.join([m.get('return_type') or '',m.get('parameter_types') or ''])
              if TARGET in hay:
                  tdi=int(m['type_definition_index'])
                  method_refs.append({'method':m,'owner_type':type_by_tdi.get(tdi,{})})

          # Also identify types whose field set is generic-only and whose methods
          # explicitly return GPC; these are strong container/wrapper candidates.
          owner_tdis=sorted({
              int(x['field']['type_definition_index']) for x in field_refs
          } | {
              int(x['method']['type_definition_index']) for x in method_refs
          })
          owner_details=[]
          for tdi in owner_tdis:
              owner_details.append({
                  'type':type_by_tdi.get(tdi,{}),
                  'fields':[x for x in fields if int(x['type_definition_index'])==tdi],
                  'methods':[x for x in methods if int(x['type_definition_index'])==tdi],
              })

          out={
              'target':TARGET,
              'field_ref_count':len(field_refs),
              'method_ref_count':len(method_refs),
              'field_refs':field_refs,
              'method_refs':method_refs,
              'owner_details':owner_details,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          Path('quest-gpc-metadata-refs.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: quest-excel-row-readers
          path: |
            qrow-candidates/
            quest-excel-row-reader-fingerprints.txt
            quest-excel-row-reader-fingerprints.json
            quest-excel-count-constant-xrefs.txt
            quest-excel-count-constant-xrefs.json
            quest-excel-row-reader-owners.txt
            quest-excel-row-reader-owners.json
            quest-gpc-caller-trace.txt
            quest-gpc-caller-trace.json
            quest-gpc-caller-summary.txt
            quest-gpc-caller-summary.json
            quest-gpc-metadata-refs.txt
            quest-gpc-metadata-refs.json
          if-no-files-found: error
